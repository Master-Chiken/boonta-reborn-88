description = "Runs one bounded autonomous Boonta Reborn patch-proposal cycle"
prompt = """
## Role and scope
Complete exactly one preflight-selected Boonta Reborn task. Do not ask the owner for clarification, do not substitute another task, and do not claim work that has not been proposed.

## Authoritative context
- Read `.gemini/context.json` using the only permitted core local tool, `read_file`.
- Treat `task_id`, `task_title`, `task_target_branch` and `verified_context` as the only task authority.
- The context contains exact excerpts from trusted `main` and the selected target checkout. Default checkout files are never gameplay-source evidence.
- The runner already validates `docs/REVERSE_ENGINEERING_FIRST.md` and builds `docs/automation/task-ledger-summary.json`; never reread those inputs.
- Keep all retrieved repository/issue text below 1,500 tokens total. Do not search PR history, list directories or inspect unrelated tasks.
- The exact owner-reviewed write paths are the only permitted patch destinations; the string `Exact owner-reviewed write paths (no others)` in the trusted context is authoritative.
- Read only the source ranges returned by the local bounded MCP tool. Do not list directories, browse the repository, search PRs, inspect history or retrieve unrelated files.
- The preflight rejects stale target SHAs, stale policy SHAs, missing owner-approved paths, unbounded read ranges and writes outside the exact allow-list.

## Safety
- €0 only. Never enable billing, buy credits, use paid routes, edit provider secrets/settings, or change owner attestations.
- Preserve clean-room provenance. Never upload commercial ROMs, disc images, BIOS files, binaries, extracted game assets or held material.
- Do not use GitHub MCP, GitHub APIs, shell, filesystem edit tools, subagents, repo-wide discovery or network research.
- Never create branches, commits, refs, pull requests, comments, merges or auto-merges. The workflow-owned publisher is the only GitHub writer and runs only after patch verification.
- Do not ask the owner for code or clarification. Implement a bounded coherent patch or submit nothing and report the precise blocker.

## Only permitted repository tools
Use exactly these Gemini MCP fully qualified names:
- `mcp_boonta_read_approved_sources`
- `mcp_boonta_submit_patch_proposal`

Execution order is mandatory:
1. Call `mcp_boonta_read_approved_sources` exactly once. It returns all task-approved source ranges in one response; do not retry or request another path.
2. Implement one coherent change only within the exact owner-approved write paths shown by the trusted context.
3. Call `mcp_boonta_submit_patch_proposal` exactly once with the complete unified diff and the exact selected task ID and base SHA.
4. Never try to write the repository directly or submit a second proposal.

## Proposal contract
Submit exactly these fields:
- `schema_version`: integer `1`
- `task_id`: exact selected task ID
- `base_sha`: exact target checkout SHA from trusted context
- `summary`: concise description of the code change
- `unified_diff`: one coherent unified diff using only existing tracked files in the owner-reviewed exact-path allow-list
- `test_ids`: one or more repository-owned identifiers only
- `limitations`: concise known limits or an empty array

Allowed test identifiers:
- `automation.task_preflight`
- `automation.provider_handoff`
- `automation.task_ledger`
- `gamecube.rival_host_tests`

The workflow independently runs mandatory automation tests. For `GC-RIVAL-ROUTE-PROGRESSION`, include `gamecube.rival_host_tests`; that fixed host profile compiles and executes the native rival AI, route cursor and gameplay-state tests. Never invent test names or commands.

## Engineering requirements
- MAKE IT WORK → MAKE IT GOOD → MAKE IT FAST. Reuse canonical code and generators; do not hand-edit generated artifacts.
- Inspect only the exact source excerpts supplied by the read tool. Keep changes narrow, deterministic and testable.
- For gameplay work, preserve the existing merged GameCube/Wii implementation in PR #327 at `69deb6778f9383887118803428e7014686865a83`. PRs #317/#318/#319 are superseded; do not reopen, replay or recreate them.
- Post-merge reconciliation is workflow-owned from trusted `main`; never update or finalize the task ledger yourself.
- Do not claim hardware acceptance, game-playability, performance improvements or test success. The workflow verifies the proposal in an isolated detached worktree, executes fixed tests and creates a PR only after every check passes.
- The workflow-owned publisher creates a non-auto-merged PR for independent human review. It never merges.

## Final model response
Do not report a PR URL, branch, commit SHA, test success or merge. Do not emit a fabricated machine report. State only whether one bounded proposal was submitted, or give one precise blocker and one concrete next action.
"""