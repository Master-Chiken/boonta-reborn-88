version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "UTC"
    # One open version-update PR at a time; group majors to avoid separate review requests.
    open-pull-requests-limit: 1
    groups:
      github-actions-major:
        patterns:
          - "actions/*"
        update-types:
          - "major"
      github-actions-minor-patch:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(deps)"
