name: CI failure triage (deterministic)

on:
  workflow_run:
    workflows:
      - GameCube first-render prototype build
      - GameCube native build
      - Wii64 tooling tests
      - AI free-tier safety checks
      - Branch automation self-test
      - Step 102 source-import provenance guard
      - Trusted source-import path guard
      - Synthetic BRRES MDL0 probe
      - Dreamcast KallistiOS build
      - Boonta Autonomous Loop
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-failure-triage-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  summarize-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report failed jobs and steps without checking out PR code
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # pinned GitHub Script v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // Prefer the PR association supplied by GitHub, but verify the exact
            // head SHA, same-repository origin, and an allowed integration base.
            // Some workflow_run payloads have no pull_requests entry.
            const expectedRepo = context.repo.owner + '/' + context.repo.repo;
            const isEligiblePr = item =>
              item &&
              Number.isInteger(Number(item.number)) &&
              item.head?.sha === run.head_sha &&
              item.head?.repo?.full_name === expectedRepo &&
              ['main', 'dev'].includes(item.base?.ref);
            let candidate = (run.pull_requests || []).find(isEligiblePr);
            if (!candidate && run.head_branch && run.head_sha) {
              const { data: candidates } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: context.repo.owner + ':' + String(run.head_branch),
                per_page: 100,
              });
              candidate = candidates.find(isEligiblePr);
            }
            let targetIssueNumber = null;
            let prNumber = null;
            if (candidate) {
              prNumber = Number(candidate.number);
              if (!Number.isInteger(prNumber) || prNumber < 1) {
                core.warning('No valid pull request number found.');
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (
                pr.state === 'open' &&
                ['main', 'dev'].includes(pr.base.ref) &&
                pr.head.repo?.full_name === expectedRepo &&
                pr.head.sha === run.head_sha
              ) {
                // Keep this reporter least-privileged: PR failures go to the
                // canonical queue issue because PR-thread comments require
                // pull-requests: write, which this workflow intentionally lacks.
                targetIssueNumber = 226;
                prNumber = null;
              } else {
                core.info('PR association is closed, ineligible or stale; checking the protected push route when applicable.');
                prNumber = null;
              }
            }
            if (!prNumber && run.event === 'push' && ['main', 'dev'].includes(run.head_branch)) {
              // Merged gameplay PRs receive a fresh push build on dev. If that
              // post-merge build fails, report to the canonical queue even
              // though GitHub has already closed the merged PR.
              const targetBranch = String(run.head_branch);
              const { data: branchInfo } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: targetBranch,
              });
              if (branchInfo.commit?.sha !== run.head_sha) {
                core.info('The protected branch has advanced since this failed run; no stale issue report will be posted.');
                return;
              }
              targetIssueNumber = targetBranch === 'dev' ? 226 : 156;
            } else if (!prNumber && ['schedule', 'workflow_dispatch'].includes(run.event) && run.name === 'Boonta Autonomous Loop' && run.head_branch === 'main') {
              // Do not let a silent autonomous-cycle failure disappear. Report
              // to the active queue only while the failed run is still for the
              // exact current main SHA.
              const { data: branchInfo } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              if (branchInfo.commit?.sha !== run.head_sha) {
                core.info('main has advanced since this failed autonomous run; no stale issue report will be posted.');
                return;
              }
              targetIssueNumber = 226;
            }
            if (!prNumber && !targetIssueNumber) {
              core.info('No eligible open PR or current protected-branch push matches this exact workflow-run head SHA; no comment will be posted.');
              return;
            }

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedJobs = data.jobs.filter(job =>
              job.conclusion === 'failure' || job.conclusion === 'timed_out'
            );
            const lines = [];
            for (const job of failedJobs) {
              lines.push('- Job: ' + String(job.name).replace(/[\r\n]/g, ' ').slice(0, 180) +
                ' (' + String(job.conclusion) + ')');
              for (const step of (job.steps || []).filter(step =>
                step.conclusion === 'failure' || step.conclusion === 'timed_out'
              )) {
                lines.push('  - Failed step: ' + String(step.name).replace(/[\r\n]/g, ' ').slice(0, 180) +
                  ' (' + String(step.conclusion) + ')');
              }
            }

            const runUrl = String(run.html_url || '');
            const branch = String(run.head_branch || 'unknown').replace(/[\r\n]/g, ' ').slice(0, 180);
            const conclusion = String(run.conclusion || 'unknown');
            const noJobs = !Array.isArray(data.jobs) || data.jobs.length === 0;
            const details = noJobs && conclusion === 'startup_failure'
              ? '- GitHub reported startup_failure before creating any job. No workflow step or provider job ran; no provider authentication result can be inferred. Inspect the run page for the platform-level startup diagnostic.'
              : lines.length
                ? lines.join('\n')
                : '- GitHub reported conclusion ' + conclusion + ' but exposed no failed job/step summary.';
            const nextStep = noJobs
              ? 'Next step: inspect the run page for a platform-level startup diagnostic. This report does not infer a provider failure or authentication outcome.'
              : 'Next step: open the logs for failed steps and inspect the actual failure. This report does not infer a root cause or claim tests passed.';
            const body = [
              '## Automated CI failure triage (deterministic)',
              '',
              'This report uses workflow/job metadata only. It did not check out or execute pull-request code and did not call an AI provider.',
              '',
              '**Workflow:** ' + String(run.name || 'unknown').replace(/[\r\n]/g, ' ').slice(0, 180),
              '**Branch:** ' + branch,
              '**Target:** ' + (prNumber ? 'PR #' + prNumber : 'canonical issue #' + targetIssueNumber),
              '**Conclusion:** ' + conclusion,
              '**Jobs returned:** ' + (Array.isArray(data.jobs) ? data.jobs.length : 0),
              '**Run:** ' + runUrl,
              '',
              '**Job/step diagnosis:**',
              details,
              '',
              nextStep,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber || targetIssueNumber,
              body: body.slice(0, 12000),
            });
