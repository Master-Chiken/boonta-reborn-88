name: Validate and import Step 102 source-only bundle

on:
  push:
    branches:
      - import/step102-source-only
    paths:
      - .import/READY

permissions:
  contents: write

concurrency:
  group: step102-source-only-import
  cancel-in-progress: false

jobs:
  host-validation:
    name: Unpack and run host regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply the checksummed source-only bundle
        run: python3 tools/import_step102_bundle.py
      - name: Run path and asset safety checks
        run: python3 tools/check_source_import_policy.py
      - name: Run portable C regressions and source checks
        run: bash tools/release_check.sh
      - name: Upload the validated source tree for the native build
        uses: actions/upload-artifact@v4
        with:
          name: step102-source-tree
          path: |
            Makefile
            STEP102_IMPORT_README.md
            data/**
            source/**
            tests/**
            tools/**
          if-no-files-found: error
          retention-days: 2

  native-build:
    name: Cross-build Step 102 for GameCube
    needs: host-validation
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out branch for action metadata
        uses: actions/checkout@v4
      - name: Download the validated source tree
        uses: actions/download-artifact@v4
        with:
          name: step102-source-tree
          path: .
          merge-multiple: true
      - name: Build with the procedural fallback track only
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          test ! -e source/track_centerlines_pc.generated.h
          test ! -e source/track_centerline.imported.h
          make clean
          make USE_IMPORTED_SPLINE=0
          test -s swe1r_gc_port.dol
          ls -lh swe1r_gc_port.dol
      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-step102-source-only
          path: |
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: error
          retention-days: 7

  dolphin-smoke:
    name: Headless Dolphin process smoke test
    needs: native-build
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Download the compiled GameCube DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-step102-source-only
          path: dist
      - name: Install free Dolphin emulator and virtual display dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          command -v dolphin-emu
          dolphin-emu --version
      - name: Launch the DOL headlessly for 12 seconds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          mkdir -p /tmp/dolphin-user
          set +e
          timeout 12s dolphin-emu --batch --video_backend=Null --exec=dist/swe1r_gc_port.dol --user=/tmp/dolphin-user
          status=$?
          set -e
          if [[ "$status" -eq 124 ]]; then
            echo "Dolphin remained active until the 12-second timeout."
            echo "Process smoke test only: visible rendering, controller input, and gameplay are not verified."
            exit 0
          fi
          echo "Dolphin exited before the expected timeout (status $status)."
          exit 1

  commit-reviewed-source:
    name: Commit after host tests, native build, and smoke test
    needs: [host-validation, native-build, dolphin-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: import/step102-source-only
      - name: Apply source-only bundle and remove its temporary transport file
        run: python3 tools/import_step102_bundle.py
      - name: Commit reviewed sources to the draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "feat: import Step 102 source-only GameCube prototype"
          git push origin HEAD:import/step102-source-only
