name: Import Step 102 native source

on:
  push:
    branches: [work/step102-import-gate]
    paths:
      - "source-bundle/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.ref == 'refs/heads/work/step102-import-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Validate and import the source-only bundle
        run: |
          set -euo pipefail
          test -s source-bundle/step102-source-only-import.b64
          python3 tools/import_step102_bundle.py
          rm source-bundle/step102-source-only-import.b64 source-bundle/IMPORT_TRIGGER.txt
          rmdir source-bundle

      - name: Run complete host regression suite before committing
        run: bash tools/release_check.sh

      - name: Commit extracted source into the PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Makefile STEP102_IMPORT_README.md data source tests tools source-bundle/step102-source-only-import.b64 source-bundle/IMPORT_TRIGGER.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Step 102 native GameCube/Wii source baseline"
          git push origin "HEAD:work/step102-import-gate"

  native-build:
    needs: import-source
    if: success() && github.ref == 'refs/heads/work/step102-import-gate'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out imported source
        uses: actions/checkout@v4
        with:
          ref: work/step102-import-gate

      - name: Run host regression suite
        run: bash tools/release_check.sh

      - name: Build GameCube DOL
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          mkdir -p build
          {
            make clean
            make
            test -s swe1r_gc_port.dol
          } 2>&1 | tee build.log

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: |
            build.log
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: warn
          retention-days: 7
