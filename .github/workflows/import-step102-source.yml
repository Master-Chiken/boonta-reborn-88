name: Validate and import Step 102 source-only bundle

on:
  push:
    branches:
      - import/step102-source-only
    paths:
      - .import/READY

permissions:
  contents: read

concurrency:
  group: step102-source-only-import
  cancel-in-progress: false

jobs:
  host-validation:
    name: Unpack and run host regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply the checksummed source-only bundle
        run: python3 tools/import_step102_bundle.py
      - name: Run path and asset safety checks
        run: python3 tools/check_source_import_policy.py
      - name: Run portable C regressions and source checks
        run: bash tools/release_check.sh
      - name: Upload the validated source tree for the native build
        uses: actions/upload-artifact@v4
        with:
          name: step102-source-tree
          path: |
            Makefile
            STEP102_IMPORT_README.md
            data/**
            source/**
            tests/**
            tools/**
          if-no-files-found: error
          retention-days: 2

  native-build:
    name: Cross-build Step 102 for GameCube
    needs: host-validation
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out branch for action metadata
        uses: actions/checkout@v4
      - name: Download the validated source tree
        uses: actions/download-artifact@v4
        with:
          name: step102-source-tree
          path: .
          merge-multiple: true
      - name: Build with the procedural fallback track only
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          test ! -e source/track_centerlines_pc.generated.h
          test ! -e source/track_centerline.imported.h
          make clean
          make USE_IMPORTED_SPLINE=0
          test -s swe1r_gc_port.dol
          ls -lh swe1r_gc_port.dol
      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-step102-source-only
          path: |
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: error
          retention-days: 7

  dolphin-smoke:
    name: Headless Dolphin process smoke test
    needs: native-build
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Download the compiled GameCube DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-step102-source-only
          path: dist
      - name: Install free Dolphin emulator and virtual display dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          command -v dolphin-emu
          dolphin-emu --version
      - name: Launch the DOL headlessly for 12 seconds
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          mkdir -p /tmp/dolphin-user
          set +e
          timeout 12s dolphin-emu --batch --video_backend=Null --exec=dist/swe1r_gc_port.dol --user=/tmp/dolphin-user
          status=$?
          set -e
          if [[ "$status" -eq 124 ]]; then
            echo "Dolphin remained active until the 12-second timeout."
            echo "Process smoke test only: visible rendering, controller input, and gameplay are not verified."
            exit 0
          fi
          echo "Dolphin exited before the expected timeout (status $status)."
          exit 1

  dolphin-visible-preview:
    name: Experimental visible OpenGL preview
    needs: native-build
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ubuntu:26.04
    steps:
      - name: Download the compiled GameCube DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-step102-source-only
          path: dist
      - name: Install Dolphin, Xvfb, software OpenGL and screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dolphin-emu xvfb xauth ffmpeg python3-pil libxcb-cursor0
          command -v xvfb-run
          command -v ffmpeg
      - name: Capture visible Dolphin frames (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview /tmp/dolphin-visible-user /tmp/dolphin-visible-home/.config /tmp/dolphin-visible-home/.local/share
          chmod 700 /tmp/dolphin-visible-home
          export PATH="/usr/games:$PATH"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" bash -euo pipefail -c '
            export PATH="/usr/games:$PATH"
            export HOME=/tmp/dolphin-visible-home
            export XDG_CONFIG_HOME="$HOME/.config"
            export XDG_DATA_HOME="$HOME/.local/share"
            export LIBGL_ALWAYS_SOFTWARE=1
            export QT_QPA_PLATFORM=xcb
            dolphin-emu --batch --video_backend=OGL \
              --exec=dist/swe1r_gc_port.dol --user=/tmp/dolphin-visible-user \
              > preview/dolphin-visible.log 2>&1 &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            sleep 7
            ffmpeg -hide_banner -loglevel error -y -f x11grab \
              -video_size 1280x720 -i "$DISPLAY" -frames:v 1 preview/frame-07s.png
            sleep 4
            ffmpeg -hide_banner -loglevel error -y -f x11grab \
              -video_size 1280x720 -i "$DISPLAY" -frames:v 1 preview/frame-11s.png
            kill -TERM "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            trap - EXIT
          '
      - name: Measure captured frames for non-trivial image content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          for name in ("frame-07s.png", "frame-11s.png"):
              path = Path("preview") / name
              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Missing or suspiciously small screenshot: {path}")
              image = Image.open(path).convert("RGB")
              colors = image.getcolors(maxcolors=2_000_000)
              color_count = len(colors) if colors is not None else 2_000_001
              means = ImageStat.Stat(image).mean
              print(f"{name}: size={image.size}, unique_colors={color_count}, mean_rgb={[round(v, 2) for v in means]}")
              if color_count < 20 or max(means) < 3.0:
                  raise SystemExit(f"Screenshot looks blank or nearly uniform: {path}")
          PY
      - name: Upload visible preview and Dolphin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-dolphin-visible-preview
          path: preview/
          if-no-files-found: warn
          retention-days: 7

  commit-reviewed-source:
    name: Commit after host tests, native build, and smoke test
    needs: [host-validation, native-build, dolphin-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: import/step102-source-only
      - name: Apply source-only bundle and remove its temporary transport file
        run: python3 tools/import_step102_bundle.py
      - name: Commit reviewed sources to the draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "feat: import Step 102 source-only GameCube prototype"
          git push origin HEAD:import/step102-source-only
