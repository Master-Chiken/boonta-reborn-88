name: Recompiler PowerPC ABI probe

on:
  pull_request:
    paths:
      - ".github/workflows/recomp-abi-ppc.yml"
      - "tests/recomp-abi/**"
      - "docs/RECOMP_PPC_ABI_PROBE.md"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/recomp-abi-ppc.yml"
      - "tests/recomp-abi/**"
      - "docs/RECOMP_PPC_ABI_PROBE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recomp-abi-ppc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-big-endian-memory-model:
    name: Host tests for the N64 big-endian memory contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run synthetic big-endian memory tests
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tests/recomp-abi/test_n64_memory_be.c \
            -o /tmp/test_n64_memory_be
          /tmp/test_n64_memory_be
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tests/recomp-abi/test_memory_lane_selector.c \
            -o /tmp/test_memory_lane_le
          /tmp/test_memory_lane_le
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DRECOMP_MEMORY_FORCE_BIG_ENDIAN_FOR_TEST=1 \
            tests/recomp-abi/test_memory_lane_selector.c \
            -o /tmp/test_memory_lane_be
          /tmp/test_memory_lane_be
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tests/recomp-abi/test_ppc_mul64.c \
            -o /tmp/test_ppc_mul64
          /tmp/test_ppc_mul64

  cross-compile-upstream-header:
    name: Compile pinned N64Recomp header with portable multiply fallback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: devkitpro/devkitppc:20261102
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerPC toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEVKITPPC:-}"
          export PATH="$DEVKITPPC/bin:$PATH"
          command -v powerpc-eabi-g++
          powerpc-eabi-g++ --version
          test "$(powerpc-eabi-g++ -dumpmachine)" = "powerpc-eabi"

      - name: Fetch the exact N64Recomp header revision
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$RUNNER_TEMP/N64Recomp"
          mkdir -p "$repo_dir"
          git -C "$repo_dir" init
          git -C "$repo_dir" remote add origin https://github.com/dguillot-gh/N64Recomp.git
          git -C "$repo_dir" fetch --depth=1 origin 36286fb9a96f325a64b3c600131ba00af44654fc
          git -C "$repo_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$repo_dir" rev-parse HEAD)" = "36286fb9a96f325a64b3c600131ba00af44654fc"
          test -s "$repo_dir/include/recomp.h"
          echo "Pinned N64Recomp header: $(git -C "$repo_dir" rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/tests/recomp-abi/patch_recomp_header_for_ppc.py" \
            "$repo_dir/include/recomp.h"

      - name: Cross-compile ABI probe for GameCube and Wii
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITPPC/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/recomp-abi-build"
          header_dir="$RUNNER_TEMP/N64Recomp/include"
          source_file="$GITHUB_WORKSPACE/tests/recomp-abi/recomp_header_compile.cpp"
          for target in gamecube wii; do
            case "$target" in
              gamecube) platform_flag="-mogc" ;;
              wii) platform_flag="-mrvl" ;;
            esac
            echo "::group::Compile upstream recomp.h for $target ($platform_flag)"
            powerpc-eabi-g++ \
              -std=gnu++20 -O2 -Wall -Wextra -Werror \
              -frounding-math -fno-fast-math \
              -mcpu=750 "$platform_flag" \
              -I"$header_dir" -I"$GITHUB_WORKSPACE/tests/recomp-abi" \
              -c "$source_file" \
              -o "$RUNNER_TEMP/recomp-abi-build/recomp-header-$target.o"
            readelf_header="$(powerpc-eabi-readelf -h "$RUNNER_TEMP/recomp-abi-build/recomp-header-$target.o")"
            grep -qE 'Class:.*ELF32' <<< "$readelf_header"
            grep -qE 'Data:.*big endian' <<< "$readelf_header"
            grep -qE 'Machine:.*PowerPC' <<< "$readelf_header"
            echo "$readelf_header" | grep -E 'Class:|Data:|Machine:'
            echo "::endgroup::"
          done

      - name: Build a native GameCube DOL that executes the N64 memory helpers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITPPC/bin:$PATH"
          cd "$GITHUB_WORKSPACE/tests/recomp-abi/runtime-probe"
          make clean
          make N64RECOMP_INCLUDE="$RUNNER_TEMP/N64Recomp/include"
          python3 "$GITHUB_WORKSPACE/gamecube-demo/tools/pad_dol.py" recomp_memory_probe.dol
          test -s recomp_memory_probe.dol
          test -s recomp_memory_probe.elf
          python3 "$GITHUB_WORKSPACE/gamecube-demo/tools/validate_artifacts.py" recomp_memory_probe.dol recomp_memory_probe.elf

      - name: Upload the native PowerPC memory-probe DOL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned actions/upload-artifact v7.0.2
        with:
          name: recomp-powerpc-memory-probe
          path: tests/recomp-abi/runtime-probe/recomp_memory_probe.dol
          if-no-files-found: error
          retention-days: 3

  run-powerpc-memory-probe-in-dolphin:
    name: Execute the native PowerPC memory probe in Dolphin
    needs: [cross-compile-upstream-header]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the GameCube DOL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned actions/download-artifact v4.3.0
        with:
          name: recomp-powerpc-memory-probe
          path: memory-probe-artifact

      - name: Install Dolphin and headless display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb xauth qt6-qpa-plugins

      - name: Run the PowerPC DOL and verify memory-operation results
        shell: bash
        run: |
          set -euo pipefail
          dol="$(find "$GITHUB_WORKSPACE/memory-probe-artifact" -type f -name recomp_memory_probe.dol -print -quit)"
          test -n "$dol"
          export HOME=/tmp/recomp-dolphin-home
          mkdir -p "$HOME" /tmp/recomp-dolphin-user/Logs /tmp/recomp-dolphin-user/Config
          chmod 700 "$HOME"
          set +e
          timeout --signal=TERM --kill-after=5s 12s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$dol" \
            --user=/tmp/recomp-dolphin-user \
            -C Logger.Options.WriteToFile=True \
            -C Logger.Options.WriteToConsole=True \
            -C Logger.Options.Verbosity=4 \
            -C Logger.Logs.OSREPORT=True \
            -C Logger.Logs.OSREPORT_HLE=True \
            -C Logger.Logs.MASTER=True \
            -C Logger.Logs.BOOT=True \
            -C Logger.Logs.EXI=True \
            -C Logger.Logs.CORE=True \
            -C Dolphin.Interface.UsePanicHandlers=False \
            -C Dolphin.Interface.ConfirmStop=False \
            > /tmp/recomp-dolphin-stdout.log 2>&1
          dolphin_status=$?
          set -e
          cat /tmp/recomp-dolphin-stdout.log
          log_file=/tmp/recomp-dolphin-user/Logs/dolphin.log
          logger_config=/tmp/recomp-dolphin-user/Config/Logger.ini
          dolphin_config=/tmp/recomp-dolphin-user/Config/Dolphin.ini
          if [[ -s "$log_file" ]]; then cat "$log_file"; fi
          if [[ -s "$logger_config" ]]; then cat "$logger_config"; fi
          mkdir -p "$GITHUB_WORKSPACE/recomp-probe-logs"
          cp /tmp/recomp-dolphin-stdout.log "$GITHUB_WORKSPACE/recomp-probe-logs/dolphin-stdout.log"
          cp "$log_file" "$GITHUB_WORKSPACE/recomp-probe-logs/dolphin.log" 2>/dev/null || true
          cp "$logger_config" "$GITHUB_WORKSPACE/recomp-probe-logs/Logger.ini" 2>/dev/null || true
          cp "$dolphin_config" "$GITHUB_WORKSPACE/recomp-probe-logs/Dolphin.ini" 2>/dev/null || true
          combined_log=/tmp/recomp-dolphin-combined.log
          cat /tmp/recomp-dolphin-stdout.log "$log_file" 2>/dev/null > "$combined_log" || true
          if ! grep -Fq "RECOMP_PPC_MEMORY_PROBE:START" "$combined_log"; then
            find /tmp/recomp-dolphin-user -maxdepth 4 -type f -print
            echo "::error::Dolphin did not capture the DOL's direct SYS_Report START marker (status $dolphin_status)."
            exit 1
          fi
          if ! grep -Fq "RECOMP_PPC_MEMORY_PROBE:PASS" "$combined_log"; then
            echo "::error::The native PowerPC memory probe started but did not report PASS (Dolphin status $dolphin_status)."
            exit 1
          fi
          if grep -Fq "RECOMP_PPC_MEMORY_PROBE:FAIL" "$combined_log"; then
            echo "::error::The native PowerPC memory probe reported a memory mismatch."
            exit 1
          fi
          if [[ "$dolphin_status" -ne 124 && "$dolphin_status" -ne 137 && "$dolphin_status" -ne 143 ]]; then
            echo "::error::Dolphin did not remain in the expected test loop (status $dolphin_status)."
            exit 1
          fi

      - name: Collect Dolphin startup logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/recomp-probe-logs"
          cp /tmp/recomp-dolphin-stdout.log "$GITHUB_WORKSPACE/recomp-probe-logs/dolphin-stdout.log" 2>/dev/null || true
          cp /tmp/recomp-dolphin-user/Logs/dolphin.log "$GITHUB_WORKSPACE/recomp-probe-logs/dolphin.log" 2>/dev/null || true

      - name: Upload Dolphin OSReport and startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned actions/upload-artifact v7.0.2
        with:
          name: recomp-powerpc-memory-probe-logs
          path: recomp-probe-logs/
          if-no-files-found: warn
          retention-days: 3
