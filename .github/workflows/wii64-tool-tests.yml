name: Wii64 tooling tests

on:
  push:
    branches:
      - main
      - "tools/**"
      - "ci/**"
    paths:
      - "tools/**"
      - ".github/workflows/wii64-tool-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Read-only Wii64 tooling unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Show Python version
        run: python3 --version

      - name: Run standard-library unit tests
        working-directory: tools
        run: python3 -m unittest discover -s tests -v
