name: Wii64 tooling tests

on:
  push:
    branches:
      - main
      - "tools/**"
      - "ci/**"
    paths:
      - "tools/compare_wii64_rice_ini.py"
      - "tools/compare_wii64_rice_profiles.py"
      - "tools/inspect_wii64_rice_ini.py"
      - "tools/verify_wii64_archive.py"
      - "tools/n64_comp_inventory.pl"
      - "tools/n64_reference/**"
      - "tools/test_dtk_synthetic_dol.py"
      - "tools/build_autonomous_context.py"
      - "tools/tests/**"
      - ".github/workflows/wii64-tool-tests.yml"
  pull_request:
    paths:
      - "tools/compare_wii64_rice_ini.py"
      - "tools/compare_wii64_rice_profiles.py"
      - "tools/inspect_wii64_rice_ini.py"
      - "tools/verify_wii64_archive.py"
      - "tools/n64_comp_inventory.pl"
      - "tools/n64_reference/**"
      - "tools/test_dtk_synthetic_dol.py"
      - "tools/build_autonomous_context.py"
      - "tools/tests/**"
      - ".github/workflows/wii64-tool-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wii64-tool-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Read-only Wii64 tooling unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Show Python version
        run: python3 --version

      - name: Run standard-library unit tests
        working-directory: tools
        run: python3 -m unittest discover -s tests -v


  perl-compwolf-tests:
    name: Read-only N64 CompWolf metadata inventory tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Check Perl syntax
        run: perl -c tools/n64_comp_inventory.pl

      - name: Run synthetic-only inventory tests
        run: prove -v tools/tests/n64_comp_inventory.t

  decomp-toolkit-synthetic-dol:
    name: Pinned decomp-toolkit synthetic DOL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Boonta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned decomp-toolkit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          repository: encounter/decomp-toolkit
          ref: 9d1ac132c4e073c9c48ac393cf290ff33e4c809a
          path: .ci/decomp-toolkit
          persist-credentials: false

      - name: Install minimum compatible pinned Rust toolchain
        # let-chain expressions in the audited decomp-toolkit source require Rust 1.88+
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.88.0

      - name: Build decomp-toolkit from its locked source
        working-directory: .ci/decomp-toolkit
        run: cargo build --locked --release --bin dtk

      - name: Inspect a synthetic DOL and reject malformed input
        run: python3 tools/test_dtk_synthetic_dol.py .ci/decomp-toolkit/target/release/dtk
