name: GameCube procedural driving prototype

on:
  pull_request:
    paths:
      - "gamecube/**"
      - ".github/workflows/gamecube-smoke.yml"
  push:
    branches: [main]
    paths:
      - "gamecube/**"
      - ".github/workflows/gamecube-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean-room GameCube driving prototype
        working-directory: gamecube
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          make clean
          make
          test -s boonta_demo.dol
          ls -lh boonta_demo.dol

      - name: Upload GameCube prototype DOL
        uses: actions/upload-artifact@v4
        with:
          name: boonta-gamecube-demo-dol
          path: gamecube/boonta_demo.dol
          if-no-files-found: error
          retention-days: 7

  host-race-logic-tests:
    name: Host tests for racing physics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile portable race logic tests with warnings as errors
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror \
            -I gamecube/source \
            gamecube/tests/race_logic_test.c \
            gamecube/source/race_logic.c \
            -lm -o /tmp/race_logic_test
          /tmp/race_logic_test

  dolphin-runtime-smoke:
    name: Headless Dolphin process smoke test (null video backend)
    needs: [build-smoke-test, host-race-logic-tests]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Download GameCube prototype DOL
        uses: actions/download-artifact@v4
        with:
          name: boonta-gamecube-demo-dol
          path: dist

      - name: Install free Dolphin process-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          dolphin-emu --version

      - name: Launch the DOL for 12 seconds (process smoke test only)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME" /tmp/dolphin-user
          chmod 700 "$HOME"
          set +e
          timeout 12s dolphin-emu --batch --video_backend=Null \
            --exec=dist/boonta_demo.dol --user=/tmp/dolphin-user > /tmp/dolphin-null.log 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 124 ]]; then
            echo "Dolphin remained active until the 12-second timeout."
            echo "This verifies only that the DOL process stays active; it does not verify graphics or controls."
            exit 0
          fi
          cat /tmp/dolphin-null.log
          echo "Dolphin exited before the expected timeout (status $status)."
          exit 1

      - name: Upload Dolphin process log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boonta-dolphin-process-smoke
          path: /tmp/dolphin-null.log
          if-no-files-found: ignore
          retention-days: 7

  dolphin-render-smoke:
    name: Experimental Dolphin OpenGL frame diagnostic (non-blocking)
    continue-on-error: true
    needs: [build-smoke-test, host-race-logic-tests]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Download GameCube prototype DOL
        uses: actions/download-artifact@v4
        with:
          name: boonta-gamecube-demo-dol
          path: dist

      - name: Install free Dolphin OpenGL renderer and virtual display
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dolphin-emu xvfb xauth imagemagick python3-pil libgl1-mesa-dri libxcb-cursor0 qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          command -v dolphin-emu
          command -v xvfb-run
          command -v import
          dolphin-emu --version

      - name: Launch DOL and verify a rendered frame
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/games:$PATH"
          mkdir -p /tmp/dolphin-user
          xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            export PATH="/usr/games:$PATH"
            export QT_QPA_PLATFORM=xcb
            export LIBGL_ALWAYS_SOFTWARE=1
            export HOME=/tmp/dolphin-home
            mkdir -p "$HOME" /tmp/dolphin-user
            chmod 700 "$HOME"
            dolphin-emu --batch --video_backend=OGL \
              --exec="$GITHUB_WORKSPACE/dist/boonta_demo.dol" \
              --user=/tmp/dolphin-user > /tmp/dolphin.log 2>&1 &
            dolphin_pid=$!
            cleanup() {
              kill "$dolphin_pid" 2>/dev/null || true
              wait "$dolphin_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            for second in $(seq 1 8); do
              sleep 1
              if ! kill -0 "$dolphin_pid" 2>/dev/null; then
                cat /tmp/dolphin.log
                echo "Dolphin exited before a frame could be captured."
                exit 1
              fi
            done

            import -window root "$GITHUB_WORKSPACE/dolphin-frame.png"
            image_colors=$(magick "$GITHUB_WORKSPACE/dolphin-frame.png" -resize 160x90 -format %k info:)
            echo "Captured frame has $image_colors distinct colors."
            if [[ "$image_colors" -lt 24 ]]; then
              echo "Captured image appears blank or nearly blank."
              exit 1
            fi
          '

      - name: Upload Dolphin frame and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boonta-dolphin-render-smoke
          path: |
            dolphin-frame.png
            /tmp/dolphin.log
          if-no-files-found: ignore
          retention-days: 7
