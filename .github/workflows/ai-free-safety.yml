name: AI free-tier safety checks

on:
  push:
    branches:
      - main
      - ai/gemini-agent-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-free-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-guardrails:
    name: Verify Gemini free-only guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1

      - name: Run static AI safety checks (no API calls)
        run: python3 tools/check_ai_free_safety.py

      - name: Verify provider fallback stops after a completed model invocation
        run: python3 tools/check_autonomous_provider_handoff.py

      - name: Validate compact autonomous task summary
        run: python3 tools/check_task_ledger_summary.py

      - name: Validate persistent task ledger and regression tests
        run: |
          python3 tools/check_task_ledger.py
          python3 -m unittest tools/test_check_task_ledger.py

      - name: Validate declarative agent hierarchy and governance invariants
        run: |
          python3 tools/check_agent_roles.py
          python3 -m unittest tools/test_check_agent_roles.py

      - name: Reconcile ledger with live PR state (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/audit_task_ledger_github.py
