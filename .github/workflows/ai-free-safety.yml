name: AI free-tier safety checks

on:
  push:
    branches:
      - ai/gemini-agent-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-free-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-guardrails:
    name: Verify Gemini free-only guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run static AI safety checks (no API calls)
        run: python3 tools/check_ai_free_safety.py
