name: AI free-tier safety checks

on:
  push:
    branches:
      - main
      - ai/gemini-agent-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-free-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-guardrails:
    name: Verify Gemini free-only guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1

      - name: Run static AI safety checks (no API calls)
        run: python3 tools/check_ai_free_safety.py

      - name: Test pinned trusted main checkout and summary validation (offline)
        run: python3 tools/test_validate_trusted_main_checkout.py

      - name: Run structured patch pipeline regression suite (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_preflight_github_mcp.py
          python3 tools/test_autonomous_task_preflight.py
          python3 tools/check_task_read_paths.py
          python3 tools/test_task_read_paths.py
          python3 tools/test_autonomous_context.py
          python3 tools/test_autonomous_fresh_task_guard.py
          python3 tools/test_autonomous_patch_proposal.py
          python3 tools/test_autonomous_provider_patch.py
          python3 tools/test_autonomous_patch_test_runner.py
          python3 tools/test_autonomous_path_allowlist.py
          python3 tools/test_verify_autonomous_patch.py
          python3 tools/test_autonomous_delivery_plan.py
          python3 tools/test_execute_autonomous_github_delivery.py
          python3 tools/test_openrouter_watchdog.py
          python3 tools/run_autonomous_patch_tests.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --test-id automation.task_preflight \
            --test-id automation.provider_handoff \
            --test-id automation.task_ledger

      - name: Verify provider fallback stops after a completed model invocation
        run: python3 tools/check_autonomous_provider_handoff.py

      - name: Validate compact autonomous task summary
        run: python3 tools/check_task_ledger_summary.py

      - name: Validate persistent task ledger and regression tests
        run: |
          python3 tools/check_task_ledger.py
          python3 -m unittest tools/test_check_task_ledger.py

      - name: Validate declarative agent hierarchy and governance invariants
        run: |
          python3 tools/check_agent_roles.py
          python3 -m unittest tools/test_check_agent_roles.py

      - name: Reconcile ledger with live PR state (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/audit_task_ledger_github.py
