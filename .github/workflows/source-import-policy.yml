name: Source import policy

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - import/step102-source-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Reject unreviewed assets and dumps
        run: python3 tools/check_source_import_policy.py
