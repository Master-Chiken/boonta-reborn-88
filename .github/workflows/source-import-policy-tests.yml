name: Source import policy unit tests

on:
  push:
    branches:
      - fix/source-import-policy-casefold
    paths:
      - "tools/check_source_import_policy.py"
      - "tools/test_check_source_import_policy.py"
      - "tools/import_step102_bundle.py"
      - "tools/test_import_step102_bundle.py"
      - ".github/workflows/source-import-policy-tests.yml"
  pull_request:
    branches:
      - import/step102-source-only
    paths:
      - "tools/check_source_import_policy.py"
      - "tools/test_check_source_import_policy.py"
      - "tools/import_step102_bundle.py"
      - "tools/test_import_step102_bundle.py"
      - ".github/workflows/source-import-policy-tests.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    name: Python source-import safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run source import policy regression tests
        run: python3 -m unittest discover -s tools -p 'test_check_source_import_policy.py' -v
      - name: Run archive member validation regression tests
        run: python3 -m unittest discover -s tools -p 'test_import_step102_bundle.py' -v
