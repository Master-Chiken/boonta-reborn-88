name: Retire verified branch reference

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "One exact branch ref from the reviewed retirement allowlist"
        required: true
        type: choice
        options:
          - automation/fix-gemini-secondary-key-20261108
          - automation/task-lease-and-evidence-acceptance-20261107
          - chore/sync-main-to-dev-8429930271375379263
          - docs/paperclip-local-zero-cost-20261111
          - docs/reconcile-n64-t2-ledger-20261111
          - feat/paperclip-role-governance-20261112
          - feat/role-aware-autonomous-context-20261112
          - feat/scheduled-provider-pr-resume-20261112
          - fix/automation-report-task-identity-20261111
          - fix/autonomous-cycle-trusted-task-envelope-20261111
          - fix/gemini-dispatch-reusable-permissions-20261110
          - fix/gemini-transient-fetch-retry-20261109
          - fix/groq-dispatch-gate-observability-20261112
          - fix/groq-free-invocation-timeout-180s-20261111
          - fix/groq-tool-json-temperature-20261110
          - fix/regenerate-task-ledger-summary-pr410
          - fix/retain-complete-autonomous-task-context
          - infra/paperclip-control-plane-20261110
      expected_sha:
        description: "Exact SHA from the reviewed inventory"
        required: true
        type: string
      confirm_branch:
        description: "Type the complete branch name again"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-verified-branch-reference
  cancel-in-progress: false

jobs:
  retire:
    if: github.actor == 'Master-Chiken' && github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.number == 248 && github.event.issue.pull_request == null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      INPUT_BRANCH_NAME: ${{ inputs.branch_name || '' }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
      INPUT_CONFIRM_BRANCH: ${{ inputs.confirm_branch || '' }}
    steps:
      - name: Check out main for exact ref and ancestry verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate exact owner-confirmed branch and SHA
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            [[ "$ISSUE_NUMBER" == "248" ]] || { echo "::error::Only branch-budget issue #248 is accepted."; exit 1; }
            if [[ ! "$COMMENT_BODY" =~ ^/retire-branch[[:space:]]+([A-Za-z0-9_./-]+)[[:space:]]+([0-9a-f]{40})[[:space:]]+CONFIRM$ ]]; then
              echo "::error::Use exactly: /retire-branch BRANCH_NAME EXPECTED_SHA CONFIRM"
              exit 1
            fi
            BRANCH_NAME="${BASH_REMATCH[1]}"
            EXPECTED_SHA="${BASH_REMATCH[2]}"
            CONFIRM_BRANCH="$BRANCH_NAME"
          else
            BRANCH_NAME="$INPUT_BRANCH_NAME"
            EXPECTED_SHA="$INPUT_EXPECTED_SHA"
            CONFIRM_BRANCH="$INPUT_CONFIRM_BRANCH"
          fi

          [[ -n "$BRANCH_NAME" && "$CONFIRM_BRANCH" == "$BRANCH_NAME" ]] || {
            echo "::error::Branch confirmation mismatch."
            exit 1
          }

          case "$BRANCH_NAME" in
            "automation/fix-gemini-secondary-key-20261108") PINNED_SHA="40a9db2ee79bafa0752899ded915bae8af3a4a8c" ;;
            "automation/task-lease-and-evidence-acceptance-20261107") PINNED_SHA="1166a4c4edd3cf7416543caaba50a302d2e025e3" ;;
            "chore/sync-main-to-dev-8429930271375379263") PINNED_SHA="1b8cc59355db88a0ba64e7b94203f264824cadf6" ;;
            "docs/paperclip-local-zero-cost-20261111") PINNED_SHA="2ea042f6fa1759208a0798d297606420a93c86c6" ;;
            "docs/reconcile-n64-t2-ledger-20261111") PINNED_SHA="cb59571694b22dc4d7543f15bc3bbed311af05b7" ;;
            "feat/paperclip-role-governance-20261112") PINNED_SHA="a37e9df742371a9e537ad6ca8b75dd286192a06c" ;;
            "feat/role-aware-autonomous-context-20261112") PINNED_SHA="80a8e470ccdeee8f9d6221ed527d131e0286528e" ;;
            "feat/scheduled-provider-pr-resume-20261112") PINNED_SHA="6f2b9febf7dbf6b79318d68093a14ca3610c74bf" ;;
            "fix/automation-report-task-identity-20261111") PINNED_SHA="aa22f34a5a231cca4f850deba4779709ac3c25cd" ;;
            "fix/autonomous-cycle-trusted-task-envelope-20261111") PINNED_SHA="cd24fd67cd7d4669a3317f62a3c92e9ef63bb4b8" ;;
            "fix/gemini-dispatch-reusable-permissions-20261110") PINNED_SHA="c7ae0927ba03b5bd3a4826f5d5d840a4d966655d" ;;
            "fix/gemini-transient-fetch-retry-20261109") PINNED_SHA="973690f8b3a63299750959cb98b65200d03932d0" ;;
            "fix/groq-dispatch-gate-observability-20261112") PINNED_SHA="4859401f39796e187beda1c4335be236edea42f2" ;;
            "fix/groq-free-invocation-timeout-180s-20261111") PINNED_SHA="30e119962a51eac54147c29e8e5111f7767ac35f" ;;
            "fix/groq-tool-json-temperature-20261110") PINNED_SHA="c592d3eb724ac8456dd9a340bed5c6edfa41b031" ;;
            "fix/regenerate-task-ledger-summary-pr410") PINNED_SHA="81e6db46d3cbd174971e547c7657c0879c089117" ;;
            "fix/retain-complete-autonomous-task-context") PINNED_SHA="dd276581c4bdf34cdba9457305b083724fd82646" ;;
            "infra/paperclip-control-plane-20261110") PINNED_SHA="582dfc020a8068c0fa6b9feaa84f2cc35419cd7a" ;;
            *) echo "::error::Branch is not allowlisted."; exit 1 ;;
          esac

          [[ "$EXPECTED_SHA" == "$PINNED_SHA" ]] || {
            echo "::error::Expected SHA does not match the reviewed allowlist."
            exit 1
          }
          {
            echo "branch_name=$BRANCH_NAME"
            echo "expected_sha=$EXPECTED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protection, open PR references and archived ancestry
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.selection.outputs.branch_name }}
          EXPECTED_SHA: ${{ steps.selection.outputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" && "$BRANCH_NAME" != "archive/branch-heads-20261019" && "$BRANCH_NAME" != "archive/rival-ai-history-20261107" ]] || {
            echo "::error::Permanent refs cannot be retired."
            exit 1
          }

          ref_json="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME")"
          [[ "$(jq -r '.object.sha' <<< "$ref_json")" == "$EXPECTED_SHA" ]] || {
            echo "::error::Live branch head changed."
            exit 1
          }

          branch_pages="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100")"
          branch_json="$(jq -c --arg branch "$BRANCH_NAME" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
          [[ -n "$branch_json" ]] || { echo "::error::Branch missing from inventory."; exit 1; }
          [[ "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || {
            echo "::error::Protected branch."
            exit 1
          }

          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs.json >/dev/null; then
            echo "::error::An open PR uses this branch as head or base."
            exit 1
          fi

          ARCHIVE_BRANCH="archive/rival-ai-history-20261107"
          ARCHIVE_CHECKPOINT="cb7e18e574bae0441e5df6eaca618a3b92c63fc9"
          archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$archive_ref")" == "$ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned rival-AI history archive moved or is missing."
            exit 1
          }
          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019" "+refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH" "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/dev:refs/remotes/origin/dev"
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019 &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/dev; then
            echo "::error::Branch tip is not reachable from a verified archive, main or dev."
            exit 1
          fi

      - name: Recheck exact ref and atomically retire one branch
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.selection.outputs.branch_name }}
          EXPECTED_SHA: ${{ steps.selection.outputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" && "$BRANCH_NAME" != "archive/branch-heads-20261019" && "$BRANCH_NAME" != "archive/rival-ai-history-20261107" ]] || {
            echo "::error::Permanent refs cannot be retired."
            exit 1
          }
          ref_json="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME")"
          [[ "$(jq -r '.object.sha' <<< "$ref_json")" == "$EXPECTED_SHA" ]] || {
            echo "::error::Branch moved after the first check."
            exit 1
          }

          branch_pages="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100")"
          branch_json="$(jq -c --arg branch "$BRANCH_NAME" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
          [[ -n "$branch_json" && "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || {
            echo "::error::Branch missing or protected at final check."
            exit 1
          }

          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs-before-delete.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs-before-delete.json >/dev/null; then
            echo "::error::An open PR started using this branch."
            exit 1
          fi

          ARCHIVE_BRANCH="archive/rival-ai-history-20261107"
          ARCHIVE_CHECKPOINT="cb7e18e574bae0441e5df6eaca618a3b92c63fc9"
          archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$archive_ref")" == "$ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned rival-AI history archive moved or is missing."
            exit 1
          }
          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019" "+refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH" "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/dev:refs/remotes/origin/dev"
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019 &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/dev; then
            echo "::error::Branch tip is not reachable from a verified archive, main or dev."
            exit 1
          fi

          # Compare-and-swap lease prevents deleting a branch that moved after
          # verification. Only the exact pre-reviewed ref may be deleted.
          git push --force-with-lease="refs/heads/$BRANCH_NAME:$EXPECTED_SHA" origin ":refs/heads/$BRANCH_NAME"

          if gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::Ref still exists after conditional deletion."
            exit 1
          fi

          remaining="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq '[add[]] | length')"
          echo "Successfully retired $BRANCH_NAME at $EXPECTED_SHA. Remaining branch refs: $remaining"
          echo "Remaining refs are reported from the live GitHub inventory; the permanent and open-PR refs are never removed."
