name: Retire verified branch reference

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "One exact branch ref from the reviewed retirement allowlist"
        required: true
        type: choice
        options:
          - automation/split-policy-target-checkouts-20261119
          - automation/structured-patch-loop-integration-20261120
          - automation-ledger-activation-20261115
          - chore/strict-automation-gates-20261121
          - feat/n64-bounded-memory-map-20261125
          - feature/pause-overlay-guidance
          - fix/agents-finish-without-owner-clarification-20261113
          - fix/automation-resume-multifile-read-20261118
          - fix/automation-resume-source-context-20261118
          - fix/autonomous-summary-sync-20261113
          - fix/deterministic-writer-cycle-contract-20261116
          - fix/gemini-context-budget-20261118
          - fix/groq-dispatch-origin-guard-20261118
          - fix/patch-cycle-review-lock-20261120
          - fix/queued-task-pr-resume-20261117
          - gameplay/normalized-player-route-progress-20261120
          - gameplay/per-course-rival-route-cursors-20261120
          - gameplay/playable-fork-run-course-20261120
          - gameplay/rival-branch-geometry-regression-20261120
          - gameplay/rival-route-cursors-20261117
          - security/enforce-task-write-scope-20261116
          - security/opencode-default-deny-20261117
          - archive/gameplay-cleanup-20261121
      expected_sha:
        description: "Exact SHA from the reviewed inventory"
        required: true
        type: string
      confirm_branch:
        description: "Type the complete branch name again"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-verified-branch-reference
  cancel-in-progress: false

jobs:
  retire:
    if: github.actor == 'Master-Chiken' && github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.number == 248 && github.event.issue.pull_request == null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      INPUT_BRANCH_NAME: ${{ inputs.branch_name || '' }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
      INPUT_CONFIRM_BRANCH: ${{ inputs.confirm_branch || '' }}
    steps:
      - name: Check out main for exact ref and ancestry verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate exact owner-confirmed branch and SHA
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            [[ "$ISSUE_NUMBER" == "248" ]] || { echo "::error::Only branch-budget issue #248 is accepted."; exit 1; }
            if [[ ! "$COMMENT_BODY" =~ ^/retire-branch[[:space:]]+([A-Za-z0-9_./-]+)[[:space:]]+([0-9a-f]{40})[[:space:]]+CONFIRM$ ]]; then
              echo "::error::Use exactly: /retire-branch BRANCH_NAME EXPECTED_SHA CONFIRM"
              exit 1
            fi
            BRANCH_NAME="${BASH_REMATCH[1]}"
            EXPECTED_SHA="${BASH_REMATCH[2]}"
            CONFIRM_BRANCH="$BRANCH_NAME"
          else
            BRANCH_NAME="$INPUT_BRANCH_NAME"
            EXPECTED_SHA="$INPUT_EXPECTED_SHA"
            CONFIRM_BRANCH="$INPUT_CONFIRM_BRANCH"
          fi

          [[ -n "$BRANCH_NAME" && "$CONFIRM_BRANCH" == "$BRANCH_NAME" ]] || {
            echo "::error::Branch confirmation mismatch."
            exit 1
          }

          case "$BRANCH_NAME" in
            "automation/split-policy-target-checkouts-20261119") PINNED_SHA="5f5accc3299793cbf35367286d4ef69248ad6fbe" ;;
            "automation/structured-patch-loop-integration-20261120") PINNED_SHA="11eed9dde15bca7b5ad26bff59df12d6ad2a2bae" ;;
            "automation-ledger-activation-20261115") PINNED_SHA="451e239072f8d94b638fe67d2c22ce9e3826f324" ;;
            "chore/strict-automation-gates-20261121") PINNED_SHA="a4b97a7dc58dc263cc2ac2dc40c14bdbd4e85ccb" ;;
            "feat/n64-bounded-memory-map-20261125") PINNED_SHA="3150a5851dafa36c61f366567150822901714901" ;;
            "feature/pause-overlay-guidance") PINNED_SHA="84d58ba7bf58aed270b227f422103cd460c52a7d" ;;
            "fix/agents-finish-without-owner-clarification-20261113") PINNED_SHA="67ab3839a3d49808c5a0217e4949985e304b4589" ;;
            "fix/automation-resume-multifile-read-20261118") PINNED_SHA="0a1623ac2573abcfbe87bc0a1a8c1024ead29698" ;;
            "fix/automation-resume-source-context-20261118") PINNED_SHA="53b958aa66a5a6355117fba5cdd4dc8a51bc0a38" ;;
            "fix/autonomous-summary-sync-20261113") PINNED_SHA="e3c1aaf90641f270a47dfe85c59cdf3676db21b9" ;;
            "fix/deterministic-writer-cycle-contract-20261116") PINNED_SHA="76719432191d36ab9430bef2ad8f13958fa07f23" ;;
            "fix/gemini-context-budget-20261118") PINNED_SHA="f36069f77a1fad5de27c9d4567956d73857e3f1d" ;;
            "fix/groq-dispatch-origin-guard-20261118") PINNED_SHA="e0b63c1eb0ebdd9a6e433c2603e69af41ac2bdb0" ;;
            "fix/patch-cycle-review-lock-20261120") PINNED_SHA="28960c7fc029f91f2637991e9d4d83113e77673a" ;;
            "fix/queued-task-pr-resume-20261117") PINNED_SHA="6726b0d8aa34b5107f46f4755e37d44eda8625cb" ;;
            "gameplay/normalized-player-route-progress-20261120") PINNED_SHA="19beab26f7274b8c473be4172d8f62b8b5ae7c73" ;;
            "gameplay/per-course-rival-route-cursors-20261120") PINNED_SHA="3c2da3c3be233e72581e38b27f3e60bae17d3c9b" ;;
            "gameplay/playable-fork-run-course-20261120") PINNED_SHA="25bf689431074cd6278d826b71a46b7d636d8a63" ;;
            "gameplay/rival-branch-geometry-regression-20261120") PINNED_SHA="e13c31d55efcba3c98e689ca7235c65a8b0f7ba9" ;;
            "gameplay/rival-route-cursors-20261117") PINNED_SHA="ff5cdd59244deae763b10ae6516358754a9344c4" ;;
            "security/enforce-task-write-scope-20261116") PINNED_SHA="f52d7fc1d9d07cda8594cb977b455fe1ea2ff651" ;;
            "security/opencode-default-deny-20261117") PINNED_SHA="42f5c3f7f30ca5f8e0fc661950a3dd4efd303325" ;;
            "archive/gameplay-cleanup-20261121") PINNED_SHA="25bf689431074cd6278d826b71a46b7d636d8a63" ;;
            *) echo "::error::Branch is not allowlisted."; exit 1 ;;
          esac

          [[ "$EXPECTED_SHA" == "$PINNED_SHA" ]] || {
            echo "::error::Expected SHA does not match the reviewed allowlist."
            exit 1
          }
          {
            echo "branch_name=$BRANCH_NAME"
            echo "expected_sha=$EXPECTED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protection, open PR references and archived ancestry
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.selection.outputs.branch_name }}
          EXPECTED_SHA: ${{ steps.selection.outputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" && "$BRANCH_NAME" != "archive/branch-heads-20261019" && "$BRANCH_NAME" != "archive/rival-ai-history-20261107" && "$BRANCH_NAME" != "archive/branch-heads-20261126" ]] || {
            echo "::error::Permanent refs cannot be retired."
            exit 1
          }

          ref_json="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME")"
          [[ "$(jq -r '.object.sha' <<< "$ref_json")" == "$EXPECTED_SHA" ]] || {
            echo "::error::Live branch head changed."
            exit 1
          }

          branch_pages="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100")"
          branch_json="$(jq -c --arg branch "$BRANCH_NAME" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
          [[ -n "$branch_json" ]] || { echo "::error::Branch missing from inventory."; exit 1; }
          [[ "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || {
            echo "::error::Protected branch."
            exit 1
          }

          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs.json >/dev/null; then
            echo "::error::An open PR uses this branch as head or base."
            exit 1
          fi

          ARCHIVE_BRANCH="archive/rival-ai-history-20261107"
          ARCHIVE_CHECKPOINT="cb7e18e574bae0441e5df6eaca618a3b92c63fc9"
          NEW_ARCHIVE_BRANCH="archive/branch-heads-20261126"
          NEW_ARCHIVE_CHECKPOINT="b8aac5311f1552a99205eea08f42c695504981e8"
          new_archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$NEW_ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$new_archive_ref")" == "$NEW_ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned 2026-11-26 recovery archive moved or is missing."
            exit 1
          }
          archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$archive_ref")" == "$ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned rival-AI history archive moved or is missing."
            exit 1
          }

          require_protected_archive() {
            local archive_name="$1"
            local archive_json
            archive_json="$(jq -c --arg branch "$archive_name" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
            [[ -n "$archive_json" ]] || {
              echo "::error::Required recovery archive $archive_name is missing from branch inventory."
              exit 1
            }
            [[ "$(jq -r '.protected' <<< "$archive_json")" == "true" ]] || {
              echo "::error::Required recovery archive $archive_name is not protected; enable an active branch protection rule before retiring branches."
              exit 1
            }
          }
          require_protected_archive "archive/branch-heads-20261019"
          require_protected_archive "$ARCHIVE_BRANCH"
          require_protected_archive "$NEW_ARCHIVE_BRANCH"

          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019" "+refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH" "+refs/heads/$NEW_ARCHIVE_BRANCH:refs/remotes/origin/$NEW_ARCHIVE_BRANCH" "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/dev:refs/remotes/origin/dev"
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019 &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$NEW_ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/dev; then
            echo "::error::Branch tip is not reachable from a verified archive, main or dev."
            exit 1
          fi

      - name: Recheck exact ref and atomically retire one branch
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.selection.outputs.branch_name }}
          EXPECTED_SHA: ${{ steps.selection.outputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" && "$BRANCH_NAME" != "archive/branch-heads-20261019" && "$BRANCH_NAME" != "archive/rival-ai-history-20261107" && "$BRANCH_NAME" != "archive/branch-heads-20261126" ]] || {
            echo "::error::Permanent refs cannot be retired."
            exit 1
          }
          ref_json="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME")"
          [[ "$(jq -r '.object.sha' <<< "$ref_json")" == "$EXPECTED_SHA" ]] || {
            echo "::error::Branch moved after the first check."
            exit 1
          }

          branch_pages="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100")"
          branch_json="$(jq -c --arg branch "$BRANCH_NAME" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
          [[ -n "$branch_json" && "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || {
            echo "::error::Branch missing or protected at final check."
            exit 1
          }

          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs-before-delete.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs-before-delete.json >/dev/null; then
            echo "::error::An open PR started using this branch."
            exit 1
          fi

          ARCHIVE_BRANCH="archive/rival-ai-history-20261107"
          ARCHIVE_CHECKPOINT="cb7e18e574bae0441e5df6eaca618a3b92c63fc9"
          NEW_ARCHIVE_BRANCH="archive/branch-heads-20261126"
          NEW_ARCHIVE_CHECKPOINT="b8aac5311f1552a99205eea08f42c695504981e8"
          new_archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$NEW_ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$new_archive_ref")" == "$NEW_ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned 2026-11-26 recovery archive moved or is missing."
            exit 1
          }
          archive_ref="$(gh api "repos/$GH_REPO/git/ref/heads/$ARCHIVE_BRANCH")"
          [[ "$(jq -r '.object.sha' <<< "$archive_ref")" == "$ARCHIVE_CHECKPOINT" ]] || {
            echo "::error::The pinned rival-AI history archive moved or is missing."
            exit 1
          }

          require_protected_archive() {
            local archive_name="$1"
            local archive_json
            archive_json="$(jq -c --arg branch "$archive_name" 'add | map(select(.name == $branch)) | if length == 1 then .[0] else empty end' <<< "$branch_pages")"
            [[ -n "$archive_json" ]] || {
              echo "::error::Required recovery archive $archive_name is missing from branch inventory."
              exit 1
            }
            [[ "$(jq -r '.protected' <<< "$archive_json")" == "true" ]] || {
              echo "::error::Required recovery archive $archive_name is not protected; enable an active branch protection rule before retiring branches."
              exit 1
            }
          }
          require_protected_archive "archive/branch-heads-20261019"
          require_protected_archive "$ARCHIVE_BRANCH"
          require_protected_archive "$NEW_ARCHIVE_BRANCH"

          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019" "+refs/heads/$ARCHIVE_BRANCH:refs/remotes/origin/$ARCHIVE_BRANCH" "+refs/heads/$NEW_ARCHIVE_BRANCH:refs/remotes/origin/$NEW_ARCHIVE_BRANCH" "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/dev:refs/remotes/origin/dev"
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019 &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/$NEW_ARCHIVE_BRANCH" &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main &&
             ! git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/dev; then
            echo "::error::Branch tip is not reachable from a verified archive, main or dev."
            exit 1
          fi

          # Compare-and-swap lease prevents deleting a branch that moved after
          # verification. Only the exact pre-reviewed ref may be deleted.
          git push --force-with-lease="refs/heads/$BRANCH_NAME:$EXPECTED_SHA" origin ":refs/heads/$BRANCH_NAME"

          if gh api "repos/$GH_REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::Ref still exists after conditional deletion."
            exit 1
          fi

          remaining="$(gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq '[add[]] | length')"
          echo "Successfully retired $BRANCH_NAME at $EXPECTED_SHA. Remaining branch refs: $remaining"
          echo "Remaining refs are reported from the live GitHub inventory; the permanent and open-PR refs are never removed."
