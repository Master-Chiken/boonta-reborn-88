name: Retire verified branch reference

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "One pre-reviewed branch ref"
        required: true
        type: choice
        options:
          - recovery/all-branch-heads-20261102
          - test/ares-gdb-smoke-20261021
      expected_sha:
        description: "Exact SHA from reviewed inventory"
        required: true
        type: string
      confirm_branch:
        description: "Type the complete branch name again"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-verified-branch-reference
  cancel-in-progress: false

jobs:
  retire:
    if: github.actor == 'Master-Chiken' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRM_BRANCH: ${{ inputs.confirm_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact allowlist, head, protection, PRs and archive reachability
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM_BRANCH" == "$BRANCH_NAME" ]] || { echo "::error::Confirmation mismatch"; exit 1; }
          case "$BRANCH_NAME" in
            "recovery/all-branch-heads-20261102") PINNED_SHA="69a88aadcc7fb3bb17255136f079568f3f98c501" ;;
            "test/ares-gdb-smoke-20261021") PINNED_SHA="fa8cee047ae8e74c30c87cd94977c434bb1c7398" ;;
            *) echo "::error::Not allowlisted"; exit 1 ;;
          esac
          [[ "$EXPECTED_SHA" == "$PINNED_SHA" ]] || { echo "::error::SHA mismatch"; exit 1; }
          branch_json="$(gh api "repos/$GH_REPO/branches/$BRANCH_NAME")"
          [[ "$(jq -r '.commit.sha' <<< "$branch_json")" == "$EXPECTED_SHA" ]] || { echo "::error::Head changed"; exit 1; }
          [[ "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || { echo "::error::Protected branch"; exit 1; }
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs.json >/dev/null; then
            echo "::error::Open PR uses this branch"; exit 1
          fi
          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019
      - name: Recheck and delete one ref
        shell: bash
        run: |
          set -euo pipefail
          branch_json="$(gh api "repos/$GH_REPO/branches/$BRANCH_NAME")"
          [[ "$(jq -r '.commit.sha' <<< "$branch_json")" == "$EXPECTED_SHA" && "$(jq -r '.protected' <<< "$branch_json")" == "false" ]] || { echo "::error::Branch changed"; exit 1; }
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs-before-delete.json
          if jq -e --arg branch "$BRANCH_NAME" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' /tmp/open-prs-before-delete.json >/dev/null; then
            echo "::error::Open PR uses this branch"; exit 1
          fi
          git fetch --no-tags origin "+refs/heads/archive/branch-heads-20261019:refs/remotes/origin/archive/branch-heads-20261019"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/archive/branch-heads-20261019
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH_NAME"
          if gh api "repos/$GH_REPO/branches/$BRANCH_NAME" >/dev/null 2>&1; then echo "::error::Ref still exists"; exit 1; fi
