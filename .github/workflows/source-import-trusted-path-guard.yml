name: Trusted source-import path guard

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open pull request number to inspect"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-source-import-path-guard-${{ github.event.pull_request.number || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: true

jobs:
  trusted-path-guard:
    name: Check proposed source paths using trusted base policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          # Always load the latest trusted policy from the fixed target branch; PR event base SHAs may lag behind main.
          ref: main
          persist-credentials: false

      - name: Fetch proposed filenames as API metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ""|*[!0-9]*)
              echo "::error::A valid pull request number is required."
              exit 2
              ;;
          esac
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/proposed-files.json"
          python3 tools/check_proposed_source_paths.py "$RUNNER_TEMP/proposed-files.json"

      - name: Run trusted path policy unit tests
        working-directory: tools
        run: python3 -m unittest -v test_check_proposed_source_paths.py test_check_source_import_policy.py
