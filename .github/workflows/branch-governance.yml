name: Branch governance audit

on:
  workflow_dispatch:
  create:
    branches: ["**"]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: branch-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    name: Inventory and report branch activity
    runs-on: ubuntu-latest
    steps:
      - name: Collect branch and open-PR metadata
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq -c 'add' > /tmp/branches.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          python3 - <<'PY'
          import datetime, json, os, subprocess, time
          from pathlib import Path
          branches = json.loads(Path("/tmp/branches.json").read_text())
          prs = json.loads(Path("/tmp/open-prs.json").read_text())
          repo = os.environ["GH_REPO"]
          info = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}"], text=True))
          default_branch = info["default_branch"]
          now = datetime.datetime.now(datetime.timezone.utc)
          pr_heads = {p["head"]["ref"] for p in prs}
          active, inactive = [], []
          unknown_dates = 0
          date_by_sha = {}
          for b in branches:
              name = b["name"]
              sha = b.get("commit", {}).get("sha")
              date = None
              if sha:
                  try:
                      # The /branches endpoint returns only a commit SHA/URL,
                      # not the nested commit timestamp; fetch the actual tip.
                      date = subprocess.check_output(
                          ["gh", "api", f"repos/{repo}/commits/{sha}",
                           "--jq", ".commit.committer.date // .commit.author.date // empty"],
                          text=True, stderr=subprocess.DEVNULL).strip() or None
                  except subprocess.CalledProcessError:
                      date = None
              recent = False
              if date:
                  try:
                      stamp = datetime.datetime.fromisoformat(date.replace("Z", "+00:00"))
                      recent = (now - stamp).days < 30
                  except ValueError:
                      date = None
              if not date:
                  unknown_dates += 1
              # Fail conservatively: if we cannot resolve a tip date, keep it
              # active pending review rather than wrongly treating it as stale.
              unknown = not date
              item = {"name": name, "date": date or "unknown", "open_pr": name in pr_heads,
                      "unknown_date": unknown}
              (active if name == default_branch or name in pr_heads or recent or unknown else inactive).append(item)
              time.sleep(0.05)
          lines = ["# Branch governance audit", "",
              f"- **Total branches:** {len(branches)}",
              f"- **Active branches (30-day/open-PR heuristic; unknown dates count active):** {len(active)} / target 30",
              f"- **Branches with unresolved tip dates:** {unknown_dates}",
              f"- **Open pull requests:** {len(prs)}",
              f"- **Default branch:** `{default_branch}`",
              "- **Automatic deletion:** disabled by project policy.", "", "## Active branches", ""]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" + ("; open PR" if x["open_pr"] else "") for x in sorted(active, key=lambda x: x["name"])]
          lines += ["", "## Inactive candidates for human/AI review", "",
              "These branches are only candidates for review. They have not been deleted or modified."]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" for x in sorted(inactive, key=lambda x: x["name"])]
          report = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={len(branches)}\nactive={len(active)}\nover_target={'true' if len(active) > 30 else 'false'}\n")
          PY

      - name: Open a consolidation tracking issue when active branches exceed 30
        if: steps.inventory.outputs.over_target == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOTAL: ${{ steps.inventory.outputs.total }}
          ACTIVE: ${{ steps.inventory.outputs.active }}
        shell: bash
        run: |
          set -euo pipefail
          title="Branch governance: consolidation needed"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "\"$title\"" --json number,title --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            {
              echo "## Active branch target exceeded"
              echo
              echo "- Total branches: **$TOTAL** (historical/inactive branches may remain)"
              echo "- Active branches (30-day/open-PR heuristic): **$ACTIVE**"
              echo "- Target: **30 active branches or fewer**"
              echo
              echo "### Required actions"
              echo "1. Review branch purposes, open PRs, recent commits, and whether work is already in `main`."
              echo "2. Consolidate useful work through reviewed pull requests and CI."
              echo "3. Do not delete branches automatically. Preserve all branch contents and commits; historical branches may remain."
              echo "4. Update this issue with the remaining active count and blockers."
              echo
              echo "Generated by the Branch governance audit workflow."
            } > /tmp/issue.md
            gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/issue.md
          else
            echo "Tracking issue #$existing is already open; no duplicate created."
          fi
