name: Branch governance audit

on:
  workflow_dispatch:
  create:
    branches: ["**"]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: branch-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    name: Inventory and report branch activity
    runs-on: ubuntu-latest
    steps:
      - name: Collect branch and open-PR metadata
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq -c 'add' > /tmp/branches.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          python3 - <<'PY'
          import datetime, json, os, subprocess, time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          branches = json.loads(Path("/tmp/branches.json").read_text())
          prs = json.loads(Path("/tmp/open-prs.json").read_text())
          repo = os.environ["GH_REPO"]
          info = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}"], text=True))
          default_branch = info["default_branch"]
          now = datetime.datetime.now(datetime.timezone.utc)
          pr_heads = {p["head"]["ref"] for p in prs}
          permanent_names = {"main", "dev"}
          permanent, active_work, preservation, inactive = [], [], [], []
          unknown_dates = 0

          # Resolve each unique tip SHA once, concurrently. The previous loop
          # waited on each GitHub API request serially; a bounded pool reduces
          # audit latency without increasing the number of requests or losing
          # the conservative "unknown date means active" behavior.
          tip_shas = sorted({
              b.get("commit", {}).get("sha")
              for b in branches
              if b.get("commit", {}).get("sha")
          })

          date_lookup_started = time.monotonic()
          date_lookup_request_seconds = 0.0

          def resolve_tip_date(sha):
              request_started = time.monotonic()
              try:
                  date = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/commits/{sha}",
                       "--jq", ".commit.committer.date // .commit.author.date // empty"],
                      text=True, stderr=subprocess.DEVNULL).strip() or None
              except subprocess.CalledProcessError:
                  date = None
              return sha, date, time.monotonic() - request_started

          with ThreadPoolExecutor(max_workers=min(10, max(1, len(tip_shas)))) as pool:
              tip_date_results = list(pool.map(resolve_tip_date, tip_shas))
          date_lookup_wall_seconds = time.monotonic() - date_lookup_started
          date_lookup_request_seconds = sum(elapsed for _, _, elapsed in tip_date_results)
          date_by_sha = {sha: date for sha, date, _ in tip_date_results}

          for b in branches:
              name = b["name"]
              sha = b.get("commit", {}).get("sha")
              date = date_by_sha.get(sha) if sha else None
              recent = False
              if date:
                  try:
                      stamp = datetime.datetime.fromisoformat(date.replace("Z", "+00:00"))
                      recent = (now - stamp).days < 30
                  except ValueError:
                      date = None
              if not date:
                  unknown_dates += 1
              # Fail conservatively: if we cannot resolve a tip date, keep it
              # active pending review rather than wrongly treating it as stale.
              unknown = not date
              item = {"name": name, "date": date or "unknown", "open_pr": name in pr_heads,
                      "unknown_date": unknown, "protected": bool(b.get("protected", False))}
              if name.startswith(("archive/", "recovery/")):
                  preservation.append(item)
              elif name in permanent_names:
                  permanent.append(item)
              elif name in pr_heads or recent or unknown:
                  active_work.append(item)
              else:
                  inactive.append(item)

          by_name = {b["name"]: b for b in branches}
          main_ref = by_name.get("main")
          dev_ref = by_name.get("dev")
          main_protection_missing = not main_ref or not main_ref.get("protected", False)
          dev_protection_missing = not dev_ref or not dev_ref.get("protected", False)

          def branch_health(name, ref):
              if not ref:
                  return "MISSING"
              return "present/protected" if ref.get("protected", False) else "present/**UNPROTECTED**"

          lines = ["# Branch governance audit", "",
              f"- **Total refs:** {len(branches)}",
              f"- **Permanent branch model:** `main` (stable/release) + `dev` (integration)",
              f"- **`main`:** {branch_health('main', main_ref)}",
              f"- **`dev`:** {branch_health('dev', dev_ref)}",
              f"- **Active task branches** (30-day/open-PR heuristic; unknown dates count active): {len(active_work)}",
              f"- **Preservation refs** (`archive/*` and `recovery/*`): {len(preservation)}; excluded from active task count",
              f"- **Inactive task refs for review:** {len(inactive)}",
              f"- **Branches with unresolved tip dates:** {unknown_dates}",
              f"- **Open pull requests:** {len(prs)}",
              f"- Unique tip dates requested: {len(tip_shas)}",
              f"- Tip-date lookup wall time: {date_lookup_wall_seconds:.2f}s",
              f"- Serial-equivalent request wait: {date_lookup_request_seconds:.2f}s",
              f"- Estimated lookup-stage speedup: {date_lookup_request_seconds / max(date_lookup_wall_seconds, 0.001):.1f}x",
              f"- **Default branch:** `{default_branch}`",
              "- **Automatic deletion and merging:** disabled by project policy.",
              "- **Hard cap:** 105 refs (warning at 100), retained only as an emergency GitHub-limit safeguard.",
              "", "## Permanent integration branches", ""]
          lines += [f"- `{x['name']}` — {branch_health(x['name'], by_name.get(x['name']))}" for x in sorted(permanent, key=lambda x: x["name"])]
          lines += ["", "## Active task branches", ""]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" + ("; open PR" if x["open_pr"] else "") for x in sorted(active_work, key=lambda x: x["name"])]
          lines += ["", "## Preservation refs (not product branches)", "",
              "Keep these outside normal intake. Never merge an archive/recovery ref wholesale into `main` or `dev`."]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" for x in sorted(preservation, key=lambda x: x["name"])]
          lines += ["", "## Inactive task refs for human/AI review", "",
              "These branches are candidates for individual review only; they have not been deleted or modified."]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" for x in sorted(inactive, key=lambda x: x["name"])]
          report = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={len(branches)}\nactive_work={len(active_work)}\n")
              out.write(f"main_protection_missing={'true' if main_protection_missing else 'false'}\n")
              out.write(f"dev_protection_missing={'true' if dev_protection_missing else 'false'}\n")
              out.write(f"permanent_protection_missing={'true' if main_protection_missing or dev_protection_missing else 'false'}\n")
              out.write(f"cap_warning={'true' if len(branches) >= 100 else 'false'}\n")
              out.write(f"hard_cap_exceeded={'true' if len(branches) > 105 else 'false'}\n")
          PY

      - name: Warn when approaching or exceeding the 105-branch hard cap
        if: steps.inventory.outputs.cap_warning == 'true' || steps.inventory.outputs.hard_cap_exceeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOTAL: ${{ steps.inventory.outputs.total }}
        shell: bash
        run: |
          set -euo pipefail
          title="Branch governance: 105-branch hard cap"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title" --json number,title --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            {
              echo "## Branch count hard cap"
              echo
              echo "- Current total: **$TOTAL**"
              echo "- Hard cap: **105 branches**"
              echo "- Early warning: **100 branches**"
              echo "Stop creating branches at 100; do not exceed 105."
              echo "Preserve all branch history. Never delete automatically."
              echo "GitHub Actions reports after creation; it cannot retroactively block the create event."
            } > /tmp/issue.md
            gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/issue.md
          else
            gh issue comment "$existing" --repo "$GH_REPO" --body "Latest audit reports $TOTAL branches; hard cap 105, warning threshold 100."
          fi

      - name: Fail audit if hard cap exceeded
        if: steps.inventory.outputs.hard_cap_exceeded == 'true'
        run: |
          echo "::error::Repository has ${{ steps.inventory.outputs.total }} branches; hard cap is 105. No branches were deleted."
          exit 1
      - name: Open a tracking issue when a permanent branch is missing or unprotected
        if: steps.inventory.outputs.permanent_protection_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_MISSING: ${{ steps.inventory.outputs.main_protection_missing }}
          DEV_MISSING: ${{ steps.inventory.outputs.dev_protection_missing }}
        shell: bash
        run: |
          set -euo pipefail
          title="Branch governance: protect main and dev"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "\"$title\"" --json number,title --jq '.[0].number // empty')"
          {
            echo "## Two-permanent-branch protection prerequisite"
            echo
            echo "- main missing/unprotected: **$MAIN_MISSING**"
            echo "- dev missing/unprotected: **$DEV_MISSING**"
            echo
            echo "### Required owner action"
            echo "Open Settings → Rules → Rulesets and ensure both `refs/heads/main` and `refs/heads/dev` have active rulesets."
            echo "Block deletion and force-pushes; require pull requests before merging. Keep main as the repository default branch."
            echo "The audit only reports missing protection. It does not mutate rulesets or delete refs."
            echo
            echo "Generated by the Branch governance audit workflow."
          } > /tmp/issue.md
          if [ -z "$existing" ]; then
            gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/issue.md
          else
            gh issue comment "$existing" --repo "$GH_REPO" --body-file /tmp/issue.md
          fi
