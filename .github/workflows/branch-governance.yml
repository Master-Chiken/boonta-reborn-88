name: Branch governance audit

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/branch-governance.yml"
  create:
    branches: ["**"]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: branch-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    name: Inventory and report branch activity
    runs-on: ubuntu-latest
    steps:
      - name: Collect branch and open-PR metadata
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq -c 'add' > /tmp/branches.json
          gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > /tmp/open-prs.json
          python3 - <<'PY'
          import datetime, json, os, subprocess, time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          branches = json.loads(Path("/tmp/branches.json").read_text())
          prs = json.loads(Path("/tmp/open-prs.json").read_text())
          repo = os.environ["GH_REPO"]
          info = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}"], text=True))
          default_branch = info["default_branch"]
          now = datetime.datetime.now(datetime.timezone.utc)
          pr_heads = {p["head"]["ref"] for p in prs}
          active, inactive = [], []
          unknown_dates = 0
          BRANCH_WARNING_THRESHOLD = 10
          BRANCH_REDLINE = 20
          ACTIVE_BRANCH_TARGET = 10

          # Resolve each unique tip SHA once, concurrently. The previous loop
          # waited on each GitHub API request serially; a bounded pool reduces
          # audit latency without increasing the number of requests or losing
          # the conservative "unknown date means active" behavior.
          tip_shas = sorted({
              b.get("commit", {}).get("sha")
              for b in branches
              if b.get("commit", {}).get("sha")
          })

          date_lookup_started = time.monotonic()
          date_lookup_request_seconds = 0.0

          def resolve_tip_date(sha):
              request_started = time.monotonic()
              try:
                  date = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/commits/{sha}",
                       "--jq", ".commit.committer.date // .commit.author.date // empty"],
                      text=True, stderr=subprocess.DEVNULL).strip() or None
              except subprocess.CalledProcessError:
                  date = None
              return sha, date, time.monotonic() - request_started

          with ThreadPoolExecutor(max_workers=min(10, max(1, len(tip_shas)))) as pool:
              tip_date_results = list(pool.map(resolve_tip_date, tip_shas))
          date_lookup_wall_seconds = time.monotonic() - date_lookup_started
          date_lookup_request_seconds = sum(elapsed for _, _, elapsed in tip_date_results)
          date_by_sha = {sha: date for sha, date, _ in tip_date_results}

          for b in branches:
              name = b["name"]
              sha = b.get("commit", {}).get("sha")
              date = date_by_sha.get(sha) if sha else None
              recent = False
              if date:
                  try:
                      stamp = datetime.datetime.fromisoformat(date.replace("Z", "+00:00"))
                      recent = (now - stamp).days < 30
                  except ValueError:
                      date = None
              if not date:
                  unknown_dates += 1
              # Fail conservatively: if we cannot resolve a tip date, keep it
              # active pending review rather than wrongly treating it as stale.
              unknown = not date
              item = {"name": name, "date": date or "unknown", "open_pr": name in pr_heads,
                      "unknown_date": unknown}
              (active if name == default_branch or name in pr_heads or recent or unknown else inactive).append(item)
          budget_status = ("RED LINE EXCEEDED" if len(branches) > BRANCH_REDLINE
                            else ("WARNING" if len(branches) >= BRANCH_WARNING_THRESHOLD else "within budget"))
          auto_delete = "enabled" if info.get("delete_branch_on_merge", False) else "DISABLED — enable in Settings → General → Pull Requests"
          lines = ["# Branch governance audit", "",
              f"- **Total branches:** {len(branches)}",
              f"- **Branch budget:** warning at {BRANCH_WARNING_THRESHOLD}; red line above {BRANCH_REDLINE}; status: {budget_status}",
              f"- **Active branches (30-day/open-PR heuristic; unknown dates count active):** {len(active)} / target {ACTIVE_BRANCH_TARGET}",
              f"- **Branches with unresolved tip dates:** {unknown_dates}",
              f"- **Open pull requests:** {len(prs)}",
              f"- **Automatically delete merged PR head branches:** {auto_delete}",
              f"- Unique tip dates requested: {len(tip_shas)}",
              f"- Tip-date lookup wall time: {date_lookup_wall_seconds:.2f}s",
              f"- Serial-equivalent request wait: {date_lookup_request_seconds:.2f}s",
              f"- Estimated lookup-stage speedup: {date_lookup_request_seconds / max(date_lookup_wall_seconds, 0.001):.1f}x",
              f"- **Default branch:** `{default_branch}`", "", "## Active branches", ""]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" + ("; open PR" if x["open_pr"] else "") for x in sorted(active, key=lambda x: x["name"])]
          lines += ["", "## Inactive candidates for human/AI review", "",
              "These branches are only candidates for review. They have not been deleted or modified."]
          lines += [f"- `{x['name']}` — last commit: {x['date']}" for x in sorted(inactive, key=lambda x: x["name"])]
          report = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(report)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={len(branches)}\nactive={len(active)}\nopen_prs={len(prs)}\nover_target={'true' if len(active) > ACTIVE_BRANCH_TARGET else 'false'}\n")
              out.write(f"cap_warning={'true' if len(branches) >= BRANCH_WARNING_THRESHOLD else 'false'}\n")
              out.write(f"hard_cap_exceeded={'true' if len(branches) > BRANCH_REDLINE else 'false'}\n")
          PY

      - name: Warn when branch budget is reached or exceeded
        if: steps.inventory.outputs.cap_warning == 'true' || steps.inventory.outputs.hard_cap_exceeded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOTAL: ${{ steps.inventory.outputs.total }}
          ACTIVE: ${{ steps.inventory.outputs.active }}
          OPEN_PRS: ${{ steps.inventory.outputs.open_prs }}
        shell: bash
        run: |
          set -euo pipefail
          title="Branch governance: branch budget"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title" --json number,title --jq '.[0].number // empty')"
          {
            echo "## Branch budget alert"
            echo
            echo "- Current total: **$TOTAL branch refs**"
            echo "- Warning threshold: **10 branches**"
            echo "- Red line: **more than 20 branches**"
            echo "- Active branch estimate (recent tip or open PR): **$ACTIVE**; target **10 or fewer**"
            echo "- Open pull requests: **$OPEN_PRS**"
            echo
            echo "### Required actions"
            echo "1. Keep only main, dev, the protected recovery archive, and branches needed by live pull requests."
            echo "2. Turn on automatic deletion of merged PR head branches in **Settings → General → Pull Requests**."
            echo "3. Review stale branches without an open PR. Preserve history in the recovery archive; do not bulk-delete unverified refs."
            echo
            echo "This is an alert, not a hard block: GitHub Actions runs after a branch is created and cannot retroactively prevent that creation. This audit does not delete branches."
            echo
            echo "Updated by the Branch governance audit workflow."
          } > /tmp/issue.md
          if [ -z "$existing" ]; then
            gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/issue.md
          else
            gh issue edit "$existing" --repo "$GH_REPO" --body-file /tmp/issue.md
            echo "Updated existing branch-budget issue #$existing instead of adding a duplicate comment."
          fi

      - name: Close branch-budget issue when the repository is back within budget
        if: steps.inventory.outputs.cap_warning == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title="Branch governance: branch budget"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title" --json number,title --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GH_REPO" --comment "The latest branch audit is back below the 10-branch warning threshold. Closing this alert; the next audit will reopen it if the budget is exceeded again."
          else
            echo "No open branch-budget alert to close."
          fi

      - name: Fail audit if branch red line exceeded
        if: steps.inventory.outputs.hard_cap_exceeded == 'true'
        run: |
          echo "::error::Repository has ${{ steps.inventory.outputs.total }} branches; red line is 20. No branches were deleted."
          exit 1
