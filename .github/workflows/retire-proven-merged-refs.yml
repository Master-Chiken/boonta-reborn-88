name: Retire archive-backed branch refs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/retire-proven-merged-refs.yml"
  # Deliberately no workflow_dispatch: deletion is only triggered by the reviewed
  # workflow arriving on protected main, never by selecting an arbitrary branch.

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-archive-backed-branch-refs
  cancel-in-progress: false

jobs:
  retire:
    name: Retire recoverable refs, keep main and archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Preflight all refs, then retire only recoverable branches
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == "Master-Chiken/boonta-reborn-88" ]] || { echo "::error::Unexpected repository; refusing cleanup."; exit 1; }

          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          [[ "$default_branch" == "main" ]] || { echo "::error::Expected default branch main; refusing cleanup."; exit 1; }

          archive_branch="archive/branch-heads-20261019"
          target_count=2
          workdir="$RUNNER_TEMP/archive-backed-cleanup"
          git clone --quiet --no-tags --no-checkout "https://github.com/$GH_REPO.git" "$workdir"
          git -C "$workdir" fetch --quiet origin "refs/heads/main:refs/remotes/origin/main"
          git -C "$workdir" fetch --quiet origin "refs/heads/$archive_branch:refs/remotes/origin/$archive_branch"
          main_ref="refs/remotes/origin/main"
          archive_ref="refs/remotes/origin/$archive_branch"

          inventory() {
            gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq -c 'add' > "$RUNNER_TEMP/branches.json"
            gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > "$RUNNER_TEMP/open-prs.json"
          }
          branch_count() { jq 'length' "$RUNNER_TEMP/branches.json"; }
          is_open_pr_head() {
            local name="$1"
            jq -e --arg name "$name" --arg repo "$GH_REPO" \
              'any(.[]; .head.ref == $name and .head.repo.full_name == $repo)' \
              "$RUNNER_TEMP/open-prs.json" >/dev/null
          }

          inventory
          if ! jq -e 'any(.[]; .name == "main") and any(.[]; .name == "archive/branch-heads-20261019")' "$RUNNER_TEMP/branches.json" >/dev/null; then
            echo "::error::The two required keeper refs are not both present; nothing will be deleted."
            exit 1
          fi

          # The archive is the only recovery shelf once the candidate refs are retired.
          # Require GitHub to report it as protected before the first deletion. The
          # maintainer must configure an active exact-ref ruleset blocking deletion
          # and non-fast-forward updates; an unprotected or missing archive fails closed.
          archive_protected="$(jq -r --arg name "$archive_branch" '[.[] | select(.name == $name)][0].protected // false' "$RUNNER_TEMP/branches.json")"
          if [[ "$archive_protected" != "true" ]]; then
            echo "::error::Recovery archive must be protected against deletion and non-fast-forward updates; refusing all ref deletion."
            exit 1
          fi

          initial_count="$(branch_count)"
          echo "# Archive-backed branch-ref cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Initial refs: $initial_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required keepers: `main`, `$archive_branch`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target refs after cleanup: $target_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch-ref retirement is not integration into main; archived commits remain recoverable." >> "$GITHUB_STEP_SUMMARY"

          mapfile -t candidates < <(
            jq -r --arg archive "$archive_branch" '
              .[] | select(.name != "main" and .name != $archive)
              | [.name, .commit.sha, (.protected | tostring)] | @tsv
            ' "$RUNNER_TEMP/branches.json"
          )
          if [[ "$((${#candidates[@]} + 2))" -ne "$initial_count" ]]; then
            echo "::error::Inventory changed during preflight; nothing will be deleted."
            exit 1
          fi

          # Preflight all non-keeper refs before deleting any.
          : > "$RUNNER_TEMP/eligible.tsv"
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r name sha protected <<< "$row"
            if [[ "$protected" != "false" ]]; then
              echo "::error::$name is protected or its protection state is unknown; nothing will be deleted."
              exit 1
            fi
            if is_open_pr_head "$name"; then
              echo "::error::An open PR uses $name; nothing will be deleted."
              exit 1
            fi
            if ! git -C "$workdir" merge-base --is-ancestor "$sha" "$archive_ref" &&
               ! git -C "$workdir" merge-base --is-ancestor "$sha" "$main_ref"; then
              echo "::error::Exact tip $sha for $name is not reachable from archive or main; nothing will be deleted."
              exit 1
            fi
            printf '%s\t%s\n' "$name" "$sha" >> "$RUNNER_TEMP/eligible.tsv"
            echo "PREFLIGHT OK: $name @ $sha; unprotected; no open PR; tip recoverable from archive/main."
          done

          deleted=0
          while IFS=$'\t' read -r name sha; do
            [[ -n "$name" ]] || continue
            inventory
            archive_protected="$(jq -r --arg name "$archive_branch" '[.[] | select(.name == $name)][0].protected // false' "$RUNNER_TEMP/branches.json")"
            if [[ "$archive_protected" != "true" ]]; then
              echo "::error::Recovery archive protection disappeared during cleanup; stopping."
              exit 1
            fi
            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            if [[ "$current_sha" != "$sha" || "$protected" != "false" ]] || is_open_pr_head "$name"; then
              echo "::error::Final ref-state check changed for $name; stopping."
              exit 1
            fi
            git -C "$workdir" fetch --quiet origin "refs/heads/main:refs/remotes/origin/main"
            git -C "$workdir" fetch --quiet origin "refs/heads/$archive_branch:refs/remotes/origin/$archive_branch"
            if ! git -C "$workdir" merge-base --is-ancestor "$sha" "$archive_ref" &&
               ! git -C "$workdir" merge-base --is-ancestor "$sha" "$main_ref"; then
              echo "::error::Reachability check changed for $name; stopping."
              exit 1
            fi

            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$name" >/dev/null
            inventory
            if jq -e --arg name "$name" 'any(.[]; .name == $name)' "$RUNNER_TEMP/branches.json" >/dev/null; then
              echo "::error::GitHub still lists $name after deletion request."
              exit 1
            fi
            echo "RETIRED AND VERIFIED: $name @ $sha"
            echo "- Retired `$name` only after exact-head, protection, open-PR, and archive/main reachability checks." >> "$GITHUB_STEP_SUMMARY"
            deleted=$((deleted + 1))
          done < "$RUNNER_TEMP/eligible.tsv"

          inventory
          final_count="$(branch_count)"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Deleted refs: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final refs: $final_count" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$final_count" -ne "$target_count" ]] ||
             ! jq -e '[.[].name] | sort == ["archive/branch-heads-20261019", "main"]' "$RUNNER_TEMP/branches.json" >/dev/null; then
            echo "::error::Cleanup completed conservatively, but the live inventory is not exactly main + archive. Inspect the summary; do not delete unverified refs."
            exit 1
          fi
          echo "SUCCESS: exactly two live refs remain; archived histories are recoverable and have not been merged into main merely to reduce the count."
