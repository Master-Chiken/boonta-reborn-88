name: Proof-based branch cleanup

on:
  # This runs once when the reviewed workflow first lands on main, and can be
  # re-run manually. It is not scheduled and never discovers extra targets.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/proof-based-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: proof-based-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-only-proven-redundant-branches:
    name: Delete only branches proven contained in main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and delete the eight audited branch refs
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          if [ "$default_branch" != "main" ]; then
            echo "::error::Expected default branch main, found $default_branch. Refusing to delete."
            exit 1
          fi

          workdir="$RUNNER_TEMP/branch-cleanup"
          git clone --quiet --no-tags "https://github.com/$GH_REPO.git" "$workdir"
          git -C "$workdir" fetch --quiet origin "$default_branch"
          main_ref="refs/remotes/origin/$default_branch"

          inventory() {
            gh api --paginate --slurp "repos/$GH_REPO/branches?per_page=100" | jq -c 'add' > "$RUNNER_TEMP/branches.json"
            gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq -c 'add' > "$RUNNER_TEMP/open-prs.json"
          }

          {
            echo "# Proof-based branch cleanup"
            echo
            echo "- Default branch: `$default_branch`"
            echo "- Rule: only delete a listed branch if its exact tip is reachable from `main`, it has no open PR, and GitHub reports it unprotected."
            echo "- Fixed scope: 20 pre-existing project branches proven redundant, plus temporary cleanup branches created while installing this workflow."
            echo
            echo "| Branch | Expected tip SHA | Evidence / result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          deleted=0
          skipped=0
          while read -r name expected_sha; do
            [ -n "$name" ] || continue
            inventory

            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            if [ -z "$current_sha" ]; then
              echo "| `$name` | `$expected_sha` | Already absent; no action |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "| `$name` | `$expected_sha` | PRESERVED: tip changed to `$current_sha` |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$protected" != "false" ]; then
              echo "| `$name` | `$expected_sha` | PRESERVED: protected or protection status unknown |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
              echo "| `$name` | `$expected_sha` | PRESERVED: an open PR uses this branch |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if ! git -C "$workdir" merge-base --is-ancestor "$expected_sha" "$main_ref"; then
              echo "| `$name` | `$expected_sha` | PRESERVED: tip is not provably reachable from main |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            # Recheck tip, protection and open PR status immediately before deletion.
            inventory
            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            if [ "$current_sha" != "$expected_sha" ] || [ "$protected" != "false" ] || jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
              echo "| `$name` | `$expected_sha` | PRESERVED: final safety check failed |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$name"; then
              echo "| `$name` | `$expected_sha` | DELETED: exact tip is in main; unprotected; no open PR |" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
            else
              echo "| `$name` | `$expected_sha` | NOT DELETED: GitHub rejected deletion |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            fi
          done <<'CANDIDATES'
          ci/wii64-tool-tests e7969c4f72ab803f5f6a8c2248317cdb5f4df0de
          docs/branch-consolidation-plan 431db6000d083636341343d2a783d8696431e8b4
          docs/wii64-test-log-template 3add41a3589964baaaf725871517828a2564e9d7
          docs/wii64-tooling-guide ea1fb3014caffc744fd651d8fb4bcca1e5290f65
          test/use-gameplay-helpers-in-runtime 750fabe7330d8a50aa1089ad79bf2189376509bc
          tools/wii64-archive-verifier-v2 fe0d53bfa325ba597290f01872bd677190b75586
          tools/wii64-rice-profile-diff 7f3342beb8bd3fdb6af9c95dd0f88feeb7e9d7f7
          tools/wii64-rice-profile-inspector afc8f1d6b24064482ab53ba5f4e6bb92d55d66a1
          CANDIDATES

          merged_deleted=0
          while read -r name expected_sha pr_number; do
            [ -n "$name" ] || continue
            [ "$merged_deleted" -lt 12 ] || break
            inventory

            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            if [ -z "$current_sha" ]; then
              echo "| \`$name\` | \`$expected_sha\` | Already absent; no action (merged PR #$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: branch tip changed (merged PR #$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$protected" != "false" ]; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: protected or protection status unknown |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: an open PR uses this branch |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            merged_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
            if ! printf '%s' "$merged_pr" | jq -e --arg name "$name" --arg sha "$expected_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: merged-PR evidence did not match exact head (PR #$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            # Recheck current ref, PR state, and merged head immediately before deletion.
            inventory
            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            merged_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
            if [ "$current_sha" != "$expected_sha" ] || [ "$protected" != "false" ] || jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null || ! printf '%s' "$merged_pr" | jq -e --arg name "$name" --arg sha "$expected_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: final merged-PR safety check failed |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$name"; then
              echo "| \`$name\` | \`$expected_sha\` | DELETED: unchanged exact head of merged PR #$pr_number; unprotected; no open PR |" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
              merged_deleted=$((merged_deleted + 1))
            else
              echo "| \`$name\` | \`$expected_sha\` | NOT DELETED: GitHub rejected deletion |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            fi
          done <<'MERGED_CANDIDATES'
          maintenance/fix-branch-cleanup-protection-check 44f74b33be94555c242c13db0769823e4b32561e 139
          maintenance/proof-based-cleanup fca93b8d359bc6049beb94d16f26ad731d40b72b 138
          ai/gemini-agent-hardening 14973dce75c2455b55fe9bc42a8b0484823b0b20 15
          ai/openrouter-free-pr-review 19f31276b8ee46d72fd0557454ae30b7c3b64e82 14
          audit/initial-repository-audit 4c4ae81cc2a2bd6f3546ca0de0b43f25c579c685 54
          automation/checkout-v7-clean-rebase f8f513133915b77d075f82218d521e27db408135 40
          automation/ci-failure-triage f8144f5c1cdcb8626ea8561389cf4dca5597a856 32
          automation/github-script-v9-clean-rebase 3fd29d209388ad829a3fc84dcb7febd7680f0a63 41
          automation/upload-artifact-v7-pinned 5d15493a645f1c16ab06a2d2fac8e5e3914cc9c0 42
          docs/record-dolphin-headless-smoke d07bf10959c4da1e19d7bf36d6cb5d2ab4894f33 50
          docs/record-visible-dolphin-frame 35587e9a3196ada8965ec1699d4e6593efd88e4a 58
          docs/refresh-repository-audit ceaae89303ea81e29e0dbc1864f781b55a4d8beb 57
          MERGED_CANDIDATES

          final_deleted=0
          while read -r name expected_sha pr_number; do
            [ -n "$name" ] || continue
            inventory

            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            if [ -z "$current_sha" ]; then
              echo "| \`$name\` | \`$expected_sha\` | Already absent; no action (merged PR #$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: exact head changed (merged PR #$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$protected" != "false" ]; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: protected or protection state unknown |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: open PR exists |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            merged_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
            if ! printf '%s' "$merged_pr" | jq -e --arg name "$name" --arg sha "$expected_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: no matching merged-PR proof (#$pr_number) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            inventory
            current_sha="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            protected="$(jq -r --arg name "$name" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            merged_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")"
            if [ "$current_sha" != "$expected_sha" ] || [ "$protected" != "false" ] || jq -e --arg name "$name" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null || ! printf '%s' "$merged_pr" | jq -e --arg name "$name" --arg sha "$expected_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
              echo "| \`$name\` | \`$expected_sha\` | PRESERVED: final safety check failed |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$name"; then
              echo "| \`$name\` | \`$expected_sha\` | DELETED: exact unchanged head of merged PR #$pr_number |" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
              final_deleted=$((final_deleted + 1))
            else
              echo "| \`$name\` | \`$expected_sha\` | NOT DELETED: GitHub rejected deletion |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            fi
          done <<'FINAL_CANDIDATES'
          maintenance/proof-based-cleanup-batch-2 7aaeafa99ca741cc0fffe908fa8b536df498f09c 140
          docs/restore-gamecube-wii-focus 463d80d2826039c1e1cd8e6dd5161058a9811ecd 6
          feat/gamecube-three-lap-finish f6862b7a5cf702ca210bbca388911e81576697d4 51
          FINAL_CANDIDATES

          # The workflow's own source branch is also temporary. Delete it only if
          # its merged PR still has the exact current head and its complete Git tree
          # is byte-for-byte identical to main.
          self_branch="maintenance/proof-based-cleanup-final"
          self_pr_number=141
          inventory
          self_sha="$(jq -r --arg name "$self_branch" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
          self_protected="$(jq -r --arg name "$self_branch" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
          self_pr="$(gh api "repos/$GH_REPO/pulls/$self_pr_number")"
          if [ -n "$self_sha" ] && [ "$self_protected" = "false" ] &&
             ! jq -e --arg name "$self_branch" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null &&
             printf '%s' "$self_pr" | jq -e --arg name "$self_branch" --arg sha "$self_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
            git -C "$workdir" fetch --quiet origin "$default_branch"
            git -C "$workdir" fetch --quiet origin "refs/heads/$self_branch:refs/remotes/origin/self-cleanup"
            main_tree="$(git -C "$workdir" rev-parse "$main_ref^{tree}")"
            self_tree="$(git -C "$workdir" rev-parse "refs/remotes/origin/self-cleanup^{tree}")"
            inventory
            self_sha_again="$(jq -r --arg name "$self_branch" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
            self_protected_again="$(jq -r --arg name "$self_branch" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
            self_pr="$(gh api "repos/$GH_REPO/pulls/$self_pr_number")"
            if [ "$self_sha_again" = "$self_sha" ] && [ "$self_protected_again" = "false" ] &&
               ! jq -e --arg name "$self_branch" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null &&
               [ "$self_tree" = "$main_tree" ] &&
               printf '%s' "$self_pr" | jq -e --arg name "$self_branch" --arg sha "$self_sha" '.merged_at != null and .head.ref == $name and .head.sha == $sha' >/dev/null; then
              if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$self_branch"; then
                echo "| \`$self_branch\` | \`$self_sha\` | DELETED: merged PR #$self_pr_number and full tree identical to main |" >> "$GITHUB_STEP_SUMMARY"
                deleted=$((deleted + 1))
              else
                echo "| \`$self_branch\` | \`$self_sha\` | NOT DELETED: GitHub rejected deletion |" >> "$GITHUB_STEP_SUMMARY"
                skipped=$((skipped + 1))
              fi
            else
              echo "| \`$self_branch\` | \`$self_sha\` | PRESERVED: final exact-head or tree-equality check failed |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            fi
          else
            echo "| \`$self_branch\` | \`$self_sha\` | Preserved or already absent: no exact merged-PR proof |" >> "$GITHUB_STEP_SUMMARY"
            skipped=$((skipped + 1))
          fi

          # Exact one-branch exception: remove only if its full tree is identical to its merge-base with main.
          mergebase_branch="Master-Chiken-patch-1"
          mergebase_expected_sha="09f320e4bc9a321eadef33f4f7b5260d23146b9f"
          inventory
          mergebase_sha="$(jq -r --arg name "$mergebase_branch" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
          mergebase_protected="$(jq -r --arg name "$mergebase_branch" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
          if [ -z "$mergebase_sha" ]; then
            echo "| `$mergebase_branch` | `$mergebase_expected_sha` | Already absent; no action |" >> "$GITHUB_STEP_SUMMARY"
            skipped=$((skipped + 1))
          elif [ "$mergebase_sha" != "$mergebase_expected_sha" ]; then
            echo "| `$mergebase_branch` | `$mergebase_expected_sha` | PRESERVED: exact target tip changed |" >> "$GITHUB_STEP_SUMMARY"
            skipped=$((skipped + 1))
          elif [ "$mergebase_protected" != "false" ]; then
            echo "| `$mergebase_branch` | `$mergebase_expected_sha` | PRESERVED: protected or protection status unknown |" >> "$GITHUB_STEP_SUMMARY"
            skipped=$((skipped + 1))
          elif jq -e --arg name "$mergebase_branch" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
            echo "| `$mergebase_branch` | `$mergebase_expected_sha` | PRESERVED: an open PR uses this branch |" >> "$GITHUB_STEP_SUMMARY"
            skipped=$((skipped + 1))
          else
            # Fetch only this explicit target, then prove the tip has the same complete tree as its common ancestor.
            git -C "$workdir" fetch --quiet origin "refs/heads/$mergebase_branch:refs/remotes/origin/cleanup-target"
            merge_base="$(git -C "$workdir" merge-base "$mergebase_expected_sha" "$main_ref" || true)"
            target_tree=""
            base_tree=""
            if [ -n "$merge_base" ]; then
              target_tree="$(git -C "$workdir" rev-parse "$mergebase_expected_sha^{tree}")"
              base_tree="$(git -C "$workdir" rev-parse "$merge_base^{tree}")"
            fi
            if [ -z "$merge_base" ] || [ "$target_tree" != "$base_tree" ]; then
              echo "| `$mergebase_branch` | `$mergebase_expected_sha` | PRESERVED: complete tree does not equal merge-base tree |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            else
              # Recheck exact head, protection and PR usage immediately before deletion.
              inventory
              mergebase_sha_again="$(jq -r --arg name "$mergebase_branch" '[.[] | select(.name == $name)][0].commit.sha // empty' "$RUNNER_TEMP/branches.json")"
              mergebase_protected_again="$(jq -r --arg name "$mergebase_branch" '[.[] | select(.name == $name)][0] | if . == null then empty else (.protected | tostring) end' "$RUNNER_TEMP/branches.json")"
              if [ "$mergebase_sha_again" = "$mergebase_expected_sha" ] && [ "$mergebase_protected_again" = "false" ] && ! jq -e --arg name "$mergebase_branch" 'any(.[]; .head.ref == $name)' "$RUNNER_TEMP/open-prs.json" >/dev/null; then
                if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$mergebase_branch"; then
                  echo "| `$mergebase_branch` | `$mergebase_expected_sha` | DELETED: exact unprotected tip has same full tree as merge base; no open PR |" >> "$GITHUB_STEP_SUMMARY"
                  deleted=$((deleted + 1))
                else
                  echo "| `$mergebase_branch` | `$mergebase_expected_sha` | NOT DELETED: GitHub rejected deletion |" >> "$GITHUB_STEP_SUMMARY"
                  skipped=$((skipped + 1))
                fi
              else
                echo "| `$mergebase_branch` | `$mergebase_expected_sha` | PRESERVED: final exact-head/protection/PR check failed |" >> "$GITHUB_STEP_SUMMARY"
                skipped=$((skipped + 1))
              fi
            fi
          fi

          {
            echo
            echo "**Summary:** $deleted deleted; $skipped preserved or already absent."
            echo
            echo "Deletion scope is finite: existing fixed lists with their exact evidence, the helper source branch only with a merged-PR exact-head proof and full-tree equality to main, and Master-Chiken-patch-1 only if its exact tip is unprotected, unused by open PRs, unchanged, and its full tree equals its merge-base tree."
          } >> "$GITHUB_STEP_SUMMARY"
