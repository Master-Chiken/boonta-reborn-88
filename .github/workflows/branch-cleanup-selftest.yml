name: Branch retirement safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/retire-verified-branch.yml"
      - ".github/workflows/branch-cleanup-selftest.yml"

permissions:
  contents: read

jobs:
  validate-retirement:
    name: Validate retirement YAML, shell syntax and exact allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse workflow YAML and syntax-check embedded shell
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            ARGV.each do |path|
              doc = YAML.load_file(path)
              puts "YAML OK: #{path}"
              next unless path.end_with?("retire-verified-branch.yml")
              job = doc.fetch("jobs").values.find { |candidate| candidate.is_a?(Hash) && candidate["steps"].is_a?(Array) }
              raise "No workflow job with a steps array in #{path}" unless job
              job.fetch("steps").each_with_index do |step, index|
                next unless step["run"]
                File.write("/tmp/verified-retire-#{index}.sh", step["run"])
              end
            end
          ' .github/workflows/retire-verified-branch.yml .github/workflows/branch-cleanup-selftest.yml

          for script in /tmp/verified-retire-*.sh; do
            bash -n "$script"
            echo "Bash syntax OK: $script"
          done

      - name: Assert owner-only issue command, exact refs and safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/retire-verified-branch.yml").read_text(encoding="utf-8")
          header = workflow.split("permissions:", 1)[0]
          cases = dict(re.findall(
              r'^\s*"([^"]+)"\)\s+PINNED_SHA="([0-9a-f]{40})"\s+;;$',
              workflow,
              flags=re.MULTILINE,
          ))
          expected = {
              "feat/career-stable-standings-order-20261112": "548c69bec25dc82011344b2c1f0a9c99edcdc563",
              "feat/championship-standings-core-20261112": "360de5a647418cbac3555c5670d88790851bbc45",
              "feat/championship-standings-tiebreaks-20261112": "7604e09d98f88f1ca4fdaf79fb0cdb19bf982afb",
              "feat/nemesis-adaptive-rival-pace-20261112": "3a981183964e1a866589df69c58a6a9280f6b975",
              "feat/nemesis-racing-line-commitment-20261112": "452a81487c285cf17f2df80f06b86c662235074d",
              "feat/rival-encounter-memory-20261112": "a8c6c2fee2ad63469f7c122f52d517554965ae47",
              "feat/rival-personality-racing-lines-20261112": "994e200cb80f53a2296d25b803166b4e7802444d",
              "feat/rival-personality-speed-profiles-20261112": "e3a93ac35a4d69dcefabc3e2497d006168cfa737",
              "fix/rival-traffic-split-tie-break-20261112": "89e9922f22033b8149f6e372b192914ec2e4fc24",
              "feat/role-aware-autonomous-context-20261112": "80a8e470ccdeee8f9d6221ed527d131e0286528e",
              "feat/paperclip-role-governance-20261112": "a37e9df742371a9e537ad6ca8b75dd286192a06c",
              "fix/regenerate-task-ledger-summary-pr410": "81e6db46d3cbd174971e547c7657c0879c089117",
              "fix/groq-dispatch-gate-observability-20261112": "4859401f39796e187beda1c4335be236edea42f2",
              "fix/groq-free-invocation-timeout-180s-20261111": "30e119962a51eac54147c29e8e5111f7767ac35f",
              "infra/paperclip-control-plane-20261110": "582dfc020a8068c0fa6b9feaa84f2cc35419cd7a",
              "fix/gemini-dispatch-reusable-permissions-20261110": "c7ae0927ba03b5bd3a4826f5d5d840a4d966655d",
              "fix/groq-tool-json-temperature-20261110": "c592d3eb724ac8456dd9a340bed5c6edfa41b031",
              "fix/gemini-transient-fetch-retry-20261109": "973690f8b3a63299750959cb98b65200d03932d0",
              "automation/fix-gemini-secondary-key-20261108": "40a9db2ee79bafa0752899ded915bae8af3a4a8c",
              "automation-ledger-activation-20261112": "a89555e6d65aa4b086bd883a295501db91e9748c",
              "automation-ledger-validation": "c1d3fb6c87379777d508f1facaa222b849faa9e7",
              "fix/activation-handoff-mainline-20261111": "7dca23ebd573e5b7194b36a8ad92ccd6231c60c9",
          }

          checks = {
              "manual triggers only": "workflow_dispatch:" in header and "issue_comment:" in header and all(token not in header for token in ("push:", "pull_request:", "schedule:")),
              "actor, main ref and dedicated issue gate": "github.actor == 'Master-Chiken'" in workflow and "github.ref == 'refs/heads/main'" in workflow and "github.event.issue.number == 248" in workflow and "github.event.issue.pull_request == null" in workflow,
              "comment requires exact one-line command and explicit confirmation": r"^/retire-branch" in workflow and "CONFIRM$" in workflow and "Use exactly: /retire-branch BRANCH_NAME EXPECTED_SHA CONFIRM" in workflow,
              "22 unique live exact branch/SHA pins": cases == expected and len(cases) == 22,
              "all pinned refs are available in manual selection": all(f"- {name}" in header for name in cases),
              "current open PR heads are not allowlisted": "recovery/all-branch-heads-20261102" not in cases and "feat/native-wii-classic-input-main-20261102" not in cases,
              "permanent refs cannot be retired": all(name not in cases for name in ("main", "dev", "archive/branch-heads-20261019", "archive/rival-ai-history-20261107")) and "archive/rival-ai-history-20261107" in workflow,
              "checks exact live head": '.object.sha' in workflow and '== "$EXPECTED_SHA"' in workflow,
              "rejects protected branches": '.protected' in workflow and '== "false"' in workflow,
              "rejects open PR heads and bases": '.head.ref == $branch or .base.ref == $branch' in workflow,
              "requires protected archive, pinned rival-AI archive, main or dev ancestry": workflow.count("git merge-base --is-ancestor") == 8 and "refs/remotes/origin/main" in workflow and "refs/remotes/origin/dev" in workflow and 'ARCHIVE_CHECKPOINT="1c863bf93ab680ef07fe7dfacc8748934341acab"' in workflow,
              "dev is fetched for both reachability checks": workflow.count('"+refs/heads/dev:refs/remotes/origin/dev"') == 2 and workflow.count("refs/remotes/origin/dev") >= 4,
              "rechecks immediately before deletion": workflow.count('ref_json="$(gh api') == 2 and "Recheck exact ref and atomically retire one branch" in workflow,
              "deletion uses exact-SHA lease": 'git push --force-with-lease="refs/heads/$BRANCH_NAME:$EXPECTED_SHA" origin ":refs/heads/$BRANCH_NAME"' in workflow,
              "one ref per workflow run and no broad delete": "branch_name" in workflow and "push --delete" not in workflow and workflow.count('git push --force-with-lease=') == 1,
              "concurrent retirements are serialized": "cancel-in-progress: false" in workflow and "concurrency:" in workflow,
              "superseded role-aware context branch is pinned exactly": cases.get("feat/role-aware-autonomous-context-20261112") == "80a8e470ccdeee8f9d6221ed527d131e0286528e",
              "superseded role-registry branch is pinned exactly": cases.get("feat/paperclip-role-governance-20261112") == "a37e9df742371a9e537ad6ca8b75dd286192a06c",
              "superseded task-ledger refs are pinned exactly": cases.get("automation-ledger-activation-20261112") == "a89555e6d65aa4b086bd883a295501db91e9748c" and cases.get("automation-ledger-validation") == "c1d3fb6c87379777d508f1facaa222b849faa9e7",
              "mainline activation handoff is pinned exactly": cases.get("fix/activation-handoff-mainline-20261111") == "7dca23ebd573e5b7194b36a8ad92ccd6231c60c9",
              "new candidate retirement requires pinned archive, main or dev ancestry": "refs/remotes/origin/main" in workflow and "refs/remotes/origin/dev" in workflow and "Branch tip is not reachable from a verified archive, main or dev." in workflow and "ARCHIVE_CHECKPOINT" in workflow,
              "never deletes via an unguarded REST DELETE": "gh api --method DELETE" not in workflow,
          }

          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Retirement workflow validation failed: " + "; ".join(failed))
          PY
