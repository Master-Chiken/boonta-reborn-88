name: Archived branch cleanup safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/retire-archived-branch-refs.yml"
      - ".github/workflows/branch-cleanup-selftest.yml"

permissions:
  contents: read

jobs:
  validate-cleanup:
    name: Validate cleanup YAML, shell syntax, and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Parse YAML and syntax-check all embedded bash scripts
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            ARGV.each do |path|
              doc = YAML.load_file(path)
              puts "YAML OK: #{path}"
              next unless path.end_with?("retire-archived-branch-refs.yml")
              doc.fetch("jobs").fetch("retire").fetch("steps").each_with_index do |step, index|
                next unless step["run"]
                File.write("/tmp/retire-workflow-#{index}.sh", step["run"])
              end
            end
          ' .github/workflows/retire-archived-branch-refs.yml .github/workflows/branch-cleanup-selftest.yml

          for script in /tmp/retire-workflow-*.sh; do
            bash -n "$script"
            echo "Bash syntax OK: $script"
          done

      - name: Assert owner-only manual dispatch and exact safe allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/retire-archived-branch-refs.yml").read_text(encoding="utf-8")
          header = workflow.split("permissions:", 1)[0]
          marker = 'cat > "$CANDIDATES_FILE" <<\'EOF\''
          assert marker in workflow, "fixed candidate list is missing"
          candidate_block = workflow.split(marker, 1)[1].split("\n          EOF", 1)[0]
          records = [line.split() for line in candidate_block.splitlines() if line.strip()]
          names = [row[0] for row in records]

          expected = {
              "audit/step102-import-gate",
              "chore/two-branch-workflow",
              "feat/game-finish-banner-label-20261017",
              "feat/rocky-canyon-silhouette-20261017",
              "feat/source-driven-racer-mesh-texture-20261017",
              "feature/cleanroom-mesh-source",
              "feature/gamecube-boost-meter",
              "feature/gamecube-boost-overheat",
              "feature/gamecube-lap-timing-hud",
              "feature/gamecube-multi-rival-race-v2",
              "fix/frame-rate-independent-gameplay-v3",
              "fix/steering-stick-deadzone-20261017",
              "governance/no-branch-cap-task-completion-20261017",
              "import/step102-source-only",
              "recovery/branch-heads-20261019-verified",
              "test/dolphin-pause-state-acceptance",
              "test/dolphin-pause-state-acceptance-7679597746618456134",
              "chore/archived-branch-ref-cleanup",
          }

          checks = {
              "manual dispatch only": "workflow_dispatch:" in header and all(x not in header for x in ("push:", "pull_request:", "schedule:")),
              "owner and main-branch gate": "github.actor == 'Master-Chiken' && github.ref == 'refs/heads/main'" in workflow,
              "dry-run is the default": "default: dry-run" in workflow and 'CONFIRMATION" == "DRY RUN"' in workflow,
              "deletion needs explicit phrase": "RETIRE 18 ARCHIVED BRANCH REFS" in workflow,
              "pinned checkpoint and ancestry check": "cf4978a17916c00eed8e25550bd9231354096993" in workflow and "git merge-base --is-ancestor" in workflow,
              "exact SHA verification for archived refs": '[[ "$actual_sha" == "$expected" ]]' in workflow,
              "reject protected refs": ".protected // false" in workflow,
              "reject open PR head or base": '.head.ref == $branch or .base.ref == $branch' in workflow,
              "exact allowlist contains 18 unique reviewed refs": len(names) == 18 and len(set(names)) == 18 and set(names) == expected,
              "never retire permanent refs": '[[ "$branch" != "main" && "$branch" != "dev" && "$branch" != "archive/branch-heads-20261019" ]]' in workflow,
              "only one Git ref delete operation": workflow.count('gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"') == 1,
              "no force updates or merges": all(x not in workflow for x in ("git push --force", "gh pr merge", "git update-ref", "force=true")),
              "each ref is verified again immediately before deletion": "Retire refs one by one after immediate recheck" in workflow and workflow.count('actual_sha="$(jq -r') >= 2,
              "final inventory verifies each deletion": 'any(.[]; .name == $branch)' in workflow,
          }

          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Cleanup workflow validation failed: " + "; ".join(failed))
          PY
