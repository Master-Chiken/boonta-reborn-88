name: Branch retirement safety tests

on:
  pull_request:
    paths:
      - ".github/workflows/retire-verified-branch.yml"
      - ".github/workflows/branch-cleanup-selftest.yml"

permissions:
  contents: read

jobs:
  validate-retirement:
    name: Validate retirement YAML, shell syntax and exact allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse workflow YAML and syntax-check embedded shell
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            ARGV.each do |path|
              doc = YAML.load_file(path)
              puts "YAML OK: #{path}"
              next unless path.end_with?("retire-verified-branch.yml")
              job = doc.fetch("jobs").fetch("retire")
              steps = job.fetch("steps")
              expected_names = [
                "Check out main for exact ref and ancestry verification",
                "Validate exact owner-confirmed branch and SHA",
                "Verify protection, open PR references and archived ancestry",
                "Recheck exact ref and atomically retire one branch",
              ]
              actual_names = steps.map { |step| step["name"] }
              raise "Expected exactly four named retirement steps, got #{actual_names.inspect}" unless actual_names == expected_names
              raise "Every non-checkout step must execute a shell script" unless steps.drop(1).all? { |step| step["shell"] == "bash" && step["run"].is_a?(String) && !step["run"].empty? }
              raise "Both safety verification steps must be independent" unless steps[2]["run"].include?("open-prs.json") && steps[3]["run"].include?("open-prs-before-delete.json")
              steps.each_with_index do |step, index|
                next unless step["run"]
                File.write("/tmp/verified-retire-#{index}.sh", step["run"])
              end
            end
          ' .github/workflows/retire-verified-branch.yml .github/workflows/branch-cleanup-selftest.yml

          for script in /tmp/verified-retire-*.sh; do
            bash -n "$script"
            echo "Bash syntax OK: $script"
          done

      - name: Assert owner-only issue command, exact refs and safety gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/retire-verified-branch.yml").read_text(encoding="utf-8")
          header = workflow.split("permissions:", 1)[0]
          cases = dict(re.findall(
              r'^\s*"([^"]+)"\)\s+PINNED_SHA="([0-9a-f]{40})"\s+;;$',
              workflow,
              flags=re.MULTILINE,
          ))
          expected = {
              "automation/split-policy-target-checkouts-20261119": "5f5accc3299793cbf35367286d4ef69248ad6fbe",
              "automation/structured-patch-loop-integration-20261120": "11eed9dde15bca7b5ad26bff59df12d6ad2a2bae",
              "automation-ledger-activation-20261115": "451e239072f8d94b638fe67d2c22ce9e3826f324",
              "chore/strict-automation-gates-20261121": "a4b97a7dc58dc263cc2ac2dc40c14bdbd4e85ccb",
              "feat/n64-bounded-memory-map-20261125": "3150a5851dafa36c61f366567150822901714901",
              "feature/pause-overlay-guidance": "84d58ba7bf58aed270b227f422103cd460c52a7d",
              "fix/agents-finish-without-owner-clarification-20261113": "67ab3839a3d49808c5a0217e4949985e304b4589",
              "fix/automation-resume-multifile-read-20261118": "0a1623ac2573abcfbe87bc0a1a8c1024ead29698",
              "fix/automation-resume-source-context-20261118": "53b958aa66a5a6355117fba5cdd4dc8a51bc0a38",
              "fix/autonomous-summary-sync-20261113": "e3c1aaf90641f270a47dfe85c59cdf3676db21b9",
              "fix/deterministic-writer-cycle-contract-20261116": "76719432191d36ab9430bef2ad8f13958fa07f23",
              "fix/gemini-context-budget-20261118": "f36069f77a1fad5de27c9d4567956d73857e3f1d",
              "fix/groq-dispatch-origin-guard-20261118": "e0b63c1eb0ebdd9a6e433c2603e69af41ac2bdb0",
              "fix/patch-cycle-review-lock-20261120": "28960c7fc029f91f2637991e9d4d83113e77673a",
              "fix/queued-task-pr-resume-20261117": "6726b0d8aa34b5107f46f4755e37d44eda8625cb",
              "gameplay/normalized-player-route-progress-20261120": "19beab26f7274b8c473be4172d8f62b8b5ae7c73",
              "gameplay/per-course-rival-route-cursors-20261120": "3c2da3c3be233e72581e38b27f3e60bae17d3c9b",
              "gameplay/playable-fork-run-course-20261120": "25bf689431074cd6278d826b71a46b7d636d8a63",
              "gameplay/rival-branch-geometry-regression-20261120": "e13c31d55efcba3c98e689ca7235c65a8b0f7ba9",
              "gameplay/rival-route-cursors-20261117": "ff5cdd59244deae763b10ae6516358754a9344c4",
              "security/enforce-task-write-scope-20261116": "f52d7fc1d9d07cda8594cb977b455fe1ea2ff651",
              "security/opencode-default-deny-20261117": "42f5c3f7f30ca5f8e0fc661950a3dd4efd303325",
              "archive/gameplay-cleanup-20261121": "25bf689431074cd6278d826b71a46b7d636d8a63",
          }

          checks = {
              "manual triggers only": "workflow_dispatch:" in header and "issue_comment:" in header and all(token not in header for token in ("push:", "pull_request:", "schedule:")),
              "actor, main ref and dedicated issue gate": "github.actor == 'Master-Chiken'" in workflow and "github.ref == 'refs/heads/main'" in workflow and "github.event.issue.number == 248" in workflow and "github.event.issue.pull_request == null" in workflow,
              "comment requires exact one-line command and explicit confirmation": r"^/retire-branch" in workflow and "CONFIRM$" in workflow and "Use exactly: /retire-branch BRANCH_NAME EXPECTED_SHA CONFIRM" in workflow,
              "23 unique live exact branch/SHA pins": cases == expected and len(cases) == 23,
              "all pinned refs are available in manual selection": all(f"- {name}" in header for name in cases),
              "current open PR heads are not allowlisted": "recovery/all-branch-heads-20261102" not in cases and "feat/native-wii-classic-input-main-20261102" not in cases and "dependabot/github_actions/actions/create-github-app-token-3.4.0" not in cases and "docs/not64-wiiflow-autoboot-20261124" not in cases and "research/dguillot-recomp-wii-audit-20261125" not in cases and "fix/recomp-ppc-no-int128-20261125" not in cases,
              "permanent refs cannot be retired": all(name not in cases for name in ("main", "dev", "archive/branch-heads-20261019", "archive/rival-ai-history-20261107", "archive/branch-heads-20261126")) and "archive/rival-ai-history-20261107" in workflow,
              "checks exact live head": '.object.sha' in workflow and '== "$EXPECTED_SHA"' in workflow,
              "rejects protected branches": '.protected' in workflow and '== "false"' in workflow,
              "rejects open PR heads and bases": '.head.ref == $branch or .base.ref == $branch' in workflow,
              "requires protected archive, pinned rival-AI archive, pinned 2026-11-26 archive, main or dev ancestry": workflow.count("git merge-base --is-ancestor") == 10 and "refs/remotes/origin/main" in workflow and "refs/remotes/origin/dev" in workflow and 'ARCHIVE_CHECKPOINT="cb7e18e574bae0441e5df6eaca618a3b92c63fc9"' in workflow and 'NEW_ARCHIVE_CHECKPOINT="b8aac5311f1552a99205eea08f42c695504981e8"' in workflow,
              "dev is fetched for both reachability checks": workflow.count('"+refs/heads/dev:refs/remotes/origin/dev"') == 2 and workflow.count("refs/remotes/origin/dev") >= 4,
              "rechecks immediately before deletion": workflow.count('ref_json="$(gh api') == 2 and "Recheck exact ref and atomically retire one branch" in workflow,
              "deletion uses exact-SHA lease": 'git push --force-with-lease="refs/heads/$BRANCH_NAME:$EXPECTED_SHA" origin ":refs/heads/$BRANCH_NAME"' in workflow,
              "one ref per workflow run and no broad delete": "branch_name" in workflow and "push --delete" not in workflow and workflow.count('git push --force-with-lease=') == 1,
              "concurrent retirements are serialized": "cancel-in-progress: false" in workflow and "concurrency:" in workflow,
              "new candidate retirement requires pinned archive, main or dev ancestry": "refs/remotes/origin/main" in workflow and "refs/remotes/origin/dev" in workflow and "Branch tip is not reachable from a verified archive, main or dev." in workflow and "ARCHIVE_CHECKPOINT" in workflow,
              "new recovery checkpoint pinned and fetched in both safety passes": workflow.count('NEW_ARCHIVE_CHECKPOINT="b8aac5311f1552a99205eea08f42c695504981e8"') == 2 and workflow.count('refs/heads/$NEW_ARCHIVE_BRANCH:refs/remotes/origin/$NEW_ARCHIVE_BRANCH') == 2 and workflow.count('refs/remotes/origin/$NEW_ARCHIVE_BRANCH') >= 4,
              "all newly reviewed refs are available for one-at-a-time retirement": all(f"- {name}" in header and cases.get(name) == sha for name, sha in [["automation/split-policy-target-checkouts-20261119","5f5accc3299793cbf35367286d4ef69248ad6fbe"],["automation/structured-patch-loop-integration-20261120","11eed9dde15bca7b5ad26bff59df12d6ad2a2bae"],["automation-ledger-activation-20261115","451e239072f8d94b638fe67d2c22ce9e3826f324"],["chore/strict-automation-gates-20261121","a4b97a7dc58dc263cc2ac2dc40c14bdbd4e85ccb"],["feat/n64-bounded-memory-map-20261125","3150a5851dafa36c61f366567150822901714901"],["feature/pause-overlay-guidance","84d58ba7bf58aed270b227f422103cd460c52a7d"],["fix/agents-finish-without-owner-clarification-20261113","67ab3839a3d49808c5a0217e4949985e304b4589"],["fix/automation-resume-multifile-read-20261118","0a1623ac2573abcfbe87bc0a1a8c1024ead29698"],["fix/automation-resume-source-context-20261118","53b958aa66a5a6355117fba5cdd4dc8a51bc0a38"],["fix/autonomous-summary-sync-20261113","e3c1aaf90641f270a47dfe85c59cdf3676db21b9"],["fix/deterministic-writer-cycle-contract-20261116","76719432191d36ab9430bef2ad8f13958fa07f23"],["fix/gemini-context-budget-20261118","f36069f77a1fad5de27c9d4567956d73857e3f1d"],["fix/groq-dispatch-origin-guard-20261118","e0b63c1eb0ebdd9a6e433c2603e69af41ac2bdb0"],["fix/patch-cycle-review-lock-20261120","28960c7fc029f91f2637991e9d4d83113e77673a"],["fix/queued-task-pr-resume-20261117","6726b0d8aa34b5107f46f4755e37d44eda8625cb"],["gameplay/normalized-player-route-progress-20261120","19beab26f7274b8c473be4172d8f62b8b5ae7c73"],["gameplay/per-course-rival-route-cursors-20261120","3c2da3c3be233e72581e38b27f3e60bae17d3c9b"],["gameplay/playable-fork-run-course-20261120","25bf689431074cd6278d826b71a46b7d636d8a63"],["gameplay/rival-branch-geometry-regression-20261120","e13c31d55efcba3c98e689ca7235c65a8b0f7ba9"],["gameplay/rival-route-cursors-20261117","ff5cdd59244deae763b10ae6516358754a9344c4"],["security/enforce-task-write-scope-20261116","f52d7fc1d9d07cda8594cb977b455fe1ea2ff651"],["security/opencode-default-deny-20261117","42f5c3f7f30ca5f8e0fc661950a3dd4efd303325"],["archive/gameplay-cleanup-20261121","25bf689431074cd6278d826b71a46b7d636d8a63"]]),
              "never deletes via an unguarded REST DELETE": "gh api --method DELETE" not in workflow,
          }

          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Retirement workflow validation failed: " + "; ".join(failed))
          PY
