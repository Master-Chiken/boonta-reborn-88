name: RE-001 Ares GDB smoke test (public homebrew only)

on:
  push:
    branches:
      - "re-001-ares-gdb-smoke-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: re-001-ares-gdb-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Ares v148 + ctest.z64
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Install build, graphics, and debugger dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config curl git ninja-build \
            gdb-multiarch xvfb xauth unzip iproute2 vulkan-tools \
            libgtk-3-dev libcanberra-gtk3-module libgl-dev \
            libgl1-mesa-dri mesa-vulkan-drivers libasound2-dev libopenal-dev libvulkan-dev

      - name: Build official Ares v148 with the N64 core
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/ares-gdb-smoke"
          SRC_DIR="$RUNNER_TEMP/ares-v148"
          BUILD_DIR="$SRC_DIR/build"
          mkdir -p "$LOG_DIR"
          echo "Building upstream ares v148; no game ROM is used in this step."
          git clone --depth 1 --branch v148 https://github.com/ares-emulator/ares.git "$SRC_DIR"
          cmake -S "$SRC_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARES_CORES=n64 \
            -DARES_SKIP_DEPS=ON 2>&1 | tee "$LOG_DIR/cmake-configure.log"
          cmake --build "$BUILD_DIR" --parallel 2 2>&1 | tee "$LOG_DIR/ares-build.log"
          ARES_BIN="$(find "$BUILD_DIR" -type f -name ares -executable -print -quit)"
          if [[ -z "$ARES_BIN" ]]; then
            echo "Could not locate the Ares executable after the build." >&2
            find "$BUILD_DIR" -maxdepth 5 -type f -executable -print | head -100 >&2
            exit 1
          fi
          echo "ARES_BIN=$ARES_BIN" >> "$GITHUB_ENV"
          "$ARES_BIN" --version 2>&1 | tee "$LOG_DIR/ares-version.log"

      - name: Fetch only the public homebrew GDB reproducer
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/ares-gdb-smoke"
          TEST_DIR="$RUNNER_TEMP/ctest-homebrew"
          mkdir -p "$TEST_DIR" "$LOG_DIR"
          curl --fail --location --retry 3 --retry-delay 1 \
            https://github.com/user-attachments/files/18465249/ctest.zip \
            --output "$TEST_DIR/ctest.zip"
          unzip -q "$TEST_DIR/ctest.zip" -d "$TEST_DIR/unpacked"
          CTEST_ROM="$(find "$TEST_DIR/unpacked" -type f -name ctest.z64 -print -quit)"
          CTEST_ELF="$(find "$TEST_DIR/unpacked" -type f -name ctest.elf -print -quit)"
          if [[ -z "$CTEST_ROM" || -z "$CTEST_ELF" ]]; then
            echo "The public attachment did not contain the expected ctest.z64 and ctest.elf files." >&2
            unzip -l "$TEST_DIR/ctest.zip" >&2
            exit 1
          fi
          printf 'Public homebrew ROM: %s\nELF with debug symbols: %s\n' "$CTEST_ROM" "$CTEST_ELF" | tee "$LOG_DIR/ctest-files.log"
          echo "CTEST_ROM=$CTEST_ROM" >> "$GITHUB_ENV"
          echo "CTEST_ELF=$CTEST_ELF" >> "$GITHUB_ENV"

      - name: Reproduce upstream attach order and continue through main
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/ares-gdb-smoke"
          ARES_LOG="$LOG_DIR/ares-runtime.log"
          GDB_LOG="$LOG_DIR/gdb.log"
          GDB_RC_FILE="$LOG_DIR/gdb-exit-code.txt"
          LAST_GDB_ATTEMPT="$LOG_DIR/gdb-last-attempt.log"

          # Verify lavapipe exists and use it for headless N64 rendering.
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$LVP_ICD" ]]; then
            echo "FAIL: Mesa lavapipe Vulkan ICD was not installed." >&2
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          echo "Vulkan ICD selected: $LVP_ICD" | tee "$LOG_DIR/vulkan-icd.log"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary > "$LOG_DIR/vulkaninfo.log" 2>&1

          # Mirror Ares issue #1778's startup ordering: start GDB first and
          # retry real remote-connection attempts while the emulator is launched.
          # This avoids testing only the separate AwaitGDBClient pause mechanism.
          (
            set +e
            deadline=$((SECONDS + 35))
            attempt=0
            while (( SECONDS < deadline )); do
              attempt=$((attempt + 1))
              ATTEMPT_LOG="$LOG_DIR/gdb-attempt-$attempt.log"
              timeout --foreground --signal=INT --kill-after=3s 15s \
                gdb-multiarch -q --batch \
                  -ex "set pagination off" \
                  -ex "target extended-remote ip6-localhost:9123" \
                  -ex "break main" \
                  -ex "continue" \
                  -ex "continue" \
                  "$CTEST_ELF" > "$ATTEMPT_LOG" 2>&1
              rc=$?
              cp "$ATTEMPT_LOG" "$LAST_GDB_ATTEMPT"
              # Once the target responds far enough to reach main or report a
              # target signal, preserve this transcript; do not hide a crash
              # by retrying another session.
              if grep -Eq 'Breakpoint 1, main|Program received signal|Remote debugging using|Remote connection closed|Remote communication error' "$ATTEMPT_LOG"; then
                cp "$ATTEMPT_LOG" "$GDB_LOG"
                printf '%s\n' "$rc" > "$GDB_RC_FILE"
                exit 0
              fi
              sleep 0.25
            done
            cp "$LAST_GDB_ATTEMPT" "$GDB_LOG" 2>/dev/null || true
            printf '1\n' > "$GDB_RC_FILE"
            exit 1
          ) &
          GDB_WRAPPER_PID=$!

          # Start the emulator after the debugger has already begun attempting
          # to connect, matching the public issue's ordering more closely.
          sleep 1
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null \
            VK_ICD_FILENAMES="$LVP_ICD" PARALLEL_RDP_ALLOW_EXTERNAL_HOST=0 \
            stdbuf -oL -eL "$ARES_BIN" \
              --system "Nintendo 64" \
              --setting DebugServer/Port=9123 \
              --setting DebugServer/Enabled=true \
              --setting DebugServer/UseIPv4=false \
              --kiosk "$CTEST_ROM" \
              > "$ARES_LOG" 2>&1 &
          ARES_PID=$!

          cleanup() {
            if [[ -n "${GDB_WRAPPER_PID:-}" ]] && kill -0 "$GDB_WRAPPER_PID" 2>/dev/null; then
              pkill -TERM -P "$GDB_WRAPPER_PID" 2>/dev/null || true
              kill "$GDB_WRAPPER_PID" 2>/dev/null || true
            fi
            if [[ -n "${ARES_PID:-}" ]] && kill -0 "$ARES_PID" 2>/dev/null; then
              kill "$ARES_PID" 2>/dev/null || true
            fi
            wait "${GDB_WRAPPER_PID:-}" 2>/dev/null || true
            wait "${ARES_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          LISTENER_READY=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$ARES_PID" 2>/dev/null; then
              echo "FAIL: Ares exited before its debug listener became ready." >&2
              cat "$ARES_LOG" >&2 || true
              exit 1
            fi
            if ss -H -ltn 'sport = :9123' | grep -q .; then
              ss -H -ltn 'sport = :9123' | tee "$LOG_DIR/listener.log"
              LISTENER_READY=1
              break
            fi
            sleep 1
          done
          if [[ "$LISTENER_READY" -ne 1 ]]; then
            echo "FAIL: no TCP listener appeared on port 9123." >&2
            cat "$ARES_LOG" >&2 || true
            cat "$LAST_GDB_ATTEMPT" >&2 || true
            exit 1
          fi

          # Wait for the bounded GDB session to capture either a successful
          # main breakpoint or a clear target/connection outcome.
          for attempt in $(seq 1 40); do
            [[ -s "$GDB_RC_FILE" ]] && break
            if ! kill -0 "$GDB_WRAPPER_PID" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [[ ! -s "$GDB_RC_FILE" ]]; then
            echo "FAIL: GDB did not finish within the workflow's bounded window." >&2
            cat "$LAST_GDB_ATTEMPT" >&2 || true
            exit 1
          fi
          GDB_RC="$(cat "$GDB_RC_FILE")"
          cat "$GDB_LOG"

          if [[ "$GDB_RC" -ne 124 && "$GDB_RC" -ne 130 && "$GDB_RC" -ne 137 ]]; then
            echo "FAIL: GDB ended with exit code $GDB_RC before the bounded continue completed." >&2
            tail -n 100 "$ARES_LOG" >&2 || true
            exit 1
          fi
          if ! grep -Eq 'Breakpoint 1, main|Breakpoint 1.*main' "$GDB_LOG"; then
            echo "FAIL: GDB did not report a breakpoint at main." >&2
            tail -n 100 "$ARES_LOG" >&2 || true
            exit 1
          fi
          if grep -Eqi 'Remote connection closed|Remote communication error|Target disconnected|SIGSEGV|SIGABRT|Program received signal SIGTRAP|__rsp_check_assert|Connection refused|Connection timed out|Cannot access memory' "$GDB_LOG"; then
            echo "FAIL: GDB transcript contains a disconnect, signal/assert trap, or target error." >&2
            exit 1
          fi
          if ! grep -Fq 'GDB client connected' "$ARES_LOG"; then
            echo "FAIL: Ares log does not confirm a GDB client connection." >&2
            cat "$ARES_LOG" >&2 || true
            exit 1
          fi
          if ! grep -Fq 'Vulkan Enabled: using paraLLEl-RDP' "$ARES_LOG"; then
            echo "FAIL: N64 paraLLEl-RDP did not initialize during ctest rendering." >&2
            cat "$ARES_LOG" >&2 || true
            exit 1
          fi
          if ! kill -0 "$ARES_PID" 2>/dev/null; then
            echo "FAIL: Ares exited during the post-breakpoint run." >&2
            tail -n 100 "$ARES_LOG" >&2 || true
            exit 1
          fi

          {
            echo "## RE-001 Ares/GDB smoke test"
            echo ""
            echo "- Ares baseline: official stable v148"
            echo "- Target: public libdragon ctest homebrew; debugger is started before Ares."
            echo "- Result: **PASS** — GDB hit main and remained connected for the bounded run without target/assert signals."
            echo "- Scope: debugger tooling only; not a SWE1R run and not proof of the N64 results-screen transition."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-001-ares-gdb-smoke-logs
          path: ${{ runner.temp }}/ares-gdb-smoke/*.log
          if-no-files-found: ignore
          retention-days: 14
