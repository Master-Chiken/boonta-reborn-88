name: Branch self-test contract guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse workflow and execute branch governance contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "YAML OK: #{path}" }' \
            .github/workflows/branch-automation-selftest.yml \
            .github/workflows/openrouter-plan-execute.yml \
            .github/workflows/groq-plan-execute.yml \
            .github/workflows/gemini-plan-execute.yml

      - name: Execute the exact branch governance contract block (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          path = Path(".github/workflows/branch-automation-selftest.yml")
          source = path.read_text(encoding="utf-8")
          step_marker = "      - name: Enforce conservative branch budget and lifecycle policy"
          run_marker = "          python3 - <<'PY'\n"
          start_step = source.find(step_marker)
          if start_step < 0:
              raise SystemExit("Branch governance contract step is missing")
          start = source.find(run_marker, start_step)
          if start < 0:
              raise SystemExit("Branch governance Python heredoc is missing")
          start += len(run_marker)
          end = source.find("\n          PY", start)
          if end < 0:
              raise SystemExit("Branch governance Python heredoc terminator is missing")

          code = textwrap.dedent(source[start:end])
          compile(code, str(path) + ":governance-contract", "exec")
          completed = subprocess.run(
              [sys.executable, "-c", code],
              cwd=Path.cwd(),
              stdin=subprocess.DEVNULL,
              text=True,
              encoding="utf-8",
              capture_output=True,
              check=False,
              timeout=60,
          )
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          print("Branch governance contract executed successfully.")
          PY
