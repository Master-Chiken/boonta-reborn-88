name: Repository safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reject-game-dumps:
    name: Reject ROM and disc-image files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject prohibited binary game files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only HEAD | grep -Eiq '\.(z64|n64|v64|iso|gcm|wbfs|rvz|wad)$'; then
            echo "::error::ROM or disc-image files must not be committed."
            git ls-tree -r --name-only HEAD | grep -Ei '\.(z64|n64|v64|iso|gcm|wbfs|rvz|wad)$' || true
            exit 1
          fi
          echo "No prohibited ROM or disc-image files found."
