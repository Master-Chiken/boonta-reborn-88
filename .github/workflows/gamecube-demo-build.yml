name: GameCube first-render prototype build

on:
  push:
    branches: [main]
    paths:
      - "gamecube-demo/Makefile"
      - "gamecube-demo/source/**"
      - "gamecube-demo/tests/**"
      - "gamecube-demo/include/**"
      - "gamecube-demo/data/**"
      - "gamecube-demo/tools/**"
      - ".github/workflows/gamecube-demo-build.yml"
  pull_request:
    paths:
      - "gamecube-demo/Makefile"
      - "gamecube-demo/source/**"
      - "gamecube-demo/tests/**"
      - "gamecube-demo/include/**"
      - "gamecube-demo/data/**"
      - "gamecube-demo/tools/**"
      - ".github/workflows/gamecube-demo-build.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-pause-state-tests:
    name: Host pause/resume state tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run gameplay-state unit tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic gamecube-demo/tests/test_gameplay_state.c -lm -o /tmp/test_gameplay_state
          /tmp/test_gameplay_state

      - name: Compile and run pause/resume unit tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic gamecube-demo/tests/test_pause_state.c -o /tmp/test_pause_state
          /tmp/test_pause_state

      - name: Test DOL padding and artifact validation utilities
        run: python3 -m unittest discover -s gamecube-demo/tools -p 'test_*.py' -v

  build-gamecube-demo:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1

      - name: Verify toolchain and project inputs
        shell: bash
        run: |
          test -n "${DEVKITPPC:-}"
          test -f "$DEVKITPPC/gamecube_rules"
          test -s gamecube-demo/Makefile
          test -s gamecube-demo/source/main.c

      - name: Build GameCube DOL and ELF
        shell: bash
        run: |
          cd gamecube-demo
          make clean
          set -o pipefail
          make 2>&1 | tee build.log
          if grep -nE 'warning:' build.log; then
            echo "::error::The native GameCube build emitted compiler warnings; resolve them before publishing the artifact."
            exit 1
          fi
          # libogc's DOL output may omit the final bytes required for
          # 32-byte-aligned section reads. Dolphin rejects such a DOL at boot.
          python3 tools/pad_dol.py boonta_gc_demo.dol
          test -s boonta_gc_demo.dol
          test -s boonta_gc_demo.elf

      - name: Validate native artifact structure
        run: python3 gamecube-demo/tools/validate_artifacts.py gamecube-demo/boonta_gc_demo.dol gamecube-demo/boonta_gc_demo.elf

      - name: Upload build outputs and compiler log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned actions/upload-artifact v7.0.2
        with:
          name: boonta-reborn-gamecube-first-render
          path: |
            gamecube-demo/boonta_gc_demo.dol
            gamecube-demo/boonta_gc_demo.elf
            gamecube-demo/build.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-process-smoke:
    name: Dolphin headless process smoke (not visual verification)
    needs: [build-gamecube-demo, host-pause-state-tests]
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the DOL built by this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned download-artifact v4.3.0
        with:
          name: boonta-reborn-gamecube-first-render
          path: build-artifact

      - name: Install free Dolphin headless-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          {
            printf '%s\n' '### apt-installed Dolphin version'
            dolphin-emu --version 2>&1 || true
            printf '%s\n' '### apt-installed Dolphin CLI help'
            dolphin-emu --help 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/dolphin-cli-capabilities.log"

      - name: Run the DOL for 12 seconds with Dolphin's null video backend
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME" /tmp/dolphin-user
          chmod 700 "$HOME"
          test -s build-artifact/boonta_gc_demo.dol
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=5s 12s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$PWD/build-artifact/boonta_gc_demo.dol" \
            --user=/tmp/dolphin-user > dolphin-smoke.log 2>&1
          status=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          cat dolphin-smoke.log
          if grep -Eiq "failed to load executable|could not boot|fatal error|assertion failed|SIGBUS|SIGSEGV" dolphin-smoke.log; then
            echo "::error::Dolphin logged a boot/fatal-error marker."
            exit 1
          fi
          if [[ "$elapsed" -ge 10 && ( "$status" -eq 124 || "$status" -eq 137 || "$status" -eq 143 ) ]]; then
            echo "Dolphin remained active for the 12-second process smoke window (elapsed: ${elapsed}s)."
            echo "This proves only process/startup stability with null video; it does not verify visible rendering, controller response, or a completed race."
          else
            echo "::error::Dolphin did not remain active for the expected window (status ${status}, elapsed ${elapsed}s)."
            exit 1
          fi

      - name: Upload Dolphin process log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact v7.0.2
        with:
          name: gamecube-dolphin-process-smoke
          path: |
            dolphin-smoke.log
            dolphin-cli-capabilities.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-software-frame-diagnostic:
    name: Experimental Dolphin software-renderer frame diagnostic (non-blocking)
    continue-on-error: true
    needs: [build-gamecube-demo, host-pause-state-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the DOL built by this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned download-artifact v4.3.0
        with:
          name: boonta-reborn-gamecube-first-render
          path: build-artifact

      - name: Install official free Dolphin Flatpak and capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates flatpak xvfb xauth xdotool x11-utils imagemagick dbus-daemon tesseract-ocr python3-pil
          export HOME=/tmp/dolphin-render-home
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          flatpak remote-add --if-not-exists --user dolphin https://flatpak.dolphin-emu.org/releases.flatpakrepo
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Dolphin's official release remote does not reliably provide the KDE
          # runtime required by the app. Install the runtime from Flathub first.
          flatpak install --user --assumeyes flathub org.kde.Platform//6.11
          flatpak info --user org.kde.Platform//6.11
          flatpak install --user --assumeyes dolphin org.DolphinEmu.dolphin-emu
          # Do not start the Qt GUI during setup: the GUI capture job owns Xvfb.
          flatpak info --user org.DolphinEmu.dolphin-emu
          {
            printf '%s\n' '### Flatpak Dolphin version'
            flatpak run --command=dolphin-emu org.DolphinEmu.dolphin-emu --version 2>&1 || true
            printf '%s\n' '### Flatpak Dolphin CLI help'
            flatpak run --command=dolphin-emu org.DolphinEmu.dolphin-emu --help 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/dolphin-flatpak-cli-capabilities.log"

      - name: Launch the DOL and capture a non-blocking diagnostic frame
        shell: bash
        run: |
          set -euo pipefail
          test -s build-artifact/boonta_gc_demo.dol
          export DOL="$GITHUB_WORKSPACE/build-artifact/boonta_gc_demo.dol"
          export DOLPHIN_LOG="$GITHUB_WORKSPACE/dolphin-render.log"
          export CAPTURE="$GITHUB_WORKSPACE/dolphin-software-frame.png"
          export HOME=/tmp/dolphin-render-home
          mkdir -p "$HOME" "$GITHUB_WORKSPACE/dolphin-render-user/Config"
          chmod 700 "$HOME"
          # Put the rendered game surface in the Dolphin main window so the
          # CI screenshot captures the game, not only the library window.
          cat > "$GITHUB_WORKSPACE/dolphin-render-user/Config/Dolphin.ini" <<EOF
          [Display]
          RenderToMain = True
          EOF
          set +e
          timeout --signal=TERM --kill-after=3s 35s xvfb-run -a -s "-screen 0 1280x720x24" \
            env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            bash -c '
              set -euo pipefail
              flatpak run --command=dolphin-emu --filesystem="$GITHUB_WORKSPACE" org.DolphinEmu.dolphin-emu \
                --video_backend="Software Renderer" \
                --config=Logger.Options.WriteToFile=True \
                --config=Logger.Options.WriteToConsole=True \
                --config=Logger.Options.Verbosity=2 \
                --config=Logger.Logs.BOOT=True \
                --config=Logger.Logs.CORE=True \
                --config=Logger.Logs.Video=True \
                --exec="$DOL" --user="$GITHUB_WORKSPACE/dolphin-render-user" > "$DOLPHIN_LOG" 2>&1 &
              emu_pid=$!
              cleanup() {
                kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                wait "$emu_pid" >/dev/null 2>&1 || true
              }
              trap cleanup EXIT
              sleep 8
              if ! kill -0 "$emu_pid" 2>/dev/null; then
                cat "$DOLPHIN_LOG"
                echo "Dolphin exited before the software-renderer capture."
                exit 1
              fi
              window=""
              for attempt in $(seq 1 15); do
                for id in $(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null || true); do
                  title=$(xdotool getwindowname "$id" 2>/dev/null || true)
                  geometry=$(xdotool getwindowgeometry --shell "$id" 2>/dev/null || true)
                  width=$(printf "%s\n" "$geometry" | sed -n "s/^WIDTH=//p")
                  height=$(printf "%s\n" "$geometry" | sed -n "s/^HEIGHT=//p")
                  if [[ -n "$width" && -n "$height" && "$width" -ge 300 && "$height" -ge 200 && ( "$title" == "Dolphin" || "$title" == *" - Dolphin" || "$title" == Dolphin\ * ) ]]; then
                    window="$id"
                    break
                  fi
                done
                [[ -n "$window" ]] && break
                sleep 1
              done
              if [[ -z "$window" ]]; then
                echo "No visible Dolphin main window of at least 300x200 was found."
                xwininfo -root -tree || true
                exit 1
              fi
              echo "Capturing Dolphin window id=$window title=$(xdotool getwindowname "$window")"
              xdotool windowactivate --sync "$window" >/dev/null 2>&1 || true
              sleep 2
              import -window "$window" "$CAPTURE"
              test -s "$CAPTURE"
              identify "$CAPTURE"
              colors=$(convert "$CAPTURE" -resize 160x90 -format %k info:)
              echo "Dolphin-window capture has $colors distinct colors."
              if [[ "$colors" -lt 24 ]]; then
                echo "Dolphin window capture appears blank or nearly blank; visual rendering remains unverified."
                exit 1
              fi
              # The captured window must also contain signatures from the actual
              # procedural scene; window chrome alone must not pass the check.
              python3 - "$CAPTURE" <<PY
          from pathlib import Path
          import sys
          from PIL import Image

          image = Image.open(Path(sys.argv[1])).convert("RGB")
          pixels = list(image.getdata())
          cyan = sum(1 for r, g, b in pixels if r < 110 and g > 145 and b > 150)
          orange = sum(1 for r, g, b in pixels if r > 180 and 45 < g < 190 and b < 135)
          ground_green = sum(1 for r, g, b in pixels if g > 1.25 * r and g > 1.05 * b and g > 25 and r < 100)
          pod_blue = sum(1 for r, g, b in pixels if b > 145 and b > 1.35 * r and g > 65 and r < 120)
          print(f"Scene color-pixel counts: cyan={cyan}, orange={orange}, ground_green={ground_green}, pod_blue={pod_blue}")
          if cyan < 30 or orange < 30 or ground_green < 100 or pod_blue < 30:
              print("Captured Dolphin window is missing one or more expected scene-color signatures.")
              sys.exit(1)
          PY
              # The captured Dolphin main window is 800x480. Its lower
              # viewport should contain the dark road, not a near-white field.
              near_white_fraction=$(convert "$CAPTURE" -crop 800x180+0+280 +repage \
                -colorspace gray -threshold 90% -format "%[fx:mean]" info:)
              echo "Near-white pixel fraction in the lower Dolphin game viewport: $near_white_fraction"
              if awk -v fraction="$near_white_fraction" "BEGIN { exit !(fraction > 0.25) }"; then
                echo "The lower game viewport is predominantly near-white; GX scene colors may not be reaching the renderer."
                exit 1
              fi
              ocr=$(tesseract "$CAPTURE" stdout --psm 6 2>/dev/null || true)
              echo "Text detected in captured frame:"
              printf "%s\n" "$ocr"
              if printf "%s\n" "$ocr" | grep -Eiq "failed to init core|failed to initialize|could not boot|failed to load executable"; then
                echo "Captured frame contains a Dolphin boot/core error dialog; this must not count as a visual pass."
                exit 1
              fi
              echo "A non-blank frame without a recognized boot/core error dialog was captured; geometry and controls still require inspection."
            '
          status=$?
          set -e
          [[ ! -f "$DOLPHIN_LOG" ]] || cat "$DOLPHIN_LOG"
          echo "Dolphin user files created during boot attempt:"
          find "$GITHUB_WORKSPACE/dolphin-render-user" -maxdepth 4 -type f -print || true
          if [[ -d "$GITHUB_WORKSPACE/dolphin-render-user/Logs" ]]; then
            find "$GITHUB_WORKSPACE/dolphin-render-user/Logs" -maxdepth 2 -type f -print -exec tail -n 200 {} \; || true
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::The optional software-renderer capture failed. Native build and headless smoke remain separate results."
            exit "$status"
          fi

      - name: Upload the optional frame and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact v7.0.2
        with:
          name: gamecube-dolphin-software-frame-diagnostic
          path: |
            dolphin-software-frame.png
            dolphin-render.log
            dolphin-flatpak-cli-capabilities.log
            dolphin-render-user/Logs/**
          if-no-files-found: warn
          retention-days: 7
