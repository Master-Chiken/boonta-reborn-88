name: GameCube first-render prototype build

on:
  push:
    branches: [main]
    paths:
      - "gamecube-demo/Makefile"
      - "gamecube-demo/source/**"
      - "gamecube-demo/tests/**"
      - "gamecube-demo/include/**"
      - "gamecube-demo/data/**"
      - "gamecube-demo/tools/**"
      - "tools/mesh_format/**"
      - ".github/workflows/gamecube-demo-build.yml"
  pull_request:
    paths:
      - "gamecube-demo/Makefile"
      - "gamecube-demo/source/**"
      - "gamecube-demo/tests/**"
      - "gamecube-demo/include/**"
      - "gamecube-demo/data/**"
      - "gamecube-demo/tools/**"
      - "tools/mesh_format/**"
      - ".github/workflows/gamecube-demo-build.yml"
  workflow_dispatch:
    inputs:
      full_race_diagnostic:
        description: "Run the slower, opt-in three-lap Dolphin finish check"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      full_race_diagnostic:
        description: "Run the slower, opt-in three-lap Dolphin finish check"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  host-pause-state-tests:
    name: Host pause/resume state tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run bounded mesh-data validation tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic gamecube-demo/tests/test_mesh_data.c -lm -o /tmp/test_mesh_data
          /tmp/test_mesh_data

      - name: Compile and run gameplay-state unit tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic gamecube-demo/tests/test_gameplay_state.c -lm -o /tmp/test_gameplay_state
          /tmp/test_gameplay_state

      - name: Compile and run pause/resume unit tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic gamecube-demo/tests/test_pause_state.c -o /tmp/test_pause_state
          /tmp/test_pause_state

      - name: Test GameCube host build and validation utilities
        run: python3 -m unittest discover -s gamecube-demo/tools -p 'test_*.py' -v

      - name: Validate clean-room track format and checked-in runtime header
        run: python3 -m unittest discover -s tests -p 'test_track_format.py' -v

  build-gamecube-demo:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1

      - name: Verify toolchain and project inputs
        shell: bash
        run: |
          test -n "${DEVKITPPC:-}"
          test -f "$DEVKITPPC/gamecube_rules"
          test -s gamecube-demo/Makefile
          test -s gamecube-demo/source/main.c

      - name: Build GameCube DOL and ELF
        shell: bash
        run: |
          cd gamecube-demo
          make clean
          set -o pipefail
          make 2>&1 | tee build.log
          if grep -nE 'warning:' build.log; then
            echo "::error::The native GameCube build emitted compiler warnings; resolve them before publishing the artifact."
            exit 1
          fi
          # libogc's DOL output may omit the final bytes required for
          # 32-byte-aligned section reads. Dolphin rejects such a DOL at boot.
          python3 tools/pad_dol.py boonta_gc_demo.dol
          test -s boonta_gc_demo.dol
          test -s boonta_gc_demo.elf

      - name: Validate native artifact structure
        run: python3 gamecube-demo/tools/validate_artifacts.py gamecube-demo/boonta_gc_demo.dol gamecube-demo/boonta_gc_demo.elf

      - name: Upload build outputs and compiler log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned actions/upload-artifact v7.0.2
        with:
          name: boonta-reborn-gamecube-first-render
          path: |
            gamecube-demo/boonta_gc_demo.dol
            gamecube-demo/boonta_gc_demo.elf
            gamecube-demo/build.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-process-smoke:
    name: Dolphin headless process smoke (not visual verification)
    needs: [build-gamecube-demo, host-pause-state-tests]
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the DOL built by this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned download-artifact v4.3.0
        with:
          name: boonta-reborn-gamecube-first-render
          path: build-artifact

      - name: Install free Dolphin headless-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dolphin-emu xvfb qt6-qpa-plugins
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          {
            printf '%s\n' '### apt-installed Dolphin version'
            dolphin-emu --version 2>&1 || true
            printf '%s\n' '### apt-installed Dolphin CLI help'
            dolphin-emu --help 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/dolphin-cli-capabilities.log"
          grep -F -- '--movie=MOVIE' "$GITHUB_WORKSPACE/dolphin-cli-capabilities.log"

      - name: Run the DOL for 12 seconds with Dolphin's null video backend
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/games:$PATH"
          export QT_QPA_PLATFORM=offscreen
          export HOME=/tmp/dolphin-home
          mkdir -p "$HOME" /tmp/dolphin-user
          chmod 700 "$HOME"
          test -s build-artifact/boonta_gc_demo.dol
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=5s 12s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$PWD/build-artifact/boonta_gc_demo.dol" \
            --user=/tmp/dolphin-user > dolphin-smoke.log 2>&1
          status=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          cat dolphin-smoke.log
          if grep -Eiq "failed to load executable|could not boot|fatal error|assertion failed|SIGBUS|SIGSEGV" dolphin-smoke.log; then
            echo "::error::Dolphin logged a boot/fatal-error marker."
            exit 1
          fi
          if [[ "$elapsed" -ge 10 && ( "$status" -eq 124 || "$status" -eq 137 || "$status" -eq 143 ) ]]; then
            echo "Dolphin remained active for the 12-second process smoke window (elapsed: ${elapsed}s)."
            echo "This proves only process/startup stability with null video; it does not verify visible rendering, controller response, or a completed race."
          else
            echo "::error::Dolphin did not remain active for the expected window (status ${status}, elapsed ${elapsed}s)."
            exit 1
          fi

      - name: Upload Dolphin process log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact v7.0.2
        with:
          name: gamecube-dolphin-process-smoke
          path: |
            dolphin-smoke.log
            dolphin-cli-capabilities.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-software-frame-diagnostic:
    name: Experimental Dolphin software-renderer frame diagnostic (non-blocking)
    continue-on-error: true
    needs: [build-gamecube-demo, host-pause-state-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository for the deterministic DTM generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Download the DOL built by this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned download-artifact v4.3.0
        with:
          name: boonta-reborn-gamecube-first-render
          path: build-artifact

      - name: Install official free Dolphin Flatpak and capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates flatpak xvfb xauth xdotool x11-utils imagemagick dbus-daemon tesseract-ocr python3-pil
          export HOME=/tmp/dolphin-render-home
          mkdir -p "$HOME"
          chmod 700 "$HOME"
          flatpak remote-add --if-not-exists --user dolphin https://flatpak.dolphin-emu.org/releases.flatpakrepo
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Dolphin's official release remote does not reliably provide the KDE
          # runtime required by the app. Install the runtime from Flathub first.
          flatpak install --user --assumeyes flathub org.kde.Platform//6.11
          flatpak info --user org.kde.Platform//6.11
          flatpak install --user --assumeyes dolphin org.DolphinEmu.dolphin-emu
          # Do not start the Qt GUI during setup: the GUI capture job owns Xvfb.
          flatpak info --user org.DolphinEmu.dolphin-emu
          {
            printf '%s\n' '### Flatpak Dolphin version'
            timeout --signal=TERM --kill-after=2s 10s flatpak run --env=QT_QPA_PLATFORM=offscreen --command=dolphin-emu org.DolphinEmu.dolphin-emu --version 2>&1 || true
            printf '%s\n' '### Flatpak Dolphin CLI help'
            timeout --signal=TERM --kill-after=2s 10s flatpak run --env=QT_QPA_PLATFORM=offscreen --command=dolphin-emu org.DolphinEmu.dolphin-emu --help 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/dolphin-flatpak-cli-capabilities.log"
          grep -F -- '--movie=MOVIE' "$GITHUB_WORKSPACE/dolphin-flatpak-cli-capabilities.log"

      - name: Test DTM protocol and finish-banner detector with Pillow
        shell: bash
        run: python3 -m unittest discover -s gamecube-demo/tools -p 'test_dolphin_dtm.py' -v

      - name: Launch the DOL and capture a non-blocking diagnostic frame
        env:
          # Run finish and post-finish reset checks automatically for this gameplay candidate.
          # All other PRs/pushes retain the existing opt-in behavior to conserve CI minutes.
          RUN_FULL_RACE_DIAGNOSTIC: ${{ inputs.full_race_diagnostic || (github.event_name == 'pull_request' && (github.head_ref == 'feature/runtime-track-spline' || github.head_ref == 'test/dolphin-pause-state-acceptance' || github.head_ref == 'feat/game-finish-banner-label-20261017' || github.head_ref == 'feat/rocky-canyon-silhouette-20261017' || github.head_ref == 'fix/width-aware-rail-collision-20261017')) }}
          CHECK_FINISH_LABEL: ${{ github.event_name == 'pull_request' && (github.head_ref == 'feat/game-finish-banner-label-20261017' || github.head_ref == 'feat/rocky-canyon-silhouette-20261017') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build-artifact/boonta_gc_demo.dol
          export DOL="$GITHUB_WORKSPACE/build-artifact/boonta_gc_demo.dol"
          export BASELINE_DTM="$GITHUB_WORKSPACE/dolphin-neutral-baseline.dtm"
          export BASELINE_CAPTURE="$GITHUB_WORKSPACE/dolphin-neutral-baseline.png"
          export BASELINE_LOG="$GITHUB_WORKSPACE/dolphin-neutral-baseline.log"
          export BASELINE_USER="$GITHUB_WORKSPACE/dolphin-neutral-user"
          export STEERED_USER="$GITHUB_WORKSPACE/dolphin-steered-user"
          export LEFT_USER="$GITHUB_WORKSPACE/dolphin-left-steered-user"
          export STICK_USER="$GITHUB_WORKSPACE/dolphin-stick-steered-user"
          export LEFT_STICK_USER="$GITHUB_WORKSPACE/dolphin-left-stick-steered-user"
          export RESET_USER="$GITHUB_WORKSPACE/dolphin-reset-user"
          export PAUSE_USER="$GITHUB_WORKSPACE/dolphin-pause-user"
          export RESUME_USER="$GITHUB_WORKSPACE/dolphin-resume-user"
          export DTM="$GITHUB_WORKSPACE/dolphin-scripted-controller-input.dtm"
          export LEFT_DTM="$GITHUB_WORKSPACE/dolphin-scripted-controller-left.dtm"
          export STICK_DTM="$GITHUB_WORKSPACE/dolphin-scripted-stick-right.dtm"
          export LEFT_STICK_DTM="$GITHUB_WORKSPACE/dolphin-scripted-stick-left.dtm"
          export RESET_DTM="$GITHUB_WORKSPACE/dolphin-reset-state.dtm"
          export PAUSE_DTM="$GITHUB_WORKSPACE/dolphin-pause-state.dtm"
          export RESUME_DTM="$GITHUB_WORKSPACE/dolphin-resume-state.dtm"
          export DOLPHIN_LOG="$GITHUB_WORKSPACE/dolphin-render.log"
          export RESET_LOG="$GITHUB_WORKSPACE/dolphin-reset-state.log"
          export PAUSE_LOG="$GITHUB_WORKSPACE/dolphin-pause-state.log"
          export RESUME_LOG="$GITHUB_WORKSPACE/dolphin-resume-state.log"
          export LEFT_LOG="$GITHUB_WORKSPACE/dolphin-left-render.log"
          export STICK_LOG="$GITHUB_WORKSPACE/dolphin-stick-right-render.log"
          export LEFT_STICK_LOG="$GITHUB_WORKSPACE/dolphin-stick-left-render.log"
          export CAPTURE="$GITHUB_WORKSPACE/dolphin-software-frame.png"
          export LEFT_CAPTURE="$GITHUB_WORKSPACE/dolphin-software-left-frame.png"
          export STICK_CAPTURE="$GITHUB_WORKSPACE/dolphin-software-stick-right-frame.png"
          export LEFT_STICK_CAPTURE="$GITHUB_WORKSPACE/dolphin-software-stick-left-frame.png"
          export RESET_CAPTURE="$GITHUB_WORKSPACE/dolphin-reset-state.png"
          export PAUSE_CAPTURE="$GITHUB_WORKSPACE/dolphin-pause-state.png"
          export RESUME_CAPTURE="$GITHUB_WORKSPACE/dolphin-resume-state.png"
          export RACE_DTM="$GITHUB_WORKSPACE/dolphin-full-race.dtm"
          export RACE_LOG="$GITHUB_WORKSPACE/dolphin-full-race.log"
          export RACE_CAPTURE="$GITHUB_WORKSPACE/dolphin-full-race.png"
          export RACE_USER="$GITHUB_WORKSPACE/dolphin-full-race-user"
          export FINISH_RESET_DTM="$GITHUB_WORKSPACE/dolphin-finish-reset.dtm"
          export FINISH_RESET_LOG="$GITHUB_WORKSPACE/dolphin-finish-reset.log"
          export FINISH_RESET_CAPTURE="$GITHUB_WORKSPACE/dolphin-finish-reset.png"
          export FINISH_RESET_USER="$GITHUB_WORKSPACE/dolphin-finish-reset-user"
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$BASELINE_DTM" --frames 3600 --game-id ID-boo --steering none
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$DTM" --frames 3600 --game-id ID-boo --steering right
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$LEFT_DTM" --frames 3600 --game-id ID-boo --steering left
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$STICK_DTM" --frames 3600 --game-id ID-boo --steering right --steering-source stick
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$LEFT_STICK_DTM" --frames 3600 --game-id ID-boo --steering left --steering-source stick
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$RESET_DTM" --frames 3600 --game-id ID-boo --steering right --steering-source stick --scenario reset-check
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$PAUSE_DTM" --frames 3600 --game-id ID-boo --steering right --scenario pause-check
          python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$RESUME_DTM" --frames 3600 --game-id ID-boo --steering none --scenario resume-check
          test -s "$BASELINE_DTM"
          test -s "$DTM"
          test -s "$LEFT_DTM"
          test -s "$STICK_DTM"
          test -s "$LEFT_STICK_DTM"
          test -s "$RESET_DTM"
          test -s "$PAUSE_DTM"
          test -s "$RESUME_DTM"
          export HOME=/tmp/dolphin-render-home
          mkdir -p "$HOME" "$BASELINE_USER/Config" "$STEERED_USER/Config" "$LEFT_USER/Config" "$STICK_USER/Config" "$LEFT_STICK_USER/Config" "$RESET_USER/Config" "$PAUSE_USER/Config" "$RESUME_USER/Config"
          chmod 700 "$HOME" "$BASELINE_USER" "$STEERED_USER" "$LEFT_USER" "$STICK_USER" "$LEFT_STICK_USER" "$RESET_USER" "$PAUSE_USER" "$RESUME_USER"
          # Use isolated Dolphin profiles so the second capture cannot reuse
          # the first session's movie state, window or display configuration.
          for user_dir in "$BASELINE_USER" "$STEERED_USER" "$LEFT_USER" "$STICK_USER" "$LEFT_STICK_USER" "$RESET_USER" "$PAUSE_USER" "$RESUME_USER"; do
            cat > "$user_dir/Config/Dolphin.ini" <<EOF
          [Display]
          RenderToMain = True
          EOF
          done
          capture_timeout=160
          if [[ "${RUN_FULL_RACE_DIAGNOSTIC:-false}" == "true" ]]; then capture_timeout=1500; fi
          set +e
          timeout --signal=TERM --kill-after=3s "${capture_timeout}s" xvfb-run -a -s "-screen 0 1280x720x24" \
            env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            bash -c '
              set -euo pipefail
              capture_frame() {
                local movie="$1"
                local log="$2"
                local capture="$3"
                local user_dir="$4"
                local wait_seconds="${5:-6}"
                local emu_pid=""
                local window=""
                local title=""
                local geometry=""
                local width=""
                local height=""
                flatpak run --command=dolphin-emu --filesystem="$GITHUB_WORKSPACE" org.DolphinEmu.dolphin-emu \
                  --video_backend="Software Renderer" \
                  --config=Logger.Options.WriteToFile=True \
                  --config=Logger.Options.WriteToConsole=True \
                  --config=Logger.Options.Verbosity=2 \
                  --config=Logger.Logs.BOOT=True \
                  --config=Logger.Logs.CORE=True \
                  --config=Logger.Logs.Video=True \
                  --exec="$DOL" --movie="$movie" --user="$user_dir" > "$log" 2>&1 &
                emu_pid=$!
                sleep "$wait_seconds"
                if ! kill -0 "$emu_pid" 2>/dev/null; then
                  cat "$log"
                  echo "Dolphin exited before the software-renderer capture."
                  return 1
                fi
                for attempt in $(seq 1 15); do
                  for id in $(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null || true); do
                    title=$(xdotool getwindowname "$id" 2>/dev/null || true)
                    geometry=$(xdotool getwindowgeometry --shell "$id" 2>/dev/null || true)
                    width=$(printf "%s\\n" "$geometry" | sed -n "s/^WIDTH=//p")
                    height=$(printf "%s\\n" "$geometry" | sed -n "s/^HEIGHT=//p")
                    if [[ -n "$width" && -n "$height" && "$width" -ge 300 && "$height" -ge 200 && "$title" == *Dolphin* ]]; then
                      window="$id"
                      break
                    fi
                  done
                  [[ -n "$window" ]] && break
                  sleep 1
                done
                if [[ -z "$window" ]]; then
                  echo "No visible Dolphin main window of at least 300x200 was found."
                  xwininfo -root -tree || true
                  flatpak kill org.DolphinEmu.dolphin-emu >/dev/null 2>&1 || true
                  kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                  wait "$emu_pid" >/dev/null 2>&1 || true
                  return 1
                fi
                echo "Capturing $capture from Dolphin window id=$window title=$(xdotool getwindowname "$window")"
                xdotool windowactivate --sync "$window" >/dev/null 2>&1 || true
                sleep 1
                import -window "$window" "$capture"
                test -s "$capture"
                identify "$capture"
                colors=$(convert "$capture" -resize 160x90 -format %k info:)
                echo "Dolphin-window capture has $colors distinct colors."
                if [[ "$colors" -lt 24 ]]; then
                  echo "Dolphin window capture appears blank or nearly blank."
                  flatpak kill org.DolphinEmu.dolphin-emu >/dev/null 2>&1 || true
                  kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                  wait "$emu_pid" >/dev/null 2>&1 || true
                  return 1
                fi
                # The Flatpak launcher PID is not necessarily the emulator process.
                flatpak kill org.DolphinEmu.dolphin-emu >/dev/null 2>&1 || true
                kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                wait "$emu_pid" >/dev/null 2>&1 || true
                sleep 2
              }
              # Do not use a fixed post-movie sleep for the finish/reset check:
              # that can let the restarted race run for several minutes before capture.
              # Poll one live Dolphin session until we first see the finish banner,
              # then retain the first frame whose HUD matches the clean reset state.
              capture_finish_then_reset() {
                local movie="$1"
                local log="$2"
                local capture="$3"
                local user_dir="$4"
                local emu_pid=""
                local window=""
                local title=""
                local geometry=""
                local width=""
                local height=""
                local saw_finish=0
                local saw_reset=0
                flatpak run --command=dolphin-emu --filesystem="$GITHUB_WORKSPACE" org.DolphinEmu.dolphin-emu \
                  --video_backend="Software Renderer" \
                  --config=Logger.Options.WriteToFile=True \
                  --config=Logger.Options.WriteToConsole=True \
                  --config=Logger.Options.Verbosity=2 \
                  --config=Logger.Logs.BOOT=True \
                  --config=Logger.Logs.CORE=True \
                  --config=Logger.Logs.Video=True \
                  --exec="$DOL" --movie="$movie" --user="$user_dir" > "$log" 2>&1 &
                emu_pid=$!
                sleep 6
                if ! kill -0 "$emu_pid" 2>/dev/null; then
                  cat "$log"
                  echo "Dolphin exited before the finish/reset window became available."
                  return 1
                fi
                for attempt in $(seq 1 15); do
                  for id in $(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null || true); do
                    title=$(xdotool getwindowname "$id" 2>/dev/null || true)
                    geometry=$(xdotool getwindowgeometry --shell "$id" 2>/dev/null || true)
                    width=$(printf "%s\\n" "$geometry" | sed -n "s/^WIDTH=//p")
                    height=$(printf "%s\\n" "$geometry" | sed -n "s/^HEIGHT=//p")
                    if [[ -n "$width" && -n "$height" && "$width" -ge 300 && "$height" -ge 200 && "$title" == *Dolphin* ]]; then
                      window="$id"
                      break
                    fi
                  done
                  [[ -n "$window" ]] && break
                  sleep 1
                done
                if [[ -z "$window" ]]; then
                  echo "No visible Dolphin main window was found for the finish/reset diagnostic."
                  xwininfo -root -tree || true
                  flatpak kill org.DolphinEmu.dolphin-emu >/dev/null 2>&1 || true
                  kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                  wait "$emu_pid" >/dev/null 2>&1 || true
                  return 1
                fi
                xdotool windowactivate --sync "$window" >/dev/null 2>&1 || true
                # 220 polls x 3 seconds gives the slow Software Renderer more
                # than 10 minutes to reach finish and the subsequent reset.
                for attempt in $(seq 1 220); do
                  import -window "$window" "$capture"
                  test -s "$capture"
                  if [[ "$saw_finish" -eq 0 ]]; then
                    if python3 gamecube-demo/tools/check_dolphin_frame.py "$capture" --expect-finish > "$GITHUB_WORKSPACE/dolphin-finish-detector.log" 2>&1; then
                      echo "Finish banner detected in live frame $attempt."
                      cat "$GITHUB_WORKSPACE/dolphin-finish-detector.log"
                      saw_finish=1
                    fi
                  else
                    if python3 gamecube-demo/tools/check_dolphin_frame.py "$capture" --expect-reset > "$GITHUB_WORKSPACE/dolphin-finish-reset-detector.log" 2>&1; then
                      echo "Clean reset HUD detected after the finish banner at live frame $attempt."
                      cat "$GITHUB_WORKSPACE/dolphin-finish-reset-detector.log"
                      saw_reset=1
                      break
                    fi
                  fi
                  sleep 3
                done
                flatpak kill org.DolphinEmu.dolphin-emu >/dev/null 2>&1 || true
                kill -KILL "$emu_pid" >/dev/null 2>&1 || true
                wait "$emu_pid" >/dev/null 2>&1 || true
                if [[ "$saw_finish" -ne 1 ]]; then
                  [[ ! -f "$GITHUB_WORKSPACE/dolphin-finish-detector.log" ]] || cat "$GITHUB_WORKSPACE/dolphin-finish-detector.log"
                  echo "The finish banner was not detected during the post-finish reset movie."
                  return 1
                fi
                if [[ "$saw_reset" -ne 1 ]]; then
                  [[ ! -f "$GITHUB_WORKSPACE/dolphin-finish-reset-detector.log" ]] || cat "$GITHUB_WORKSPACE/dolphin-finish-reset-detector.log"
                  echo "The clean reset HUD was not detected after the finish banner."
                  return 1
                fi
              }
              capture_frame "$BASELINE_DTM" "$BASELINE_LOG" "$BASELINE_CAPTURE" "$BASELINE_USER"
              capture_frame "$DTM" "$DOLPHIN_LOG" "$CAPTURE" "$STEERED_USER"
              capture_frame "$LEFT_DTM" "$LEFT_LOG" "$LEFT_CAPTURE" "$LEFT_USER"
              capture_frame "$STICK_DTM" "$STICK_LOG" "$STICK_CAPTURE" "$STICK_USER"
              capture_frame "$LEFT_STICK_DTM" "$LEFT_STICK_LOG" "$LEFT_STICK_CAPTURE" "$LEFT_STICK_USER"
              capture_frame "$RESET_DTM" "$RESET_LOG" "$RESET_CAPTURE" "$RESET_USER" 24
              capture_frame "$PAUSE_DTM" "$PAUSE_LOG" "$PAUSE_CAPTURE" "$PAUSE_USER" 10
              capture_frame "$RESUME_DTM" "$RESUME_LOG" "$RESUME_CAPTURE" "$RESUME_USER" 12
              echo "Running D-pad and analog-stick camera-follow diagnostics: road silhouette should shift opposite to each steering direction."
              python3 gamecube-demo/tools/check_dolphin_frame.py "$CAPTURE" --baseline "$BASELINE_CAPTURE" --direction right --min-shift 2.0
              python3 gamecube-demo/tools/check_dolphin_frame.py "$LEFT_CAPTURE" --baseline "$BASELINE_CAPTURE" --direction left --min-shift 2.0
              python3 gamecube-demo/tools/check_dolphin_frame.py "$STICK_CAPTURE" --baseline "$BASELINE_CAPTURE" --direction right --min-shift 2.0
              python3 gamecube-demo/tools/check_dolphin_frame.py "$LEFT_STICK_CAPTURE" --baseline "$BASELINE_CAPTURE" --direction left --min-shift 2.0
              python3 gamecube-demo/tools/check_dolphin_frame.py "$RESET_CAPTURE" --expect-reset
              python3 gamecube-demo/tools/check_dolphin_frame.py "$PAUSE_CAPTURE" --expect-pause
              python3 gamecube-demo/tools/check_dolphin_frame.py "$RESUME_CAPTURE" --expect-resume
              near_white_fraction=$(convert "$CAPTURE" -crop 800x180+0+280 +repage \
                -colorspace gray -threshold 90% -format "%[fx:mean]" info:)
              echo "Near-white pixel fraction in the lower Dolphin game viewport: $near_white_fraction"
              if awk -v fraction="$near_white_fraction" "BEGIN { exit !(fraction > 0.25) }"; then
                echo "The lower game viewport is predominantly near-white; GX scene colors may not be reaching the renderer."
                exit 1
              fi
              ocr=$(tesseract "$CAPTURE" stdout --psm 6 2>/dev/null || true)
              echo "Text detected in captured frame:"
              printf "%s\\n" "$ocr"
              if printf "%s\\n" "$ocr" | grep -Eiq "failed to init core|failed to initialize|could not boot|failed to load executable"; then
                echo "Captured frame contains a Dolphin boot/core error dialog."
                exit 1
              fi
              left_near_white_fraction=$(convert "$LEFT_CAPTURE" -crop 800x180+0+280 +repage -colorspace gray -threshold 90% -format "%[fx:mean]" info:)
              echo "Near-white pixel fraction in the lower left-steering viewport: $left_near_white_fraction"
              if awk -v fraction="$left_near_white_fraction" "BEGIN { exit !(fraction > 0.25) }"; then
                echo "The left-steered game viewport is predominantly near-white; GX scene colors may not be reaching the renderer."
                exit 1
              fi
              echo "D-pad/stick steering passed; Y-reset produced a clean HUD; Start paused visibly, and a second Start resumed throttle-driven movement."
              if [[ "${RUN_FULL_RACE_DIAGNOSTIC:-false}" == "true" ]]; then
                echo "Starting full-race DTM; use the previously passing 12000-frame window."
                python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$RACE_DTM" --frames 12000 --game-id ID-boo --steering none --scenario full-race
                mkdir -p "$RACE_USER/Config"
                chmod 700 "$RACE_USER"
                printf "%s\\n" "[Display]" "RenderToMain = True" > "$RACE_USER/Config/Dolphin.ini"
                capture_frame "$RACE_DTM" "$RACE_LOG" "$RACE_CAPTURE" "$RACE_USER" 480
                python3 gamecube-demo/tools/check_dolphin_frame.py "$RACE_CAPTURE" --expect-finish
                echo "The three-lap finish checkerboard was detected after the scripted race."
                if [[ "${CHECK_FINISH_LABEL:-false}" == "true" ]]; then
                  python3 gamecube-demo/tools/check_dolphin_frame.py "$RACE_CAPTURE" --expect-finish-label
                  echo "The finish-label branch passed the orange FINISH text pixel check on the captured race-completion frame."
                fi
                echo "Starting a longer DTM; finish the race first, then reset at frame 14000 and capture immediately."
                python3 gamecube-demo/tools/make_dolphin_dtm.py --output "$FINISH_RESET_DTM" --frames 14007 --game-id ID-boo --steering none --scenario finish-reset-check
                mkdir -p "$FINISH_RESET_USER/Config"
                chmod 700 "$FINISH_RESET_USER"
                printf "%s\\n" "[Display]" "RenderToMain = True" > "$FINISH_RESET_USER/Config/Dolphin.ini"
                capture_finish_then_reset "$FINISH_RESET_DTM" "$FINISH_RESET_LOG" "$FINISH_RESET_CAPTURE" "$FINISH_RESET_USER"
                python3 gamecube-demo/tools/check_dolphin_frame.py "$FINISH_RESET_CAPTURE" --expect-reset
                echo "Post-finish Y reset restored a clean visible HUD state."
              else
                echo "Full-race finish check not requested; the default job remains the short bidirectional steering diagnostic."
              fi
            '
          status=$?
          set -e
          [[ ! -f "$BASELINE_LOG" ]] || cat "$BASELINE_LOG"
          [[ ! -f "$DOLPHIN_LOG" ]] || cat "$DOLPHIN_LOG"
          [[ ! -f "$LEFT_LOG" ]] || cat "$LEFT_LOG"
          [[ ! -f "$STICK_LOG" ]] || cat "$STICK_LOG"
          [[ ! -f "$LEFT_STICK_LOG" ]] || cat "$LEFT_STICK_LOG"
          [[ ! -f "$RESET_LOG" ]] || cat "$RESET_LOG"
          [[ ! -f "$PAUSE_LOG" ]] || cat "$PAUSE_LOG"
          [[ ! -f "$RESUME_LOG" ]] || cat "$RESUME_LOG"
          [[ ! -f "$FINISH_RESET_LOG" ]] || cat "$FINISH_RESET_LOG"
          echo "Dolphin user files created during boot attempt:"
          find "$BASELINE_USER" "$STEERED_USER" "$LEFT_USER" "$STICK_USER" "$LEFT_STICK_USER" "$RESET_USER" "$PAUSE_USER" "$RESUME_USER" "$RACE_USER" "$FINISH_RESET_USER" -maxdepth 4 -type f -print || true
          for log_dir in "$BASELINE_USER/Logs" "$STEERED_USER/Logs" "$LEFT_USER/Logs" "$STICK_USER/Logs" "$LEFT_STICK_USER/Logs" "$RESET_USER/Logs" "$PAUSE_USER/Logs" "$RESUME_USER/Logs" "$RACE_USER/Logs" "$FINISH_RESET_USER/Logs"; do
            [[ -d "$log_dir" ]] || continue
            for log_file in "$log_dir"/*; do
              [[ -f "$log_file" ]] || continue
              echo "--- $log_file"
              tail -n 200 "$log_file" || true
            done
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::The optional Dolphin Software Renderer input/reset diagnostic failed. Native build, null-video smoke, and full gameplay are separate acceptance gates."
            exit "$status"
          fi

      - name: Upload the optional frame and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact v7.0.2
        with:
          name: gamecube-dolphin-software-frame-diagnostic
          path: |
            dolphin-software-frame.png
            dolphin-software-left-frame.png
            dolphin-software-stick-right-frame.png
            dolphin-software-stick-left-frame.png
            dolphin-reset-state.png
            dolphin-pause-state.png
            dolphin-resume-state.png
            dolphin-reset-state.log
            dolphin-pause-state.log
            dolphin-resume-state.log
            dolphin-reset-state.dtm
            dolphin-pause-state.dtm
            dolphin-resume-state.dtm
            dolphin-finish-reset.dtm
            dolphin-finish-reset.png
            dolphin-finish-reset.log
            dolphin-finish-detector.log
            dolphin-finish-reset-detector.log
            dolphin-neutral-baseline.png
            dolphin-render.log
            dolphin-left-render.log
            dolphin-stick-right-render.log
            dolphin-stick-left-render.log
            dolphin-neutral-baseline.log
            dolphin-flatpak-cli-capabilities.log
            dolphin-scripted-controller-input.dtm
            dolphin-scripted-controller-left.dtm
            dolphin-scripted-stick-right.dtm
            dolphin-scripted-stick-left.dtm
            dolphin-full-race.dtm
            dolphin-full-race.png
            dolphin-full-race.log
            dolphin-neutral-user/Logs/**
            dolphin-steered-user/Logs/**
            dolphin-left-steered-user/Logs/**
            dolphin-stick-steered-user/Logs/**
            dolphin-left-stick-steered-user/Logs/**
            dolphin-reset-user/Logs/**
            dolphin-full-race-user/Logs/**
            dolphin-finish-reset-user/Logs/**
          if-no-files-found: warn
          retention-days: 7
