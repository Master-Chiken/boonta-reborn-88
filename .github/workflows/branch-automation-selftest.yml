name: Branch automation self-test

on:
  pull_request:
    paths:
      - ".github/workflows/branch-governance.yml"
      - ".github/workflows/branch-intake-queue.yml"
      - ".github/workflows/branch-automation-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-automation-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow YAML and embedded Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "YAML OK: #{path}" }' \
            .github/workflows/branch-governance.yml \
            .github/workflows/branch-intake-queue.yml \
            .github/workflows/branch-automation-selftest.yml

      - name: Verify branch coordination thresholds remain informational
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/branch-governance.yml").read_text(encoding="utf-8")
          docs = Path("docs/BRANCH_GOVERNANCE.md").read_text(encoding="utf-8")
          agents = Path("AGENTS.md").read_text(encoding="utf-8")

          required_workflow = (
              "general_alert_threshold = 105",
              "biddy_pinky_alert_threshold = 200",
              "General-contributor coordination alert (105 total branches)",
              "Biddy-Pinky coordination alert (200 total branches)",
              "advisory only; no workflow failure or task interruption",
          )
          for marker in required_workflow:
              if marker not in workflow:
                  raise SystemExit(f"Branch alert regression: workflow missing {marker!r}")

          if "105 total repository branches" not in docs or "200 total repository branches" not in docs:
              raise SystemExit("Branch alert regression: documentation must preserve both thresholds")
          if "rather than applying the general 105-branch alert" not in docs:
              raise SystemExit("Branch alert regression: Biddy-Pinky's separate threshold is unclear")
          if "informational alert at 105 total repository branches" not in agents or "200 total branches rather than 105" not in agents:
              raise SystemExit("Branch alert regression: AGENTS.md must preserve both coordination thresholds")

          # Prevent the project from drifting back into parallel-PR overload.
          queue_markers = (
              "Single-maintainer delivery queue",
              "one active runtime implementation or integration candidate at a time",
              "Issue #201 is the single source of truth for the active integration queue",
          )
          for marker in queue_markers:
              if marker not in docs:
                  raise SystemExit(f"Delivery-queue policy regression: branch docs missing {marker!r}")
              if marker not in agents:
                  raise SystemExit(f"Delivery-queue policy regression: AGENTS.md missing {marker!r}")

          forbidden = ("issues: write", "gh issue create", "hard_cap_exceeded", "cap_warning", "Fail audit if hard cap exceeded")
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f"Branch governance must remain non-blocking; forbidden marker: {marker!r}")
          if "  create:\n" in workflow:
              raise SystemExit("Branch governance must not run a full audit on every branch-creation event")
          print("Branch-count alerts are advisory at 105 / 200 branches; no cap, issue creation, or workflow failure.")
          PY

      - name: Compile embedded Python scripts without executing network operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          paths = (
              Path(".github/workflows/branch-governance.yml"),
              Path(".github/workflows/branch-intake-queue.yml"),
          )
          checked = 0
          for path in paths:
              source = path.read_text(encoding="utf-8")
              blocks = re.findall(
                  r"^[ \t]*python3[ \t]+-[ \t]+<<'PY'[ \t]*\r?\n(.*?)^[ \t]*PY[ \t]*$",
                  source,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if not blocks:
                  raise SystemExit(f"No embedded Python heredoc found in {path}")
              for index, block in enumerate(blocks, start=1):
                  compile(textwrap.dedent(block), f"{path}:python-block-{index}", "exec")
                  checked += 1
                  print(f"Python syntax OK: {path} block {index}")
          print(f"Validated {checked} embedded Python block(s).")
          PY

      - name: Verify Git patch-equivalence detection with a local fixture
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/repo"
          git -C "$tmp/repo" config user.name "Branch intake self-test"
          git -C "$tmp/repo" config user.email "branch-intake-selftest@example.invalid"

          git -C "$tmp/repo" checkout -q -b main
          printf 'base\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" add example.txt
          git -C "$tmp/repo" commit -qm "base"
          git -C "$tmp/repo" checkout -q -b candidate

          printf 'base\npatch-equivalent change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "candidate implementation"
          equivalent_sha="$(git -C "$tmp/repo" rev-parse HEAD)"

          # Advance main on an unrelated path first, so cherry-pick cannot fast-forward
          # directly to the candidate SHA. The resulting commit must have a new SHA.
          git -C "$tmp/repo" checkout -q main
          printf 'main only\\n' > "$tmp/repo/main-only.txt"
          git -C "$tmp/repo" add main-only.txt
          git -C "$tmp/repo" commit -qm "main advances independently"
          git -C "$tmp/repo" cherry-pick "$equivalent_sha" >/dev/null
          test "$(git -C "$tmp/repo" rev-parse HEAD)" != "$equivalent_sha"
          equivalent_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$equivalent_result"
          grep -F -- "- $equivalent_sha" <<< "$equivalent_result"

          # A genuinely new patch must still be counted as unique.
          git -C "$tmp/repo" checkout -q candidate
          printf 'base\npatch-equivalent change\nnew unique change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "additional unique implementation"
          mixed_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$mixed_result"
          unique_count="$(awk '$1 == "+" { count++ } END { print count + 0 }' <<< "$mixed_result")"
          test "$unique_count" -eq 1
          echo "Patch-equivalent commit skipped; one genuinely new commit detected."
