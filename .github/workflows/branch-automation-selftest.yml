name: Branch automation self-test

on:
  pull_request:
    paths:
      - ".github/workflows/branch-governance.yml"
      - ".github/workflows/branch-intake-queue.yml"
      - ".github/workflows/branch-automation-selftest.yml"
      - ".github/workflows/gamecube-demo-build.yml"
      - ".github/workflows/retire-proven-merged-refs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-automation-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow YAML and embedded Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "YAML OK: #{path}" }' \
            .github/workflows/branch-governance.yml \
            .github/workflows/branch-intake-queue.yml \
            .github/workflows/branch-automation-selftest.yml \
            .github/workflows/gamecube-demo-build.yml \
            .github/workflows/retire-proven-merged-refs.yml \
            .github/dependabot.yml

      - name: Verify branch retirement is archive-backed and targets two live refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          retirement = Path(".github/workflows/retire-proven-merged-refs.yml").read_text(encoding="utf-8")
          gamecube = Path(".github/workflows/gamecube-demo-build.yml").read_text(encoding="utf-8")

          required_markers = (
              "archive/branch-heads-20261019",
              "target_count=2",
              "state=open&per_page=100",
              "protected",
              'merge-base --is-ancestor "$sha" "$archive_ref"',
              'merge-base --is-ancestor "$sha" "$main_ref"',
              "Preflight all non-keeper refs before deleting any.",
              "Final ref-state check changed",
              "--method DELETE",
              "branch_count()",
          )
          for marker in required_markers:
              if marker not in retirement:
                  raise SystemExit(f"Archive-backed cleanup safety regression: missing {marker!r}")

          if 'target_count=2' not in retirement or 'name != "main"' not in retirement:
              raise SystemExit("Branch cleanup must preserve main and target exactly two live refs.")
          if "fixed_refs" in retirement or "Validate all five exact refs" in retirement:
              raise SystemExit("Branch cleanup must not remain restricted to the previous five-ref allowlist.")

          if "archive_protected" not in retirement:
              raise SystemExit("Branch cleanup must verify that the recovery archive is actively protected before any deletion.")
          if "Recovery archive must be protected against deletion and non-fast-forward updates; refusing all ref deletion." not in retirement:
              raise SystemExit("Branch cleanup must fail closed when archive protection is missing.")
          if "Recovery archive protection disappeared during cleanup; stopping." not in retirement:
              raise SystemExit("Branch cleanup must recheck archive protection before every deletion.")
          import re
          if re.search(r"(?m)^  workflow_dispatch:\s*$", retirement):
              raise SystemExit("Destructive branch retirement must only trigger from the reviewed protected-main push.")
          if "check_finish_label:" not in gamecube or "inputs.check_finish_label" not in gamecube:
              raise SystemExit("GameCube regression: explicit manual finish-label diagnostic input must remain available.")

          retired_ci_selectors = (
              "feat/game-finish-banner-label-20261017",
              "feat/rocky-canyon-silhouette-20261017",
              "feat/source-driven-racer-mesh-texture-20261017",
              "test/dolphin-pause-state-acceptance",
          )
          for retired_branch in retired_ci_selectors:
              if retired_branch in gamecube:
                  raise SystemExit(f"Stale CI branch selector remains for retired ref {retired_branch}")

          print("Branch cleanup targets exactly main plus the recovery archive; every other ref must pass exact-head, unprotected, no-open-PR, and archive/main reachability checks before retirement.")
          PY

      - name: Verify branch coordination thresholds remain informational
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/branch-governance.yml").read_text(encoding="utf-8")
          docs = Path("docs/BRANCH_GOVERNANCE.md").read_text(encoding="utf-8")
          agents = Path("AGENTS.md").read_text(encoding="utf-8")
          intake = Path(".github/workflows/branch-intake-queue.yml").read_text(encoding="utf-8")
          intake_docs = Path("docs/BRANCH_INTAKE.md").read_text(encoding="utf-8")
          dependabot = Path(".github/dependabot.yml").read_text(encoding="utf-8")

          required_workflow = (
              "general_alert_threshold = 105",
              "biddy_pinky_alert_threshold = 200",
              "General-contributor coordination alert (105 total branches)",
              "Biddy-Pinky coordination alert (200 total branches)",
              "advisory only; no workflow failure or task interruption",
          )
          for marker in required_workflow:
              if marker not in workflow:
                  raise SystemExit(f"Branch alert regression: workflow missing {marker!r}")

          if "105 total repository branches" not in docs or "200 total repository branches" not in docs:
              raise SystemExit("Branch alert regression: documentation must preserve both thresholds")
          if "rather than applying the general 105-branch alert" not in docs:
              raise SystemExit("Branch alert regression: Biddy-Pinky's separate threshold is unclear")
          if "informational alert at 105 total repository branches" not in agents or "200 total branches rather than 105" not in agents:
              raise SystemExit("Branch alert regression: AGENTS.md must preserve both coordination thresholds")

          # Prevent the project from drifting back into parallel-PR overload.
          queue_markers = (
              "Single-maintainer delivery queue",
              "One active runtime implementation or integration candidate at a time",
              "single source of truth for the active integration queue",
          )
          for marker in queue_markers:
              if marker not in docs:
                  raise SystemExit(f"Delivery-queue policy regression: branch docs missing {marker!r}")
              if marker not in agents:
                  raise SystemExit(f"Delivery-queue policy regression: AGENTS.md missing {marker!r}")

          if "Issue #156" not in docs or "Issue #156" not in agents:
              raise SystemExit("The active NOW/NEXT queue must reference canonical Issue #156 in docs and AGENTS.md.")
          if "Issue #201" in docs or "Issue #201" in agents:
              raise SystemExit("Stale Issue #201 queue references must be removed so contributors use canonical Issue #156.")
          if "Controlled archive-backed branch-ref retirement" not in docs:
              raise SystemExit("Branch governance docs must explain the guarded archive-backed retirement exception.")
          if "active repository ruleset must target exactly" not in agents:
              raise SystemExit("AGENTS.md must require explicit protection of the recovery archive before ref retirement.")

          # Stop the scheduled intake workflow from flooding a solo maintainer with PRs.
          import re
          if re.search(r"(?m)^  (?:schedule|push):", intake):
              raise SystemExit("Intake regression: draft PR creation must be manual-dispatch only")
          expected_max_prs = "MAX_PRS: " + chr(36) + "{{ github.event.inputs.max_prs || '1' }}"
          if expected_max_prs not in intake:
              raise SystemExit("Intake regression: default batch size must remain one")
          if 'default: "1"' not in intake or not re.search(r'(?ms)^        options:\n          - "1"\n\npermissions:', intake):
              raise SystemExit("Intake regression: only a single draft PR may be requested per run")
          if "1|3|5|10" in intake or not re.search(r'(?m)^            1\) ;;$', intake):
              raise SystemExit("Intake regression: workflow must reject batches larger than one")
          if "manual-dispatch only" not in docs:
              raise SystemExit("Governance docs must explain the manual-only intake behavior")

          if "manual-dispatch only" not in intake_docs or "at most one draft PR per deliberate run" not in intake_docs:
              raise SystemExit("Branch intake documentation must describe the manual one-PR-at-a-time queue.")
          if "Runs twice daily" in intake_docs or "up to 5 draft pull requests per scheduled run" in intake_docs or "1, 3, 5, or 10" in intake_docs:
              raise SystemExit("Branch intake documentation must not describe the retired scheduled multi-PR queue.")
          if "Keep this permission disabled" not in intake_docs:
              raise SystemExit("Branch intake documentation must not recommend enabling GitHub Actions PR creation for this task queue.")

          # Group routine action upgrades rather than flooding the solo review queue.
          if "open-pull-requests-limit: 1" not in dependabot:
              raise SystemExit("Dependabot regression: only one version-update PR may be open")
          if "github-actions-major:" not in dependabot or "github-actions-minor-patch:" not in dependabot:
              raise SystemExit("Dependabot regression: major and minor/patch action updates must be grouped")
          if "weekly" not in dependabot or "day: monday" not in dependabot:
              raise SystemExit("Dependabot regression: retain weekly update cadence")
          if "Dependabot update-volume control" not in docs:
              raise SystemExit("Governance docs must document Dependabot PR grouping and limit")
          forbidden = ("issues: write", "gh issue create", "hard_cap_exceeded", "cap_warning", "Fail audit if hard cap exceeded")
          for marker in forbidden:
              if marker in workflow:
                  raise SystemExit(f"Branch governance must remain non-blocking; forbidden marker: {marker!r}")
          if "  create:\n" in workflow:
              raise SystemExit("Branch governance must not run a full audit on every branch-creation event")
          print("Branch-count alerts are advisory at 105 / 200 branches; no cap, issue creation, or workflow failure.")
          PY

      - name: Compile embedded Python scripts without executing network operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          paths = (
              Path(".github/workflows/branch-governance.yml"),
              Path(".github/workflows/branch-intake-queue.yml"),
          )
          checked = 0
          for path in paths:
              source = path.read_text(encoding="utf-8")
              blocks = re.findall(
                  r"^[ \t]*python3[ \t]+-[ \t]+<<'PY'[ \t]*\r?\n(.*?)^[ \t]*PY[ \t]*$",
                  source,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if not blocks:
                  raise SystemExit(f"No embedded Python heredoc found in {path}")
              for index, block in enumerate(blocks, start=1):
                  compile(textwrap.dedent(block), f"{path}:python-block-{index}", "exec")
                  checked += 1
                  print(f"Python syntax OK: {path} block {index}")
          print(f"Validated {checked} embedded Python block(s).")
          PY

      - name: Verify Git patch-equivalence detection with a local fixture
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/repo"
          git -C "$tmp/repo" config user.name "Branch intake self-test"
          git -C "$tmp/repo" config user.email "branch-intake-selftest@example.invalid"

          git -C "$tmp/repo" checkout -q -b main
          printf 'base\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" add example.txt
          git -C "$tmp/repo" commit -qm "base"
          git -C "$tmp/repo" checkout -q -b candidate

          printf 'base\npatch-equivalent change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "candidate implementation"
          equivalent_sha="$(git -C "$tmp/repo" rev-parse HEAD)"

          # Advance main on an unrelated path first, so cherry-pick cannot fast-forward
          # directly to the candidate SHA. The resulting commit must have a new SHA.
          git -C "$tmp/repo" checkout -q main
          printf 'main only\\n' > "$tmp/repo/main-only.txt"
          git -C "$tmp/repo" add main-only.txt
          git -C "$tmp/repo" commit -qm "main advances independently"
          git -C "$tmp/repo" cherry-pick "$equivalent_sha" >/dev/null
          test "$(git -C "$tmp/repo" rev-parse HEAD)" != "$equivalent_sha"
          equivalent_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$equivalent_result"
          grep -F -- "- $equivalent_sha" <<< "$equivalent_result"

          # A genuinely new patch must still be counted as unique.
          git -C "$tmp/repo" checkout -q candidate
          printf 'base\npatch-equivalent change\nnew unique change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "additional unique implementation"
          mixed_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$mixed_result"
          unique_count="$(awk '$1 == "+" { count++ } END { print count + 0 }' <<< "$mixed_result")"
          test "$unique_count" -eq 1
          echo "Patch-equivalent commit skipped; one genuinely new commit detected."
