name: Branch automation self-test

on:
  pull_request:
    paths:
      - ".github/workflows/branch-governance.yml"
      - ".github/workflows/branch-intake-queue.yml"
      - ".github/workflows/branch-automation-selftest.yml"
      - ".github/workflows/retire-verified-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-automation-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow YAML and embedded Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "YAML OK: #{path}" }' \
            .github/workflows/branch-governance.yml \
            .github/workflows/branch-intake-queue.yml \
            .github/workflows/branch-automation-selftest.yml \
            .github/workflows/retire-verified-branch.yml

      - name: Verify two-branch workflow routing and safety exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          queue = Path(".github/workflows/branch-intake-queue.yml").read_text(encoding="utf-8")
          build = Path(".github/workflows/gamecube-demo-build.yml").read_text(encoding="utf-8")
          governance = Path("docs/BRANCH_GOVERNANCE.md").read_text(encoding="utf-8")
          agents = Path("AGENTS.md").read_text(encoding="utf-8")
          audit = Path(".github/workflows/branch-governance.yml").read_text(encoding="utf-8")
          retire = Path(".github/workflows/retire-verified-branch.yml").read_text(encoding="utf-8")

          checks = {
              "intake explicitly targets dev": 'target_branch = "dev"' in queue,
              "candidate comparisons use the integration target": 'compare/{target_branch}...{sha}' in queue,
              "created PRs target the integration branch": '"--base", target_branch' in queue,
              "main is never treated as an intake candidate": 'item.get("name") not in {"main", target_branch}' in queue,
              "archive and recovery refs are excluded": 'startswith(("archive/", "recovery/"))' in queue,
              "prototype build runs on main and dev pushes": 'branches: [main, dev]' in build,
              "governance documents main/dev roles": "`main` — stable/release branch" in governance and "`dev` — integration branch" in governance,
              "agent rules direct ordinary work to dev": "targeting `dev`" in agents and "separate reviewed PR" in agents,
              "audit distinguishes permanent branches from temporary work": 'permanent_names = {"main", "dev"}' in audit and "active_work" in audit,
              "audit excludes archive/recovery refs from active work": 'startswith(("archive/", "recovery/"))' in audit,
              "audit reports missing main/dev protection": "permanent_protection_missing" in audit and "protect main and dev" in audit,
              "obsolete 30-active-branch target is removed": "target 30" not in audit and "over_target" not in audit and "Branch governance: consolidation needed" not in audit,
              "normal intake remains draft-only": '"--head", name, "--draft"' in queue,
              "intake does not run destructive git ref commands": "git push --force" not in queue and "git branch -D" not in queue and "gh pr merge" not in queue,
              "retirement workflow is manually triggered only": "workflow_dispatch:" in retire.split("permissions:", 1)[0] and all(trigger not in retire.split("permissions:", 1)[0] for trigger in ("push:", "pull_request:", "schedule:")),
              "retirement restricted to owner from main": "github.actor == 'Master-Chiken' && github.ref == 'refs/heads/main'" in retire,
              "retirement requires exact typed branch and SHA": "CONFIRM_BRANCH" in retire and "EXPECTED_SHA" in retire and "PINNED_SHA" in retire,
              "retirement has exactly five pre-reviewed candidates": all(name in retire for name in ("recovery/branch-heads-20261019-verified", "feat/game-finish-banner-label-20261017", "feat/rocky-canyon-silhouette-20261017", "feat/source-driven-racer-mesh-texture-20261017", "test/dolphin-pause-state-acceptance")),
              "retirement rejects protected refs and open PRs": ".protected // false" in retire and ".head.ref == $branch or .base.ref == $branch" in retire,
              "retirement verifies reachability in recovery archive": 'git merge-base --is-ancestor "$EXPECTED_SHA" "refs/remotes/origin/archive/branch-heads-20261019"' in retire,
              "retirement repeats exact-SHA check immediately before delete": "Recheck immediately before deletion" in retire and retire.count('actual_sha="$(jq -r') >= 2,
              "retirement does not force-push or merge": "git push --force" not in retire and "gh pr merge" not in retire and "git update-ref" not in retire,
              "retirement has one delete-ref API call": retire.count('gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH_NAME"') == 1,
          }
          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          failures = [label for label, ok in checks.items() if not ok]
          if failures:
              raise SystemExit("Two-branch workflow safety validation failed: " + "; ".join(failures))
          PY

      - name: Compile embedded Python scripts without executing network operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          paths = (
              Path(".github/workflows/branch-governance.yml"),
              Path(".github/workflows/branch-intake-queue.yml"),
          )
          checked = 0
          for path in paths:
              source = path.read_text(encoding="utf-8")
              blocks = re.findall(
                  r"^[ \t]*python3[ \t]+-[ \t]+<<'PY'[ \t]*\r?\n(.*?)^[ \t]*PY[ \t]*$",
                  source,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if not blocks:
                  raise SystemExit(f"No embedded Python heredoc found in {path}")
              for index, block in enumerate(blocks, start=1):
                  compile(textwrap.dedent(block), f"{path}:python-block-{index}", "exec")
                  checked += 1
                  print(f"Python syntax OK: {path} block {index}")
          print(f"Validated {checked} embedded Python block(s).")
          PY

      - name: Verify Git patch-equivalence detection with a local fixture
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/repo"
          git -C "$tmp/repo" config user.name "Branch intake self-test"
          git -C "$tmp/repo" config user.email "branch-intake-selftest@example.invalid"

          git -C "$tmp/repo" checkout -q -b main
          printf 'base\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" add example.txt
          git -C "$tmp/repo" commit -qm "base"
          git -C "$tmp/repo" checkout -q -b candidate

          printf 'base\npatch-equivalent change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "candidate implementation"
          equivalent_sha="$(git -C "$tmp/repo" rev-parse HEAD)"

          # Advance main on an unrelated path first, so cherry-pick cannot fast-forward
          # directly to the candidate SHA. The resulting commit must have a new SHA.
          git -C "$tmp/repo" checkout -q main
          printf 'main only\\n' > "$tmp/repo/main-only.txt"
          git -C "$tmp/repo" add main-only.txt
          git -C "$tmp/repo" commit -qm "main advances independently"
          git -C "$tmp/repo" cherry-pick "$equivalent_sha" >/dev/null
          test "$(git -C "$tmp/repo" rev-parse HEAD)" != "$equivalent_sha"
          equivalent_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$equivalent_result"
          grep -F -- "- $equivalent_sha" <<< "$equivalent_result"

          # A genuinely new patch must still be counted as unique.
          git -C "$tmp/repo" checkout -q candidate
          printf 'base\npatch-equivalent change\nnew unique change\n' > "$tmp/repo/example.txt"
          git -C "$tmp/repo" commit -qam "additional unique implementation"
          mixed_result="$(git -C "$tmp/repo" cherry main candidate)"
          printf '%s\n' "$mixed_result"
          unique_count="$(awk '$1 == "+" { count++ } END { print count + 0 }' <<< "$mixed_result")"
          test "$unique_count" -eq 1
          echo "Patch-equivalent commit skipped; one genuinely new commit detected."
