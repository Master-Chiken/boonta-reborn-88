name: Boonta Autonomous Readiness

on:
  workflow_dispatch:

# The workflow's default token is read-only. The installation token below is
# minted with the exact permissions the autonomous loop will need, but this
# readiness check uses it only for GET requests.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  readiness:
    name: Verify autonomous configuration without running Gemini
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check owner gates and secret presence without printing values
        shell: bash
        env:
          GEMINI_AUTONOMOUS_ENABLED: ${{ vars.GEMINI_AUTONOMOUS_ENABLED }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          if [[ "${GEMINI_AUTONOMOUS_ENABLED:-}" == "true" ]]; then
            writer_state="enabled"
          else
            writer_state="disabled"
          fi
          [[ "${GEMINI_FREE_TIER_CONFIRMED:-}" == "true" ]] || missing+=("GEMINI_FREE_TIER_CONFIRMED must be exactly true after the owner verifies Free tier and no linked Cloud Billing account")
          [[ -n "${GEMINI_API_KEY:-}" ]] || missing+=("GEMINI_API_KEY secret is missing")
          [[ -n "${APP_ID:-}" ]] || missing+=("APP_ID variable is missing")
          [[ -n "${APP_PRIVATE_KEY:-}" ]] || missing+=("APP_PRIVATE_KEY secret is missing")

          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Boonta Autonomous: configuration incomplete"
              echo
              printf -- '- %s\n' "${missing[@]}"
              echo
              echo "No Gemini model call was made. No repository write was performed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Boonta Autonomous: owner gates and secret presence"
            echo
            echo "- Autonomous writer gate: ${writer_state} (this read-only preflight neither changes the gate nor invokes a model)"
            echo "- Free-tier owner attestation: present and exactly true"
            echo "- Gemini API key: secret present (value not inspected or printed)"
            echo "- GitHub App ID/private key: present (values not printed)"
            echo
            echo "This verifies configuration presence only. It does not independently verify Google billing status or the project's Free tier."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report optional OpenRouter Free fallback readiness (no API request)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.OPENROUTER_FREE_TIER_CONFIRMED }}
        run: |
          set -euo pipefail
          if [[ "${OPENROUTER_FREE_TIER_CONFIRMED:-}" == "true" && -n "${OPENROUTER_API_KEY:-}" ]]; then
            {
              echo "## OpenRouter Free fallback: configured"
              echo
              echo "- Owner attestation is exactly true and API-key secret is present (value not inspected or printed)."
              echo "- This check does not verify account billing status, key validity, model availability or quota."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## OpenRouter Free fallback: not configured"
              echo
              echo "- Optional fallback remains safely disabled until OPENROUTER_API_KEY is present and OPENROUTER_FREE_TIER_CONFIRMED=true."
              echo "- Gemini remains the only active autonomous model path."
              echo "- No OpenRouter API request was made."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint a scoped GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Verify GitHub App access to the canonical project state (GET only)
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="${API_URL}/repos/${REPOSITORY}"

          # These GET requests confirm the installation can inspect the same
          # issues, branches and Actions data used by the autonomous writer.
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/issues/156" | jq -e '.number == 156' >/dev/null
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/issues/226" | jq -e '.number == 226' >/dev/null
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs?per_page=1" | jq -e '.workflow_runs | type == "array"' >/dev/null
          for branch in main dev; do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${APP_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/git/ref/heads/${branch}" | jq -e --arg branch "${branch}" '.ref == ("refs/heads/" + $branch)' >/dev/null
          done

          {
            echo "## GitHub App access: passed"
            echo
            echo "- App installation token minted with Contents/Issues/Pull requests write and Actions read."
            echo "- Read access to issues #156 and #226 confirmed."
            echo "- Read access to Actions runs confirmed."
            echo "- main and dev branch refs confirmed."
            echo "- All API checks above were GET requests. No code, issue, PR, setting or secret was changed."
            echo
            echo "## Owner-only checks still required"
            echo "- Verify in Google AI Studio that this Gemini API project is Free tier and has no linked Cloud Billing account."
            echo "- After this preflight passes and branch protection is verified, set GEMINI_AUTONOMOUS_ENABLED=true as the final activation step."
            echo "- Verify GitHub rulesets protect main and dev against direct updates, force-push and deletion, and require PR review."
            echo "- Confirm the GitHub App installation is limited to this repository."
            echo
            echo "This workflow does not call Gemini and does not prove that the Gemini API key is valid."
          } >> "$GITHUB_STEP_SUMMARY"
