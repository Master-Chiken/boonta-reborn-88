name: OpenRouter Free autonomous fallback

on:
  workflow_call:
    outputs:
      invocation_outcome:
        description: "Outcome of the actual OpenRouter/OpenCode invocation step, independent of report validation."
        value: ${{ jobs.openrouter-plan-execute.outputs.invocation_outcome }}
      report_outcome:
        description: "Outcome of the OpenRouter autonomous report validator."
        value: ${{ jobs.openrouter-plan-execute.outputs.report_outcome }}
      cycle_status:
        description: "Validated OpenRouter cycle status: progress or blocked."
        value: ${{ jobs.openrouter-plan-execute.outputs.cycle_status }}
      task_queue_state_outcome:
        description: "Outcome of persisting or clearing the single-task daily backoff marker."
        value: ${{ jobs.openrouter-plan-execute.outputs.task_queue_state_outcome }}
    inputs:
      autonomous_mode:
        type: boolean
        required: true
      issue_number:
        type: number
        required: true
      task_id:
        type: string
        required: false
      task_title:
        type: string
        required: false
      task_target_branch:
        type: string
        required: false
      task_description:
        type: string
        required: false
      task_blocked_active:
        type: boolean
        required: false
        default: false
      resume_mode:
        type: boolean
        required: false
        default: false
      resume_task_id:
        type: string
        required: false
      resume_task_title:
        type: string
        required: false
      resume_task_target_branch:
        type: string
        required: false
      resume_task_description:
        type: string
        required: false
      resume_pr_number:
        type: string
        required: false
      resume_pr_url:
        type: string
        required: false
      resume_branch:
        type: string
        required: false
      resume_head_sha:
        type: string
        required: false
      resume_file_paths:
        type: string
        required: false

concurrency:
  group: boonta-single-writer
  cancel-in-progress: false

jobs:
  openrouter-plan-execute:
    name: One bounded OpenRouter Free research/engineering cycle
    outputs:
      invocation_outcome: ${{ steps.run_opencode.outcome }}
      report_outcome: ${{ steps.validate_report.outcome }}
      cycle_status: ${{ steps.validate_report.outputs.cycle_status }}
      task_queue_state_outcome: ${{ steps.sync_task_queue_state.outcome }}
    if: inputs.autonomous_mode == true && inputs.issue_number == 226
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Check same-day OpenRouter failure cooldown
        id: openrouter_cooldown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              since: todayUtc + 'T00:00:00Z',
              per_page: 100,
            });
            const markerComment = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN:'));
            const match = markerComment?.body?.match(/<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/);
            const failedOn = match?.[1] || '';
            const active = failedOn === todayUtc;
            core.setOutput('active', String(active));
            core.setOutput('failed_on', failedOn);
            if (active) {
              core.notice('OpenRouter Free already failed during UTC day ' + todayUtc + '; skip another request until the next UTC day.');
            } else {
              core.info('No active same-day OpenRouter Free failure cooldown.');
            }
      - name: Require explicit OpenRouter Free and autonomous owner gates
        id: free_tier_guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.OPENROUTER_FREE_TIER_CONFIRMED }}
          GEMINI_AUTONOMOUS_ENABLED: ${{ vars.GEMINI_AUTONOMOUS_ENABLED }}
          AUTONOMOUS_MODE: ${{ inputs.autonomous_mode }}
          AUTONOMOUS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_EVENT_ACTION: ${{ github.event.action }}
          CALLER_DISPATCH_ORIGIN: ${{ github.event.client_payload.origin }}
          CALLER_DISPATCH_FAILED_PROVIDER: ${{ github.event.client_payload.failed_provider }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          OPENROUTER_COOLDOWN_ACTIVE: ${{ steps.openrouter_cooldown.outputs.active }}
          OPENROUTER_COOLDOWN_DATE: ${{ steps.openrouter_cooldown.outputs.failed_on }}
        run: |
          set -euo pipefail
          set +x
          reason="none"
          if [[ "${OPENROUTER_FREE_TIER_CONFIRMED:-}" != "true" ]]; then
            reason="OPENROUTER_FREE_TIER_CONFIRMED must equal true only after the owner verifies the OpenRouter Free account, zero payment methods/credits, and no paid usage."
          elif [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            reason="The OPENROUTER_API_KEY_02 (preferred) or legacy OPENROUTER_API_KEY repository secret is missing."
          elif [[ "${GEMINI_AUTONOMOUS_ENABLED:-}" != "true" ]]; then
            reason="The master GEMINI_AUTONOMOUS_ENABLED owner gate is not exactly true."
          elif [[ "${AUTONOMOUS_MODE:-false}" != "true" || "${AUTONOMOUS_ISSUE_NUMBER:-}" != "226" ]]; then
            reason="OpenRouter fallback is restricted to autonomous issue #226."
          elif [[ "${CALLER_WORKFLOW:-}" != "Boonta Autonomous Loop" || "${CALLER_REF:-}" != "refs/heads/main" ]]; then
            reason="OpenRouter fallback may only be called by Boonta Autonomous Loop from main."
          elif [[ "${CALLER_EVENT:-}" != "schedule" && "${CALLER_EVENT:-}" != "workflow_dispatch" && "${CALLER_EVENT:-}" != "push" && "${CALLER_EVENT:-}" != "repository_dispatch" ]]; then
            reason="Unsupported caller event; only schedule, owner-dispatched workflow, owner-authorized main push, or trusted provider fallback is allowed."
          elif [[ "${CALLER_EVENT:-}" == "repository_dispatch" && ( "${CALLER_EVENT_ACTION:-}" != "boonta-provider-fallback" || "${CALLER_DISPATCH_ORIGIN:-}" != "boonta-provider-fallback" || "${CALLER_DISPATCH_FAILED_PROVIDER:-}" != "gemini" ) ]]; then
            reason="OpenRouter accepts internal dispatch only after a validated Gemini failure marker."
          elif [[ "${OPENROUTER_COOLDOWN_ACTIVE:-}" == "true" ]]; then
            reason="OpenRouter Free already failed an autonomous invocation on UTC date ${OPENROUTER_COOLDOWN_DATE:-today}; skip repeated requests until the next UTC day. No provider request will be made."
          elif [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            reason="The scoped GitHub App ID variable or private-key secret is missing."
          fi

          if [[ "$reason" != "none" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenRouter Free fallback skipped safely"
              echo
              echo "$reason"
              echo "No OpenRouter request, repository write, or paid fallback was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenRouter Free fallback gate passed"
              echo
              echo "Only the fixed openrouter/free route is configured. No paid model/provider fallback is available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify OpenRouter Free key authentication without inference
        id: openrouter_auth_check
        if: steps.free_tier_guard.outputs.allowed == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Accept: application/json" \
            https://openrouter.ai/api/v1/key)"
          jq -e '.data.is_free_tier == true' <<< "$response" >/dev/null
          quota_remaining="$(jq -er '.data.free_model_daily_requests.remaining | numbers' <<< "$response")"
          if [[ ! "$quota_remaining" =~ ^[0-9]+$ ]]; then
            echo "OpenRouter returned an invalid free_model_daily_requests.remaining value; refusing model inference." >&2
            exit 1
          fi
          # Match the maximum configured OpenCode build steps before allowing inference.
          MIN_REQUESTS_PER_CYCLE=8
          echo "quota_remaining=$quota_remaining" >> "$GITHUB_OUTPUT"
          echo "quota_required=$MIN_REQUESTS_PER_CYCLE" >> "$GITHUB_OUTPUT"
          if (( quota_remaining >= MIN_REQUESTS_PER_CYCLE )); then
            echo "quota_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "quota_available=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## OpenRouter key authentication: passed"
            echo
            echo "- OpenRouter accepted the bearer key and reports is_free_tier=true."
            echo "- Free-model requests remaining in the current UTC day: $quota_remaining."
            echo "- Minimum reserve for one bounded OpenCode cycle: $MIN_REQUESTS_PER_CYCLE requests."
            if (( quota_remaining >= MIN_REQUESTS_PER_CYCLE )); then
              echo "- The daily Free-only balance meets the bounded cycle reserve; the guarded model step may proceed."
            else
              echo "- The daily Free-only balance is below the bounded cycle reserve; model inference is blocked before any provider request."
              echo "- The counter is daily and UTC-based; no credits or paid fallback will be used."
            fi
            echo "- This was a GET-only check; the key value and account details were not printed."
          } >> "$GITHUB_STEP_SUMMARY"
          unset response quota_remaining MIN_REQUESTS_PER_CYCLE

      - name: Revalidate selected task after acquiring the shared writer slot
        id: fresh_task_guard
        if: inputs.autonomous_mode == true && steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && inputs.resume_mode != true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const taskId = process.env.TASK_ID || '';
            const targetBranch = process.env.TASK_TARGET_BRANCH || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const failClosed = (reason) => {
              core.setOutput('allowed', 'false');
              core.setFailed('Fresh task revalidation blocked before provider invocation: ' + reason);
            };
            
            if (issueNumber !== 226) {
              failClosed('autonomous task execution is restricted to canonical issue #226');
              return;
            }
            if (!/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(taskId)) {
              failClosed('selected task ID is missing or malformed');
              return;
            }
            if (!['main', 'dev'].includes(targetBranch)) {
              failClosed('selected target branch must be main or dev');
              return;
            }
            
            // This GET-only check runs after the shared boonta-single-writer concurrency
            // slot has been acquired. It refreshes the earlier global selection so a run
            // that waited in the queue cannot act on a task that changed meanwhile.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main'
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              failClosed('canonical compact task ledger is missing or not a base64 file');
              return;
            }
            
            let ledgerSummary;
            try {
              ledgerSummary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            } catch (error) {
              failClosed('canonical compact task ledger is not valid JSON');
              return;
            }
            if (
              ledgerSummary.schema_version !== 2 ||
              ledgerSummary.source !== 'docs/automation/task-ledger.json' ||
              !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(ledgerSummary.updated_at || '') ||
              ledgerSummary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(ledgerSummary.tasks) ||
              !Array.isArray(ledgerSummary.completed_task_ids) ||
              ledgerSummary.completed_task_ids.some((id) => typeof id !== 'string' || !id.trim()) ||
              new Set(ledgerSummary.completed_task_ids).size !== ledgerSummary.completed_task_ids.length
            ) {
              failClosed('canonical compact task ledger schema, completed dependencies or one-active-task policy is invalid');
              return;
            }
            const completedTaskIds = new Set(ledgerSummary.completed_task_ids);
            
            const taskIds = ledgerSummary.tasks.map((task) => task?.task_id);
            if (
              taskIds.some((id) => typeof id !== 'string' || !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(id)) ||
              new Set(taskIds).size !== taskIds.length
            ) {
              failClosed('canonical compact task ledger contains missing, invalid or duplicate task IDs');
              return;
            }
            const activeTasks = ledgerSummary.tasks.filter((task) => task.status === 'active');
            if (activeTasks.length > 1) {
              failClosed('canonical task ledger violates the one-active-task policy');
              return;
            }
            const matches = ledgerSummary.tasks.filter((task) => task.task_id === taskId);
            if (matches.length !== 1) {
              failClosed('the selected task is no longer present exactly once in the canonical ledger');
              return;
            }
            const task = matches[0];
            const activationBootstrap = taskId === 'AUTOMATION-LEDGER-ACTIVATION';
            const dependenciesSatisfied = Array.isArray(task.depends_on) &&
              task.depends_on.every((dependencyId) =>
                typeof dependencyId === 'string' && completedTaskIds.has(dependencyId)
              );
            const activeReservation = task.status === 'active' &&
              activeTasks.length === 1 && activeTasks[0].task_id === taskId &&
              dependenciesSatisfied;
            const approvedQueuePromotion = task.status === 'queued' &&
              task.owner_approved === true && activeTasks.length === 0 &&
              dependenciesSatisfied;
            const eligibleStatus = activationBootstrap
              ? task.status === 'blocked' && activeTasks.length === 0
              : activeReservation || approvedQueuePromotion;
            if (!eligibleStatus) {
              failClosed('the selected task status or active-task reservation changed while this run waited');
              return;
            }
            if (
              task.target_branch !== targetBranch ||
              !task.title?.trim() ||
              !task.question_excerpt?.trim() ||
              !task.next_action_excerpt?.trim() ||
              !Array.isArray(task.acceptance_criteria_excerpt) ||
              task.acceptance_criteria_excerpt.length === 0 ||
              !Array.isArray(task.platform_scope) ||
              task.platform_scope.length === 0 ||
              !Array.isArray(task.read_paths) ||
              task.read_paths.length < 1 || task.read_paths.length > 4 ||
              task.read_paths.some((path) =>
                typeof path !== 'string' || path.length > 120 ||
                !/^[A-Za-z0-9._/-]+$/.test(path) || path.startsWith('/') ||
                path.split('/').some((part) => !part || part === '.' || part === '..') ||
                path === 'docs/automation/task-ledger.json' ||
                path === 'docs/automation/task-ledger-summary.json' ||
                path.split('/').some((part) => ['generated', 'roms', 'private'].includes(part.toLowerCase()))
              ) ||
              new Set(task.read_paths).size !== task.read_paths.length
            ) {
              failClosed('the selected task no longer matches its canonical branch or complete execution context');
              return;
            }
            if (task.pr_url || task.head_sha) {
              failClosed('the selected task already has PR or HEAD evidence and must be reconciled before another run');
              return;
            }
            
            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              failClosed('open PR inventory reached the 100-item safety ceiling');
              return;
            }
            const markerLine = 'BOONTA_TASK_ID: ' + taskId;
            const duplicate = openPullRequests.find((pull) =>
              (pull.body || '').split(/\r?\n/).some((line) => line.trim() === markerLine)
            );
            if (duplicate) {
              failClosed('open PR #' + duplicate.number + ' already represents this exact task');
              return;
            }
            
            core.setOutput('allowed', 'true');
            core.info(
              'Fresh task revalidation passed after the shared writer slot: ' +
              taskId + ' -> ' + targetBranch + '; no matching open PR or stale ledger state.'
            );
      - name: Revalidate existing task PR after acquiring the shared writer slot
        id: fresh_resume_guard
        if: inputs.autonomous_mode == true && inputs.resume_mode == true && steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          RESUME_TASK_TITLE: ${{ inputs.resume_task_title }}
          RESUME_TASK_TARGET_BRANCH: ${{ inputs.resume_task_target_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESUME_PR_NUMBER: ${{ inputs.resume_pr_number }}
          RESUME_PR_URL: ${{ inputs.resume_pr_url }}
          RESUME_BRANCH: ${{ inputs.resume_branch }}
          RESUME_HEAD_SHA: ${{ inputs.resume_head_sha }}
        with:
          script: |
            const taskId = process.env.RESUME_TASK_ID || '';
            const taskTitle = process.env.RESUME_TASK_TITLE || '';
            const targetBranch = process.env.RESUME_TASK_TARGET_BRANCH || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const prNumber = Number(process.env.RESUME_PR_NUMBER || '0');
            const prUrl = process.env.RESUME_PR_URL || '';
            const branch = process.env.RESUME_BRANCH || '';
            const expectedHeadSha = process.env.RESUME_HEAD_SHA || '';
            const failClosed = (reason) => {
              core.setOutput('allowed', 'false');
              core.setFailed('Existing task PR resume blocked before provider invocation: ' + reason);
            };

            if (
              issueNumber !== 226 ||
              !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(taskId) ||
              !taskTitle.trim() ||
              !['main', 'dev'].includes(targetBranch) ||
              !Number.isSafeInteger(prNumber) || prNumber < 1 ||
              !/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/pull\/[1-9][0-9]*$/.test(prUrl) ||
              !branch || branch === targetBranch ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha)
            ) {
              failClosed('resume metadata is missing or malformed');
              return;
            }

            // Read-only, post-queue revalidation: no provider or write token is created by this step.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main'
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              failClosed('canonical compact task ledger is missing or not a base64 file');
              return;
            }
            let summary;
            try {
              summary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            } catch (_error) {
              failClosed('canonical compact task ledger is not valid JSON');
              return;
            }
            if (
              summary.schema_version !== 2 ||
              summary.source !== 'docs/automation/task-ledger.json' ||
              summary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(summary.tasks)
            ) {
              failClosed('canonical compact task ledger schema or one-active-task policy is invalid');
              return;
            }
            const ids = summary.tasks.map((task) => task?.task_id);
            if (
              ids.some((id) => typeof id !== 'string' || !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(id)) ||
              new Set(ids).size !== ids.length
            ) {
              failClosed('canonical compact task ledger contains invalid or duplicate task IDs');
              return;
            }
            const activeTasks = summary.tasks.filter((task) => task.status === 'active');
            if (activeTasks.length > 1) {
              failClosed('canonical task ledger violates the one-active-task policy');
              return;
            }
            const matches = summary.tasks.filter((task) => task.task_id === taskId);
            if (matches.length !== 1) {
              failClosed('resume task is not present exactly once in the canonical ledger');
              return;
            }
            const task = matches[0];
            const activationBootstrap = taskId === 'AUTOMATION-LEDGER-ACTIVATION';
            const eligibleStatus = activationBootstrap
              ? task.status === 'blocked' && activeTasks.length === 0
              : task.status === 'active' && activeTasks.length === 1 && activeTasks[0].task_id === taskId;
            if (
              !eligibleStatus ||
              task.target_branch !== targetBranch ||
              task.title !== taskTitle ||
              !task.question_excerpt?.trim() ||
              !task.next_action_excerpt?.trim() ||
              !Array.isArray(task.acceptance_criteria_excerpt) ||
              task.acceptance_criteria_excerpt.length === 0 ||
              !Array.isArray(task.platform_scope) ||
              task.platform_scope.length === 0 ||
              task.pr_url || task.head_sha
            ) {
              failClosed('canonical task status, content, branch or unrecorded-PR evidence changed while the run waited');
              return;
            }

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              failClosed('open PR inventory reached the 100-item safety ceiling');
              return;
            }
            const taskMarker = 'BOONTA_TASK_ID: ' + taskId;
            const targetMarker = 'BOONTA_TASK_TARGET_BRANCH: ' + targetBranch;
            const matching = openPullRequests.filter((pull) =>
              (pull.body || '').split(/\r?\n/).some((line) => line.trim() === taskMarker)
            );
            if (matching.length !== 1) {
              failClosed('exactly one open PR with the selected task marker is required');
              return;
            }
            const pull = matching[0];
            const bodyLines = (pull.body || '').split(/\r?\n/).map((line) => line.trim());
            const canonicalRepo = context.repo.owner + '/' + context.repo.repo;
            if (
              pull.number !== prNumber ||
              pull.state !== 'open' ||
              pull.draft !== false ||
              pull.user?.login !== context.repo.owner ||
              pull.head?.repo?.full_name !== canonicalRepo ||
              pull.base?.repo?.full_name !== canonicalRepo ||
              pull.base?.ref !== targetBranch ||
              pull.head?.ref !== branch ||
              pull.head?.ref === pull.base?.ref ||
              pull.head?.sha !== expectedHeadSha ||
              pull.html_url !== prUrl ||
              prUrl !== 'https://github.com/' + canonicalRepo + '/pull/' + prNumber ||
              bodyLines.filter((line) => line === taskMarker).length !== 1 ||
              bodyLines.filter((line) => line === targetMarker).length !== 1
            ) {
              failClosed('live PR does not match owner, same repository, non-draft state, task/target markers, base, branch, URL and reserved exact head SHA');
              return;
            }
            core.setOutput('allowed', 'true');
            core.info('Existing task PR #' + prNumber + ' revalidated after the writer lock at exact head ' + expectedHeadSha + '; no provider token has been minted yet.');

      - name: Mint scoped GitHub App token
        id: mint_identity_token
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Checkout the protected default branch
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: main
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Checkout selected task target for bounded source context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: ${{ inputs.resume_mode == true && inputs.resume_task_target_branch || inputs.task_target_branch }}
          path: .boonta-target-source
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Install pinned OpenCode CLI
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Snapshot open PR heads before OpenRouter cycle
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        id: snapshot_pr_heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'Master-Chiken',
              repo: 'boonta-reborn-88',
              state: 'open',
              per_page: 100
            });
            const snapshotAt = new Date().toISOString();
            const baseline = Object.fromEntries(pulls.map((pr) => [String(pr.number), pr.head.sha]));
            core.setOutput('heads', JSON.stringify(baseline));
            core.setOutput('snapshot_at', snapshotAt);
            core.info('Captured ' + pulls.length + ' open PR head(s) for cycle-fresh validation at ' + snapshotAt + '.');

      - name: Prepare the exact selected task and repository root before inference
        id: prepare_context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success'
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          RESUME_MODE: ${{ inputs.resume_mode }}
          RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          RESUME_TASK_TITLE: ${{ inputs.resume_task_title }}
          RESUME_TASK_TARGET_BRANCH: ${{ inputs.resume_task_target_branch }}
          RESUME_TASK_DESCRIPTION: ${{ inputs.resume_task_description }}
        run: |
          set -euo pipefail
          if [[ "${RESUME_MODE:-false}" == "true" ]]; then
            TASK_ID="${RESUME_TASK_ID:-}"
            TASK_TITLE="${RESUME_TASK_TITLE:-}"
            TASK_TARGET_BRANCH="${RESUME_TASK_TARGET_BRANCH:-}"
            TASK_DESCRIPTION="${RESUME_TASK_DESCRIPTION:-}"
          fi
          repo_root=''
          for candidate in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/boonta-reborn-88"; do
            [[ -d "$candidate" ]] || continue
            candidate="$(cd "$candidate" && pwd -P)"
            if [[ -f "$candidate/tools/build_autonomous_context.py" && -f "$candidate/docs/REVERSE_ENGINEERING_FIRST.md" && -f "$candidate/docs/automation/AUTONOMOUS_CONTEXT_BUDGET.md" && -f "$candidate/docs/automation/task-ledger-summary.json" ]]; then
              git_root="$(git -C "$candidate" rev-parse --show-toplevel)"
              if [[ "$git_root" == "$candidate" ]]; then repo_root="$candidate"; break; fi
            fi
          done
          if [[ -z "$repo_root" ]]; then
            echo "::error::Could not identify the exact checked-out Boonta repository root; no OpenRouter inference was sent."
            exit 1
          fi
          # Refresh only the runner's derived summary; the global preflight's
          # task handoff is verified as a subset of this current compact projection.
          python3 "$repo_root/tools/check_task_ledger_summary.py" --write
          context="$(python3 "$repo_root/tools/build_autonomous_context.py" --root "$repo_root" --task-id "$TASK_ID" --task-title "$TASK_TITLE" --target-branch "$TASK_TARGET_BRANCH" --task-context "$TASK_DESCRIPTION" --source-root "$GITHUB_WORKSPACE/.boonta-target-source" --max-chars 2800 --max-task-context 1100 --max-source-chars 950 --max-criteria 4 --max-next-action 100)"
          {
            printf 'repo_root=%s\n' "$repo_root"
            echo 'context<<BOONTA_CONTEXT_EOF'
            printf '%s\n' "$context"
            echo 'BOONTA_CONTEXT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Prepare bounded provider inputs
        id: bounded_inputs
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.prepare_context.outcome == 'success' && inputs.resume_mode != true
        shell: bash
        env:
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.boonta-target-source"
          policy_root="$REPO_ROOT"
          base_sha="$(git -C "$source_root" rev-parse HEAD)"
          policy_sha="$(git -C "$policy_root" rev-parse HEAD)"
          proposal_path="$RUNNER_TEMP/boonta-proposal.json"
          allowlist_path="$RUNNER_TEMP/boonta-allowlist.json"
          [[ ! -e "$proposal_path" && ! -L "$proposal_path" ]]
          [[ ! -e "$allowlist_path" && ! -L "$allowlist_path" ]]
          python3 "$REPO_ROOT/tools/prepare_autonomous_agent_inputs.py" \
            --source-root "$source_root" \
            --policy-root "$policy_root" \
            --expected-base-sha "$base_sha" \
            --expected-policy-sha "$policy_sha" \
            --task-id "$TASK_ID" \
            --allowlist-output "$allowlist_path" > "$RUNNER_TEMP/boonta-agent-inputs.json"
          python3 - "$RUNNER_TEMP/boonta-agent-inputs.json" "$proposal_path" "$GITHUB_OUTPUT" "$source_root" "$policy_root" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          proposal_path = sys.argv[2]
          output = Path(sys.argv[3])
          source_root = sys.argv[4]
          policy_root = sys.argv[5]
          values = {
              "task_id": payload["task_id"],
              "target_branch": payload["target_branch"],
              "base_sha": payload["base_sha"],
              "policy_sha": payload["policy_sha"],
              "source_root": source_root,
              "policy_root": policy_root,
              "read_paths": json.dumps(payload["read_paths"], separators=(",", ":")),
              "read_ranges": json.dumps(payload["read_ranges"], separators=(",", ":")),
              "allowed_paths": json.dumps(payload["allowed_paths"], separators=(",", ":")),
              "allowlist_report": payload["allowlist_report"],
              "proposal_path": proposal_path,
          }
          with output.open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Run OpenCode through the OpenRouter Free route
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.prepare_context.outcome == 'success' && steps.bounded_inputs.outcome == 'success' && inputs.resume_mode != true
        id: run_opencode
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PREFLIGHT_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          OPENROUTER_AUTH_OUTCOME: ${{ steps.openrouter_auth_check.outcome }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
          OPENCODE_EXPERIMENTAL_CODE_MODE: 'false'
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          AUTONOMOUS_CONTEXT: ${{ steps.prepare_context.outputs.context }}
          BOONTA_BASE_SHA: ${{ steps.bounded_inputs.outputs.base_sha }}
          BOONTA_TARGET_ROOT: ${{ steps.bounded_inputs.outputs.source_root }}
          BOONTA_PROPOSAL_PATH: ${{ steps.bounded_inputs.outputs.proposal_path }}
          BOONTA_READ_PATHS: ${{ steps.bounded_inputs.outputs.read_paths }}
          BOONTA_READ_RANGES: ${{ steps.bounded_inputs.outputs.read_ranges }}
          BOONTA_ALLOWED_PATHS: ${{ steps.bounded_inputs.outputs.allowed_paths }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "$TASK_ID" || -z "$TASK_TITLE" || -z "$AUTONOMOUS_CONTEXT" || -z "$REPO_ROOT" || ! "$TASK_TARGET_BRANCH" =~ ^(main|dev)$ || -z "$BOONTA_BASE_SHA" ]]; then
            echo "::error::Trusted preflight or bounded task inputs are incomplete; no OpenRouter request was sent."
            exit 2
          fi
          if [[ -f "$BOONTA_PROPOSAL_PATH" || -L "$BOONTA_PROPOSAL_PATH" ]]; then
            echo "::error::A provider proposal already exists at the workflow-owned output path."
            exit 2
          fi

          export OPENCODE_AUTH_CONTENT
          OPENCODE_AUTH_CONTENT="$(jq -cn --arg key "$OPENROUTER_API_KEY" '{openrouter: {type: "api", key: $key}}')"

          cat > "$RUNNER_TEMP/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "openrouter/openrouter/free",
            "small_model": "openrouter/openrouter/free",
            "enabled_providers": ["openrouter"],
            "agent": {
              "build": {
                "steps": 8,
                "permission": {"task": {"*": "deny"}}
              }
            },
            "mcp": {
              "boonta": {
                "type": "local",
                "command": ["node", "tools/bounded_patch_proposal_mcp.js"],
                "environment": {
                  "BOONTA_TASK_ID": "{env:TASK_ID}",
                  "BOONTA_BASE_SHA": "{env:BOONTA_BASE_SHA}",
                  "BOONTA_TARGET_ROOT": "{env:BOONTA_TARGET_ROOT}",
                  "BOONTA_PROPOSAL_PATH": "{env:BOONTA_PROPOSAL_PATH}",
                  "RUNNER_TEMP": "{env:RUNNER_TEMP}",
                  "BOONTA_READ_PATHS": "{env:BOONTA_READ_PATHS}",
                  "BOONTA_READ_RANGES": "{env:BOONTA_READ_RANGES}",
                  "BOONTA_ALLOWED_PATHS": "{env:BOONTA_ALLOWED_PATHS}"
                },
                "enabled": true,
                "timeout": 60000
              }
            },
            "permission": {
              "*": "allow",
              "bash": "deny",
              "read": "deny",
              "edit": "deny",
              "glob": "deny",
              "grep": "deny",
              "list": "deny"
            }
          }
          JSON

          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"
          PROMPT="$(cat <<'PROMPT'
          You are the €0-only OpenRouter Free coding agent for Boonta Reborn.

          AUTHORITY AND SCOPE
          - Work only on the exact task and target branch in the preloaded context.
          - The task excerpts and trusted exact-path grants are authoritative.
          - Never ask the owner for code or clarification. Implement the smallest useful patch, or report a precise blocker.
          - Preserve clean-room provenance. Never upload commercial ROMs, disc images, binaries or extracted game assets.
          - Global preflight is authoritative. Do not search PR history or treat older merged automation PRs as current task evidence; the selected task's pr_url and head_sha are checked before inference.
          - For gameplay tasks, reuse the merged PR #327 implementation at 69deb6778f9383887118803428e7014686865a83. PRs #317/#318/#319 are superseded. Do not reopen, replay or recreate that chain.
          - No paid route, billing, credits, provider/secret/settings changes, subagents, agents, repo-wide discovery, or network research.

          AVAILABLE TOOLS
          - Only two local tools are available: boonta_read_approved_sources and boonta_submit_patch_proposal.
          - Call boonta_read_approved_sources exactly once. It returns only task-approved source ranges from the selected target checkout.
          - Then call boonta_submit_patch_proposal exactly once with one coherent unified diff.
          - No GitHub MCP, no remote branch/PR APIs, no shell, no filesystem, no directory listing and no other read/write tools exist.
          - Never claim that a branch or PR was created. The workflow-owned verifier will validate tests and publish only a verified patch.

          PATCH CONTRACT
          - Change only exact paths listed under "Exact owner-reviewed write paths". Do not add, rename, delete or copy files.
          - Keep the diff textual, bounded, and based on the exact target base SHA in the trusted handoff.
          - Proposal fields: schema_version=1, exact task_id, exact base_sha, concise summary, unified_diff, test_ids and limitations.
          - Use only registered test identifiers. For GC-RIVAL-ROUTE-PROGRESSION, include gamecube.rival_host_tests; it is mandatory regardless.
          - If the source ranges are insufficient, the task is blocked by a real dependency, or a complete safe patch cannot fit the limits, do not fabricate code. Submit no patch and explain the specific blocker in your final text.

          FINAL RESPONSE
          - The workflow, not you, creates the machine-readable PROGRESS/BLOCKED report from the verified PR result.
          - State what you changed in the proposal or the exact blocker. Do not invent PR numbers, commit SHAs, test results or merge status.
          PROMPT
          )"

          PROMPT="${PROMPT}"$'\n\n'"${AUTONOMOUS_CONTEXT}"
          PROMPT+=$'\n\nSAME-RUN EXECUTION FACTS:\n'
          PROMPT+="- OpenRouter owner/free-only preflight: ${OPENROUTER_PREFLIGHT_ALLOWED:-unknown}"$'\n'
          PROMPT+="- OpenRouter bearer authentication: ${OPENROUTER_AUTH_OUTCOME:-unknown}"$'\n'
          PROMPT+="- Workflow-owned scoped GitHub writer token minted: ${GITHUB_APP_TOKEN_OUTCOME:-unknown}"$'\n'
          PROMPT+="- The writer token is never exposed to the model or local MCP process."
          prompt_length="$(printf '%s' "$PROMPT" | wc -m | tr -d ' ')"
          if (( prompt_length > 7000 )); then
            echo "::error::OpenRouter prompt exceeds the 7,000-character safety ceiling; no model request was sent."
            exit 2
          fi
          echo "OpenRouter final prompt size: $prompt_length characters."

          echo "provider_request_started=true" >> "$GITHUB_OUTPUT"
          python3 - "$PROMPT" "$RUNNER_TEMP/openrouter-provider-output.txt" "$REPO_ROOT" <<'PY'
          import os
          import re
          import signal
          import subprocess
          import sys

          prompt, output_path, workspace = sys.argv[1:]
          command = [
              "timeout", "--signal=TERM", "--kill-after=5s", "180s",
              "opencode", "run", "--model", "openrouter/openrouter/free",
              "--auto", "--dir", workspace, prompt,
          ]
          terminal_provider_error = re.compile(
              r"(free-models-per-day|free-models-per-minute|rate[_ ]limit exceeded|"
              r"too many requests|HTTP\s*429|status(?:\s*code)?\s*[:=]?\s*429|"
              r"tokens per minute\s*\(TPM\)|request too large for model|"
              r"missing authentication header|HTTP\s*401|status(?:\s*code)?\s*[:=]?\s*401)",
              re.IGNORECASE,
          )
          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1,
              start_new_session=True,
          )

          def stop_process_group():
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()

          def handle_shutdown(signum, _frame):
              stop_process_group()
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, handle_shutdown)
          signal.signal(signal.SIGINT, handle_shutdown)

          with open(output_path, "w", encoding="utf-8") as output:
              assert process.stdout is not None
              for line in process.stdout:
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  output.write(line)
                  output.flush()
                  if terminal_provider_error.search(line):
                      print(
                          "OpenRouter throttle/quota/auth refusal detected; terminating OpenCode after the first refusal.",
                          flush=True,
                      )
                      stop_process_group()
                      sys.exit(75)

          status = process.wait()
          if status in (124, 137):
              print("OpenRouter invocation reached its 180-second hard limit.", flush=True)
          sys.exit(status)
          PY

      - name: Verify, test and publish the OpenRouter patch proposal
        id: execute_provider_cycle
        if: steps.run_opencode.outcome == 'success' && steps.bounded_inputs.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          SOURCE_ROOT: ${{ steps.bounded_inputs.outputs.source_root }}
          POLICY_ROOT: ${{ steps.bounded_inputs.outputs.policy_root }}
          PROPOSAL_PATH: ${{ steps.bounded_inputs.outputs.proposal_path }}
          ALLOWLIST_REPORT: ${{ steps.bounded_inputs.outputs.allowlist_report }}
          TASK_ID: ${{ inputs.task_id }}
          BASE_SHA: ${{ steps.bounded_inputs.outputs.base_sha }}
          POLICY_SHA: ${{ steps.bounded_inputs.outputs.policy_sha }}
          PREFLIGHT_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
        run: |
          set -euo pipefail
          python3 "$REPO_ROOT/tools/execute_autonomous_provider_cycle.py" \
            --source-root "$SOURCE_ROOT" \
            --policy-root "$POLICY_ROOT" \
            --proposal "$PROPOSAL_PATH" \
            --allowlist-report "$ALLOWLIST_REPORT" \
            --verified-report "$RUNNER_TEMP/boonta-verified-report.json" \
            --plan "$RUNNER_TEMP/boonta-delivery-plan.json" \
            --cycle-report "$RUNNER_TEMP/opencode-cycle-report.txt" \
            --task-id "$TASK_ID" \
            --base-sha "$BASE_SHA" \
            --policy-sha "$POLICY_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --preflight-allowed "$PREFLIGHT_ALLOWED"

      - name: Validate OpenRouter autonomous cycle report
        id: validate_report
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.run_opencode.outcome == 'success' && steps.execute_provider_cycle.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          REPORT_PATH: ${{ runner.temp }}/opencode-cycle-report.txt
          PRE_CYCLE_PR_HEADS: ${{ steps.snapshot_pr_heads.outputs.heads }}
          PRE_CYCLE_PR_SNAPSHOT_AT: ${{ steps.snapshot_pr_heads.outputs.snapshot_at }}
          OPENROUTER_PREFLIGHT_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          OPENROUTER_AUTH_OUTCOME: ${{ steps.openrouter_auth_check.outcome }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
          SELECTED_TASK_ID: ${{ inputs.resume_mode == true && inputs.resume_task_id || inputs.task_id }}
          SELECTED_TASK_TARGET_BRANCH: ${{ inputs.resume_mode == true && inputs.resume_task_target_branch || inputs.task_target_branch }}
        with:
          script: |
            const fs = require('fs');
            const { findBlockedReportContradictions, validateAutonomousCycleReport } =
              require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            const { bindCycleReportToReservedTask } =
              require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            let summary;
            try {
              const rawSummary = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
              summary = bindCycleReportToReservedTask(rawSummary, process.env.SELECTED_TASK_ID, process.env.SELECTED_TASK_TARGET_BRANCH);
            } catch (error) {
              core.setFailed('OpenRouter report could not be bound to the reserved task: ' + error.message);
              return;
            }
            const lines = summary.split(/\r?\n/);
            const statusLines = lines.filter((line) => line.startsWith('BOONTA_CYCLE_STATUS:'));
            if (statusLines.length === 1 && statusLines[0] === 'BOONTA_CYCLE_STATUS: BLOCKED') {
              const blocker = lines.filter((line) => line.startsWith('BOONTA_CYCLE_BLOCKER: ')).join(' ');
              const nextAction = lines.filter((line) => line.startsWith('BOONTA_CYCLE_NEXT_ACTION: ')).join(' ');
              const blockedText = blocker + ' ' + nextAction;
              const contradictions = findBlockedReportContradictions(blockedText, {
                openRouterAuthSucceeded:
                  process.env.OPENROUTER_PREFLIGHT_ALLOWED === 'true' &&
                  process.env.OPENROUTER_AUTH_OUTCOME === 'success',
                githubAppTokenMinted: process.env.GITHUB_APP_TOKEN_OUTCOME === 'success'
              });
              if (contradictions.length > 0) {
                core.setFailed('BLOCKED report contradicts same-run preflight evidence: ' + contradictions.join('; '));
                return;
              }
            }
            await validateAutonomousCycleReport({
              github,
              context,
              core,
              summary,
              baseline: JSON.parse(process.env.PRE_CYCLE_PR_HEADS || '{}'),
              snapshotAt: process.env.PRE_CYCLE_PR_SNAPSHOT_AT,
              expectedTaskId: process.env.SELECTED_TASK_ID,
              expectedBase: process.env.SELECTED_TASK_TARGET_BRANCH,
              provider: 'OpenRouter'
            });

      - name: Sync the single-task daily backoff marker
        id: sync_task_queue_state
        if: steps.validate_report.outcome == 'success' && (steps.validate_report.outputs.cycle_status == 'blocked' || inputs.task_blocked_active == true)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          CYCLE_STATUS: ${{ steps.validate_report.outputs.cycle_status }}
          BLOCKED_FINGERPRINT: ${{ steps.validate_report.outputs.blocked_fingerprint }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const cycleStatus = process.env.CYCLE_STATUS || '';
            const isBlocked = cycleStatus === 'blocked';
            const fingerprint = process.env.BLOCKED_FINGERPRINT || '';
            if (isBlocked && !/^[0-9a-f]{16}$/.test(fingerprint)) {
              core.setFailed('A valid BLOCKED report must include its deterministic task fingerprint before persistence.');
              return;
            }
            if (!isBlocked && cycleStatus !== 'progress') {
              core.info('No validated task state to persist.');
              return;
            }
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = isBlocked
              ? '<!-- BOONTA_TASK_BLOCKED_COOLDOWN: ' + todayUtc + ' ' + fingerprint + ' -->'
              : '<!-- BOONTA_TASK_BLOCKED_COOLDOWN_CLEARED: ' + todayUtc + ' -->';
            const body = [
              marker,
              isBlocked ? '## Single active task — daily backoff' : '## Single active task — backoff cleared',
              '',
              isBlocked
                ? 'A valid BLOCKED report was verified for the single active task on UTC date ' + todayUtc + '.'
                : 'A cycle-fresh PROGRESS report passed exact-head validation on UTC date ' + todayUtc + '.',
              isBlocked
                ? 'Fingerprint: ' + fingerprint + '. Scheduled provider calls are paused for the remainder of this UTC day to avoid repeating the same blocked task.'
                : 'The previous same-day task backoff is cleared. The next eligible scheduled cycle may select work again.',
              'A valid BLOCKED report is not a provider failure; this task backoff does not record a provider cooldown.',
              'An owner-authorized manual dispatch or qualifying main push may re-evaluate the task before the next UTC day.',
              '',
              '[Inspect the validated cycle](' + process.env.RUN_URL + ')',
            ].join('\\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes('<!-- BOONTA_TASK_BLOCKED_COOLDOWN')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(isBlocked
                ? 'Updated the single persistent same-day task backoff marker.'
                : 'Cleared the single persistent same-day task backoff marker.');
            } else if (isBlocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the single persistent same-day task backoff marker.');
            } else {
              core.info('No previous task backoff marker needed clearing.');
            }
      - name: Record same-day OpenRouter cooldown after quota, authentication or invocation failure
        id: record_openrouter_cooldown
        if: always() && (steps.openrouter_auth_check.outcome == 'failure' || steps.openrouter_auth_check.outputs.quota_available == 'false' || (steps.run_opencode.outputs.provider_request_started == 'true' && steps.run_opencode.outcome != 'success' && steps.run_opencode.outcome != 'skipped') || steps.validate_report.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          QUOTA_AVAILABLE: ${{ steps.openrouter_auth_check.outputs.quota_available }}
          QUOTA_REMAINING: ${{ steps.openrouter_auth_check.outputs.quota_remaining }}
          QUOTA_REQUIRED: ${{ steps.openrouter_auth_check.outputs.quota_required }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = '<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN: ' + todayUtc + ' -->';
            const quotaAvailable = process.env.QUOTA_AVAILABLE || 'unknown';
            const quotaRemaining = process.env.QUOTA_REMAINING || '0';
            const quotaRequired = process.env.QUOTA_REQUIRED || '3';
            const reason = quotaAvailable === 'false'
              ? 'The OpenRouter /api/v1/key preflight reported ' + quotaRemaining + ' Free-model request(s) remaining, below the ' + quotaRequired + '-request reserve for the bounded OpenCode cycle.'
              : 'The OpenRouter Free authentication, model invocation or cycle-report validation failed.';
            const body = [
              marker,
              '## OpenRouter Free daily failure cooldown',
              '',
              reason + ' Recorded on UTC date ' + todayUtc + '.',
              'Further fallback cycles on this UTC date will skip another OpenRouter request. A fresh attempt is allowed on the next UTC date.',
              'This marker does not change provider settings, billing, secrets, quota, or owner attestations.',
              '',
              '[Inspect the failed OpenRouter invocation](' + process.env.RUN_URL + ')',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated the single persistent OpenRouter cooldown marker on issue #' + issueNumber + '.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the persistent OpenRouter cooldown marker on issue #' + issueNumber + '.');
            }
      - name: Dispatch Groq in a separate cooldown-gated workflow run
        if: always() && steps.record_openrouter_cooldown.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number || 226 }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const marker = '<!-- BOONTA_PROVIDER_FALLBACK_DISPATCHED: openrouter ' + context.runId + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info('OpenRouter fallback dispatch was already sent for this workflow run.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'boonta-provider-fallback',
              client_payload: {
                origin: 'boonta-provider-fallback',
                failed_provider: 'openrouter',
                source_run_id: context.runId,
                source_run_url: process.env.RUN_URL,
              },
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                marker,
                'The OpenRouter cooldown was persisted. A separate repository_dispatch run was started so global preflight can verify both earlier cooldowns and select Groq Free.',
                '[Source run](' + process.env.RUN_URL + ')',
              ].join('\n'),
            });
            core.notice('Started a separate Groq fallback run; it must pass fresh cooldown and task preflight.');
      - name: Fail visibly if the OpenRouter fallback did not complete
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          GATE_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_pr_heads.outcome }}
          INVOCATION_OUTCOME: ${{ steps.run_opencode.outcome }}
          REPORT_OUTCOME: ${{ steps.validate_report.outcome }}
          QUOTA_AVAILABLE: ${{ steps.openrouter_auth_check.outputs.quota_available }}
          QUOTA_REMAINING: ${{ steps.openrouter_auth_check.outputs.quota_remaining }}
          QUOTA_REQUIRED: ${{ steps.openrouter_auth_check.outputs.quota_required }}
        with:
          script: |
            const allowed = process.env.GATE_ALLOWED === 'true';
            const quotaAvailable = process.env.QUOTA_AVAILABLE || 'unknown';
            const outcomes = {
              snapshot: process.env.SNAPSHOT_OUTCOME || 'skipped',
              invocation: process.env.INVOCATION_OUTCOME || 'skipped',
              report: process.env.REPORT_OUTCOME || 'skipped',
            };
            if (!allowed) {
              core.setFailed('OpenRouter fallback did not execute: its independent Free-only/owner gate blocked the request. No provider request was sent; the separate Groq Free fallback may now be evaluated.');
            } else if (quotaAvailable === 'false') {
              const quotaRemaining = process.env.QUOTA_REMAINING || '0';
              const quotaRequired = process.env.QUOTA_REQUIRED || '3';
              core.setFailed('OpenRouter Free daily request reserve for one bounded OpenCode cycle is insufficient (remaining: ' + quotaRemaining + '; required: ' + quotaRequired + '). No inference request was sent; the daily cooldown was recorded. Retry after the UTC reset; no credits or paid route are permitted.');
            } else if (outcomes.snapshot !== 'success' || outcomes.invocation !== 'success' || outcomes.report !== 'success') {
              core.setFailed('OpenRouter fallback did not complete. Required outcomes: quota preflight, PR snapshot, actual OpenCode invocation, and report validation must all be success. Observed: ' + JSON.stringify(outcomes));
            } else {
              core.info('OpenRouter fallback passed all execution postconditions: gate, actual invocation, and validated report.');
            }
