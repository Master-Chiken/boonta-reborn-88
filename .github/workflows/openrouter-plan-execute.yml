name: OpenRouter Free autonomous fallback

on:
  workflow_call:
    outputs:
      invocation_outcome:
        description: "Outcome of the actual OpenRouter/OpenCode invocation step, independent of report validation."
        value: ${{ jobs.openrouter-plan-execute.outputs.invocation_outcome }}
      report_outcome:
        description: "Outcome of the OpenRouter autonomous report validator."
        value: ${{ jobs.openrouter-plan-execute.outputs.report_outcome }}
      cycle_status:
        description: "Validated OpenRouter cycle status: progress or blocked."
        value: ${{ jobs.openrouter-plan-execute.outputs.cycle_status }}
      task_queue_state_outcome:
        description: "Outcome of persisting or clearing the single-task daily backoff marker."
        value: ${{ jobs.openrouter-plan-execute.outputs.task_queue_state_outcome }}
    inputs:
      autonomous_mode:
        type: boolean
        required: true
      issue_number:
        type: number
        required: true
      task_id:
        type: string
        required: false
      task_title:
        type: string
        required: false
      task_target_branch:
        type: string
        required: false
      task_description:
        type: string
        required: false
      task_blocked_active:
        type: boolean
        required: false
        default: false

concurrency:
  group: boonta-single-writer
  cancel-in-progress: false

jobs:
  openrouter-plan-execute:
    name: One bounded OpenRouter Free research/engineering cycle
    outputs:
      invocation_outcome: ${{ steps.run_opencode.outcome }}
      report_outcome: ${{ steps.validate_report.outcome }}
      cycle_status: ${{ steps.validate_report.outputs.cycle_status }}
      task_queue_state_outcome: ${{ steps.sync_task_queue_state.outcome }}
    if: inputs.autonomous_mode == true && inputs.issue_number == 226
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Check same-day OpenRouter failure cooldown
        id: openrouter_cooldown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              since: todayUtc + 'T00:00:00Z',
              per_page: 100,
            });
            const markerComment = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN:'));
            const match = markerComment?.body?.match(/<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/);
            const failedOn = match?.[1] || '';
            const active = failedOn === todayUtc;
            core.setOutput('active', String(active));
            core.setOutput('failed_on', failedOn);
            if (active) {
              core.notice('OpenRouter Free already failed during UTC day ' + todayUtc + '; skip another request until the next UTC day.');
            } else {
              core.info('No active same-day OpenRouter Free failure cooldown.');
            }
      - name: Require explicit OpenRouter Free and autonomous owner gates
        id: free_tier_guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.OPENROUTER_FREE_TIER_CONFIRMED }}
          GEMINI_AUTONOMOUS_ENABLED: ${{ vars.GEMINI_AUTONOMOUS_ENABLED }}
          AUTONOMOUS_MODE: ${{ inputs.autonomous_mode }}
          AUTONOMOUS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          OPENROUTER_COOLDOWN_ACTIVE: ${{ steps.openrouter_cooldown.outputs.active }}
          OPENROUTER_COOLDOWN_DATE: ${{ steps.openrouter_cooldown.outputs.failed_on }}
        run: |
          set -euo pipefail
          set +x
          reason="none"
          if [[ "${OPENROUTER_FREE_TIER_CONFIRMED:-}" != "true" ]]; then
            reason="OPENROUTER_FREE_TIER_CONFIRMED must equal true only after the owner verifies the OpenRouter Free account, zero payment methods/credits, and no paid usage."
          elif [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            reason="The OPENROUTER_API_KEY_02 (preferred) or legacy OPENROUTER_API_KEY repository secret is missing."
          elif [[ "${GEMINI_AUTONOMOUS_ENABLED:-}" != "true" ]]; then
            reason="The master GEMINI_AUTONOMOUS_ENABLED owner gate is not exactly true."
          elif [[ "${AUTONOMOUS_MODE:-false}" != "true" || "${AUTONOMOUS_ISSUE_NUMBER:-}" != "226" ]]; then
            reason="OpenRouter fallback is restricted to autonomous issue #226."
          elif [[ "${CALLER_WORKFLOW:-}" != "Boonta Autonomous Loop" || "${CALLER_REF:-}" != "refs/heads/main" ]]; then
            reason="OpenRouter fallback may only be called by Boonta Autonomous Loop from main."
          elif [[ "${CALLER_EVENT:-}" != "schedule" && "${CALLER_EVENT:-}" != "workflow_dispatch" && "${CALLER_EVENT:-}" != "push" ]]; then
            reason="Unsupported caller event; only schedule, owner-dispatched workflow, or owner-authorized main push is allowed."
          elif [[ "${OPENROUTER_COOLDOWN_ACTIVE:-}" == "true" ]]; then
            reason="OpenRouter Free already failed an autonomous invocation on UTC date ${OPENROUTER_COOLDOWN_DATE:-today}; skip repeated requests until the next UTC day. No provider request will be made."
          elif [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            reason="The scoped GitHub App ID variable or private-key secret is missing."
          fi

          if [[ "$reason" != "none" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenRouter Free fallback skipped safely"
              echo
              echo "$reason"
              echo "No OpenRouter request, repository write, or paid fallback was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
            {
              echo "## OpenRouter Free fallback gate passed"
              echo
              echo "Only the fixed openrouter/free route is configured. No paid model/provider fallback is available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify OpenRouter Free key authentication without inference
        id: openrouter_auth_check
        if: steps.free_tier_guard.outputs.allowed == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Accept: application/json" \
            https://openrouter.ai/api/v1/key)"
          jq -e '.data.is_free_tier == true' <<< "$response" >/dev/null
          quota_remaining="$(jq -er '.data.free_model_daily_requests.remaining | numbers' <<< "$response")"
          if [[ ! "$quota_remaining" =~ ^[0-9]+$ ]]; then
            echo "OpenRouter returned an invalid free_model_daily_requests.remaining value; refusing model inference." >&2
            exit 1
          fi
          # Match the maximum configured OpenCode build steps before allowing inference.
          MIN_REQUESTS_PER_CYCLE=8
          echo "quota_remaining=$quota_remaining" >> "$GITHUB_OUTPUT"
          echo "quota_required=$MIN_REQUESTS_PER_CYCLE" >> "$GITHUB_OUTPUT"
          if (( quota_remaining >= MIN_REQUESTS_PER_CYCLE )); then
            echo "quota_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "quota_available=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## OpenRouter key authentication: passed"
            echo
            echo "- OpenRouter accepted the bearer key and reports is_free_tier=true."
            echo "- Free-model requests remaining in the current UTC day: $quota_remaining."
            echo "- Minimum reserve for one bounded OpenCode cycle: $MIN_REQUESTS_PER_CYCLE requests."
            if (( quota_remaining >= MIN_REQUESTS_PER_CYCLE )); then
              echo "- The daily Free-only balance meets the bounded cycle reserve; the guarded model step may proceed."
            else
              echo "- The daily Free-only balance is below the bounded cycle reserve; model inference is blocked before any provider request."
              echo "- The counter is daily and UTC-based; no credits or paid fallback will be used."
            fi
            echo "- This was a GET-only check; the key value and account details were not printed."
          } >> "$GITHUB_STEP_SUMMARY"
          unset response quota_remaining MIN_REQUESTS_PER_CYCLE

      - name: Revalidate selected task after acquiring the shared writer slot
        id: fresh_task_guard
        if: inputs.autonomous_mode == true && steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const taskId = process.env.TASK_ID || '';
            const targetBranch = process.env.TASK_TARGET_BRANCH || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const failClosed = (reason) => {
              core.setOutput('allowed', 'false');
              core.setFailed('Fresh task revalidation blocked before provider invocation: ' + reason);
            };
            
            if (issueNumber !== 226) {
              failClosed('autonomous task execution is restricted to canonical issue #226');
              return;
            }
            if (!/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(taskId)) {
              failClosed('selected task ID is missing or malformed');
              return;
            }
            if (!['main', 'dev'].includes(targetBranch)) {
              failClosed('selected target branch must be main or dev');
              return;
            }
            
            // This GET-only check runs after the shared boonta-single-writer concurrency
            // slot has been acquired. It refreshes the earlier global selection so a run
            // that waited in the queue cannot act on a task that changed meanwhile.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main'
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              failClosed('canonical compact task ledger is missing or not a base64 file');
              return;
            }
            
            let ledgerSummary;
            try {
              ledgerSummary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            } catch (error) {
              failClosed('canonical compact task ledger is not valid JSON');
              return;
            }
            if (
              ledgerSummary.schema_version !== 2 ||
              ledgerSummary.source !== 'docs/automation/task-ledger.json' ||
              !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(ledgerSummary.updated_at || '') ||
              ledgerSummary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(ledgerSummary.tasks)
            ) {
              failClosed('canonical compact task ledger schema or one-active-task policy is invalid');
              return;
            }
            
            const taskIds = ledgerSummary.tasks.map((task) => task?.task_id);
            if (
              taskIds.some((id) => typeof id !== 'string' || !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(id)) ||
              new Set(taskIds).size !== taskIds.length
            ) {
              failClosed('canonical compact task ledger contains missing, invalid or duplicate task IDs');
              return;
            }
            const activeTasks = ledgerSummary.tasks.filter((task) => task.status === 'active');
            if (activeTasks.length > 1) {
              failClosed('canonical task ledger violates the one-active-task policy');
              return;
            }
            const matches = ledgerSummary.tasks.filter((task) => task.task_id === taskId);
            if (matches.length !== 1) {
              failClosed('the selected task is no longer present exactly once in the canonical ledger');
              return;
            }
            const task = matches[0];
            const activationBootstrap = taskId === 'AUTOMATION-LEDGER-ACTIVATION';
            const eligibleStatus = activationBootstrap
              ? task.status === 'blocked' && activeTasks.length === 0
              : task.status === 'active' && activeTasks.length === 1 && activeTasks[0].task_id === taskId;
            if (!eligibleStatus) {
              failClosed('the selected task status or active-task reservation changed while this run waited');
              return;
            }
            if (
              task.target_branch !== targetBranch ||
              !task.title?.trim() ||
              !task.question_excerpt?.trim() ||
              !task.next_action_excerpt?.trim() ||
              !Array.isArray(task.acceptance_criteria_excerpt) ||
              task.acceptance_criteria_excerpt.length === 0 ||
              !Array.isArray(task.platform_scope) ||
              task.platform_scope.length === 0
            ) {
              failClosed('the selected task no longer matches its canonical branch or complete execution context');
              return;
            }
            if (task.pr_url || task.head_sha) {
              failClosed('the selected task already has PR or HEAD evidence and must be reconciled before another run');
              return;
            }
            
            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              failClosed('open PR inventory reached the 100-item safety ceiling');
              return;
            }
            const markerLine = 'BOONTA_TASK_ID: ' + taskId;
            const duplicate = openPullRequests.find((pull) =>
              (pull.body || '').split(/\r?\n/).some((line) => line.trim() === markerLine)
            );
            if (duplicate) {
              failClosed('open PR #' + duplicate.number + ' already represents this exact task');
              return;
            }
            
            core.setOutput('allowed', 'true');
            core.info(
              'Fresh task revalidation passed after the shared writer slot: ' +
              taskId + ' -> ' + targetBranch + '; no matching open PR or stale ledger state.'
            );
      - name: Mint scoped GitHub App token
        id: mint_identity_token
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Checkout the protected default branch
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: main
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Checkout selected task target for bounded source context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: ${{ inputs.task_target_branch }}
          path: .boonta-target-source
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Install pinned OpenCode CLI
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Snapshot open PR heads before OpenRouter cycle
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true'
        id: snapshot_pr_heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'Master-Chiken',
              repo: 'boonta-reborn-88',
              state: 'open',
              per_page: 100
            });
            const snapshotAt = new Date().toISOString();
            const baseline = Object.fromEntries(pulls.map((pr) => [String(pr.number), pr.head.sha]));
            core.setOutput('heads', JSON.stringify(baseline));
            core.setOutput('snapshot_at', snapshotAt);
            core.info('Captured ' + pulls.length + ' open PR head(s) for cycle-fresh validation at ' + snapshotAt + '.');

      - name: Prepare the exact selected task and repository root before inference
        id: prepare_context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success'
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
        run: |
          set -euo pipefail
          repo_root=''
          for candidate in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/boonta-reborn-88"; do
            [[ -d "$candidate" ]] || continue
            candidate="$(cd "$candidate" && pwd -P)"
            if [[ -f "$candidate/tools/build_autonomous_context.py" && -f "$candidate/docs/REVERSE_ENGINEERING_FIRST.md" && -f "$candidate/docs/automation/AUTONOMOUS_CONTEXT_BUDGET.md" && -f "$candidate/docs/automation/task-ledger-summary.json" ]]; then
              git_root="$(git -C "$candidate" rev-parse --show-toplevel)"
              if [[ "$git_root" == "$candidate" ]]; then repo_root="$candidate"; break; fi
            fi
          done
          if [[ -z "$repo_root" ]]; then
            echo "::error::Could not identify the exact checked-out Boonta repository root; no OpenRouter inference was sent."
            exit 1
          fi
          context="$(python3 "$repo_root/tools/build_autonomous_context.py" --root "$repo_root" --task-id "$TASK_ID" --task-title "$TASK_TITLE" --target-branch "$TASK_TARGET_BRANCH" --task-context "$TASK_DESCRIPTION" --source-root "$GITHUB_WORKSPACE/.boonta-target-source" --max-chars 2800 --max-task-context 1100 --max-source-chars 1400)"
          {
            printf 'repo_root=%s\n' "$repo_root"
            echo 'context<<BOONTA_CONTEXT_EOF'
            printf '%s\n' "$context"
            echo 'BOONTA_CONTEXT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run OpenCode through the OpenRouter Free route
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.prepare_context.outcome == 'success'
        id: run_opencode
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_02 || secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token }}
          OPENROUTER_PREFLIGHT_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          OPENROUTER_AUTH_OUTCOME: ${{ steps.openrouter_auth_check.outcome }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
          OPENCODE_EXPERIMENTAL_CODE_MODE: 'false'
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          AUTONOMOUS_CONTEXT: ${{ steps.prepare_context.outputs.context }}
        run: |
          set -euo pipefail
          set +x

          # OpenCode 1.19.5 reads provider credentials from OPENCODE_AUTH_CONTENT.
          # Supply the existing secret as the explicit OpenRouter API auth record.
          export OPENCODE_AUTH_CONTENT
          OPENCODE_AUTH_CONTENT="$(jq -cn --arg key "$OPENROUTER_API_KEY" '{openrouter: {type: "api", key: $key}}')"

          # This config exposes only the explicitly allow-listed GitHub MCP tools.
          # Shell execution is denied; repository changes must use branch/PR MCP tools.
          cat > "$RUNNER_TEMP/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "openrouter/openrouter/free",
            "small_model": "openrouter/openrouter/free",
            "enabled_providers": ["openrouter"],
            "agent": {
              "build": {
                "steps": 8,
                "permission": {
                  "task": {
                    "*": "deny"
                  }
                }
              }
            },
            "mcp": {
              "github": {
                "type": "local",
                "command": [
                  "docker", "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "-e", "GITHUB_TOOLS",
                  "ghcr.io/github/github-mcp-server:v0.27.0"
                ],
                "environment": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "{env:GITHUB_TOKEN}",
                  "GITHUB_TOOLS": "get_file_contents,create_branch,push_files,create_pull_request"
                },
                "enabled": true,
                "timeout": 60000
              }
            },
            "permission": {
              "*": "allow",
              "bash": "deny",
              "read": "deny",
              "edit": "deny",
              "glob": "deny",
              "grep": "deny",
              "list": "deny"
            }
          }
          JSON

          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"

          PROMPT="$(cat <<'PROMPT'
          You are the €0-only OpenRouter Free agent. Execute only the preflight-selected task.
          
          SAFETY
          - No paid model/provider fallback is available. €0 only; no billing/credits, key, secret, provider or settings changes.
          - One task/writer/branch/PR. Never write main/dev, merge, auto-merge, force-push or delete refs.
          - Stop on context, TPM, rate-limit, quota or authentication errors; never retry the same request.
          - Never upload commercial ROMs, discs, binaries or extracted game data. Preserve clean-room provenance.
          
          TASK
          AUTHORITATIVE SELECTED TASK
          - Use exactly this task from docs/automation/task-ledger-summary.json. The preloaded question, acceptance_criteria_excerpt and next action are authoritative. Do not substitute another task.
          - Global preflight is authoritative: task pr_url/head_sha are empty; no matching open PR exists. Do not search PR history or treat older merged automation PRs as current-cycle evidence.
          - Do not invoke the Explore Agent, any subagent, Task agent, planning agent or repo-wide discovery. Do not list root or reread summary, ledger or budget.
          - Do not enumerate all PRs/branches or retrieve attachments, media, binaries or the large route dossier.
          - Keep newly retrieved text below 1,000 tokens total; target below 700 tokens. Read at most one exact file from the task's "Read-only source paths" allow-list on the selected target branch. Never list directories, guess paths or retrieve binaries/media.
          - The canonical task reservation, acceptance criteria and exact read-path allow-list are preloaded. The trusted context includes bounded excerpts from every exact task path; use them before the one permitted full-file read. Only those paths may be read; if none is usable, stop with a specific blocker.
          - For gameplay tasks only, reuse PR #327 at 69deb6778f9383887118803428e7014686865a83. PRs #317/#318/#319 are superseded. Do not reopen, replay or recreate that chain. This is not relevant to the current automation-only activation task.
          - If the single permitted direct source lookup fails, stop and report the exact missing path rather than spending steps on directory discovery.
          
          TOOLS / DELIVERY
          - Model-visible top-level tools: github_get_file_contents, github_create_branch, github_push_files and github_create_pull_request.
          - OpenCode 1.19.5 prefixes raw MCP names with github_. Direct MCP only; no Code Mode, shell or filesystem.
          - The global preflight already completed the exact task reservation and open-PR duplicate check. Do not spend model steps searching PR history, rereading the ledger, or rereading this budget document.
          - Use at most four tool calls: optionally read one directly relevant implementation/test file; create one branch from selected base; call push_files exactly once with one coherent patch; create one non-draft PR.
          - No PR search/readback. Use create_pull_request result URL/head_sha; the shared report validator re-fetches the live PR and checks markers, base, current head and CI.
          - Patch must advance task criteria. Docs-only changes require a verified blocker. PR body must have standalone lines BOONTA_TASK_ID: <exact selected task ID> and BOONTA_TASK_TARGET_BRANCH: <exact target branch>.
          
          FINAL REPORT
          - The shell appends the exact reserved task ID and target branch below. NO PROSE OR MARKDOWN FENCES. Output only machine-readable lines; copy the exact reserved task ID and evidence base appended below.
          - Choose one status. BLOCKED omits evidence and includes one BOONTA_CYCLE_BLOCKER plus one BOONTA_CYCLE_NEXT_ACTION.
          - PROGRESS uses the new same-repository PR URL and exact head_sha from create_pull_request. Never guess or report planned work.
          PROMPT
          )"

          if [[ -z "${TASK_ID:-}" || -z "${TASK_TITLE:-}" || -z "${AUTONOMOUS_CONTEXT:-}" || -z "${REPO_ROOT:-}" || ! "${TASK_TARGET_BRANCH:-}" =~ ^(main|dev)$ ]]; then
            echo "::error::Global preflight did not pass a complete selected task context; no OpenRouter request was sent."
            exit 2
          fi
          if [[ -z "${REPO_ROOT:-}" || -z "${AUTONOMOUS_CONTEXT:-}" ]]; then
            echo "::error::Validated repository/task context is missing; no OpenRouter inference was sent."
            exit 2
          fi
          PROMPT="${PROMPT}"$'\n\n'
          PROMPT+="${AUTONOMOUS_CONTEXT}"

          PROMPT="${PROMPT}

          SAME-RUN VERIFIED EXECUTION FACTS (authoritative workflow metadata):
          - OpenRouter owner/free-only preflight: ${OPENROUTER_PREFLIGHT_ALLOWED:-unknown}
          - GET /api/v1/key authentication, including is_free_tier=true: ${OPENROUTER_AUTH_OUTCOME:-unknown}
          - Scoped GitHub App token creation: ${GITHUB_APP_TOKEN_OUTCOME:-unknown}
          These facts apply only to this invocation and override older ledger summaries, issue comments, documentation and prior-run logs. If preflight is true and auth outcome is success, do not report a missing/invalid OpenRouter key, HTTP 401 or failed Free-tier authentication. Never ask the owner to replace the key. Do not base such a request on older notes. Execute only the task selected by the global preflight and either produce a valid cycle-fresh PR or identify a different dependency supported by current evidence."
          REPORT_TASK_ID="BOONTA_CYCLE_TASK_ID: ${TASK_ID}"
          REPORT_TARGET_BRANCH="BOONTA_CYCLE_EVIDENCE_BASE: ${TASK_TARGET_BRANCH}"
          PROMPT+=$'\n\n'"${REPORT_TASK_ID}"
          PROMPT+=$'\nBOONTA_CYCLE_STATUS: PROGRESS or BLOCKED'
          PROMPT+=$'\nBOONTA_CYCLE_EVIDENCE: https://github.com/Master-Chiken/boonta-reborn-88/pull/<number> @ <exact 40-character head SHA>'
          PROMPT+=$'\n'"${REPORT_TARGET_BRANCH}"
          PROMPT+=$'\nFor BLOCKED, omit the two evidence lines and output exactly one BOONTA_CYCLE_BLOCKER and one BOONTA_CYCLE_NEXT_ACTION.'

          if (( ${#PROMPT} > 7000 )); then
            echo "::error::OpenRouter prompt exceeds the 7,000-character safety ceiling; no model request was sent."
            exit 2
          fi
          echo "OpenRouter final prompt size: ${#PROMPT} characters."

          # Mark the boundary between local preparation and an actual provider invocation.
          # Local prompt/context guards must never create a provider cooldown.
          echo "provider_request_started=true" >> "$GITHUB_OUTPUT"
          # Stop OpenCode on the first explicit provider throttle/quota/auth refusal.
          # This prevents internal retries from multiplying a known terminal failure.
          python3 - "$PROMPT" "$RUNNER_TEMP/opencode-cycle-report.txt" "$REPO_ROOT" <<'PY'
          import os
          import re
          import signal
          import subprocess
          import sys

          prompt, report_path, workspace = sys.argv[1:]
          command = [
              "timeout", "--signal=TERM", "--kill-after=5s", "180s",
              "opencode", "run", "--model", "openrouter/openrouter/free",
              "--auto", "--dir", workspace, prompt,
          ]
          terminal_provider_error = re.compile(
              r"(free-models-per-day|free-models-per-minute|rate[_ ]limit exceeded|"
              r"too many requests|HTTP\s*429|status(?:\s*code)?\s*[:=]?\s*429|"
              r"tokens per minute\s*\(TPM\)|request too large for model|"
              r"missing authentication header|HTTP\s*401|status(?:\s*code)?\s*[:=]?\s*401)",
              re.IGNORECASE,
          )
          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1,
              start_new_session=True,
          )

          def stop_process_group():
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()

          def handle_shutdown(signum, _frame):
              stop_process_group()
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, handle_shutdown)
          signal.signal(signal.SIGINT, handle_shutdown)

          with open(report_path, "w", encoding="utf-8") as report:
              assert process.stdout is not None
              for line in process.stdout:
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  report.write(line)
                  report.flush()
                  if terminal_provider_error.search(line):
                      print(
                          "OpenRouter throttle/quota/auth refusal detected; terminating "
                          "OpenCode immediately after the first refusal. Daily cooldown will be recorded.",
                          flush=True,
                      )
                      stop_process_group()
                      sys.exit(75)

          invocation_status = process.wait()
          if invocation_status in (124, 137):
              print(
                  "OpenRouter invocation reached its 180-second hard limit; daily cooldown will be recorded.",
                  flush=True,
              )
          sys.exit(invocation_status)
          PY


      - name: Validate OpenRouter autonomous cycle report
        id: validate_report
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.openrouter_auth_check.outcome == 'success' && steps.openrouter_auth_check.outputs.quota_available == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.run_opencode.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          REPORT_PATH: ${{ runner.temp }}/opencode-cycle-report.txt
          PRE_CYCLE_PR_HEADS: ${{ steps.snapshot_pr_heads.outputs.heads }}
          PRE_CYCLE_PR_SNAPSHOT_AT: ${{ steps.snapshot_pr_heads.outputs.snapshot_at }}
          OPENROUTER_PREFLIGHT_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          OPENROUTER_AUTH_OUTCOME: ${{ steps.openrouter_auth_check.outcome }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
          SELECTED_TASK_ID: ${{ inputs.task_id }}
          SELECTED_TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
        with:
          script: |
            const fs = require('fs');
            const { findBlockedReportContradictions, validateAutonomousCycleReport } =
              require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            const { bindCycleReportToReservedTask } =
              require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            let summary;
            try {
              const rawSummary = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
              summary = bindCycleReportToReservedTask(rawSummary, process.env.SELECTED_TASK_ID);
            } catch (error) {
              core.setFailed('OpenRouter report could not be bound to the reserved task: ' + error.message);
              return;
            }
            const lines = summary.split(/\r?\n/);
            const statusLines = lines.filter((line) => line.startsWith('BOONTA_CYCLE_STATUS:'));
            if (statusLines.length === 1 && statusLines[0] === 'BOONTA_CYCLE_STATUS: BLOCKED') {
              const blocker = lines.filter((line) => line.startsWith('BOONTA_CYCLE_BLOCKER: ')).join(' ');
              const nextAction = lines.filter((line) => line.startsWith('BOONTA_CYCLE_NEXT_ACTION: ')).join(' ');
              const blockedText = blocker + ' ' + nextAction;
              const contradictions = findBlockedReportContradictions(blockedText, {
                openRouterAuthSucceeded:
                  process.env.OPENROUTER_PREFLIGHT_ALLOWED === 'true' &&
                  process.env.OPENROUTER_AUTH_OUTCOME === 'success',
                githubAppTokenMinted: process.env.GITHUB_APP_TOKEN_OUTCOME === 'success'
              });
              if (contradictions.length > 0) {
                core.setFailed('BLOCKED report contradicts same-run preflight evidence: ' + contradictions.join('; '));
                return;
              }
            }
            await validateAutonomousCycleReport({
              github,
              context,
              core,
              summary,
              baseline: JSON.parse(process.env.PRE_CYCLE_PR_HEADS || '{}'),
              snapshotAt: process.env.PRE_CYCLE_PR_SNAPSHOT_AT,
              expectedTaskId: process.env.SELECTED_TASK_ID,
              expectedBase: process.env.SELECTED_TASK_TARGET_BRANCH,
              provider: 'OpenRouter'
            });

      - name: Sync the single-task daily backoff marker
        id: sync_task_queue_state
        if: steps.validate_report.outcome == 'success' && (steps.validate_report.outputs.cycle_status == 'blocked' || inputs.task_blocked_active == true)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          CYCLE_STATUS: ${{ steps.validate_report.outputs.cycle_status }}
          BLOCKED_FINGERPRINT: ${{ steps.validate_report.outputs.blocked_fingerprint }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const cycleStatus = process.env.CYCLE_STATUS || '';
            const isBlocked = cycleStatus === 'blocked';
            const fingerprint = process.env.BLOCKED_FINGERPRINT || '';
            if (isBlocked && !/^[0-9a-f]{16}$/.test(fingerprint)) {
              core.setFailed('A valid BLOCKED report must include its deterministic task fingerprint before persistence.');
              return;
            }
            if (!isBlocked && cycleStatus !== 'progress') {
              core.info('No validated task state to persist.');
              return;
            }
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = isBlocked
              ? '<!-- BOONTA_TASK_BLOCKED_COOLDOWN: ' + todayUtc + ' ' + fingerprint + ' -->'
              : '<!-- BOONTA_TASK_BLOCKED_COOLDOWN_CLEARED: ' + todayUtc + ' -->';
            const body = [
              marker,
              isBlocked ? '## Single active task — daily backoff' : '## Single active task — backoff cleared',
              '',
              isBlocked
                ? 'A valid BLOCKED report was verified for the single active task on UTC date ' + todayUtc + '.'
                : 'A cycle-fresh PROGRESS report passed exact-head validation on UTC date ' + todayUtc + '.',
              isBlocked
                ? 'Fingerprint: ' + fingerprint + '. Scheduled provider calls are paused for the remainder of this UTC day to avoid repeating the same blocked task.'
                : 'The previous same-day task backoff is cleared. The next eligible scheduled cycle may select work again.',
              'A valid BLOCKED report is not a provider failure; this task backoff does not record a provider cooldown.',
              'An owner-authorized manual dispatch or qualifying main push may re-evaluate the task before the next UTC day.',
              '',
              '[Inspect the validated cycle](' + process.env.RUN_URL + ')',
            ].join('\\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes('<!-- BOONTA_TASK_BLOCKED_COOLDOWN')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(isBlocked
                ? 'Updated the single persistent same-day task backoff marker.'
                : 'Cleared the single persistent same-day task backoff marker.');
            } else if (isBlocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the single persistent same-day task backoff marker.');
            } else {
              core.info('No previous task backoff marker needed clearing.');
            }
      - name: Record same-day OpenRouter cooldown after quota, authentication or invocation failure
        if: always() && (steps.openrouter_auth_check.outcome == 'failure' || steps.openrouter_auth_check.outputs.quota_available == 'false' || (steps.run_opencode.outputs.provider_request_started == 'true' && steps.run_opencode.outcome != 'success' && steps.run_opencode.outcome != 'skipped') || steps.validate_report.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          QUOTA_AVAILABLE: ${{ steps.openrouter_auth_check.outputs.quota_available }}
          QUOTA_REMAINING: ${{ steps.openrouter_auth_check.outputs.quota_remaining }}
          QUOTA_REQUIRED: ${{ steps.openrouter_auth_check.outputs.quota_required }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = '<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN: ' + todayUtc + ' -->';
            const quotaAvailable = process.env.QUOTA_AVAILABLE || 'unknown';
            const quotaRemaining = process.env.QUOTA_REMAINING || '0';
            const quotaRequired = process.env.QUOTA_REQUIRED || '3';
            const reason = quotaAvailable === 'false'
              ? 'The OpenRouter /api/v1/key preflight reported ' + quotaRemaining + ' Free-model request(s) remaining, below the ' + quotaRequired + '-request reserve for the bounded OpenCode cycle.'
              : 'The OpenRouter Free authentication, model invocation or cycle-report validation failed.';
            const body = [
              marker,
              '## OpenRouter Free daily failure cooldown',
              '',
              reason + ' Recorded on UTC date ' + todayUtc + '.',
              'Further fallback cycles on this UTC date will skip another OpenRouter request. A fresh attempt is allowed on the next UTC date.',
              'This marker does not change provider settings, billing, secrets, quota, or owner attestations.',
              '',
              '[Inspect the failed OpenRouter invocation](' + process.env.RUN_URL + ')',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated the single persistent OpenRouter cooldown marker on issue #' + issueNumber + '.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the persistent OpenRouter cooldown marker on issue #' + issueNumber + '.');
            }
      - name: Fail visibly if the OpenRouter fallback did not complete
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          GATE_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_pr_heads.outcome }}
          INVOCATION_OUTCOME: ${{ steps.run_opencode.outcome }}
          REPORT_OUTCOME: ${{ steps.validate_report.outcome }}
          QUOTA_AVAILABLE: ${{ steps.openrouter_auth_check.outputs.quota_available }}
          QUOTA_REMAINING: ${{ steps.openrouter_auth_check.outputs.quota_remaining }}
          QUOTA_REQUIRED: ${{ steps.openrouter_auth_check.outputs.quota_required }}
        with:
          script: |
            const allowed = process.env.GATE_ALLOWED === 'true';
            const quotaAvailable = process.env.QUOTA_AVAILABLE || 'unknown';
            const outcomes = {
              snapshot: process.env.SNAPSHOT_OUTCOME || 'skipped',
              invocation: process.env.INVOCATION_OUTCOME || 'skipped',
              report: process.env.REPORT_OUTCOME || 'skipped',
            };
            if (!allowed) {
              core.setFailed('OpenRouter fallback did not execute: its independent Free-only/owner gate blocked the request. No provider request was sent; the separate Groq Free fallback may now be evaluated.');
            } else if (quotaAvailable === 'false') {
              const quotaRemaining = process.env.QUOTA_REMAINING || '0';
              const quotaRequired = process.env.QUOTA_REQUIRED || '3';
              core.setFailed('OpenRouter Free daily request reserve for one bounded OpenCode cycle is insufficient (remaining: ' + quotaRemaining + '; required: ' + quotaRequired + '). No inference request was sent; the daily cooldown was recorded. Retry after the UTC reset; no credits or paid route are permitted.');
            } else if (outcomes.snapshot !== 'success' || outcomes.invocation !== 'success' || outcomes.report !== 'success') {
              core.setFailed('OpenRouter fallback did not complete. Required outcomes: quota preflight, PR snapshot, actual OpenCode invocation, and report validation must all be success. Observed: ' + JSON.stringify(outcomes));
            } else {
              core.info('OpenRouter fallback passed all execution postconditions: gate, actual invocation, and validated report.');
            }
