name: Gemini on-demand coding assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: >-
      ${{
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || '', '@gemini-cli') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || '')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      command: ${{ steps.extract.outputs.command }}
      additional_context: ${{ steps.extract.outputs.additional_context }}
    steps:
      - name: Extract command
        id: extract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          REQUEST: ${{ github.event.comment.body || github.event.review.body || '' }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || github.event.review.author_association || '' }}
        with:
          script: |
            const request = process.env.REQUEST || '';
            const association = process.env.AUTHOR_ASSOCIATION || '';
            let command = 'fallthrough';
            if (/^@gemini-cli\s+\/approve(?:\s|$)/.test(request)) {
              // Only the repository owner may authorize the write-capable workflow.
              command = association === 'OWNER' ? 'approve' : 'approve-denied';
            } else if (request.startsWith('@gemini-cli')) {
              command = 'invoke';
            }
            core.setOutput('command', command);
            core.setOutput('additional_context', request.replace(/^@gemini-cli/, '').trim());

      - name: Acknowledge request
        if: steps.extract.outputs.command == 'invoke'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) {
              core.warning('Could not resolve the issue or pull request number.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Gemini received your request. For substantial code changes it will post a plan first. Write execution remains locked until the repository owner protects main and enables the GEMINI_WRITE_ENABLED Actions variable.'
            });

  approval-denied:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve-denied'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain owner-only approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) {
              core.warning('Could not resolve the issue or pull request number.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'The /approve command is restricted to the repository owner. No code-writing task was run.'
            });

  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit

  write-disabled:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve' && vars.GEMINI_WRITE_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain the write gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issueNumber) {
              core.warning('Could not resolve the issue or pull request number.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Gemini write execution is still locked: no code-writing task was run. First protect the main branch from direct pushes and force pushes, then add the GEMINI_API_KEY repository secret without enabling Google billing, and only then set the repository Actions variable GEMINI_WRITE_ENABLED to the exact value true. Keep the budget at €0; if the free quota is unavailable, stop instead of upgrading. Nothing was merged.'
            });

  plan-execute:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve' && vars.GEMINI_WRITE_ENABLED == 'true'
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit
