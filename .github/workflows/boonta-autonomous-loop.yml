name: Boonta Autonomous Loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/boonta-autonomous-loop.yml
      - .github/workflows/boonta-autonomous-readiness.yml
      - .github/workflows/gemini-plan-execute.yml
      - .github/workflows/openrouter-plan-execute.yml
      - .github/workflows/groq-plan-execute.yml
      - docs/automation/task-ledger.json
  schedule:
    # Four bounded opportunities per day, including 00:17 UTC just after daily quota reset.
    # Keep six-hour spacing; concurrency prevents overlapping writers.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: boonta-autonomous-loop
  cancel-in-progress: false

jobs:
  readiness:
    name: Run the read-only owner/configuration and GitHub App preflight
    uses: ./.github/workflows/boonta-autonomous-readiness.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    secrets: inherit

  provider-cooldowns:
    name: Check same-day provider cooldowns before launching agents
    needs: readiness
    if: >-
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      task_ready: ${{ steps.check.outputs.task_ready }}
      task_id: ${{ steps.check.outputs.task_id }}
      task_title: ${{ steps.check.outputs.task_title }}
      task_context: ${{ steps.check.outputs.task_context }}
      task_target_branch: ${{ steps.check.outputs.task_target_branch }}
      task_reason: ${{ steps.check.outputs.task_reason }}
      gemini_active: ${{ steps.check.outputs.gemini_active }}
      openrouter_active: ${{ steps.check.outputs.openrouter_active }}
      groq_active: ${{ steps.check.outputs.groq_active }}
      task_blocked_active: ${{ steps.check.outputs.task_blocked_active }}
    steps:
      - name: Read the three persistent UTC cooldown markers
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const todayUtc = new Date().toISOString().slice(0, 10);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 226,
              since: todayUtc + 'T00:00:00Z',
              per_page: 100,
            });

            // Resolve the single-task daily backoff before task selection references it.
            // Keep this read ahead of the eligibility branch to avoid a temporal-dead-zone error.
            const botComments = comments.filter((comment) => comment.user?.login === 'github-actions[bot]');
            const taskMarker = /<!-- BOONTA_TASK_BLOCKED_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) ([0-9a-f]{16}) -->/;
            const taskMarkerComment = botComments.find((comment) => taskMarker.test(comment.body || ''));
            const taskBlockedDate = taskMarkerComment?.body?.match(taskMarker)?.[1] || '';
            const taskBlockedActive = taskBlockedDate === todayUtc;

            // An open PR carrying this task's exact identity marker is an in-flight
            // writer. Reconcile it before allowing another provider invocation.
            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1,
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              throw new Error('Open PR inventory reached the 100-item safety ceiling; refusing provider invocation to avoid duplicate task work.');
            }
            const openTaskPullRequest = (task) => {
              if (!task) return null;
              const markerLine = 'BOONTA_TASK_ID: ' + task.task_id;
              return openPullRequests.find((pull) =>
                (pull.body || '').split(/\r?\n/).some((line) => line.trim() === markerLine)
              ) || null;
            };

            // Refuse a model call unless the compact canonical queue exposes one eligible task.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main',
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              throw new Error('Canonical compact task ledger is missing or not a base64 file.');
            }
            const ledgerSummary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            if (
              ledgerSummary.schema_version !== 2 ||
              ledgerSummary.source !== 'docs/automation/task-ledger.json' ||
              !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(ledgerSummary.updated_at || '') ||
              ledgerSummary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(ledgerSummary.tasks)
            ) {
              throw new Error('Canonical compact task ledger schema or one-active-task policy is invalid.');
            }
            const taskIds = ledgerSummary.tasks.map((task) => task?.task_id);
            if (
              taskIds.some((taskId) => typeof taskId !== 'string' || !taskId.trim()) ||
              new Set(taskIds).size !== taskIds.length
            ) {
              throw new Error('Canonical compact task ledger contains missing or duplicate task IDs.');
            }
            const activeTasks = ledgerSummary.tasks.filter((task) => task.status === 'active');
            const activationTask = ledgerSummary.tasks.find((task) => task.task_id === 'AUTOMATION-LEDGER-ACTIVATION');
            const activeTaskOpenPr = activeTasks.length === 1 ? openTaskPullRequest(activeTasks[0]) : null;
            const activationTaskOpenPr = openTaskPullRequest(activationTask);
            const usableTask = (task) => Boolean(
              task && typeof task.task_id === 'string' && task.task_id.trim() &&
              typeof task.title === 'string' && task.title.trim() &&
              typeof task.question_excerpt === 'string' && task.question_excerpt.trim() &&
              Array.isArray(task.acceptance_criteria_excerpt) && task.acceptance_criteria_excerpt.length > 0 &&
              typeof task.next_action_excerpt === 'string' && task.next_action_excerpt.trim() &&
              Array.isArray(task.platform_scope) && task.platform_scope.length > 0 &&
              ['main', 'dev'].includes(task.target_branch)
            );
            let selectedTask = null;
            let taskReason = '';
            if (activeTasks.length === 1 && usableTask(activeTasks[0]) && !activeTasks[0].pr_url && !activeTasks[0].head_sha && !activeTaskOpenPr) {
              selectedTask = activeTasks[0];
              taskReason = 'one complete active ledger task with no existing PR, head or open task PR';
            } else if (activeTasks.length === 1 && usableTask(activeTasks[0]) && activeTaskOpenPr) {
              taskReason = 'the active task already has open PR #' + activeTaskOpenPr.number + '; reconcile it before another provider invocation';
            } else if (
              activeTasks.length === 0 &&
              usableTask(activationTask) &&
              activationTask.status === 'blocked' &&
              !activationTask.pr_url &&
              !activationTask.head_sha &&
              !taskBlockedActive &&
              !activationTaskOpenPr
            ) {
              selectedTask = activationTask;
              taskReason = 'the single blocked activation task is eligible; no task-level daily backoff or open task PR is active';
            } else if (
              activeTasks.length === 0 &&
              usableTask(activationTask) &&
              activationTask.status === 'blocked' &&
              !activationTask.pr_url &&
              !activationTask.head_sha &&
              !taskBlockedActive &&
              activationTaskOpenPr
            ) {
              taskReason = 'the activation task already has open PR #' + activationTaskOpenPr.number + '; reconcile it before another provider invocation';
            } else if (activeTasks.length > 1) {
              taskReason = 'multiple active tasks violate the one-active-task policy';
            } else if (activeTasks.length === 1 && !usableTask(activeTasks[0])) {
              taskReason = 'the sole active task is incomplete; repair its ledger fields before another model invocation';
            } else if (activeTasks.length === 1) {
              taskReason = 'the active task already has a PR/head; reconcile it before another model invocation';
            } else {
              taskReason = 'no eligible active task or approved post-cooldown activation task exists';
            }
            const taskReady = Boolean(selectedTask);
            const taskContext = taskReady ? [
              'Task ID: ' + selectedTask.task_id,
              'Title: ' + selectedTask.title,
              'Target branch: ' + selectedTask.target_branch,
              'Question: ' + selectedTask.question_excerpt,
              'Acceptance criteria (' + selectedTask.acceptance_criteria_total + '; first 5):',
              ...selectedTask.acceptance_criteria_excerpt.map((item) => '- ' + item),
              'Next: ' + selectedTask.next_action_excerpt,
              'If criteria exceed these excerpts, read only this task record in the canonical ledger before coding.',
              'PR #327 is integrated at main merge commit 69deb6778f9383887118803428e7014686865a83; PRs #317/#318/#319 are superseded. Do not reopen, replay or recreate that chain.',
            ].join('\n') : '';
            if (taskReady && taskContext.length > 2500) {
              throw new Error('Selected task context exceeds the bounded 2,500-character provider handoff budget.');
            }

            core.setOutput('task_ready', String(taskReady));
            core.setOutput('task_id', selectedTask?.task_id || '');
            core.setOutput('task_title', selectedTask?.title || '');
            core.setOutput('task_context', taskContext);
            core.setOutput('task_target_branch', selectedTask?.target_branch || '');
            core.setOutput('task_reason', taskReason);
            core.info('Task eligibility=' + taskReady + '; task=' + (selectedTask?.task_id || 'none') + '; reason=' + taskReason);

            const definitions = {
              gemini: /<!-- BOONTA_GEMINI_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/,
              openrouter: /<!-- BOONTA_OPENROUTER_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/,
              groq: /<!-- BOONTA_GROQ_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/,
            };
            const results = {};
            core.setOutput('task_blocked_active', String(taskBlockedActive));
            core.info('single-task daily backoff=' + taskBlockedActive + (taskBlockedDate ? ', recorded UTC date=' + taskBlockedDate : ', no active marker'));
            for (const [provider, marker] of Object.entries(definitions)) {
              const markerComment = botComments.find((comment) => marker.test(comment.body || ''));
              const failedOn = markerComment?.body?.match(marker)?.[1] || '';
              const active = failedOn === todayUtc;
              results[provider] = active ? 'ACTIVE' : 'clear';
              core.setOutput(provider + '_active', String(active));
              core.setOutput(provider + '_failed_on', failedOn);
              core.info(provider + ': cooldown=' + active + (failedOn ? ', recorded UTC date=' + failedOn : ', no marker'));
            }
            await core.summary
              .addHeading('Provider cooldown and task-eligibility preflight')
              .addTable([
                [{data: 'Provider', header: true}, {data: 'Cooldown today (UTC)', header: true}],
                ['Gemini', results.gemini],
                ['OpenRouter Free', results.openrouter],
                ['Groq Free', results.groq],
                ['Single task queue', taskBlockedActive ? 'BLOCKED (scheduled backoff)' : 'clear'],
                ['Eligible task', taskReady ? selectedTask.task_id : 'none'],
                ['Task target branch', taskReady ? selectedTask.target_branch : 'none'],
              ])
              .addRaw('Read-only checks: issue #226 cooldown comments, open PR task-identity markers and the compact main-branch task ledger. An existing open PR for the selected task blocks duplicate provider work until it is reconciled.')
              .write();

  autonomous-cycle:
    name: Select and execute one safe project task
    needs: [readiness, provider-cooldowns]
    if: >-
      needs.readiness.result == 'success' &&
      needs.provider-cooldowns.result == 'success' &&
      needs.provider-cooldowns.outputs.task_ready == 'true' &&
      (needs.provider-cooldowns.outputs.task_blocked_active != 'true' || github.event_name != 'schedule') &&
      needs.provider-cooldowns.outputs.gemini_active != 'true' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    with:
      autonomous_mode: true
      issue_number: 226
      task_blocked_active: ${{ needs.provider-cooldowns.outputs.task_blocked_active == 'true' }}
      task_id: ${{ needs.provider-cooldowns.outputs.task_id }}
      task_target_branch: ${{ needs.provider-cooldowns.outputs.task_target_branch }}
      task_title: ${{ needs.provider-cooldowns.outputs.task_title }}
      task_description: ${{ needs.provider-cooldowns.outputs.task_context }}
      additional_context: >-
        Owner-authorized scheduled or manual main-branch loop. The selected task ID, title, acceptance criteria and target branch are supplied by the read-only preflight and must remain identical across providers. Use only one provider invocation per workflow run; fallback is allowed only on a later eligible run after the earlier provider cooldown is already active. Budget €0; preserve provenance, exact-head checks and human review. Never merge or change secrets, billing, permissions, branch protection or merge policy.
    secrets: inherit

  openrouter-fallback:
    name: Next-cycle OpenRouter Free fallback after Gemini cooldown
    needs: [readiness, provider-cooldowns, autonomous-cycle]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.provider-cooldowns.result == 'success' &&
      needs.provider-cooldowns.outputs.task_ready == 'true' &&
      (needs.provider-cooldowns.outputs.task_blocked_active != 'true' || github.event_name != 'schedule') &&
      needs.provider-cooldowns.outputs.openrouter_active != 'true' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'skipped' &&
      needs.provider-cooldowns.outputs.gemini_active == 'true' &&
      needs.autonomous-cycle.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/openrouter-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    with:
      autonomous_mode: true
      issue_number: 226
      task_blocked_active: ${{ needs.provider-cooldowns.outputs.task_blocked_active == 'true' }}
      task_id: ${{ needs.provider-cooldowns.outputs.task_id }}
      task_title: ${{ needs.provider-cooldowns.outputs.task_title }}
      task_target_branch: ${{ needs.provider-cooldowns.outputs.task_target_branch }}
      task_description: ${{ needs.provider-cooldowns.outputs.task_context }}
    secrets: inherit

  groq-fallback:
    name: Next-cycle Groq Free fallback after Gemini and OpenRouter cooldowns
    needs: [readiness, provider-cooldowns, autonomous-cycle, openrouter-fallback]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.provider-cooldowns.result == 'success' &&
      needs.provider-cooldowns.outputs.task_ready == 'true' &&
      (needs.provider-cooldowns.outputs.task_blocked_active != 'true' || github.event_name != 'schedule') &&
      needs.provider-cooldowns.outputs.groq_active != 'true' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'skipped' &&
      needs.provider-cooldowns.outputs.gemini_active == 'true' &&
      needs.openrouter-fallback.result == 'skipped' &&
      needs.provider-cooldowns.outputs.openrouter_active == 'true' &&
      needs.openrouter-fallback.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/groq-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    with:
      autonomous_mode: true
      issue_number: 226
      task_blocked_active: ${{ needs.provider-cooldowns.outputs.task_blocked_active == 'true' }}
      task_id: ${{ needs.provider-cooldowns.outputs.task_id }}
      task_title: ${{ needs.provider-cooldowns.outputs.task_title }}
      task_target_branch: ${{ needs.provider-cooldowns.outputs.task_target_branch }}
      task_description: ${{ needs.provider-cooldowns.outputs.task_context }}
    secrets: inherit

  cycle-summary:
    name: Explain provider calls and validated results
    needs: [readiness, provider-cooldowns, autonomous-cycle, openrouter-fallback, groq-fallback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Publish the exact outcome of each provider stage
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          WRITER_STATE: ${{ needs.readiness.outputs.writer_state }}
          COOLDOWN_CHECK_RESULT: ${{ needs.provider-cooldowns.result }}
          TASK_BLOCKED_ACTIVE: ${{ needs.provider-cooldowns.outputs.task_blocked_active }}
          TASK_READY: ${{ needs.provider-cooldowns.outputs.task_ready }}
          TASK_ID: ${{ needs.provider-cooldowns.outputs.task_id }}
          TASK_TITLE: ${{ needs.provider-cooldowns.outputs.task_title }}
          TASK_TARGET_BRANCH: ${{ needs.provider-cooldowns.outputs.task_target_branch }}
          TASK_REASON: ${{ needs.provider-cooldowns.outputs.task_reason }}
          EVENT_NAME: ${{ github.event_name }}
          GEMINI_COOLDOWN_ACTIVE: ${{ needs.provider-cooldowns.outputs.gemini_active }}
          OPENROUTER_COOLDOWN_ACTIVE: ${{ needs.provider-cooldowns.outputs.openrouter_active }}
          GROQ_COOLDOWN_ACTIVE: ${{ needs.provider-cooldowns.outputs.groq_active }}
          GEMINI_RESULT: ${{ needs.autonomous-cycle.result }}
          GEMINI_INVOCATION: ${{ needs.autonomous-cycle.outputs.invocation_outcome }}
          GEMINI_REPORT: ${{ needs.autonomous-cycle.outputs.report_outcome }}
          GEMINI_CYCLE_STATUS: ${{ needs.autonomous-cycle.outputs.cycle_status }}
          GEMINI_TASK_QUEUE_STATE: ${{ needs.autonomous-cycle.outputs.task_queue_state_outcome }}
          OPENROUTER_RESULT: ${{ needs.openrouter-fallback.result }}
          OPENROUTER_INVOCATION: ${{ needs.openrouter-fallback.outputs.invocation_outcome }}
          OPENROUTER_REPORT: ${{ needs.openrouter-fallback.outputs.report_outcome }}
          OPENROUTER_CYCLE_STATUS: ${{ needs.openrouter-fallback.outputs.cycle_status }}
          OPENROUTER_TASK_QUEUE_STATE: ${{ needs.openrouter-fallback.outputs.task_queue_state_outcome }}
          GROQ_RESULT: ${{ needs.groq-fallback.result }}
          GROQ_INVOCATION: ${{ needs.groq-fallback.outputs.invocation_outcome }}
          GROQ_REPORT: ${{ needs.groq-fallback.outputs.report_outcome }}
          GROQ_CYCLE_STATUS: ${{ needs.groq-fallback.outputs.cycle_status }}
          GROQ_TASK_QUEUE_STATE: ${{ needs.groq-fallback.outputs.task_queue_state_outcome }}
        run: |
          set -euo pipefail
          provider_row() {
            local provider="$1" job_result="$2" invocation="$3" report="$4" cycle_status="$5" cooldown="$6" task_state="$7"
            local call="no" detail
            case "$invocation" in
              success)
                call="yes"
                if [[ "$report" == "success" && "$cycle_status" == "progress" ]]; then
                  detail="Model called; fresh-PR progress report validated."
                elif [[ "$report" == "success" && "$cycle_status" == "blocked" ]]; then
                  detail="Model called; a named BLOCKED report passed validation. No progress is claimed."
                elif [[ "$report" == "failure" ]]; then
                  detail="Model called, but report validation failed. Inspect this provider job."
                else
                  detail="Model call completed, but report validation/status is not confirmed."
                fi
                ;;
              failure)
                call="attempted/failed"
                detail="Provider invocation failed. The daily cooldown should prevent repeated calls."
                ;;
              skipped)
                if [[ "$cooldown" == "true" ]]; then
                  detail="Skipped before launching the provider workflow: its same-day UTC cooldown is active."
                else
                  case "$job_result" in
                    failure) detail="No model call. A quota, owner, or free-tier gate stopped this provider; inspect its job summary for the exact reason." ;;
                    skipped) detail="Provider job was not eligible or an upstream/readiness condition prevented launch." ;;
                    *) detail="No model invocation was recorded." ;;
                  esac
                fi
                ;;
              *)
                detail="Provider invocation outcome is unavailable; inspect the workflow logs."
                ;;
            esac
            if [[ "$task_state" == "failure" ]]; then
              detail="${detail} Task-backoff persistence/clearing failed; the scheduled pause is not confirmed."
            elif [[ "$task_state" == "success" && "$cycle_status" == "blocked" ]]; then
              detail="${detail} Same-day task backoff was persisted."
            elif [[ "$task_state" == "success" && "$cycle_status" == "progress" ]]; then
              detail="${detail} Any previous same-day task backoff was cleared."
            fi
            printf '| %s | %s | %s | %s | %s | %s | %s |\n' "$provider" "$job_result" "$cooldown" "$call" "${report:-not checked}" "${task_state:-not written}" "$detail"
          }
          {
            echo "## Boonta autonomous cycle — provider outcome"
            echo
            echo "- Readiness: **${READINESS_RESULT:-unknown}**"
            echo "- Autonomous writer gate: **${WRITER_STATE:-unknown}**"
            echo "- Cooldown precheck: **${COOLDOWN_CHECK_RESULT:-unknown}**"
            echo "- Eligible task: **${TASK_READY:-unknown}** (${TASK_ID:-none}: ${TASK_TITLE:-untitled}; target ${TASK_TARGET_BRANCH:-unknown})"
            if [[ "${TASK_READY:-false}" != "true" ]]; then
              echo "- Provider calls skipped before inference: ${TASK_REASON:-canonical queue eligibility was not confirmed}."
            fi
            echo
            echo "| Provider | Job result | Cooldown active | Model call | Report check | Task queue state | Interpretation |"
            echo "|---|---|---|---|---|---|"
            provider_row "Gemini" "${GEMINI_RESULT:-unknown}" "${GEMINI_INVOCATION:-skipped}" "${GEMINI_REPORT:-skipped}" "${GEMINI_CYCLE_STATUS:-unknown}" "${GEMINI_COOLDOWN_ACTIVE:-unknown}" "${GEMINI_TASK_QUEUE_STATE:-skipped}"
            provider_row "OpenRouter Free" "${OPENROUTER_RESULT:-unknown}" "${OPENROUTER_INVOCATION:-skipped}" "${OPENROUTER_REPORT:-skipped}" "${OPENROUTER_CYCLE_STATUS:-unknown}" "${OPENROUTER_COOLDOWN_ACTIVE:-unknown}" "${OPENROUTER_TASK_QUEUE_STATE:-skipped}"
            provider_row "Groq Free" "${GROQ_RESULT:-unknown}" "${GROQ_INVOCATION:-skipped}" "${GROQ_REPORT:-skipped}" "${GROQ_CYCLE_STATUS:-unknown}" "${GROQ_COOLDOWN_ACTIVE:-unknown}" "${GROQ_TASK_QUEUE_STATE:-skipped}"
            echo
            if [[ "${TASK_BLOCKED_ACTIVE:-false}" == "true" && "${EVENT_NAME:-}" == "schedule" ]]; then
              echo "**A validated BLOCKED report already exists for the single active task on this UTC day. Scheduled provider calls were skipped; an owner-authorized manual dispatch or qualifying main push may re-evaluate it.**"
            fi
            if [[ "${GEMINI_COOLDOWN_ACTIVE:-false}" == "true" && "${OPENROUTER_COOLDOWN_ACTIVE:-false}" == "true" && "${GROQ_COOLDOWN_ACTIVE:-false}" == "true" ]]; then
              echo "**All three same-day UTC cooldowns are active. No provider workflows were launched and no project progress is claimed.**"
            elif [[ "${GEMINI_INVOCATION:-skipped}" != "success" && "${OPENROUTER_INVOCATION:-skipped}" != "success" && "${GROQ_INVOCATION:-skipped}" != "success" ]]; then
              echo "**No provider completed a model invocation. No autonomous project progress is confirmed by this run.**"
            else
              echo "At least one provider invocation completed. Check its report validation and progress status above; a valid BLOCKED report is not progress."
            fi
            echo
            echo "At most one provider invocation is allowed per workflow run. A failed provider is not followed by another model call in the same run; the next scheduled cycle may advance to the next Free-only provider after cooldown." 
            echo
            echo "This summary does not change provider job conclusions or the canonical activation gate. Budget remains €0."
            echo
            echo "[Open the full workflow run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
