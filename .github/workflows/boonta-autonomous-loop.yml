name: Boonta Autonomous Loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/boonta-autonomous-loop.yml
      - .github/workflows/boonta-autonomous-readiness.yml
      - .github/workflows/gemini-plan-execute.yml
      - .github/workflows/openrouter-plan-execute.yml
      - .github/workflows/groq-plan-execute.yml
      - docs/automation/task-ledger.json
  schedule:
    # Four bounded opportunities per day; concurrency prevents overlapping writers.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: boonta-autonomous-loop
  cancel-in-progress: false

jobs:
  readiness:
    name: Run the read-only owner/configuration and GitHub App preflight
    uses: ./.github/workflows/boonta-autonomous-readiness.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    secrets: inherit

  autonomous-cycle:
    name: Select and execute one safe project task
    needs: readiness
    if: >-
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
      task_title: "Boonta Reborn autonomous work cycle"
      task_description: >-
        Use the owner-approved task brief in this workflow plus docs/automation/task-ledger-summary.json.
        Do not read full append-only bodies/comments for #156, #226 or #279; search only for a precise
        unresolved detail required by the selected task, and inspect only related PRs/CI.
        #226 owns native GameCube/Wii target compatibility and implementation decisions; #279 is the read-only PC/N64/Dreamcast comparative evidence queue. Consume and cite #279's source/format/code maps instead of duplicating PC/N64 source audits in #226. PR #282 is the completed broad system inventory; do not recreate or expand it.
        The canonical ledger currently marks AUTOMATION-LEDGER-ACTIVATION as blocked, not active. Keep the activation gate unresolved until a post-merge provider cycle produces a valid cycle-fresh PR/report or a precise verified blocker. Do not create a second active task or competing writer.
        After the activation gate is cleared, execute the newest bounded Phase 1 direction in #226: cross-platform reverse-engineering inventory and a concrete reuse/convert/adapt/reimplement decision. Defer visible-Dolphin three-lap acceptance and new gameplay feature work during this phase.
        PR #282 is already the broad system inventory; do not recreate or expand it. Add only missing, source-verified rows for SW_RACER_RE (PC), swe1r-tools/data extractors, N64Recomp and the N64 static-recomp project, community mod formats/assets, and Wii64/emulator observations. For each, record exact repository/revision, platform/version, license scope and exclusions, bundled-tool licenses, utility, evidence type (code/tool/data/behavior), GameCube compatibility, redistribution status and unknowns.
        Consume and link the bounded PC-vs-N64 data-format map and code/behavior evidence from #279. Do not duplicate those read-only comparative audits in #226. Map each relevant finding to actual GameCube/Wii target constraints and the current clean-room GX/libogc asset pipeline; identify what is compatible, what requires conversion, and what remains UNKNOWN. If #279 lacks a necessary PC/N64 source fact, record the gap and keep its investigation in #279 rather than launching a parallel writer. Keep any lawful owner-held ROM/disc/binary/extracted inputs local; never upload them to issues, CI, model providers or hosted services. Publish only independently written notes, synthetic fixtures and public-source citations.
        Label every target-compatibility claim OBSERVED, INFERRED, HYPOTHESIS or UNKNOWN. Evaluate graphics, audio and frame-rate/physics as suspected porting challenges against evidence; include existing GX/libogc foundations, missing interfaces, candidate tools and one minimal validation experiment per area.
        Finish with a one-page decision comparing an N64-informed specification route, PC reverse-engineering-led clean-room implementation, and a hybrid. State what can be reused as tools, used only as behavioral evidence, converted only after rights review, or must be independently implemented for GameCube/Wii. Research stops when the decision is adequately supported; estimates remain estimates.
        Maintain €0/free-tier-only routing, clean-room provenance, serialized single-writer and the existing activation gate. Do not change secrets, billing, permissions, branch protection, licensing or merge policy. Never copy AGPL SW_RACER_RE code, generated ROM-derived code, unclear mod code or proprietary assets. No auto-merge, force-push, branch deletion or binary uploads.
      additional_context: >-
        This is the Boonta Autonomous Loop, started by its six-hour schedule,
        an owner-approved main-branch merge affecting the bounded automation/ledger
        paths, or an owner manual dispatch. The owner explicitly approved
        autonomous task selection and branch/PR work. #226 is the native GameCube/Wii
        queue; #279 is the comparative PC/N64/Dreamcast evidence queue and stays
        documentation-only. Do not ask for a new "continue" message or per-task
        approval. The €0 budget, free-tier gate, provenance restrictions, one-writer
        rule, exact-head validation, and no-merge policy remain mandatory.
    secrets: inherit

  openrouter-fallback:
    name: Free-only fallback when the Gemini cycle fails
    needs: [readiness, autonomous-cycle]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      needs.autonomous-cycle.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/openrouter-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit

  groq-fallback:
    name: Third Free-only fallback when OpenRouter fails or is safely blocked
    needs: [readiness, autonomous-cycle, openrouter-fallback]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      needs.autonomous-cycle.outputs.invocation_outcome != 'success' &&
      (needs.openrouter-fallback.result == 'failure' || needs.openrouter-fallback.result == 'skipped') &&
      needs.openrouter-fallback.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/groq-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit
