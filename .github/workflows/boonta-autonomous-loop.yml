name: Boonta Autonomous Loop

on:
  schedule:
    # Four bounded opportunities per day; concurrency prevents overlapping writers.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: boonta-autonomous-loop
  cancel-in-progress: false

jobs:
  readiness:
    name: Run the read-only owner/configuration and GitHub App preflight
    uses: ./.github/workflows/boonta-autonomous-readiness.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    secrets: inherit

  autonomous-cycle:
    name: Select and execute one safe project task
    needs: readiness
    if: >-
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == github.repository_owner)
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
      task_title: "Boonta Reborn autonomous work cycle"
      task_description: >-
        Read the newest owner direction in dashboard #156 and native queue #226,
        plus queue #279, current repository instructions, PRs, branches and CI.
        #226 owns native GameCube/Wii research and implementation; #279 is strictly
        read-only PC/N64/Dreamcast comparative documentation. The owner update
        dated 2026-11-05 supersedes the older 80/20 research-first balance:
        immediately finish/review the existing complete-game system matrix PR #282
        as one bounded research gate (no duplicate matrix/report, no auto-merge).
        If that matrix is already sufficiently complete, do not wait for its merge:
        proceed to one bounded clean-room gameplay implementation task. The first
        implementation milestone is a deterministic, testable rival-racing AI
        subsystem, reusing existing rival state/helpers, track sampling, collision
        and overtake logic. Replace sine-only lane wandering incrementally with
        state-driven trajectory, speed, passing and avoidance decisions, plus
        focused host C tests and native GameCube build validation. After the matrix
        gate, target at least 60% implementation/integration effort; use research
        only to resolve concrete design questions. Continue existing non-overlapping
        branches/PRs, open a reviewable PR and record exact-SHA evidence; never merge.
        Keep €0, free-tier-only routing, clean-room provenance and serialized
        single-writer restrictions mandatory.
      additional_context: >-
        This is the scheduled Boonta Autonomous Loop. The owner explicitly approved
        autonomous task selection and branch/PR work. #226 is the native GameCube/Wii
        queue; #279 is the comparative PC/N64/Dreamcast evidence queue and stays
        documentation-only. Do not ask for a new "continue" message or per-task
        approval. The €0 budget, free-tier gate, provenance restrictions, one-writer
        rule, exact-head validation, and no-merge policy remain mandatory.
    secrets: inherit

  openrouter-fallback:
    name: Free-only fallback when the Gemini cycle fails
    needs: [readiness, autonomous-cycle]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == github.repository_owner)
    uses: ./.github/workflows/openrouter-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit

  groq-fallback:
    name: Third Free-only fallback when OpenRouter fails or is safely blocked
    needs: [readiness, autonomous-cycle, openrouter-fallback]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      (needs.openrouter-fallback.result == 'failure' || needs.openrouter-fallback.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == github.repository_owner)
    uses: ./.github/workflows/groq-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit
