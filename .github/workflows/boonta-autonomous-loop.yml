name: Boonta Autonomous Loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/boonta-autonomous-loop.yml
      - .github/workflows/boonta-autonomous-readiness.yml
      - .github/workflows/gemini-plan-execute.yml
      - .github/workflows/openrouter-plan-execute.yml
      - .github/workflows/groq-plan-execute.yml
      - docs/automation/task-ledger.json
  schedule:
    # Four bounded opportunities per day; concurrency prevents overlapping writers.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: boonta-autonomous-loop
  cancel-in-progress: false

jobs:
  readiness:
    name: Run the read-only owner/configuration and GitHub App preflight
    uses: ./.github/workflows/boonta-autonomous-readiness.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    secrets: inherit

  autonomous-cycle:
    name: Select and execute one safe project task
    needs: readiness
    if: >-
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
      task_title: "Boonta Reborn autonomous work cycle"
      task_description: >-
        Use the owner-approved task brief in this workflow plus docs/automation/task-ledger-summary.json.
        Do not read full append-only bodies/comments for #156, #226 or #279; search only for a precise
        unresolved detail required by the selected task, and inspect only related PRs/CI.
        #226 owns native GameCube/Wii research and implementation; #279 is strictly
        read-only PC/N64/Dreamcast comparative documentation. The owner-approved 2026-11-05 matrix gate is complete: PR #282 is a sufficient planning inventory; do not recreate or expand it.
        The canonical ledger currently marks AUTOMATION-LEDGER-ACTIVATION as blocked, not active. Keep the activation gate unresolved until a post-merge provider cycle produces a valid cycle-fresh PR/report or a precise verified blocker. Do not create a second active task or competing writer.
        After the activation gate is cleared, continue the existing gameplay PR chain; do not create a second rival AI or route graph:
        - Review/integrate PR #317 (deterministic rival avoidance) first, then PR #318 (independent curvature-aware rival pace), then PR #319 (bounded corner-aware racing lines). These are existing dependent branches with exact-head checks already reported green; inspect each live head and required review state before integration. Preserve their dependency order and do not claim they are merged.
        - The next new gameplay task is the missing end-to-end race integration/acceptance test: connect the existing player and rival controllers, lap/progress/standings, finish/results and restart into one deterministic race loop. Reuse existing gameplay_state.h, rival AI, collision/overtake helpers, route sampler, generated mesh/track pipeline, tests, native DOL/ELF build and Dolphin diagnostics. Do not rewrite main.c wholesale.
        - Reuse PR #274 only if a concrete route-runtime dependency is demonstrated by the selected integration task; it is an existing route-graph candidate, not permission to create a duplicate. It currently represents one closed Bezier oval; branch history/split-rejoin decisions are not connected to gameplay. Preserve its required human review and do not bypass branch protection.
        Use existing PC AI/catch-up and pod-control/speed/traction research as behavioral contracts, and consult sp00nznet/racer's N64 static-recomp build only as a separate N64 behavior/runtime cross-check (never copy generated ROM-derived code). Keep pace/rank targets distinct from physical pod movement, use route progress/look-ahead, and test track bounds, passing, avoidance, collisions, lap completion, finish/results and restart.
        Keep platform boundaries: PC findings are static PC evidence, N64/Dreamcast separate comparisons, GameCube/Wii clean-room homebrew targets; no original retail GameCube/Wii Racer binary exists. Do not copy AGPL SW_RACER_RE code or proprietary/unclear assets. Keep Step 102 on HOLD. Defer career/profile/upgrades #307 until a coherent playable race slice (player + rivals, laps, standings, finish/results and restart) exists. After the matrix and active-task gate, target at least 60% implementation/integration/testing, with research only for concrete unknowns. Keep €0, free-tier-only routing, clean-room provenance and serialized single-writer restrictions mandatory.
      additional_context: >-
        This is the Boonta Autonomous Loop, started by its six-hour schedule,
        an owner-approved main-branch merge affecting the bounded automation/ledger
        paths, or an owner manual dispatch. The owner explicitly approved
        autonomous task selection and branch/PR work. #226 is the native GameCube/Wii
        queue; #279 is the comparative PC/N64/Dreamcast evidence queue and stays
        documentation-only. Do not ask for a new "continue" message or per-task
        approval. The €0 budget, free-tier gate, provenance restrictions, one-writer
        rule, exact-head validation, and no-merge policy remain mandatory.
    secrets: inherit

  openrouter-fallback:
    name: Free-only fallback when the Gemini cycle fails
    needs: [readiness, autonomous-cycle]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      needs.autonomous-cycle.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/openrouter-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit

  groq-fallback:
    name: Third Free-only fallback when OpenRouter fails or is safely blocked
    needs: [readiness, autonomous-cycle, openrouter-fallback]
    if: >-
      always() &&
      needs.readiness.result == 'success' &&
      needs.readiness.outputs.writer_state == 'enabled' &&
      needs.autonomous-cycle.result == 'failure' &&
      needs.autonomous-cycle.outputs.invocation_outcome != 'success' &&
      (needs.openrouter-fallback.result == 'failure' || needs.openrouter-fallback.result == 'skipped') &&
      needs.openrouter-fallback.outputs.invocation_outcome != 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor == github.repository_owner))
    uses: ./.github/workflows/groq-plan-execute.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      autonomous_mode: true
      issue_number: 226
    secrets: inherit
