name: Groq Free autonomous fallback

on:
  workflow_call:
    outputs:
      invocation_outcome:
        description: "Outcome of the actual Groq/OpenCode invocation step."
        value: ${{ jobs.groq-plan-execute.outputs.invocation_outcome }}
      report_outcome:
        description: "Outcome of the Groq autonomous report validator."
        value: ${{ jobs.groq-plan-execute.outputs.report_outcome }}
      cycle_status:
        description: "Validated Groq cycle status: progress or blocked."
        value: ${{ jobs.groq-plan-execute.outputs.cycle_status }}
      task_queue_state_outcome:
        description: "Outcome of persisting or clearing the single-task daily backoff marker."
        value: ${{ jobs.groq-plan-execute.outputs.task_queue_state_outcome }}
    inputs:
      autonomous_mode:
        type: boolean
        required: true
      issue_number:
        type: number
        required: true
      task_id:
        type: string
        required: false
      task_title:
        type: string
        required: false
      task_target_branch:
        type: string
        required: false
      task_description:
        type: string
        required: false
      task_blocked_active:
        type: boolean
        required: false
        default: false
      resume_mode:
        type: boolean
        required: false
        default: false
      resume_task_id:
        type: string
        required: false
      resume_task_title:
        type: string
        required: false
      resume_task_target_branch:
        type: string
        required: false
      resume_task_description:
        type: string
        required: false
      resume_pr_number:
        type: number
        required: false
      resume_pr_url:
        type: string
        required: false
      resume_branch:
        type: string
        required: false
      resume_head_sha:
        type: string
      resume_file_paths:
        type: string
        required: false

concurrency:
  group: boonta-single-writer
  cancel-in-progress: false

jobs:
  groq-plan-execute:
    name: One bounded Groq Free research/engineering cycle
    outputs:
      invocation_outcome: ${{ steps.run_opencode.outcome }}
      report_outcome: ${{ steps.validate_report.outcome }}
      cycle_status: ${{ steps.validate_report.outputs.cycle_status }}
      task_queue_state_outcome: ${{ steps.sync_task_queue_state.outcome }}
    if: inputs.autonomous_mode == true && inputs.issue_number == 226
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Check same-day Groq failure cooldown
        id: groq_cooldown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              since: todayUtc + 'T00:00:00Z',
              per_page: 100,
            });
            const markerComment = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_GROQ_FAILURE_COOLDOWN:'));
            const match = markerComment?.body?.match(/<!-- BOONTA_GROQ_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/);
            const failedOn = match?.[1] || '';
            const active = failedOn === todayUtc;
            core.setOutput('active', String(active));
            core.setOutput('failed_on', failedOn);
            if (active) {
              core.notice('Groq Free already failed during UTC day ' + todayUtc + '; skip another request until the next UTC day.');
            } else {
              core.info('No active same-day Groq Free failure cooldown.');
            }
      - name: Require explicit Groq Free and autonomous owner gates
        id: free_tier_guard
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.TA_CLE_GROQ }}
          GROQ_FREE_TIER_CONFIRMED: ${{ vars.GROQ_FREE_TIER_CONFIRMED }}
          GEMINI_AUTONOMOUS_ENABLED: ${{ vars.GEMINI_AUTONOMOUS_ENABLED }}
          AUTONOMOUS_MODE: ${{ inputs.autonomous_mode }}
          AUTONOMOUS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GROQ_COOLDOWN_ACTIVE: ${{ steps.groq_cooldown.outputs.active }}
          GROQ_COOLDOWN_DATE: ${{ steps.groq_cooldown.outputs.failed_on }}
        run: |
          set -euo pipefail
          set +x
          reason="none"
          if [[ "${GROQ_FREE_TIER_CONFIRMED:-}" != "true" ]]; then
            reason="GROQ_FREE_TIER_CONFIRMED must equal true only after the owner verifies the Groq Free account, zero payment methods/credits, and no paid usage."
          elif [[ -z "${GROQ_API_KEY:-}" ]]; then
            reason="The TA_CLE_GROQ repository secret is missing; it is mapped to the GROQ_API_KEY environment variable for OpenCode."
          elif [[ "${GEMINI_AUTONOMOUS_ENABLED:-}" != "true" ]]; then
            reason="The master GEMINI_AUTONOMOUS_ENABLED owner gate is not exactly true."
          elif [[ "${AUTONOMOUS_MODE:-false}" != "true" || "${AUTONOMOUS_ISSUE_NUMBER:-}" != "226" ]]; then
            reason="Groq fallback is restricted to autonomous issue #226."
          elif [[ "${CALLER_WORKFLOW:-}" != "Boonta Autonomous Loop" || "${CALLER_REF:-}" != "refs/heads/main" ]]; then
            reason="Groq fallback may only be called by Boonta Autonomous Loop from main."
          elif [[ "${CALLER_EVENT:-}" != "schedule" && "${CALLER_EVENT:-}" != "workflow_dispatch" && "${CALLER_EVENT:-}" != "push" ]]; then
            reason="Unsupported caller event; only schedule, owner-dispatched workflow, or owner-authorized main push is allowed."
          elif [[ "${GROQ_COOLDOWN_ACTIVE:-}" == "true" ]]; then
            reason="Groq Free already failed an autonomous invocation on UTC date ${GROQ_COOLDOWN_DATE:-today}; skip repeated requests until the next UTC day. No provider request will be made."
          elif [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            reason="The scoped GitHub App ID variable or private-key secret is missing."
          fi

          if [[ "$reason" != "none" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Groq Free fallback skipped safely"
              echo
              echo "$reason"
              echo "No Groq request, repository write, or paid fallback was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
            {
              echo "## Groq Free fallback gate passed"
              echo
              echo "Only the fixed groq/openai/gpt-oss-20b model is configured. Groq Free plan only; no paid model/provider fallback is available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Revalidate selected task after acquiring the shared writer slot
        id: fresh_task_guard
        if: inputs.autonomous_mode == true && steps.free_tier_guard.outputs.allowed == 'true' && inputs.resume_mode != true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const taskId = process.env.TASK_ID || '';
            const targetBranch = process.env.TASK_TARGET_BRANCH || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const failClosed = (reason) => {
              core.setOutput('allowed', 'false');
              core.setFailed('Fresh task revalidation blocked before provider invocation: ' + reason);
            };
            
            if (issueNumber !== 226) {
              failClosed('autonomous task execution is restricted to canonical issue #226');
              return;
            }
            if (!/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(taskId)) {
              failClosed('selected task ID is missing or malformed');
              return;
            }
            if (!['main', 'dev'].includes(targetBranch)) {
              failClosed('selected target branch must be main or dev');
              return;
            }
            
            // This GET-only check runs after the shared boonta-single-writer concurrency
            // slot has been acquired. It refreshes the earlier global selection so a run
            // that waited in the queue cannot act on a task that changed meanwhile.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main'
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              failClosed('canonical compact task ledger is missing or not a base64 file');
              return;
            }
            
            let ledgerSummary;
            try {
              ledgerSummary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            } catch (error) {
              failClosed('canonical compact task ledger is not valid JSON');
              return;
            }
            if (
              ledgerSummary.schema_version !== 2 ||
              ledgerSummary.source !== 'docs/automation/task-ledger.json' ||
              !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(ledgerSummary.updated_at || '') ||
              ledgerSummary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(ledgerSummary.tasks) ||
              !Array.isArray(ledgerSummary.completed_task_ids) ||
              ledgerSummary.completed_task_ids.some((id) => typeof id !== 'string' || !id.trim()) ||
              new Set(ledgerSummary.completed_task_ids).size !== ledgerSummary.completed_task_ids.length
            ) {
              failClosed('canonical compact task ledger schema, completed dependencies or one-active-task policy is invalid');
              return;
            }
            const completedTaskIds = new Set(ledgerSummary.completed_task_ids);
            
            const taskIds = ledgerSummary.tasks.map((task) => task?.task_id);
            if (
              taskIds.some((id) => typeof id !== 'string' || !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(id)) ||
              new Set(taskIds).size !== taskIds.length
            ) {
              failClosed('canonical compact task ledger contains missing, invalid or duplicate task IDs');
              return;
            }
            const activeTasks = ledgerSummary.tasks.filter((task) => task.status === 'active');
            if (activeTasks.length > 1) {
              failClosed('canonical task ledger violates the one-active-task policy');
              return;
            }
            const matches = ledgerSummary.tasks.filter((task) => task.task_id === taskId);
            if (matches.length !== 1) {
              failClosed('the selected task is no longer present exactly once in the canonical ledger');
              return;
            }
            const task = matches[0];
            const activationBootstrap = taskId === 'AUTOMATION-LEDGER-ACTIVATION';
            const dependenciesSatisfied = Array.isArray(task.depends_on) &&
              task.depends_on.every((dependencyId) =>
                typeof dependencyId === 'string' && completedTaskIds.has(dependencyId)
              );
            const activeReservation = task.status === 'active' &&
              activeTasks.length === 1 && activeTasks[0].task_id === taskId &&
              dependenciesSatisfied;
            const approvedQueuePromotion = task.status === 'queued' &&
              task.owner_approved === true && activeTasks.length === 0 &&
              dependenciesSatisfied;
            const eligibleStatus = activationBootstrap
              ? task.status === 'blocked' && activeTasks.length === 0
              : activeReservation || approvedQueuePromotion;
            if (!eligibleStatus) {
              failClosed('the selected task status or active-task reservation changed while this run waited');
              return;
            }
            if (
              task.target_branch !== targetBranch ||
              !task.title?.trim() ||
              !task.question_excerpt?.trim() ||
              !task.next_action_excerpt?.trim() ||
              !Array.isArray(task.acceptance_criteria_excerpt) ||
              task.acceptance_criteria_excerpt.length === 0 ||
              !Array.isArray(task.platform_scope) ||
              task.platform_scope.length === 0 ||
              !Array.isArray(task.read_paths) ||
              task.read_paths.length < 1 || task.read_paths.length > 4 ||
              task.read_paths.some((path) =>
                typeof path !== 'string' || path.length > 120 ||
                !/^[A-Za-z0-9._/-]+$/.test(path) || path.startsWith('/') ||
                path.split('/').some((part) => !part || part === '.' || part === '..') ||
                path === 'docs/automation/task-ledger.json' ||
                path === 'docs/automation/task-ledger-summary.json' ||
                path.split('/').some((part) => ['generated', 'roms', 'private'].includes(part.toLowerCase()))
              ) ||
              new Set(task.read_paths).size !== task.read_paths.length
            ) {
              failClosed('the selected task no longer matches its canonical branch or complete execution context');
              return;
            }
            if (task.pr_url || task.head_sha) {
              failClosed('the selected task already has PR or HEAD evidence and must be reconciled before another run');
              return;
            }
            
            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              failClosed('open PR inventory reached the 100-item safety ceiling');
              return;
            }
            const markerLine = 'BOONTA_TASK_ID: ' + taskId;
            const duplicate = openPullRequests.find((pull) =>
              (pull.body || '').split(/\r?\n/).some((line) => line.trim() === markerLine)
            );
            if (duplicate) {
              failClosed('open PR #' + duplicate.number + ' already represents this exact task');
              return;
            }
            
            core.setOutput('allowed', 'true');
            core.info(
              'Fresh task revalidation passed after the shared writer slot: ' +
              taskId + ' -> ' + targetBranch + '; no matching open PR or stale ledger state.'
            );
      - name: Revalidate existing task PR after acquiring the shared writer slot
        id: fresh_resume_guard
        if: inputs.autonomous_mode == true && inputs.resume_mode == true && steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          RESUME_TASK_TITLE: ${{ inputs.resume_task_title }}
          RESUME_TASK_TARGET_BRANCH: ${{ inputs.resume_task_target_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RESUME_PR_NUMBER: ${{ inputs.resume_pr_number }}
          RESUME_PR_URL: ${{ inputs.resume_pr_url }}
          RESUME_BRANCH: ${{ inputs.resume_branch }}
          RESUME_HEAD_SHA: ${{ inputs.resume_head_sha }}
        with:
          script: |
            const taskId = process.env.RESUME_TASK_ID || '';
            const taskTitle = process.env.RESUME_TASK_TITLE || '';
            const targetBranch = process.env.RESUME_TASK_TARGET_BRANCH || '';
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const prNumber = Number(process.env.RESUME_PR_NUMBER || '0');
            const prUrl = process.env.RESUME_PR_URL || '';
            const branch = process.env.RESUME_BRANCH || '';
            const expectedHeadSha = process.env.RESUME_HEAD_SHA || '';
            const failClosed = (reason) => {
              core.setOutput('allowed', 'false');
              core.setFailed('Existing task PR resume blocked before provider invocation: ' + reason);
            };

            if (
              issueNumber !== 226 ||
              !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(taskId) ||
              !taskTitle.trim() ||
              !['main', 'dev'].includes(targetBranch) ||
              !Number.isSafeInteger(prNumber) || prNumber < 1 ||
              !/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/pull\/[1-9][0-9]*$/.test(prUrl) ||
              !branch || branch === targetBranch ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha)
            ) {
              failClosed('resume metadata is missing or malformed');
              return;
            }

            // Read-only, post-queue revalidation: no provider or write token is created by this step.
            const { data: ledgerFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/automation/task-ledger-summary.json',
              ref: 'main'
            });
            if (!ledgerFile || Array.isArray(ledgerFile) || ledgerFile.encoding !== 'base64') {
              failClosed('canonical compact task ledger is missing or not a base64 file');
              return;
            }
            let summary;
            try {
              summary = JSON.parse(Buffer.from(ledgerFile.content, 'base64').toString('utf8'));
            } catch (_error) {
              failClosed('canonical compact task ledger is not valid JSON');
              return;
            }
            if (
              summary.schema_version !== 2 ||
              summary.source !== 'docs/automation/task-ledger.json' ||
              summary.policy?.max_active_tasks !== 1 ||
              !Array.isArray(summary.tasks)
            ) {
              failClosed('canonical compact task ledger schema or one-active-task policy is invalid');
              return;
            }
            const ids = summary.tasks.map((task) => task?.task_id);
            if (
              ids.some((id) => typeof id !== 'string' || !/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(id)) ||
              new Set(ids).size !== ids.length
            ) {
              failClosed('canonical compact task ledger contains invalid or duplicate task IDs');
              return;
            }
            const activeTasks = summary.tasks.filter((task) => task.status === 'active');
            if (activeTasks.length > 1) {
              failClosed('canonical task ledger violates the one-active-task policy');
              return;
            }
            const matches = summary.tasks.filter((task) => task.task_id === taskId);
            if (matches.length !== 1) {
              failClosed('resume task is not present exactly once in the canonical ledger');
              return;
            }
            const task = matches[0];
            const activationBootstrap = taskId === 'AUTOMATION-LEDGER-ACTIVATION';
            const eligibleStatus = activationBootstrap
              ? task.status === 'blocked' && activeTasks.length === 0
              : task.status === 'active' && activeTasks.length === 1 && activeTasks[0].task_id === taskId;
            if (
              !eligibleStatus ||
              task.target_branch !== targetBranch ||
              task.title !== taskTitle ||
              !task.question_excerpt?.trim() ||
              !task.next_action_excerpt?.trim() ||
              !Array.isArray(task.acceptance_criteria_excerpt) ||
              task.acceptance_criteria_excerpt.length === 0 ||
              !Array.isArray(task.platform_scope) ||
              task.platform_scope.length === 0 ||
              task.pr_url || task.head_sha
            ) {
              failClosed('canonical task status, content, branch or unrecorded-PR evidence changed while the run waited');
              return;
            }

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              page: 1
            });
            if (!Array.isArray(openPullRequests) || openPullRequests.length >= 100) {
              failClosed('open PR inventory reached the 100-item safety ceiling');
              return;
            }
            const taskMarker = 'BOONTA_TASK_ID: ' + taskId;
            const targetMarker = 'BOONTA_TASK_TARGET_BRANCH: ' + targetBranch;
            const matching = openPullRequests.filter((pull) =>
              (pull.body || '').split(/\r?\n/).some((line) => line.trim() === taskMarker)
            );
            if (matching.length !== 1) {
              failClosed('exactly one open PR with the selected task marker is required');
              return;
            }
            const pull = matching[0];
            const bodyLines = (pull.body || '').split(/\r?\n/).map((line) => line.trim());
            const canonicalRepo = context.repo.owner + '/' + context.repo.repo;
            if (
              pull.number !== prNumber ||
              pull.state !== 'open' ||
              pull.draft !== false ||
              pull.user?.login !== context.repo.owner ||
              pull.head?.repo?.full_name !== canonicalRepo ||
              pull.base?.repo?.full_name !== canonicalRepo ||
              pull.base?.ref !== targetBranch ||
              pull.head?.ref !== branch ||
              pull.head?.ref === pull.base?.ref ||
              pull.head?.sha !== expectedHeadSha ||
              pull.html_url !== prUrl ||
              prUrl !== 'https://github.com/' + canonicalRepo + '/pull/' + prNumber ||
              bodyLines.filter((line) => line === taskMarker).length !== 1 ||
              bodyLines.filter((line) => line === targetMarker).length !== 1
            ) {
              failClosed('live PR does not match owner, same repository, non-draft state, task/target markers, base, branch, URL and reserved exact head SHA');
              return;
            }
            core.setOutput('allowed', 'true');
            core.info('Existing task PR #' + prNumber + ' revalidated after the writer lock at exact head ' + expectedHeadSha + '; no provider token has been minted yet.');

      - name: Mint scoped GitHub App token
        id: mint_identity_token
        if: steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Checkout the protected default branch
        if: steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: main
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Checkout selected task target for bounded source context
        if: steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: ${{ inputs.resume_mode == true && inputs.resume_task_target_branch || inputs.task_target_branch }}
          path: .boonta-target-source
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Install pinned OpenCode CLI
        if: steps.free_tier_guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Snapshot open PR heads before Groq cycle
        if: steps.free_tier_guard.outputs.allowed == 'true'
        id: snapshot_pr_heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'Master-Chiken',
              repo: 'boonta-reborn-88',
              state: 'open',
              per_page: 100
            });
            const snapshotAt = new Date().toISOString();
            const baseline = Object.fromEntries(pulls.map((pr) => [String(pr.number), pr.head.sha]));
            core.setOutput('heads', JSON.stringify(baseline));
            core.setOutput('snapshot_at', snapshotAt);
            core.info('Captured ' + pulls.length + ' open PR head(s) for cycle-fresh validation at ' + snapshotAt + '.');

      - name: Prepare the exact selected task and compact repository context
        id: prepare_context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success'
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          RESUME_MODE: ${{ inputs.resume_mode }}
          RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          RESUME_TASK_TITLE: ${{ inputs.resume_task_title }}
          RESUME_TASK_TARGET_BRANCH: ${{ inputs.resume_task_target_branch }}
          RESUME_TASK_DESCRIPTION: ${{ inputs.resume_task_description }}
        run: |
          set -euo pipefail
          if [[ "${RESUME_MODE:-false}" == "true" ]]; then
            TASK_ID="${RESUME_TASK_ID}"
            TASK_TITLE="${RESUME_TASK_TITLE}"
            TASK_TARGET_BRANCH="${RESUME_TASK_TARGET_BRANCH}"
            TASK_DESCRIPTION="${RESUME_TASK_DESCRIPTION}"
          fi
          repo_root=''
          for candidate in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/boonta-reborn-88"; do
            [[ -d "$candidate" ]] || continue
            candidate="$(cd "$candidate" && pwd -P)"
            if [[ -f "$candidate/tools/build_autonomous_context.py" && -f "$candidate/docs/REVERSE_ENGINEERING_FIRST.md" && -f "$candidate/docs/automation/AUTONOMOUS_CONTEXT_BUDGET.md" && -f "$candidate/docs/automation/task-ledger-summary.json" ]]; then
              git_root="$(git -C "$candidate" rev-parse --show-toplevel)"
              if [[ "$git_root" == "$candidate" ]]; then repo_root="$candidate"; break; fi
            fi
          done
          if [[ -z "$repo_root" ]]; then
            echo "::error::Could not identify the exact checked-out Boonta repository root; no Groq inference was sent."
            exit 1
          fi
          context="$(python3 "$repo_root/tools/build_autonomous_context.py" --root "$repo_root" --source-root "$GITHUB_WORKSPACE/.boonta-target-source" --task-id "$TASK_ID" --task-title "$TASK_TITLE" --target-branch "$TASK_TARGET_BRANCH" --task-context "$TASK_DESCRIPTION" --max-chars 3000 --max-task-context 1100 --max-criteria 4 --max-next-action 100 --max-source-chars 1800)"
          {
            printf 'repo_root=%s\n' "$repo_root"
            echo 'context<<BOONTA_CONTEXT_EOF'
            printf '%s\n' "$context"
            echo 'BOONTA_CONTEXT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run OpenCode through the Groq Free route
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.prepare_context.outcome == 'success'
        id: run_opencode
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.TA_CLE_GROQ }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token }}
          OPENCODE_EXPERIMENTAL_CODE_MODE: 'false'
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          TASK_BRANCH_NAME: autonomous-${{ inputs.task_id }}-${{ github.run_id }}
          RESUME_TASK_ID: ${{ inputs.resume_task_id }}
          RESUME_TASK_TITLE: ${{ inputs.resume_task_title }}
          RESUME_TASK_TARGET_BRANCH: ${{ inputs.resume_task_target_branch }}
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          AUTONOMOUS_CONTEXT: ${{ steps.prepare_context.outputs.context }}
          RESUME_MODE: ${{ inputs.resume_mode }}
          RESUME_PR_NUMBER: ${{ inputs.resume_pr_number }}
          RESUME_PR_URL: ${{ inputs.resume_pr_url }}
          RESUME_BRANCH: ${{ inputs.resume_branch }}
          RESUME_HEAD_SHA: ${{ inputs.resume_head_sha }}
          RESUME_FILE_PATHS: ${{ inputs.resume_file_paths }}
        run: |
          set -euo pipefail
          set +x

          if [[ "${RESUME_MODE:-false}" == "true" ]]; then
            TASK_ID="${RESUME_TASK_ID}"
            TASK_TITLE="${RESUME_TASK_TITLE}"
            TASK_TARGET_BRANCH="${RESUME_TASK_TARGET_BRANCH}"
            export GITHUB_TOOLS="get_file_contents,push_files"
          else
            export GITHUB_TOOLS="create_branch,create_pull_request,push_files"
          fi

          # This config exposes only the explicitly allow-listed GitHub MCP tools.
          # 1,550/256 limits; max 4 steps (7,224 nominal tokens). Exact task source excerpts are preloaded; no model file-read step.
          # Shell execution is denied; repository changes must use branch/PR MCP tools.
          cat > "$RUNNER_TEMP/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "groq/openai/gpt-oss-20b",
            "small_model": "groq/openai/gpt-oss-20b",
            "enabled_providers": ["groq"],
            "agent": {
              "build": {
                "steps": 4,
                "temperature": 0.2,
                "permission": {
                  "task": {
                    "*": "deny"
                  }
                }
              }
            },
            "provider": {
              "groq": {
                "models": {
                  "openai/gpt-oss-20b": {
                    "temperature": true,
                    "limit": {
                      "context": 1550,
                      "output": 256
                    }
                  }
                }
              }
            },
            "mcp": {
              "github": {
                "type": "local",
                "command": [
                  "docker", "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "-e", "GITHUB_TOOLS",
                  "ghcr.io/github/github-mcp-server:v0.27.0"
                ],
                "environment": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "{env:GITHUB_TOKEN}",
                  "GITHUB_TOOLS": "{env:GITHUB_TOOLS}"
                },
                "enabled": true,
                "timeout": 60000
              }
            },
            "permission": {
              "*": "allow",
              "bash": "deny",
              "read": "deny",
              "edit": "deny",
              "glob": "deny",
              "grep": "deny",
              "list": "deny"
            }
          }
          JSON

          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"

          PROMPT="$(cat <<'PROMPT'
          Groq Free, €0 only. Execute the one globally selected task.
          
          TASK
          - The preloaded schema-v2 context is authoritative. Global preflight is authoritative: task pr_url/head_sha are empty; no matching open PR exists. Do not search PR history or treat older merged automation PRs as current-cycle evidence. Use the preloaded excerpts for every exact task path from TASK_TARGET_BRANCH. Do not browse, list, call file-read tools, inspect other paths or reread the ledger. If an excerpt is insufficient, report BLOCKED rather than guess.
          - No full issue bodies/comments; exact source excerpts are preloaded.
          - Source excerpt budget: 1,800 characters.
          - Queued work: write only the exact paths in verified context's owner-reviewed write-path list; if absent, BLOCKED, no branch/PR.
          - No model-side reads or repo discovery.
          - Do not reopen, replay or recreate that chain. #327 is merged at 69deb6778f9383887118803428e7014686865a83; #317/#318/#319 are superseded.
          
          SAFETY
          - No paid routes, billing, credits, or provider/secret/settings changes. Stop after the first quota, TPM, rate-limit, context or auth error; never retry.
          - Preserve clean-room provenance; never upload commercial ROMs/assets. Never write main/dev, merge, force-push or delete refs.
          
          TOOLS / DELIVERY
          - Only github_create_branch, github_push_files and github_create_pull_request in normal mode. No source reads, shell, filesystem or subagents; excerpts are preloaded by the trusted workflow.
          - Use FQNs: github_create_branch, github_push_files, github_create_pull_request.
          - PR body has standalone BOONTA_TASK_ID and BOONTA_TASK_TARGET_BRANCH.
          - Four steps: create TASK_BRANCH_NAME from TASK_TARGET_BRANCH; push_files once with one coherent patch; create one non-draft PR; report.
          - PR body must contain BOONTA_TASK_ID and BOONTA_TASK_TARGET_BRANCH. Use returned PR URL/head_sha; no PR readback.
          
          REPORT
          - copy reserved BOONTA_CYCLE_TASK_ID and EVIDENCE_BASE verbatim. Output only machine-readable lines. PROGRESS needs same-repo PR URL, exact 40-char HEAD and base. BLOCKED needs one verified blocker and next action.
          PROMPT
          )"

          if [[ -z "${TASK_ID:-}" || -z "${TASK_TITLE:-}" || -z "${AUTONOMOUS_CONTEXT:-}" || -z "${REPO_ROOT:-}" || ! "${TASK_TARGET_BRANCH:-}" =~ ^(main|dev)$ ]]; then
            echo "::error::Global preflight or schema-v2 context builder did not pass; no Groq request was sent."
            exit 2
          fi
          PROMPT="${PROMPT}"$'\n\n'
          PROMPT+="${AUTONOMOUS_CONTEXT}"
          if [[ "${RESUME_MODE:-false}" != "true" ]]; then
            PROMPT+=$'\nSelected base: '"${TASK_TARGET_BRANCH}"$'\nNew branch: '"${TASK_BRANCH_NAME}"
          fi
          REPORT_TASK_ID="BOONTA_CYCLE_TASK_ID: ${TASK_ID}"
          REPORT_TARGET_BRANCH="BOONTA_CYCLE_EVIDENCE_BASE: ${TASK_TARGET_BRANCH}"
          PROMPT+=$'\n\n'"${REPORT_TASK_ID}"
          PROMPT+=$'\nBOONTA_CYCLE_STATUS: PROGRESS or BLOCKED'
          PROMPT+=$'\nBOONTA_CYCLE_EVIDENCE: https://github.com/Master-Chiken/boonta-reborn-88/pull/<number> @ <exact 40-character head SHA>'
          PROMPT+=$'\n'"${REPORT_TARGET_BRANCH}"
          PROMPT+=$'\nFor BLOCKED, omit the two evidence lines and output exactly one BOONTA_CYCLE_BLOCKER and one BOONTA_CYCLE_NEXT_ACTION.'

          if [[ "${RESUME_MODE:-false}" == "true" ]]; then
            if [[ ! "${RESUME_PR_NUMBER:-}" =~ ^[1-9][0-9]*$ || -z "${RESUME_PR_URL:-}" || -z "${RESUME_BRANCH:-}" || ! "${RESUME_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Verified resume metadata is incomplete; no Groq request was sent."
              exit 2
            fi
            if ! jq -e 'type == "array" and length >= 1 and length <= 4 and all(.[]; type == "string" and length > 0 and length <= 120 and test("^[A-Za-z0-9._/-]+$") and (split("/") | all(.[]; . != "" and . != "." and . != "..")))' <<<"${RESUME_FILE_PATHS:-}" >/dev/null; then
              echo "::error::Resume path allow-list is missing or invalid; no Groq request was sent."
              exit 2
            fi
            RESUME_ALLOWED_PATHS="$(jq -r '.[] | "- " + .' <<<"$RESUME_FILE_PATHS")"
            PROMPT="$(cat <<'RESUME_PROMPT'
          Groq Free, €0 only. Resume exactly one existing task PR.
          
          AUTHORITY
          - The preloaded task context and exact existing-PR metadata are authoritative. The workflow revalidated owner, same repository, open/non-draft, task/target markers, branch, URL and prior head SHA.
          - Do not search history, use agents, or inspect unrelated PRs. Read exactly one file from the preflight-verified changed-path allow-list appended below.
          
          WRITE
          - Only github_get_file_contents and github_push_files are exposed. Read exactly one listed path using the supplied existing branch as the ref, then call github_push_files once with the full updated file content on that same branch.
          - Never create a branch or PR; never write main/dev, merge, force-push, delete refs, change secrets or edit the canonical ledger.
          - Preserve provenance and licenses. Stop rather than guess.
          
          EVIDENCE
          - PROGRESS requires the existing PR URL and exact new SHA returned by github_push_files. The shared validator checks freshness and exact-head CI.
          - Otherwise report BLOCKED with one verified blocker and next action.
          
          REPORT
          - Output only machine-readable lines; copy the task ID and target branch appended below. No prose or fences.
          RESUME_PROMPT
          )"
            PROMPT="${PROMPT}"$'\n\n'
            PROMPT+="${AUTONOMOUS_CONTEXT}"
            PROMPT+=$'\nPR: '"${RESUME_PR_URL}"
            PROMPT+=$'\nBranch: '"${RESUME_BRANCH}"
            PROMPT+=$'\nPrior HEAD: '"${RESUME_HEAD_SHA}"
            PROMPT+=$'\nPreflight-verified changed paths (read at most one):\n'"${RESUME_ALLOWED_PATHS}"
            PROMPT+=$'\nRead no other paths. Preserve the existing branch and PR; do not create a new one.'
            REPORT_TASK_ID="BOONTA_CYCLE_TASK_ID: ${TASK_ID}"
            REPORT_TARGET_BRANCH="BOONTA_CYCLE_EVIDENCE_BASE: ${TASK_TARGET_BRANCH}"
            PROMPT+=$'\n\n'"${REPORT_TASK_ID}"
            PROMPT+=$'\nBOONTA_CYCLE_STATUS: PROGRESS or BLOCKED'
            PROMPT+=$'\nBOONTA_CYCLE_EVIDENCE: '"${RESUME_PR_URL}"' @ <exact new 40-character SHA returned by github_push_files>'
            PROMPT+=$'\n'"${REPORT_TARGET_BRANCH}"
            PROMPT+=$'\nFor BLOCKED omit evidence and include one BOONTA_CYCLE_BLOCKER and BOONTA_CYCLE_NEXT_ACTION.'
          fi

          # Refuse accidental prompt growth before any provider request.
          if (( ${#PROMPT} > 5500 )); then
            echo "::error::Groq prompt exceeds the 5,500-character TPM safety ceiling; no model request was sent."
            exit 2
          fi
          echo "Groq prompt size: ${#PROMPT} characters."
          # Local prompt/context guards must never create a provider cooldown.
          echo "provider_request_started=true" >> "$GITHUB_OUTPUT"
          # OpenCode 1.19.5 retries retryable 429/TPM failures internally. Stop
          # the process group on the first terminal Free-quota/TPM response so
          # one agent invocation cannot consume the provider limit repeatedly.
          python3 - "$PROMPT" "$RUNNER_TEMP/opencode-cycle-report.txt" "$REPO_ROOT" <<'PY'
          import os
          import re
          import signal
          import subprocess
          import sys

          prompt, report_path, workspace = sys.argv[1:]
          command = [
              "timeout", "--signal=TERM", "--kill-after=5s", "90s",
              "opencode", "run", "--model", "groq/openai/gpt-oss-20b",
              "--auto", "--dir", workspace, prompt,
          ]
          terminal_quota_error = re.compile(
              r"(tokens per minute\s*\(TPM\)|free-models-per-day|free-models-per-minute|"
              r"resource[_ ]exhausted|rate[_ ]limit exceeded|too many requests|"
              r"HTTP\s*429|status(?:\s*code)?\s*[:=]?\s*429|error code\s*[:=]?\s*429|"
              r"HTTP\s*401|status(?:\s*code)?\s*[:=]?\s*401|error code\s*[:=]?\s*401|"
              r"missing authentication header|unauthorized|invalid api key|authentication failed)",
              re.IGNORECASE,
          )
          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1,
              start_new_session=True,
          )

          def stop_process_group():
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()

          def handle_shutdown(signum, _frame):
              stop_process_group()
              raise SystemExit(128 + signum)

          # Match OpenRouter: runner cancellation must not orphan the timeout,
          # OpenCode process, or any descendant in the provider process group.
          signal.signal(signal.SIGTERM, handle_shutdown)
          signal.signal(signal.SIGINT, handle_shutdown)

          with open(report_path, "w", encoding="utf-8") as report:
              assert process.stdout is not None
              for line in process.stdout:
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  report.write(line)
                  report.flush()
                  if terminal_quota_error.search(line):
                      print(
                          "Groq provider quota/auth refusal detected; terminating OpenCode "
                          "immediately after the first refusal. Daily cooldown will be recorded.",
                          flush=True,
                      )
                      stop_process_group()
                      sys.exit(75)

          invocation_status = process.wait()
          if invocation_status in (124, 137):
              print(
                  "Groq invocation reached its 90-second hard limit; daily cooldown will be recorded.",
                  flush=True,
              )
          sys.exit(invocation_status)
          PY


      - name: Validate Groq autonomous cycle report
        id: validate_report
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.run_opencode.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          REPORT_PATH: ${{ runner.temp }}/opencode-cycle-report.txt
          PRE_CYCLE_PR_HEADS: ${{ steps.snapshot_pr_heads.outputs.heads }}
          PRE_CYCLE_PR_SNAPSHOT_AT: ${{ steps.snapshot_pr_heads.outputs.snapshot_at }}
          SELECTED_TASK_ID: ${{ inputs.task_id }}
          SELECTED_TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { bindCycleReportToReservedTask } = require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            let summary;
            try {
              summary = bindCycleReportToReservedTask(
                fs.readFileSync(process.env.REPORT_PATH, 'utf8'),
                process.env.SELECTED_TASK_ID,
                process.env.SELECTED_TASK_TARGET_BRANCH
              );
            } catch (error) {
              core.setFailed('Groq report could not be bound to the reserved task: ' + error.message);
              return;
            }
            const lines = summary.split(/\r?\n/);
            const statusLines = lines.filter((line) => line.startsWith('BOONTA_CYCLE_STATUS:'));
            if (statusLines.length === 1 && statusLines[0] === 'BOONTA_CYCLE_STATUS: BLOCKED') {
              const blocker = lines.filter((line) => line.startsWith('BOONTA_CYCLE_BLOCKER: ')).join(' ');
              const nextAction = lines.filter((line) => line.startsWith('BOONTA_CYCLE_NEXT_ACTION: ')).join(' ');
              const { findBlockedReportContradictions } = require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
              const contradictions = findBlockedReportContradictions(blocker + ' ' + nextAction, {
                githubAppTokenMinted: process.env.GITHUB_APP_TOKEN_OUTCOME === 'success'
              });
              if (contradictions.length > 0) {
                core.setFailed('BLOCKED report contradicts same-run GitHub App evidence: ' + contradictions.join('; '));
                return;
              }
            }
            const { validateAutonomousCycleReport } = require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            await validateAutonomousCycleReport({
              github,
              context,
              core,
              summary,
              baseline: JSON.parse(process.env.PRE_CYCLE_PR_HEADS || '{}'),
              snapshotAt: process.env.PRE_CYCLE_PR_SNAPSHOT_AT,
              expectedTaskId: process.env.SELECTED_TASK_ID,
              expectedBase: process.env.SELECTED_TASK_TARGET_BRANCH,
              provider: 'Groq'
            });

      - name: Sync the single-task daily backoff marker
        id: sync_task_queue_state
        if: steps.validate_report.outcome == 'success' && (steps.validate_report.outputs.cycle_status == 'blocked' || inputs.task_blocked_active == true)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          CYCLE_STATUS: ${{ steps.validate_report.outputs.cycle_status }}
          BLOCKED_FINGERPRINT: ${{ steps.validate_report.outputs.blocked_fingerprint }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const cycleStatus = process.env.CYCLE_STATUS || '';
            const isBlocked = cycleStatus === 'blocked';
            const fingerprint = process.env.BLOCKED_FINGERPRINT || '';
            if (isBlocked && !/^[0-9a-f]{16}$/.test(fingerprint)) {
              core.setFailed('A valid BLOCKED report must include its deterministic task fingerprint before persistence.');
              return;
            }
            if (!isBlocked && cycleStatus !== 'progress') {
              core.info('No validated task state to persist.');
              return;
            }
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = isBlocked
              ? '<!-- BOONTA_TASK_BLOCKED_COOLDOWN: ' + todayUtc + ' ' + fingerprint + ' -->'
              : '<!-- BOONTA_TASK_BLOCKED_COOLDOWN_CLEARED: ' + todayUtc + ' -->';
            const body = [
              marker,
              isBlocked ? '## Single active task — daily backoff' : '## Single active task — backoff cleared',
              '',
              isBlocked
                ? 'A valid BLOCKED report was verified for the single active task on UTC date ' + todayUtc + '.'
                : 'A cycle-fresh PROGRESS report passed exact-head validation on UTC date ' + todayUtc + '.',
              isBlocked
                ? 'Fingerprint: ' + fingerprint + '. Scheduled provider calls are paused for the remainder of this UTC day to avoid repeating the same blocked task.'
                : 'The previous same-day task backoff is cleared. The next eligible scheduled cycle may select work again.',
              'A valid BLOCKED report is not a provider failure; this task backoff does not record a provider cooldown.',
              'An owner-authorized manual dispatch or qualifying main push may re-evaluate the task before the next UTC day.',
              '',
              '[Inspect the validated cycle](' + process.env.RUN_URL + ')',
            ].join('\\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes('<!-- BOONTA_TASK_BLOCKED_COOLDOWN')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(isBlocked
                ? 'Updated the single persistent same-day task backoff marker.'
                : 'Cleared the single persistent same-day task backoff marker.');
            } else if (isBlocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the single persistent same-day task backoff marker.');
            } else {
              core.info('No previous task backoff marker needed clearing.');
            }
      - name: Record same-day Groq cooldown after an invocation failure
        if: always() && ((steps.run_opencode.outputs.provider_request_started == 'true' && steps.run_opencode.outcome != 'success' && steps.run_opencode.outcome != 'skipped') || steps.validate_report.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = '<!-- BOONTA_GROQ_FAILURE_COOLDOWN: ' + todayUtc + ' -->';
            const body = [
              marker,
              '## Groq Free daily failure cooldown',
              '',
              'The autonomous Groq Free invocation or cycle-report validation failed on UTC date ' + todayUtc + '.',
              'Further fallback cycles on this UTC date will skip another Groq request. A fresh attempt is allowed on the next UTC date.',
              'This marker does not change provider settings, billing, secrets, quota, or owner attestations.',
              '',
              '[Inspect the failed Groq invocation](' + process.env.RUN_URL + ')',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_GROQ_FAILURE_COOLDOWN:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated the single persistent Groq cooldown marker on issue #' + issueNumber + '.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the persistent Groq cooldown marker on issue #' + issueNumber + '.');
            }
      - name: Fail visibly if the Groq fallback did not complete
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          GATE_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_pr_heads.outcome }}
          INVOCATION_OUTCOME: ${{ steps.run_opencode.outcome }}
          REPORT_OUTCOME: ${{ steps.validate_report.outcome }}
        with:
          script: |
            const allowed = process.env.GATE_ALLOWED === 'true';
            const outcomes = {
              snapshot: process.env.SNAPSHOT_OUTCOME || 'skipped',
              invocation: process.env.INVOCATION_OUTCOME || 'skipped',
              report: process.env.REPORT_OUTCOME || 'skipped',
            };
            if (!allowed) {
              core.setFailed('Groq fallback did not execute: its independent Free-only/owner gate blocked the request. No provider request was sent; the separate Groq Free fallback may now be evaluated.');
            } else if (outcomes.snapshot !== 'success' || outcomes.invocation !== 'success' || outcomes.report !== 'success') {
              core.setFailed('Groq fallback did not complete. Required outcomes: PR snapshot, actual OpenCode invocation, and report validation must all be success. Observed: ' + JSON.stringify(outcomes));
            } else {
              core.info('Groq fallback passed all execution postconditions: gate, actual invocation, and validated report.');
            }
