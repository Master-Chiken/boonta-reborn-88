name: Groq Free autonomous fallback

on:
  workflow_call:
    outputs:
      invocation_outcome:
        description: "Outcome of the actual Groq/OpenCode invocation step."
        value: ${{ jobs.groq-plan-execute.outputs.invocation_outcome }}
      report_outcome:
        description: "Outcome of the Groq autonomous report validator."
        value: ${{ jobs.groq-plan-execute.outputs.report_outcome }}
      cycle_status:
        description: "Validated Groq cycle status: progress or blocked."
        value: ${{ jobs.groq-plan-execute.outputs.cycle_status }}
      task_queue_state_outcome:
        description: "Outcome of persisting or clearing the single-task daily backoff marker."
        value: ${{ jobs.groq-plan-execute.outputs.task_queue_state_outcome }}
    inputs:
      autonomous_mode:
        type: boolean
        required: true
      issue_number:
        type: number
        required: true
      task_id:
        type: string
        required: false
      task_title:
        type: string
        required: false
      task_target_branch:
        type: string
        required: false
      task_description:
        type: string
        required: false
      task_blocked_active:
        type: boolean
        required: false
        default: false

concurrency:
  group: boonta-single-writer
  cancel-in-progress: false

jobs:
  groq-plan-execute:
    name: One bounded Groq Free research/engineering cycle
    outputs:
      invocation_outcome: ${{ steps.run_opencode.outcome }}
      report_outcome: ${{ steps.validate_report.outcome }}
      cycle_status: ${{ steps.validate_report.outputs.cycle_status }}
      task_queue_state_outcome: ${{ steps.sync_task_queue_state.outcome }}
    if: inputs.autonomous_mode == true && inputs.issue_number == 226
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Check same-day Groq failure cooldown
        id: groq_cooldown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              since: todayUtc + 'T00:00:00Z',
              per_page: 100,
            });
            const markerComment = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_GROQ_FAILURE_COOLDOWN:'));
            const match = markerComment?.body?.match(/<!-- BOONTA_GROQ_FAILURE_COOLDOWN: ([0-9]{4}-[0-9]{2}-[0-9]{2}) -->/);
            const failedOn = match?.[1] || '';
            const active = failedOn === todayUtc;
            core.setOutput('active', String(active));
            core.setOutput('failed_on', failedOn);
            if (active) {
              core.notice('Groq Free already failed during UTC day ' + todayUtc + '; skip another request until the next UTC day.');
            } else {
              core.info('No active same-day Groq Free failure cooldown.');
            }
      - name: Require explicit Groq Free and autonomous owner gates
        id: free_tier_guard
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.TA_CLE_GROQ }}
          GROQ_FREE_TIER_CONFIRMED: ${{ vars.GROQ_FREE_TIER_CONFIRMED }}
          GEMINI_AUTONOMOUS_ENABLED: ${{ vars.GEMINI_AUTONOMOUS_ENABLED }}
          AUTONOMOUS_MODE: ${{ inputs.autonomous_mode }}
          AUTONOMOUS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GROQ_COOLDOWN_ACTIVE: ${{ steps.groq_cooldown.outputs.active }}
          GROQ_COOLDOWN_DATE: ${{ steps.groq_cooldown.outputs.failed_on }}
        run: |
          set -euo pipefail
          set +x
          reason="none"
          if [[ "${GROQ_FREE_TIER_CONFIRMED:-}" != "true" ]]; then
            reason="GROQ_FREE_TIER_CONFIRMED must equal true only after the owner verifies the Groq Free account, zero payment methods/credits, and no paid usage."
          elif [[ -z "${GROQ_API_KEY:-}" ]]; then
            reason="The TA_CLE_GROQ repository secret is missing; it is mapped to the GROQ_API_KEY environment variable for OpenCode."
          elif [[ "${GEMINI_AUTONOMOUS_ENABLED:-}" != "true" ]]; then
            reason="The master GEMINI_AUTONOMOUS_ENABLED owner gate is not exactly true."
          elif [[ "${AUTONOMOUS_MODE:-false}" != "true" || "${AUTONOMOUS_ISSUE_NUMBER:-}" != "226" ]]; then
            reason="Groq fallback is restricted to autonomous issue #226."
          elif [[ "${CALLER_WORKFLOW:-}" != "Boonta Autonomous Loop" || "${CALLER_REF:-}" != "refs/heads/main" ]]; then
            reason="Groq fallback may only be called by Boonta Autonomous Loop from main."
          elif [[ "${CALLER_EVENT:-}" != "schedule" && "${CALLER_EVENT:-}" != "workflow_dispatch" && "${CALLER_EVENT:-}" != "push" ]]; then
            reason="Unsupported caller event; only schedule, owner-dispatched workflow, or owner-authorized main push is allowed."
          elif [[ "${GROQ_COOLDOWN_ACTIVE:-}" == "true" ]]; then
            reason="Groq Free already failed an autonomous invocation on UTC date ${GROQ_COOLDOWN_DATE:-today}; skip repeated requests until the next UTC day. No provider request will be made."
          elif [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            reason="The scoped GitHub App ID variable or private-key secret is missing."
          fi

          if [[ "$reason" != "none" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Groq Free fallback skipped safely"
              echo
              echo "$reason"
              echo "No Groq request, repository write, or paid fallback was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=none" >> "$GITHUB_OUTPUT"
            {
              echo "## Groq Free fallback gate passed"
              echo
              echo "Only the fixed groq/openai/gpt-oss-20b model is configured. Groq Free plan only; no paid model/provider fallback is available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint scoped GitHub App token
        id: mint_identity_token
        if: steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Checkout the protected default branch
        if: steps.free_tier_guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned actions/checkout v7.0.1
        with:
          ref: main
          token: ${{ steps.mint_identity_token.outputs.token }}
          persist-credentials: false

      - name: Install pinned OpenCode CLI
        if: steps.free_tier_guard.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.5
          opencode --version

      - name: Snapshot open PR heads before Groq cycle
        if: steps.free_tier_guard.outputs.allowed == 'true'
        id: snapshot_pr_heads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'Master-Chiken',
              repo: 'boonta-reborn-88',
              state: 'open',
              per_page: 100
            });
            const snapshotAt = new Date().toISOString();
            const baseline = Object.fromEntries(pulls.map((pr) => [String(pr.number), pr.head.sha]));
            core.setOutput('heads', JSON.stringify(baseline));
            core.setOutput('snapshot_at', snapshotAt);
            core.info('Captured ' + pulls.length + ' open PR head(s) for cycle-fresh validation at ' + snapshotAt + '.');

      - name: Prepare the exact selected task and compact repository context
        id: prepare_context
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success'
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          TASK_DESCRIPTION: ${{ inputs.task_description }}
        run: |
          set -euo pipefail
          repo_root=''
          for candidate in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/boonta-reborn-88"; do
            [[ -d "$candidate" ]] || continue
            candidate="$(cd "$candidate" && pwd -P)"
            if [[ -f "$candidate/tools/build_autonomous_context.py" && -f "$candidate/docs/REVERSE_ENGINEERING_FIRST.md" && -f "$candidate/docs/automation/AUTONOMOUS_CONTEXT_BUDGET.md" && -f "$candidate/docs/automation/task-ledger-summary.json" ]]; then
              git_root="$(git -C "$candidate" rev-parse --show-toplevel)"
              if [[ "$git_root" == "$candidate" ]]; then repo_root="$candidate"; break; fi
            fi
          done
          if [[ -z "$repo_root" ]]; then
            echo "::error::Could not identify the exact checked-out Boonta repository root; no Groq inference was sent."
            exit 1
          fi
          context="$(python3 "$repo_root/tools/build_autonomous_context.py" --root "$repo_root" --task-id "$TASK_ID" --task-title "$TASK_TITLE" --target-branch "$TASK_TARGET_BRANCH" --task-context "$TASK_DESCRIPTION" --max-chars 1500 --max-task-context 1400)"
          {
            printf 'repo_root=%s\n' "$repo_root"
            echo 'context<<BOONTA_CONTEXT_EOF'
            printf '%s\n' "$context"
            echo 'BOONTA_CONTEXT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Run OpenCode through the Groq Free route
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.prepare_context.outcome == 'success'
        id: run_opencode
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.TA_CLE_GROQ }}
          GITHUB_TOKEN: ${{ steps.mint_identity_token.outputs.token }}
          OPENCODE_EXPERIMENTAL_CODE_MODE: 'false'
          TASK_ID: ${{ inputs.task_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          REPO_ROOT: ${{ steps.prepare_context.outputs.repo_root }}
          AUTONOMOUS_CONTEXT: ${{ steps.prepare_context.outputs.context }}
        run: |
          set -euo pipefail
          set +x

          # This config exposes only the explicitly allow-listed GitHub MCP tools.
          # 1,536/96 limits; max 3 steps. Leave margin below the observed 8k TPM ceiling.
          # Shell execution is denied; repository changes must use branch/PR MCP tools.
          cat > "$RUNNER_TEMP/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "groq/openai/gpt-oss-20b",
            "small_model": "groq/openai/gpt-oss-20b",
            "enabled_providers": ["groq"],
            "agent": {
              "build": {
                "steps": 3,
                "permission": {
                  "task": {
                    "*": "deny"
                  }
                }
              }
            },
            "provider": {
              "groq": {
                "models": {
                  "openai/gpt-oss-20b": {
                    "limit": {
                      "context": 1536,
                      "output": 96
                    }
                  }
                }
              }
            },
            "mcp": {
              "github": {
                "type": "local",
                "command": [
                  "docker", "run", "-i", "--rm",
                  "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "-e", "GITHUB_TOOLS",
                  "ghcr.io/github/github-mcp-server:v0.27.0"
                ],
                "environment": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "{env:GITHUB_TOKEN}",
                  "GITHUB_TOOLS": "get_file_contents,search_pull_requests,create_branch,push_files,create_pull_request"
                },
                "enabled": true,
                "timeout": 60000
              }
            },
            "permission": {
              "*": "allow",
              "bash": "deny",
              "read": "deny",
              "edit": "deny",
              "glob": "deny",
              "grep": "deny",
              "list": "deny"
            }
          }
          JSON

          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"

          PROMPT="$(cat <<'PROMPT'
          Groq Free. €0 only; execute the preflight-selected task.
          TASK
          - The preloaded schema-v2 context is authoritative. Match exact BOONTA_TASK_ID across all PR states; read at most one task row.
          - Complete only on a merged PR with matching repository, base and exact HEAD. Closed-unmerged is incomplete. If already complete, reconcile the ledger with the original PR URL and task SHA, regenerate the summary, and use the next queued task; never cite a ledger-update SHA.
          - PR #327 is merged at 69deb6778f9383887118803428e7014686865a83; #317/#318/#319 are superseded. Do not recreate them.
          SAFETY
          - No paid routes, billing, credits, or provider/secret/settings changes. Stop after the first quota, TPM, rate-limit, context or auth error; never retry.
          - No full bodies/comments for #156/#226/#279; new retrieved text below 300 tokens.
          - One task/writer/branch/patch/PR. Never write main/dev, merge/auto-merge, force-push or delete refs.
          TOOLS
          - Only MCP tools: get_file_contents, search_pull_requests, create_branch, push_files, create_pull_request. Use FQNs: github_get_file_contents, github_search_pull_requests, github_create_branch, github_push_files, github_create_pull_request.
          - Direct MCP only; no shell, execute wrapper, filesystem tools or subagents.
          DELIVERY
          - Exact-task PR search; max one row read, one branch, one push_files patch, one non-draft PR, exact HEAD readback.
          - PR body has standalone BOONTA_TASK_ID and BOONTA_TASK_TARGET_BRANCH.
          - Machine report only; copy reserved BOONTA_CYCLE_TASK_ID and EVIDENCE_BASE verbatim. PROGRESS needs same-repo PR URL, 40-char HEAD and base. BLOCKED needs one verified blocker and next action.
          PROMPT
          )"

          if [[ -z "${TASK_ID:-}" || -z "${TASK_TITLE:-}" || -z "${AUTONOMOUS_CONTEXT:-}" || -z "${REPO_ROOT:-}" || ! "${TASK_TARGET_BRANCH:-}" =~ ^(main|dev)$ ]]; then
            echo "::error::Global preflight or schema-v2 context builder did not pass; no Groq request was sent."
            exit 2
          fi
          PROMPT="${PROMPT}"$'\n\n'
          PROMPT+="${AUTONOMOUS_CONTEXT}"
          REPORT_TASK_ID="BOONTA_CYCLE_TASK_ID: ${TASK_ID}"
          REPORT_TARGET_BRANCH="BOONTA_CYCLE_EVIDENCE_BASE: ${TASK_TARGET_BRANCH}"
          PROMPT+=$'\n\n'"${REPORT_TASK_ID}"
          PROMPT+=$'\nBOONTA_CYCLE_STATUS: PROGRESS or BLOCKED'
          PROMPT+=$'\nBOONTA_CYCLE_EVIDENCE: https://github.com/Master-Chiken/boonta-reborn-88/pull/<number> @ <exact 40-character head SHA>'
          PROMPT+=$'\n'"${REPORT_TARGET_BRANCH}"
          PROMPT+=$'\nFor BLOCKED, omit the two evidence lines and output exactly one BOONTA_CYCLE_BLOCKER and one BOONTA_CYCLE_NEXT_ACTION.'

          # Refuse accidental prompt growth before any provider request.
          if (( ${#PROMPT} > 3600 )); then
            echo "::error::Groq prompt exceeds the 3,600-character TPM safety ceiling; no model request was sent."
            exit 2
          fi
          echo "Groq prompt size: ${#PROMPT} characters."
          # Local prompt/context guards must never create a provider cooldown.
          echo "provider_request_started=true" >> "$GITHUB_OUTPUT"
          # OpenCode 1.19.5 retries retryable 429/TPM failures internally. Stop
          # the process group on the first terminal Free-quota/TPM response so
          # one agent invocation cannot consume the provider limit repeatedly.
          python3 - "$PROMPT" "$RUNNER_TEMP/opencode-cycle-report.txt" "$REPO_ROOT" <<'PY'
          import os
          import re
          import signal
          import subprocess
          import sys

          prompt, report_path, workspace = sys.argv[1:]
          command = [
              "timeout", "--signal=TERM", "--kill-after=5s", "90s",
              "opencode", "run", "--model", "groq/openai/gpt-oss-20b",
              "--auto", "--dir", workspace, prompt,
          ]
          terminal_quota_error = re.compile(
              r"(tokens per minute\s*\(TPM\)|free-models-per-day|free-models-per-minute|"
              r"resource[_ ]exhausted|rate[_ ]limit exceeded|too many requests|"
              r"HTTP\s*429|status(?:\s*code)?\s*[:=]?\s*429|error code\s*[:=]?\s*429|"
              r"HTTP\s*401|status(?:\s*code)?\s*[:=]?\s*401|error code\s*[:=]?\s*401|"
              r"missing authentication header|unauthorized|invalid api key|authentication failed)",
              re.IGNORECASE,
          )
          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1,
              start_new_session=True,
          )

          def stop_process_group():
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()

          def handle_shutdown(signum, _frame):
              stop_process_group()
              raise SystemExit(128 + signum)

          # Match OpenRouter: runner cancellation must not orphan the timeout,
          # OpenCode process, or any descendant in the provider process group.
          signal.signal(signal.SIGTERM, handle_shutdown)
          signal.signal(signal.SIGINT, handle_shutdown)

          with open(report_path, "w", encoding="utf-8") as report:
              assert process.stdout is not None
              for line in process.stdout:
                  sys.stdout.write(line)
                  sys.stdout.flush()
                  report.write(line)
                  report.flush()
                  if terminal_quota_error.search(line):
                      print(
                          "Groq provider quota/auth refusal detected; terminating OpenCode "
                          "immediately after the first refusal. Daily cooldown will be recorded.",
                          flush=True,
                      )
                      stop_process_group()
                      sys.exit(75)

          invocation_status = process.wait()
          if invocation_status in (124, 137):
              print(
                  "Groq invocation reached its 90-second hard limit; daily cooldown will be recorded.",
                  flush=True,
              )
          sys.exit(invocation_status)
          PY


      - name: Validate Groq autonomous cycle report
        id: validate_report
        if: steps.free_tier_guard.outputs.allowed == 'true' && steps.snapshot_pr_heads.outcome == 'success' && steps.run_opencode.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          REPORT_PATH: ${{ runner.temp }}/opencode-cycle-report.txt
          PRE_CYCLE_PR_HEADS: ${{ steps.snapshot_pr_heads.outputs.heads }}
          PRE_CYCLE_PR_SNAPSHOT_AT: ${{ steps.snapshot_pr_heads.outputs.snapshot_at }}
          SELECTED_TASK_ID: ${{ inputs.task_id }}
          SELECTED_TASK_TARGET_BRANCH: ${{ inputs.task_target_branch }}
          GITHUB_APP_TOKEN_OUTCOME: ${{ steps.mint_identity_token.outcome }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.REPORT_PATH, 'utf8').trim();
            const lines = summary.split(/\r?\n/);
            const statusLines = lines.filter((line) => line.startsWith('BOONTA_CYCLE_STATUS:'));
            if (statusLines.length === 1 && statusLines[0] === 'BOONTA_CYCLE_STATUS: BLOCKED') {
              const blocker = lines.filter((line) => line.startsWith('BOONTA_CYCLE_BLOCKER: ')).join(' ');
              const nextAction = lines.filter((line) => line.startsWith('BOONTA_CYCLE_NEXT_ACTION: ')).join(' ');
              const { findBlockedReportContradictions } = require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
              const contradictions = findBlockedReportContradictions(blocker + ' ' + nextAction, {
                githubAppTokenMinted: process.env.GITHUB_APP_TOKEN_OUTCOME === 'success'
              });
              if (contradictions.length > 0) {
                core.setFailed('BLOCKED report contradicts same-run GitHub App evidence: ' + contradictions.join('; '));
                return;
              }
            }
            const { validateAutonomousCycleReport } = require(process.env.GITHUB_WORKSPACE + '/tools/validate_autonomous_cycle_report.js');
            await validateAutonomousCycleReport({
              github,
              context,
              core,
              summary,
              baseline: JSON.parse(process.env.PRE_CYCLE_PR_HEADS || '{}'),
              snapshotAt: process.env.PRE_CYCLE_PR_SNAPSHOT_AT,
              expectedTaskId: process.env.SELECTED_TASK_ID,
              expectedBase: process.env.SELECTED_TASK_TARGET_BRANCH,
              provider: 'Groq'
            });

      - name: Sync the single-task daily backoff marker
        id: sync_task_queue_state
        if: steps.validate_report.outcome == 'success' && (steps.validate_report.outputs.cycle_status == 'blocked' || inputs.task_blocked_active == true)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          CYCLE_STATUS: ${{ steps.validate_report.outputs.cycle_status }}
          BLOCKED_FINGERPRINT: ${{ steps.validate_report.outputs.blocked_fingerprint }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const cycleStatus = process.env.CYCLE_STATUS || '';
            const isBlocked = cycleStatus === 'blocked';
            const fingerprint = process.env.BLOCKED_FINGERPRINT || '';
            if (isBlocked && !/^[0-9a-f]{16}$/.test(fingerprint)) {
              core.setFailed('A valid BLOCKED report must include its deterministic task fingerprint before persistence.');
              return;
            }
            if (!isBlocked && cycleStatus !== 'progress') {
              core.info('No validated task state to persist.');
              return;
            }
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = isBlocked
              ? '<!-- BOONTA_TASK_BLOCKED_COOLDOWN: ' + todayUtc + ' ' + fingerprint + ' -->'
              : '<!-- BOONTA_TASK_BLOCKED_COOLDOWN_CLEARED: ' + todayUtc + ' -->';
            const body = [
              marker,
              isBlocked ? '## Single active task — daily backoff' : '## Single active task — backoff cleared',
              '',
              isBlocked
                ? 'A valid BLOCKED report was verified for the single active task on UTC date ' + todayUtc + '.'
                : 'A cycle-fresh PROGRESS report passed exact-head validation on UTC date ' + todayUtc + '.',
              isBlocked
                ? 'Fingerprint: ' + fingerprint + '. Scheduled provider calls are paused for the remainder of this UTC day to avoid repeating the same blocked task.'
                : 'The previous same-day task backoff is cleared. The next eligible scheduled cycle may select work again.',
              'A valid BLOCKED report is not a provider failure; this task backoff does not record a provider cooldown.',
              'An owner-authorized manual dispatch or qualifying main push may re-evaluate the task before the next UTC day.',
              '',
              '[Inspect the validated cycle](' + process.env.RUN_URL + ')',
            ].join('\\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').includes('<!-- BOONTA_TASK_BLOCKED_COOLDOWN')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(isBlocked
                ? 'Updated the single persistent same-day task backoff marker.'
                : 'Cleared the single persistent same-day task backoff marker.');
            } else if (isBlocked) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the single persistent same-day task backoff marker.');
            } else {
              core.info('No previous task backoff marker needed clearing.');
            }
      - name: Record same-day Groq cooldown after an invocation failure
        if: always() && ((steps.run_opencode.outputs.provider_request_started == 'true' && steps.run_opencode.outcome != 'success' && steps.run_opencode.outcome != 'skipped') || steps.validate_report.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || '226');
            const todayUtc = new Date().toISOString().slice(0, 10);
            const marker = '<!-- BOONTA_GROQ_FAILURE_COOLDOWN: ' + todayUtc + ' -->';
            const body = [
              marker,
              '## Groq Free daily failure cooldown',
              '',
              'The autonomous Groq Free invocation or cycle-report validation failed on UTC date ' + todayUtc + '.',
              'Further fallback cycles on this UTC date will skip another Groq request. A fresh attempt is allowed on the next UTC date.',
              'This marker does not change provider settings, billing, secrets, quota, or owner attestations.',
              '',
              '[Inspect the failed Groq invocation](' + process.env.RUN_URL + ')',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && (comment.body || '').includes('<!-- BOONTA_GROQ_FAILURE_COOLDOWN:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated the single persistent Groq cooldown marker on issue #' + issueNumber + '.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
              core.info('Created the persistent Groq cooldown marker on issue #' + issueNumber + '.');
            }
      - name: Fail visibly if the Groq fallback did not complete
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned GitHub Script v9
        env:
          GATE_ALLOWED: ${{ steps.free_tier_guard.outputs.allowed }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_pr_heads.outcome }}
          INVOCATION_OUTCOME: ${{ steps.run_opencode.outcome }}
          REPORT_OUTCOME: ${{ steps.validate_report.outcome }}
        with:
          script: |
            const allowed = process.env.GATE_ALLOWED === 'true';
            const outcomes = {
              snapshot: process.env.SNAPSHOT_OUTCOME || 'skipped',
              invocation: process.env.INVOCATION_OUTCOME || 'skipped',
              report: process.env.REPORT_OUTCOME || 'skipped',
            };
            if (!allowed) {
              core.setFailed('Groq fallback did not execute: its independent Free-only/owner gate blocked the request. No provider request was sent; the separate Groq Free fallback may now be evaluated.');
            } else if (outcomes.snapshot !== 'success' || outcomes.invocation !== 'success' || outcomes.report !== 'success') {
              core.setFailed('Groq fallback did not complete. Required outcomes: PR snapshot, actual OpenCode invocation, and report validation must all be success. Observed: ' + JSON.stringify(outcomes));
            } else {
              core.info('Groq fallback passed all execution postconditions: gate, actual invocation, and validated report.');
            }
