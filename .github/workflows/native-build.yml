name: GameCube native build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"
  push:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive was imported
        shell: bash
        run: |
          if [[ ! -f Makefile || ! -d source || -z "$(find source -maxdepth 1 -type f 2>/dev/null | head -n 1)" ]]; then
            echo "::error::The native source prototype is not present in this GitHub repository yet."
            echo "Import the source-only contents of Star_Wars_Racer_GameCube_Step102.zip first."
            echo "Do not upload ROMs, disc images, or proprietary game assets."
            exit 2
          fi

      - name: Static native project preflight
        shell: bash
        run: python3 tools/check_native_project.py

      - name: Run complete host regression suite
        shell: bash
        run: bash tools/release_check.sh

      - name: Build GameCube DOL
        shell: bash
        run: |
          set -o pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          {
            make clean
            make
            test -s swe1r_gc_port.dol
          } 2>&1 | tee build.log

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: |
            build.log
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: warn
          retention-days: 7

  dolphin-smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact

      - name: Install Dolphin and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb

      - name: Launch DOL in Dolphin batch mode
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$PWD/build-artifact/swe1r_gc_port.dol" \
            --user="$RUNNER_TEMP/dolphin-user" > dolphin-smoke.log 2>&1
          status=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          find "$RUNNER_TEMP/dolphin-user" -maxdepth 5 -type f -name '*.log' -print -exec cat {} \; >> dolphin-smoke.log 2>/dev/null || true
          cat dolphin-smoke.log
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 143 ]]; then
            echo "::error::Dolphin exited with unexpected status $status after ${elapsed}s."
            exit "$status"
          fi
          if grep -Eiq "failed to load executable|could not boot|fatal error|assertion failed" dolphin-smoke.log; then
            echo "::error::Dolphin reported a boot or fatal error."
            exit 1
          fi
          if [[ "$status" -eq 124 || "$status" -eq 143 || ( "$status" -eq 137 && "$elapsed" -ge 18 ) ]]; then
            echo "Dolphin remained active through the 20-second smoke window (elapsed: ${elapsed}s)."
          elif [[ "$status" -eq 0 ]]; then
            echo "Dolphin exited normally during the smoke window."
          else
            echo "::error::Dolphin was terminated unexpectedly after only ${elapsed}s."
            exit 1
          fi
          echo "This smoke test does not verify visible rendering, controller input, or race completion."

      - name: Upload Dolphin smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-smoke-evidence
          path: dolphin-smoke.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-visual:
    needs: [build, dolphin-smoke]
    # Ubuntu 24.04's stable Qt/X11 stack is used for GUI capture; the 26.04
    # package currently starts Dolphin without mapping a visible window.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact

      - name: Install Dolphin, virtual display, and screenshot utility
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb imagemagick xdotool x11-utils dbus-daemon

      - name: Try rendering the DOL and capture the first frame
        shell: bash
        run: |
          set -euo pipefail
          export DOL="$PWD/build-artifact/swe1r_gc_port.dol"
          export DOLPHIN_USER="$RUNNER_TEMP/dolphin-visual-user"
          export LOG="$PWD/dolphin-visual.log"
          export SCREEN="$PWD/dolphin-frame.png"
          export WINDOWS="$PWD/dolphin-window-tree.txt"
          set +e
          dbus-run-session -- xvfb-run -a bash -c '
            set +e
            export QT_QPA_PLATFORM=xcb
            dolphin-emu --video_backend="Software Renderer" --exec="$DOL" --user="$DOLPHIN_USER" > "$LOG" 2>&1 &
            pid=$!
            window=""
            for attempt in $(seq 1 30); do
              window=$(xdotool search --onlyvisible --name "Dolphin" 2>/dev/null | head -n1 || true)
              if [[ -n "$window" ]]; then break; fi
              sleep 1
            done
            xwininfo -root -tree > "$WINDOWS" 2>&1
            if [[ -n "$window" ]]; then
              echo "Found visible Dolphin window: $window" >> "$LOG"
              sleep 2
              import -window "$window" "$SCREEN"
              capture_status=$?
            else
              echo "No visible Dolphin window appeared within 30 seconds." >> "$LOG"
              echo "--- Dolphin process state ---" >> "$LOG"
              ps -eo pid,ppid,stat,etime,args | grep -E "[d]olphin-emu|[d]olphin" >> "$LOG" || true
              import -window root "$SCREEN"
              capture_status=1
            fi
            echo "--- Dolphin user logs ---" >> "$LOG"
            find "$DOLPHIN_USER" -maxdepth 6 -type f \( -name "*.log" -o -name "*.txt" \) -print -exec tail -n 200 {} \; >> "$LOG" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit "$capture_status"
          '
          status=$?
          set -e
          cat dolphin-visual.log
          cat dolphin-window-tree.txt
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Could not capture a Dolphin software-renderer frame (status $status)."
            exit "$status"
          fi
          test -s dolphin-frame.png
          identify dolphin-frame.png
          mean=$(identify -format '%[fx:mean]' dolphin-frame.png)
          echo "Captured frame mean pixel intensity: $mean"
          if awk "BEGIN { exit !($mean < 0.001) }"; then
            echo "::error::Captured frame is entirely black; visible game rendering is not verified."
            exit 1
          fi
          echo "Non-black frame captured. Controller input and race completion are still unverified."

      - name: Upload Dolphin visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-visual-evidence
          path: |
            dolphin-visual.log
            dolphin-frame.png
          if-no-files-found: warn
          retention-days: 7
