name: GameCube native build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"
  push:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify source archive was imported
        shell: bash
        run: |
          if [[ ! -f Makefile || ! -d source || -z "$(find source -maxdepth 1 -type f 2>/dev/null | head -n 1)" ]]; then
            echo "::error::The native source prototype is not present in this GitHub repository yet."
            echo "Import the source-only contents of Star_Wars_Racer_GameCube_Step102.zip first."
            echo "Do not upload ROMs, disc images, or proprietary game assets."
            exit 2
          fi
      - name: Static native project preflight
        shell: bash
        run: python3 tools/check_native_project.py
      - name: Run complete host regression suite
        shell: bash
        run: bash tools/release_check.sh
      - name: Build GameCube DOL
        shell: bash
        run: |
          set -o pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          {
            make clean
            make
            test -s swe1r_gc_port.dol
          } 2>&1 | tee build.log
      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: |
            build.log
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: warn
          retention-days: 7

  dolphin-smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact
      - name: Install Dolphin and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb
      - name: Launch DOL in Dolphin batch mode
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$PWD/build-artifact/swe1r_gc_port.dol" \
            --user="$RUNNER_TEMP/dolphin-user" > dolphin-smoke.log 2>&1
          status=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          find "$RUNNER_TEMP/dolphin-user" -maxdepth 5 -type f -name '*.log' -print -exec cat {} \; >> dolphin-smoke.log 2>/dev/null || true
          cat dolphin-smoke.log
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 143 ]]; then
            echo "::error::Dolphin exited with unexpected status $status after ${elapsed}s."
            exit "$status"
          fi
          if grep -Eiq "failed to load executable|could not boot|fatal error|assertion failed" dolphin-smoke.log; then
            echo "::error::Dolphin reported a boot or fatal error."
            exit 1
          fi
          if [[ "$status" -eq 124 || "$status" -eq 143 || ( "$status" -eq 137 && "$elapsed" -ge 18 ) ]]; then
            echo "Dolphin remained active through the 20-second smoke window (elapsed: ${elapsed}s)."
          elif [[ "$status" -eq 0 ]]; then
            echo "Dolphin exited normally during the smoke window."
          else
            echo "::error::Dolphin was terminated unexpectedly after only ${elapsed}s."
            exit 1
          fi
          echo "This smoke test does not verify visible rendering, controller input, or race completion."
      - name: Upload Dolphin smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-smoke-evidence
          path: dolphin-smoke.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-visual:
    needs: [build, dolphin-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact
      - name: Install Dolphin GUI and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common xvfb imagemagick xdotool x11-utils dbus-x11
          # Ubuntu 26.04's native Dolphin/Qt package currently fails before mapping a main window.
          # Test GUI capture with the known working Noble PPA build instead.
          sudo add-apt-repository -y ppa:ubuntuhandbook1/dolphin-emu
          sudo apt-get update
          sudo apt-get install -y dolphin-emu qt6-qpa-plugins qt6-wayland
          dolphin-emu --version || true
      - name: Download the earlier minimal GX renderer as a control
        uses: actions/download-artifact@v4
        with:
          name: boonta-reborn-gamecube-first-render
          repository: Master-Chiken/boonta-reborn-88
          run-id: 38634127716
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: control-artifact

      - name: Capture the minimal GX control through Dolphin's GUI
        id: control_capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export DOL="$PWD/control-artifact/boonta_gc_demo.dol"
          export DOLPHIN_USER="$RUNNER_TEMP/dolphin-control-user"
          export CAPTURE="$PWD/control-frame.png"
          export DOLPHIN_LOG="$PWD/control-dolphin.log"
          export WINDOW_TREE="$PWD/control-window-tree.txt"
          mkdir -p "$DOLPHIN_USER"
          set +e
          timeout --signal=TERM --kill-after=5s 25s xvfb-run -a bash -euo pipefail -c '
            dolphin-emu --video_backend="Software Renderer" --exec="$DOL" --user="$DOLPHIN_USER" > "$DOLPHIN_LOG" 2>&1 &
            emu_pid=$!
            cleanup() {
              kill "$emu_pid" >/dev/null 2>&1 || true
              wait "$emu_pid" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            window=""
            for i in $(seq 1 15); do
              for id in $(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null || true); do
                geometry=$(xdotool getwindowgeometry --shell "$id" 2>/dev/null || true)
                width=$(printf "%s\n" "$geometry" | sed -n "s/^WIDTH=//p")
                height=$(printf "%s\n" "$geometry" | sed -n "s/^HEIGHT=//p")
                if [[ -n "$width" && -n "$height" && "$width" -ge 300 && "$height" -ge 200 ]]; then
                  window="$id"
                  break
                fi
              done
              [[ -n "$window" ]] && break
              sleep 1
            done
            if [[ -z "$window" ]]; then
              xwininfo -root -tree > "$WINDOW_TREE" 2>&1 || true
              echo "No visible Dolphin window >= 300x200 was found."
              exit 1
            fi
            sleep 4
            import -window "$window" "$CAPTURE"
            test -s "$CAPTURE"
            identify "$CAPTURE"
            mean=$(identify -format "%[fx:mean]" "$CAPTURE")
            echo "Minimal GX GUI capture mean pixel intensity: $mean"
            if awk "BEGIN { exit !($mean < 0.001) }"; then
              echo "Control window capture is entirely black."
              exit 1
            fi
          '
          status=$?
          set -e
          cat "$DOLPHIN_LOG" 2>/dev/null || true
          [[ ! -f "$WINDOW_TREE" ]] || cat "$WINDOW_TREE"
          find "$DOLPHIN_USER" -maxdepth 5 -type f -print | tee control-files.txt
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::The known minimal GX DOL could not be captured through Dolphin's GUI. Visual CI validation will remain pending."
            exit "$status"
          fi
          echo "Control screenshot captured from the visible Dolphin window."

      - name: Capture the current GameCube prototype through Dolphin's GUI
        if: ${{ steps.control_capture.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export DOL="$PWD/build-artifact/swe1r_gc_port.dol"
          export DOLPHIN_USER="$RUNNER_TEMP/dolphin-frame-user"
          export CAPTURE="$PWD/dolphin-frame.png"
          export DOLPHIN_LOG="$PWD/dolphin-gui.log"
          export WINDOW_TREE="$PWD/dolphin-window-tree.txt"
          mkdir -p "$DOLPHIN_USER"
          set +e
          timeout --signal=TERM --kill-after=5s 25s xvfb-run -a bash -euo pipefail -c '
            dolphin-emu --video_backend="Software Renderer" --exec="$DOL" --user="$DOLPHIN_USER" > "$DOLPHIN_LOG" 2>&1 &
            emu_pid=$!
            cleanup() {
              kill "$emu_pid" >/dev/null 2>&1 || true
              wait "$emu_pid" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            window=""
            for i in $(seq 1 15); do
              for id in $(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null || true); do
                geometry=$(xdotool getwindowgeometry --shell "$id" 2>/dev/null || true)
                width=$(printf "%s\n" "$geometry" | sed -n "s/^WIDTH=//p")
                height=$(printf "%s\n" "$geometry" | sed -n "s/^HEIGHT=//p")
                if [[ -n "$width" && -n "$height" && "$width" -ge 300 && "$height" -ge 200 ]]; then
                  window="$id"
                  break
                fi
              done
              [[ -n "$window" ]] && break
              sleep 1
            done
            if [[ -z "$window" ]]; then
              xwininfo -root -tree > "$WINDOW_TREE" 2>&1 || true
              echo "No visible Dolphin window >= 300x200 was found."
              exit 1
            fi
            sleep 4
            import -window "$window" "$CAPTURE"
            test -s "$CAPTURE"
            identify "$CAPTURE"
            mean=$(identify -format "%[fx:mean]" "$CAPTURE")
            echo "Current prototype GUI capture mean pixel intensity: $mean"
            if awk "BEGIN { exit !($mean < 0.001) }"; then
              echo "Current prototype window capture is entirely black."
              exit 1
            fi
          '
          status=$?
          set -e
          cat "$DOLPHIN_LOG" 2>/dev/null || true
          [[ ! -f "$WINDOW_TREE" ]] || cat "$WINDOW_TREE"
          find "$DOLPHIN_USER" -maxdepth 5 -type f -print | tee dolphin-files.txt
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::The visible-window capture failed; rendering remains unverified."
            exit "$status"
          fi
          echo "Current prototype screenshot captured from the visible Dolphin window."

      - name: Upload Dolphin visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-visual-evidence
          path: |
            control-dolphin.log
            control-window-tree.txt
            control-files.txt
            control-frame.png
            ${{ runner.temp }}/dolphin-control-user/**
            dolphin-gui.log
            dolphin-window-tree.txt
            dolphin-files.txt
            dolphin-frame.png
            ${{ runner.temp }}/dolphin-frame-user/**
          if-no-files-found: warn
          retention-days: 7
