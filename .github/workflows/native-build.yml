name: GameCube native build

# Compatibility entry point for the old workflow name. The supported native
# target now lives under gamecube-demo/. Reuse the maintained workflow instead
# of retaining a second build definition that expects stale root-level files.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  current-gamecube-prototype:
    name: Run maintained GameCube prototype pipeline
    uses: ./.github/workflows/gamecube-demo-build.yml
    permissions:
      actions: read
      contents: read
