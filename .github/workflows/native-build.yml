name: GameCube native build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"
  push:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify source archive was imported
        shell: bash
        run: |
          if [[ ! -f Makefile || ! -d source || -z "$(find source -maxdepth 1 -type f 2>/dev/null | head -n 1)" ]]; then
            echo "::error::The native source prototype is not present in this GitHub repository yet."
            echo "Import the source-only contents of Star_Wars_Racer_GameCube_Step102.zip first."
            echo "Do not upload ROMs, disc images, or proprietary game assets."
            exit 2
          fi
      - name: Static native project preflight
        shell: bash
        run: python3 tools/check_native_project.py
      - name: Run complete host regression suite
        shell: bash
        run: bash tools/release_check.sh
      - name: Build GameCube DOL
        shell: bash
        run: |
          set -o pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC="$DEVKITPRO/devkitPPC"
          {
            make clean
            make
            test -s swe1r_gc_port.dol
          } 2>&1 | tee build.log
      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: |
            build.log
            swe1r_gc_port.dol
            swe1r_gc_port.elf
            swe1r_gc_port.elf.map
          if-no-files-found: warn
          retention-days: 7

  dolphin-smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact
      - name: Install Dolphin and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb
      - name: Launch DOL in Dolphin batch mode
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a dolphin-emu \
            --batch --video_backend=Null \
            --exec="$PWD/build-artifact/swe1r_gc_port.dol" \
            --user="$RUNNER_TEMP/dolphin-user" > dolphin-smoke.log 2>&1
          status=$?
          elapsed=$(( $(date +%s) - started ))
          set -e
          find "$RUNNER_TEMP/dolphin-user" -maxdepth 5 -type f -name '*.log' -print -exec cat {} \; >> dolphin-smoke.log 2>/dev/null || true
          cat dolphin-smoke.log
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 143 ]]; then
            echo "::error::Dolphin exited with unexpected status $status after ${elapsed}s."
            exit "$status"
          fi
          if grep -Eiq "failed to load executable|could not boot|fatal error|assertion failed" dolphin-smoke.log; then
            echo "::error::Dolphin reported a boot or fatal error."
            exit 1
          fi
          if [[ "$status" -eq 124 || "$status" -eq 143 || ( "$status" -eq 137 && "$elapsed" -ge 18 ) ]]; then
            echo "Dolphin remained active through the 20-second smoke window (elapsed: ${elapsed}s)."
          elif [[ "$status" -eq 0 ]]; then
            echo "Dolphin exited normally during the smoke window."
          else
            echo "::error::Dolphin was terminated unexpectedly after only ${elapsed}s."
            exit 1
          fi
          echo "This smoke test does not verify visible rendering, controller input, or race completion."
      - name: Upload Dolphin smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-smoke-evidence
          path: dolphin-smoke.log
          if-no-files-found: warn
          retention-days: 7

  dolphin-visual:
    needs: [build, dolphin-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Download the freshly built DOL
        uses: actions/download-artifact@v4
        with:
          name: swe1r-gc-build-evidence
          path: build-artifact
      - name: Install Dolphin and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb imagemagick
      - name: Configure and capture emulator frames
        shell: bash
        run: |
          set -euo pipefail
          DOL="$PWD/build-artifact/swe1r_gc_port.dol"
          DOLPHIN_USER="$RUNNER_TEMP/dolphin-frame-user"
          FRAME_DIR="$PWD/dolphin-frames"
          mkdir -p "$FRAME_DIR" "$DOLPHIN_USER/Config"
          # Write Dolphin's graphics config explicitly; CLI override syntax varies by version.
          cat > "$DOLPHIN_USER/Config/GFX.ini" <<EOF
          [Settings]
          DumpEFBTarget = True
          DumpXFBTarget = True
          DumpFrames = True
          DumpFramesAsImages = True
          DumpPath = $FRAME_DIR
          EOF
          echo "Effective graphics configuration:"
          cat "$DOLPHIN_USER/Config/GFX.ini"
          set +e
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a dolphin-emu \
            --batch --video_backend="Software Renderer" \
            --exec="$DOL" --user="$DOLPHIN_USER" > dolphin-frame-dump.log 2>&1
          status=$?
          set -e
          cat dolphin-frame-dump.log
          find "$DOLPHIN_USER" "$FRAME_DIR" -maxdepth 7 -type f -print | tee dolphin-files.txt
          if [[ "$status" -ne 0 && "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 143 ]]; then
            echo "::error::Dolphin frame capture exited unexpectedly with status $status."
            exit "$status"
          fi
          frames=$(find "$DOLPHIN_USER" "$FRAME_DIR" -type f \( -iname '*.png' -o -iname '*.bmp' \) -size +0c | head -n 1 || true)
          if [[ -z "$frames" ]]; then
            echo "::error::No frame image was emitted. Inspect GFX.ini and emulator logs; rendering is still unverified."
            exit 1
          fi
          cp "$frames" dolphin-frame.png
          identify dolphin-frame.png
          mean=$(identify -format '%[fx:mean]' dolphin-frame.png)
          echo "Captured emulator buffer mean pixel intensity: $mean"
          if awk "BEGIN { exit !($mean < 0.001) }"; then
            echo "::error::Captured emulator buffer is entirely black."
            exit 1
          fi
          echo "Non-black emulator buffer captured. Controller input and race completion remain unverified."
      - name: Upload Dolphin visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-visual-evidence
          path: |
            dolphin-frame-dump.log
            dolphin-files.txt
            dolphin-frame.png
            dolphin-frames/**
            ${{ runner.temp }}/dolphin-frame-user/Config/GFX.ini
          if-no-files-found: warn
          retention-days: 7
